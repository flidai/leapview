targets:
  - name: leapview-v1
    strict_operation_kinds: true
    typespec_dir: .
    typespec_entrypoint: typespec/main.tsp
    ir_out: gen/json-ir.json
    openapi_out: gen/openapi.yaml
    go_out:
      unmatched: error
      aggregate:
        dir: ../internal/app/api/aggregate
        package: aggregate
      packages:
        LeapViewAPI: &leapview_api_go_package
          dir: ../internal/app/api/gen
          package: gen
          import_path: github.com/flidai/leapview/internal/app/api/gen
        LeapViewAPI.Access:
          dir: ../internal/access/api/gen
          package: gen
          import_path: github.com/flidai/leapview/internal/access/api/gen
          client_file: client.apigen.gen.go
        LeapViewAPI.Agent:
          dir: ../internal/agent/api/gen
          package: gen
          import_path: github.com/flidai/leapview/internal/agent/api/gen
          client_file: client.apigen.gen.go
        LeapViewAPI.Analytics:
          dir: ../internal/analytics/api/gen
          package: gen
          import_path: github.com/flidai/leapview/internal/analytics/api/gen
          client_file: client.apigen.gen.go
        LeapViewAPI.Dashboard:
          dir: ../internal/dashboard/api/gen
          package: gen
          import_path: github.com/flidai/leapview/internal/dashboard/api/gen
          client_file: client.apigen.gen.go
        LeapViewAPI.Deployment:
          dir: ../internal/deployment/api/gen
          package: gen
          import_path: github.com/flidai/leapview/internal/deployment/api/gen
          client_file: client.apigen.gen.go
        LeapViewAPI.ManagedData:
          dir: ../internal/manageddata/api/gen
          package: gen
          import_path: github.com/flidai/leapview/internal/manageddata/api/gen
          client_file: client.apigen.gen.go
        LeapViewAPI.Project:
          dir: ../internal/project/api/gen
          package: gen
          import_path: github.com/flidai/leapview/internal/project/api/gen
          client_file: client.apigen.gen.go
        LeapViewAPI.Protocol:
          dir: ../internal/platform/http/api/gen
          package: gen
          import_path: github.com/flidai/leapview/internal/platform/http/api/gen
        LeapViewAPI.Refresh:
          dir: ../internal/refresh/api/gen
          package: gen
          import_path: github.com/flidai/leapview/internal/refresh/api/gen
          client_file: client.apigen.gen.go
        LeapViewAPI.Release:
          dir: ../internal/release/api/gen
          package: gen
          import_path: github.com/flidai/leapview/internal/release/api/gen
          client_file: client.apigen.gen.go
        LeapViewAPI.Workspace:
          dir: ../internal/workspace/api/gen
          package: gen
          import_path: github.com/flidai/leapview/internal/workspace/api/gen
          client_file: client.apigen.gen.go
    cli_out:
      dir: ../internal/app/cli/gen
      package: gen
    contract_imports:
      LeapViewVisualization:
        go_package: github.com/flidai/leapview/internal/dashboard/visualization/ir
        go_alias: visualizationir
        typescript_module: ../visualization
  - name: ui-signals
    kind: contracts
    typespec_dir: .
    typespec_entrypoint: signals/main.tsp
    ir_out: gen/ui-signals-ir.json
    ts_out: ../web/generated/signals/index.ts
    contract_imports:
      LeapViewVisualization:
        go_package: github.com/flidai/leapview/internal/dashboard/visualization/ir
        go_alias: visualizationir
        typescript_module: ../visualization
  - name: visualization-ir
    kind: contracts
    typespec_dir: .
    typespec_entrypoint: visualization/main.tsp
    ir_out: gen/visualization-ir.json
    go_models_out: ../internal/dashboard/visualization/ir/models.gen.go
    go_models_package: ir
    ts_out: ../web/generated/visualization/index.ts
    json_schema_out: gen/visualization.schema.json
  - name: agent-tool-contracts
    kind: contracts
    typespec_dir: ../internal/agent/contracts
    typespec_entrypoint: typespec/main.tsp
    ir_out: ../internal/agent/contracts/gen/agent-tools-ir.json
    go_models_out: ../internal/agent/contracts/models.gen.go
    go_models_package: contracts
    json_schema_out: ../internal/agent/contracts/gen/agent-tools.schema.json
  - name: desktop-discovery-contracts
    kind: contracts
    typespec_dir: .
    typespec_entrypoint: desktop-discovery/main.tsp
    ir_out: gen/desktop-discovery-ir.json
    go_models_out: ../internal/app/desktopdiscovery/models.gen.go
    go_models_package: desktopdiscovery
    ts_out: ../desktop/src/generated/desktop-discovery.ts
    json_schema_out: ../schemas/desktop/discovery.schema.json
