apiVersion: leapview.dev/v1
kind: Dashboard
metadata:
  id: dashboard:fulfillment-operations
  name: fulfillment-operations
  displayName: Fulfillment Operations
  description: Delivery speed, order status, reviews, and geography overview.
  tags:
  - operations
  - fulfillment
spec:
  appearance:
    icon: package-check
    color: orange
  semanticModel: operations
  filters:
  - id: state
    label: State
    dimension: state
    control:
      type: multiSelect
    operators:
    - in
    - notIn
    urlParameter: state
  - id: status
    label: Status
    dimension: status
    control:
      type: multiSelect
    operators:
    - in
    - notIn
    urlParameter: status
  - id: delivery_bucket
    label: Delivery speed
    dimension: delivery_bucket
    control:
      type: multiSelect
    operators:
    - in
    - notIn
    urlParameter: delivery
  visuals:
    total_orders:
      type: kpi
      query:
        type: aggregate
        dimensions: []
        metrics:
        - order_count
      presentation:
        type: kpi
        note: Filtered order count
        tone: ink
    delivery_days:
      type: kpi
      query:
        type: aggregate
        dimensions: []
        metrics:
        - delivery_days
      presentation:
        type: kpi
        note: Average days
        tone: warning
    review_score:
      type: kpi
      query:
        type: aggregate
        dimensions: []
        metrics:
        - review_score
      presentation:
        type: kpi
        note: Average score
        tone: danger
    orders_by_status:
      type: donut
      query:
        type: aggregate
        dimensions:
        - status
        metrics:
        - order_count
        sort:
        - field: order_count
          direction: desc
        limit: 10
      title: Orders by status
      presentation:
        type: proportional
    delivery_speed:
      type: bar
      query:
        type: aggregate
        dimensions:
        - delivery_bucket
        metrics:
        - order_count
        sort:
        - field: delivery_bucket
          direction: asc
      title: Delivery speed
      presentation:
        type: cartesian
    review_by_status:
      type: bar
      query:
        type: aggregate
        dimensions:
        - status
        metrics:
        - review_score
        sort:
        - field: review_score
          direction: desc
        limit: 10
      title: Review score by status
      presentation:
        type: cartesian
  pages:
  - id: overview
    title: Overview
    components:
    - id: state-filter
      placement:
        column: 1
        row: 1
        columnSpan: 4
        rowSpan: 2
      type: filter
      filter: state
    - id: status-filter
      placement:
        column: 5
        row: 1
        columnSpan: 4
        rowSpan: 2
      type: filter
      filter: status
    - id: delivery-filter
      placement:
        column: 9
        row: 1
        columnSpan: 4
        rowSpan: 2
      type: filter
      filter: delivery_bucket
    - id: total-orders
      placement:
        column: 1
        row: 4
        columnSpan: 4
        rowSpan: 3
      type: visual
      visual: total_orders
    - id: delivery-days
      placement:
        column: 5
        row: 4
        columnSpan: 4
        rowSpan: 3
      type: visual
      visual: delivery_days
    - id: review-score
      placement:
        column: 9
        row: 4
        columnSpan: 4
        rowSpan: 3
      type: visual
      visual: review_score
    - id: status
      placement:
        column: 1
        row: 8
        columnSpan: 4
        rowSpan: 6
      type: visual
      visual: orders_by_status
    - id: delivery-speed
      placement:
        column: 5
        row: 8
        columnSpan: 4
        rowSpan: 6
      type: visual
      visual: delivery_speed
    - id: reviews
      placement:
        column: 9
        row: 8
        columnSpan: 4
        rowSpan: 6
      type: visual
      visual: review_by_status
  layout:
    columns: 12
    rowHeight: 48
    gap: 16
    padding: 16
