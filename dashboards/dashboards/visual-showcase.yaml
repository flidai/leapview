apiVersion: leapview.dev/v1
kind: Dashboard
metadata:
  id: dashboard:visual-showcase
  name: visual-showcase
  displayName: Visual Showcase
  description: Sales, order, category, and delivery overview.
  tags:
  - dev
  - visuals
  - qa
spec:
  appearance:
    icon: gallery-vertical-end
    color: blue
  semanticModel: visuals
  filters:
  - id: purchase_date
    label: Purchase date
    dimension: purchase_date
    control:
      type: dateRange
    description: Filters dashboard content by the calendar purchase date.
    urlParameter: period
    targets: [filters/total-orders-filtered]
    operators: []
  - id: purchase_time
    label: Relative purchase period
    dimension: purchase_timestamp
    control:
      type: relativePeriod
    description: Filters dashboard content using a timestamp-relative period.
    operators: []
    targets: [filters/total-orders-filtered]
  - id: state
    label: State
    dimension: state
    control:
      type: multiSelect
    description: Filters dashboard content by customer state.
    operators:
    - in
    - notIn
    urlParameter: state
    targets: [filters/total-orders-filtered]
  - id: order_status
    label: Order status
    dimension: order_status
    control:
      type: singleSelect
    description: Filters dashboard content by one or more lifecycle states.
    operators:
    - in
    - notIn
    targets: [filters/total-orders-filtered]
  - id: category_text
    label: Category text
    dimension: category
    control:
      type: text
    description: Filters dashboard content with typed string comparisons.
    operators:
    - contains
    - equals
    - startsWith
    - notContains
    - notEquals
    targets: [filters/total-orders-filtered]
  - id: delivered
    label: Delivery state
    dimension: delivered
    control:
      type: singleSelect
    description: Filters dashboard content by the typed delivered boolean.
    operators:
    - in
    - notIn
    targets: [filters/total-orders-filtered]
  - id: delivery_days
    label: Delivery days
    dimension: delivery_days
    control:
      type: numericRange
    description: Filters dashboard content by an integer delivery-day range.
    operators: []
    targets: [filters/total-orders-filtered]
  - id: revenue_amount
    label: Order revenue
    dimension: revenue_amount
    control:
      type: numericRange
    description: Filters dashboard content by a decimal order-revenue range.
    operators: []
    targets: [filters/total-orders-filtered]
  visuals:
    total_orders:
      type: kpi
      query:
        type: aggregate
        dimensions: []
        metrics:
        - order_count
      description: Shows the filtered count of distinct orders.
      presentation:
        type: kpi
        note: Filtered order count
        tone: ink
    revenue_kpi:
      type: kpi
      query:
        type: aggregate
        dimensions: []
        metrics:
        - revenue
      title: Revenue versus baseline
      description: Shows filtered revenue, its governed baseline, and compact trend.
      presentation:
        type: kpi
    revenue_kpi_unfavorable:
      type: kpi
      query:
        type: aggregate
        dimensions: []
        metrics:
        - revenue
      title: Cost proxy versus baseline
      description: Demonstrates a positive delta that is explicitly unfavorable.
      presentation:
        type: kpi
    revenue_kpi_bullet:
      type: kpi
      query:
        type: aggregate
        dimensions: []
        metrics:
        - revenue
      title: Revenue goal
      description: Shows filtered revenue against a governed target.
      presentation:
        type: kpi
    revenue_kpi_out_of_range:
      type: kpi
      query:
        type: aggregate
        dimensions: []
        metrics:
        - revenue
      title: Revenue outside the operating band
      description: Demonstrates explicit out-of-range status without hiding the actual
        value.
      presentation:
        type: kpi
    revenue_kpi_missing_comparison:
      type: kpi
      query:
        type: aggregate
        dimensions: []
        metrics:
        - revenue
      title: Revenue with unavailable comparison
      description: Demonstrates a missing comparison that remains explicit.
      presentation:
        type: kpi
    aov_kpi:
      type: kpi
      query:
        type: aggregate
        dimensions: []
        metrics:
        - aov
      description: Shows average order value for the current filters.
      presentation:
        type: kpi
        note: Revenue per order
        tone: warning
    review_kpi:
      type: kpi
      query:
        type: aggregate
        dimensions: []
        metrics:
        - review_score
      description: Shows average review score for the current filters.
      presentation:
        type: kpi
        note: Average score
        tone: danger
    revenue:
      type: area
      query:
        type: aggregate
        dimensions:
        - purchase_month
        metrics:
        - revenue
        sort:
        - field: purchase_month
          direction: asc
        limit: 30
      title: Revenue by month
      description: Tracks monthly revenue over the selected period.
      presentation:
        type: cartesian
    orders:
      type: donut
      query:
        type: aggregate
        dimensions:
        - order_status
        metrics:
        - order_count
        sort:
        - field: order_count
          direction: desc
      title: Orders by status
      description: Breaks down orders by lifecycle status.
      presentation:
        type: proportional
    orders_by_month_status:
      type: column
      query:
        type: aggregate
        dimensions:
        - purchase_month
        metrics:
        - order_count
        sort:
        - field: purchase_month
          direction: asc
        limit: 40
      title: Orders by month and status
      description: Compares monthly order volume split by status.
      presentation:
        type: cartesian
    categories:
      type: bar
      query:
        type: aggregate
        dimensions:
        - category
        metrics:
        - revenue
        sort:
        - field: revenue
          direction: desc
        limit: 10
      title: Top product categories
      description: Ranks product categories by revenue.
      presentation:
        type: cartesian
    delivery:
      type: bar
      query:
        type: aggregate
        dimensions:
        - delivery_bucket
        metrics:
        - order_count
        sort:
        - field: delivery_bucket
          direction: asc
      title: Delivery speed
      description: Compares order volume across delivery-speed buckets.
      presentation:
        type: cartesian
    state_status_heatmap:
      type: pivot
      query:
        type: pivot
        rows:
        - state
        columns:
        - order_status
        metrics:
        - order_count
      title: State by order status
      description: Shows order status concentration by customer state.
      presentation:
        type: table
        rowHeight: 28
        showHeader: true
        striped: false
    state_status_column:
      type: column
      query:
        type: aggregate
        dimensions:
        - state
        metrics:
        - order_count
        sort:
        - field: state
          direction: asc
        limit: 120
      title: Order status by state
      description: Faceted status columns used as a cross-highlight target in the
        interaction matrix.
      presentation:
        type: cartesian
    status_delivery_flow:
      type: sankey
      query:
        type: aggregate
        dimensions:
        - order_status
        - delivery_bucket
        metrics:
        - order_count
        sort:
        - field: order_count
          direction: desc
        limit: 40
      title: Status to delivery speed
      description: Shows flow from order status to delivery-speed bucket.
      presentation:
        type: hierarchy
    delivery_distribution:
      type: boxplot
      query:
        type: distribution
        field: delivery_days
        quantiles:
        - 0.25
        - 0.5
        - 0.75
        outliers: include
        approximation: exact
      title: Delivery day distribution
      description: Summarizes delivery-day distribution by speed bucket.
      presentation:
        type: cartesian
    state_order_map:
      type: map
      query:
        type: aggregate
        dimensions:
        - latitude
        - longitude
        metrics:
        - order_count
        sort:
        - field: order_count
