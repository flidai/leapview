        type: table
        rowHeight: 32
        showHeader: true
        striped: true
    orders_full_grid:
      type: table
      query:
        type: records
        dataset: orders
        fields:
        - order_id
        - status
        - category
        - revenue
        - delivery_days
        sort:
        - field: revenue
          direction: desc
      title: Orders full grid
      description: Full-grid order table with visible row and column borders.
      presentation:
        type: table
        rowHeight: 32
        showHeader: true
        striped: true
    orders_conditional:
      type: table
      query:
        type: records
        dataset: orders
        fields:
        - order_id
        - status
        - revenue
        - review_score
        - delivery_days
        sort:
        - field: revenue
          direction: desc
      title: Orders conditional formatting
      description: Order table demonstrating badges, data bars, and threshold formatting.
      presentation:
        type: table
        rowHeight: 32
        showHeader: true
        striped: true
        conditionalFormatting:
        - id: status-color
          target: cell_foreground
          field: status
          rule:
            kind: field
            source: status
            values:
              delivered: {color: success, icon: circle}
              shipped: {color: accent, icon: arrow_up}
              unavailable: {color: warning, icon: warning}
              canceled: {color: danger, icon: warning}
            nullStyle: {color: neutral}
            defaultStyle: {color: ink, icon: square}
        - id: revenue-gradient
          target: cell_background
          field: revenue
          rule:
            kind: gradient
            minimum: 0
            maximum: 500
            low: {color: neutral}
            high: {color: accent}
            nullStyle: {color: neutral}
        - id: review-thresholds
          target: cell_foreground
          field: review_score
          rule:
            kind: rules
            rules:
            - operator: greater_or_equal
              value: 4
              style: {color: success, icon: arrow_up}
            - operator: less_than
              value: 3
              style: {color: danger, icon: arrow_down}
            nullStyle: {color: neutral}
            defaultStyle: {color: warning, icon: diamond}
        - id: delivery-gradient
          target: cell_background
          field: delivery_days
          rule:
            kind: gradient
            minimum: 0
            maximum: 30
            low: {color: neutral}
            high: {color: danger}
            nullStyle: {color: neutral}
