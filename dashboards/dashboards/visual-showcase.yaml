apiVersion: leapview.dev/v1
kind: Dashboard
metadata:
  id: dashboard:visual-showcase
  name: visual-showcase
  displayName: Visual Showcase
  description: Sales, order, category, and delivery overview.
  tags:
  - dev
  - visuals
  - qa
spec:
  appearance:
    icon: gallery-vertical-end
    color: blue
  semanticModel: visuals
  filters:
  - id: purchase_date
    label: Purchase date
    dimension: purchase_date
    control:
      type: dateRange
    description: Filters dashboard content by the calendar purchase date.
    urlParameter: period
    operators: []
    targets:
    - total_orders
    - revenue_kpi
    - aov_kpi
    - review_kpi
    - revenue
    - orders
    - delivery
    - categories
    - orders_table
  - id: purchase_time
    label: Relative purchase period
    dimension: purchase_timestamp
    control:
      type: relativePeriod
    description: Filters dashboard content using a timestamp-relative period.
    operators: []
    targets:
    - total_orders
    - revenue_kpi
    - aov_kpi
    - review_kpi
    - revenue
    - orders
    - delivery
    - categories
    - orders_table
  - id: state
    label: State
    dimension: state
    control:
      type: multiSelect
      maxSelectedValues: 50
      options:
        type: distinct
        dataset: orders
        limit: 50
    description: Filters dashboard content by customer state.
    operators:
    - in
    - notIn
    urlParameter: state
    targets:
    - total_orders
    - revenue_kpi
    - aov_kpi
    - review_kpi
    - revenue
    - orders
    - delivery
    - categories
    - orders_table
  - id: order_status
    label: Order status
    dimension: order_status
    control:
      type: singleSelect
      options:
        type: distinct
        dataset: orders
        limit: 20
    description: Filters dashboard content by one or more lifecycle states.
    operators:
    - in
    - notIn
    targets:
    - total_orders
    - revenue_kpi
    - aov_kpi
    - review_kpi
    - revenue
    - orders
    - delivery
    - categories
    - orders_table
  - id: category_text
    label: Category text
    dimension: category
    control:
      type: text
    description: Filters dashboard content with typed string comparisons.
    operators:
    - contains
    - equals
    - startsWith
    - endsWith
    - notContains
    - notEquals
    targets:
    - total_orders
    - revenue_kpi
    - aov_kpi
    - review_kpi
    - revenue
    - orders
    - delivery
    - categories
    - orders_table
  - id: delivered
    label: Delivery state
    dimension: delivered
    control:
      type: singleSelect
      options:
        type: static
        values:
        - value: {type: boolean, value: true}
          label: Delivered
        - value: {type: boolean, value: false}
          label: Not delivered
    description: Filters dashboard content by the typed delivered boolean.
    operators:
    - in
    - notIn
    targets:
    - total_orders
    - revenue_kpi
    - aov_kpi
    - review_kpi
    - revenue
    - orders
    - delivery
    - categories
    - orders_table
  - id: delivery_days
    label: Delivery days
    dimension: delivery_days
    control:
      type: numericRange
    description: Filters dashboard content by an integer delivery-day range.
    operators: []
    targets:
    - total_orders
    - revenue_kpi
    - aov_kpi
    - review_kpi
    - revenue
    - orders
    - delivery
    - categories
    - orders_table
  - id: revenue_amount
    label: Order revenue
    dimension: revenue_amount
    control:
      type: numericRange
    description: Filters dashboard content by a decimal order-revenue range.
    operators: []
    targets:
    - total_orders
    - revenue_kpi
    - aov_kpi
    - review_kpi
    - revenue
    - orders
    - delivery
    - categories
    - orders_table
  visuals:
    total_orders:
      type: kpi
      query:
        type: aggregate
        dimensions: []
        metrics:
        - order_count
      description: Shows the filtered count of distinct orders.
      presentation:
        type: kpi
        note: Filtered order count
        tone: ink
    revenue_kpi:
      type: kpi
      query:
        type: aggregate
        dimensions: []
        metrics:
        - revenue
      title: Revenue versus baseline
      description: Shows filtered revenue, its governed baseline, and compact trend.
      datasets:
        comparison:
          type: aggregate
          dimensions: []
          metrics:
          - revenue_baseline
          limit: 1
        trend:
          type: aggregate
          dimensions:
          - purchase_month
          metrics:
          - revenue
          sort:
          - field: purchase_month
            direction: asc
          limit: 12
      presentation:
        type: kpi
        mode: compact
        comparison:
          dataset: comparison
          field: revenue_baseline
          reducer: first
          label: Baseline
        trend:
          dataset: trend
          category: purchase_month
          value: revenue
        delta: relative
        favorableDirection: increase
        missingComparison: show_unavailable
    revenue_kpi_unfavorable:
      type: kpi
      query:
        type: aggregate
        dimensions: []
        metrics:
        - revenue
      title: Cost proxy versus baseline
      description: Demonstrates a positive delta that is explicitly unfavorable.
      datasets:
        comparison:
          type: aggregate
          dimensions: []
          metrics:
          - revenue_baseline
          limit: 1
      presentation:
        type: kpi
        comparison:
          dataset: comparison
          field: revenue_baseline
          reducer: first
          label: Baseline
        delta: relative
        favorableDirection: decrease
    revenue_kpi_bullet:
      type: kpi
      query:
        type: aggregate
        dimensions: []
        metrics:
        - revenue
      title: Revenue goal
      description: Shows filtered revenue against a governed target.
      datasets:
        goal:
          type: aggregate
          dimensions: []
          metrics:
          - revenue_target
          limit: 1
      presentation:
        type: kpi
        mode: bullet
        goal:
          dataset: goal
          field: revenue_target
          reducer: first
          label: Target
        ranges:
        - maximum: 1000000
          label: Behind
          tone: danger
        - minimum: 1000000
          maximum: 20000000
          label: On track
          tone: success
        - minimum: 20000000
          label: Ahead
          tone: ink
    revenue_kpi_out_of_range:
      type: kpi
      query:
        type: aggregate
        dimensions: []
        metrics:
        - revenue
      title: Revenue outside the operating band
      description: Demonstrates explicit out-of-range status without hiding the actual
        value.
      datasets:
        goal:
          type: aggregate
          dimensions: []
          metrics:
          - revenue_target
          limit: 1
      presentation:
        type: kpi
        mode: progress
        goal:
          dataset: goal
          field: revenue_target
          reducer: first
          label: Target
        ranges:
        - maximum: 100
          label: Operating band
          tone: neutral
    revenue_kpi_missing_comparison:
      type: kpi
      query:
        type: aggregate
        dimensions: []
        metrics:
        - revenue
      title: Revenue with unavailable comparison
      description: Demonstrates a missing comparison that remains explicit.
      datasets:
        comparison:
          type: aggregate
          dimensions: []
          metrics:
          - missing_revenue
          limit: 1
      presentation:
        type: kpi
        comparison:
          dataset: comparison
          field: missing_revenue
          reducer: first
          label: Prior period
        delta: absolute
        favorableDirection: neutral
        missingComparison: show_unavailable
    aov_kpi:
      type: kpi
      query:
        type: aggregate
        dimensions: []
        metrics:
        - aov
      description: Shows average order value for the current filters.
      presentation:
        type: kpi
        note: Revenue per order
        tone: warning
    review_kpi:
      type: kpi
      query:
        type: aggregate
        dimensions: []
        metrics:
        - review_score
      description: Shows average review score for the current filters.
      presentation:
        type: kpi
        note: Average score
        tone: danger
    revenue:
      type: area
      query:
        type: aggregate
        dimensions:
        - purchase_month
        metrics:
        - revenue
        sort:
        - field: purchase_month
          direction: asc
        limit: 30
      title: Revenue by month
      description: Tracks monthly revenue over the selected period.
      presentation:
        type: cartesian
        labels:
          density: hidden
          priority: []
          maxCharacters: 24
          minimumSpacing: 0
          tooltipFallback: true
      interactions:
      - type: selection
        mode: multiple
        toggle: false
        mappings:
        - field: purchase_month
          value: purchase_month
          label: purchase_month
        targets:
        - orders
        - categories
        - delivery
        - orders_table
    orders:
      type: donut
      query:
        type: aggregate
        dimensions:
        - order_status
        metrics:
        - order_count
        sort:
        - field: order_count
          direction: desc
      title: Orders by status
      description: Breaks down orders by lifecycle status.
      presentation:
        type: proportional
      interactions:
      - type: selection
        mode: multiple
        toggle: false
        mappings:
        - field: order_status
          value: order_status
          label: order_status
        targets:
        - revenue
        - categories
        - delivery
        - orders_table
    orders_by_month_status:
      type: column
      query:
        type: aggregate
        dimensions:
        - purchase_month
        - order_status
        metrics:
        - order_count
        sort:
        - field: purchase_month
          direction: asc
        limit: 40
      title: Orders by month and status
      description: Compares monthly order volume split by status.
      presentation:
        type: cartesian
        stacking: normal
      interactions:
      - type: selection
        mode: multiple
        toggle: false
        mappings:
        - field: purchase_month
          value: purchase_month
          label: purchase_month
        targets:
        - orders
        - categories
        - delivery
        - orders_table
    categories:
      type: bar
      query:
        type: aggregate
        dimensions:
        - category
        metrics:
        - revenue
        sort:
        - field: revenue
          direction: desc
        limit: 10
      title: Top product categories
      description: Ranks product categories by revenue.
      presentation:
        type: cartesian
      interactions:
      - type: selection
        mode: multiple
        toggle: false
        mappings:
        - field: category
          value: category
          label: category
        targets:
        - revenue
        - orders
        - delivery
        - orders_table
    delivery:
      type: bar
      query:
        type: aggregate
        dimensions:
        - delivery_bucket
        metrics:
        - order_count
        sort:
        - field: delivery_bucket
          direction: asc
      title: Delivery speed
      description: Compares order volume across delivery-speed buckets.
      presentation:
        type: cartesian
      interactions:
      - type: selection
        mode: multiple
        toggle: false
        mappings:
        - field: delivery_bucket
          value: delivery_bucket
          label: delivery_bucket
        targets:
        - revenue
        - orders
        - categories
        - orders_table
    state_status_heatmap:
      type: heatmap
      query:
        type: aggregate
        dimensions:
        - state
        - order_status
        metrics:
        - order_count
      title: State by order status
      description: Shows order status concentration by customer state.
      presentation:
        type: cartesian
    state_status_column:
      type: column
      query:
        type: aggregate
        dimensions:
        - state
        - order_status
        metrics:
        - order_count
        sort:
        - field: state
          direction: asc
        limit: 120
      title: Order status by state
      description: Faceted status columns used as a cross-highlight target in the
        interaction matrix.
      presentation:
        type: cartesian
    status_delivery_flow:
      type: sankey
      query:
        type: aggregate
        dimensions:
        - order_status
        - delivery_bucket
        metrics:
        - order_count
        sort:
        - field: order_count
          direction: desc
        limit: 40
      title: Status to delivery speed
      description: Shows flow from order status to delivery-speed bucket.
      presentation:
        type: hierarchy
    delivery_distribution:
      type: boxplot
      query:
        type: distribution
        field: delivery_days
        group: delivery_bucket
        quantiles:
        - 0.25
        - 0.5
        - 0.75
        outliers: include
        approximation: exact
      title: Delivery day distribution
      description: Summarizes delivery-day distribution by speed bucket.
      presentation:
        type: cartesian
    state_order_map:
      type: map
      query:
        type: aggregate
        dimensions:
        - state
        metrics:
        - order_count
        sort:
        - field: order_count
          direction: desc
        limit: 27
      title: Orders by state
      description: Maps order count by customer state.
      presentation:
        type: geographic
        theme: auto
        labelDensity: normal
        controls:
          zoom: true
          reset: true
          compass: true
        layers:
        - id: states
          kind: choropleth
          geometryAsset: brazil_states
          join: state
          value: order_count
          tooltip: [state, order_count]
          color:
            kind: sequential
            palette: teal
            nullColor: "#d8dee4"
      interactions:
      - type: selection
        mode: multiple
        toggle: false
        mappings:
        - field: state
          value: state
          label: state
        targets:
        - customer_point_map
        - customer_revenue_heat_map
        - customer_density_map
    interaction_state_order_map:
      type: map
      query:
        type: aggregate
        dimensions:
        - state
        metrics:
        - order_count
        sort:
        - field: order_count
          direction: desc
        limit: 27
      title: Interaction source by state
      description: Select a state to exercise explicit filter, highlight, and none
        edges.
      presentation:
        type: geographic
        theme: light
        labelDensity: normal
        controls:
          zoom: true
          reset: true
          compass: true
        layers:
        - id: states
          kind: choropleth
          geometryAsset: brazil_states
          join: state
          value: order_count
          tooltip: [state, order_count]
          color:
            kind: sequential
            palette: teal
            nullColor: "#d8dee4"
      interactions:
      - type: selection
        mode: multiple
        toggle: false
        mappings:
        - field: state
          value: state
          label: state
        targets:
        - orders_table
        highlightTargets:
        - state_status_column
        - customer_point_map
        - total_orders
        noneTargets:
        - orders
    status_delivery_graph:
      type: graph
      query:
        type: aggregate
        dimensions:
        - order_status
        - delivery_bucket
        metrics:
        - order_count
        sort:
        - field: order_count
          direction: desc
        limit: 40
      title: Status and delivery network
      description: Shows status and delivery-speed relationships as a network.
      presentation:
        type: hierarchy
    revenue_orders_combo:
      type: combo
      query:
        type: aggregate
        dimensions:
        - purchase_month
        metrics:
        - revenue
        - order_count
        sort:
        - field: purchase_month
          direction: asc
        limit: 30
      title: Revenue and orders by month
      description: Compares monthly revenue and order volume together.
      presentation:
        type: cartesian
        series:
        - field: revenue
          mark: line
          axis: primary
        - field: order_count
          mark: column
          axis: secondary
        labels:
          density: hidden
          priority: []
          maxCharacters: 24
          minimumSpacing: 0
          tooltipFallback: true
    revenue_waterfall:
      type: waterfall
      query:
        type: aggregate
        dimensions:
        - purchase_month
        metrics:
        - revenue
        sort:
        - field: purchase_month
          direction: asc
        limit: 18
      title: Monthly revenue contribution
      description: Shows each month contribution to total revenue.
      presentation:
        type: cartesian
    delivery_histogram:
      type: histogram
      query:
        type: histogram
        field: delivery_days
        bins: 16
        nullPolicy: omit
        approximation: exact
      title: Delivery days histogram
      description: Buckets order volume by delivery duration.
      presentation:
        type: cartesian
    status_radar:
      type: radar
      query:
        type: aggregate
        dimensions:
        - order_status
        metrics:
        - order_count
        sort:
        - field: order_count
          direction: desc
        limit: 8
      title: Order status radar
      description: Compares order status counts on a radar chart.
      presentation:
        type: polar
        area: true
    category_status_sunburst:
      type: sunburst
      query:
        type: aggregate
        dimensions:
        - category
        - order_status
        metrics:
        - order_count
        sort:
        - field: order_count
          direction: desc
        limit: 80
      title: Category and status hierarchy
      description: Shows category and status hierarchy by order count.
      presentation:
        type: hierarchy
        labels:
          density: automatic
          priority: [selected, anomaly, threshold]
          maxCharacters: 12
          minimumSpacing: 6
          tooltipFallback: true
    state_status_tree:
      type: tree
      query:
        type: aggregate
        dimensions:
        - state
        - order_status
        metrics:
        - order_count
        sort:
        - field: order_count
          direction: desc
        limit: 80
      title: State and status tree
      description: Shows customer state and order status as a hierarchy.
      presentation:
        type: hierarchy
    revenue_line:
      type: line
      query:
        type: aggregate
        dimensions:
        - purchase_month
        metrics:
        - revenue
        sort:
        - field: purchase_month
          direction: asc
        limit: 30
      title: Revenue line by month
      presentation:
        type: cartesian
        labels:
          density: hidden
          priority: []
          maxCharacters: 24
          minimumSpacing: 0
          tooltipFallback: true
    revenue_line_status:
      type: line
      query:
        type: aggregate
        dimensions:
        - purchase_month
        - order_status
        metrics:
        - revenue
        sort:
        - field: purchase_month
          direction: asc
        limit: 60
      title: Revenue line by status
      presentation:
        type: cartesian
    revenue_line_step:
      type: line
      query:
        type: aggregate
        dimensions:
        - purchase_month
        metrics:
        - revenue
        sort:
        - field: purchase_month
          direction: asc
        limit: 30
      title: Stepped revenue line
      presentation:
        type: cartesian
        step: true
        showSymbols: false
        dataZoom: true
    revenue_area_status:
      type: area
      query:
        type: aggregate
        dimensions:
        - purchase_month
        - order_status
        metrics:
        - revenue
        sort:
        - field: purchase_month
          direction: asc
        limit: 60
      title: Stacked revenue area
      presentation:
        type: cartesian
        stacking: normal
    revenue_area_smooth:
      type: area
      query:
        type: aggregate
        dimensions:
        - purchase_month
        metrics:
        - revenue
        sort:
        - field: purchase_month
          direction: asc
        limit: 30
      title: Smooth revenue area
      presentation:
        type: cartesian
        smooth: true
        showSymbols: false
        dataZoom: true
    categories_by_status_bar:
      type: bar
      query:
        type: aggregate
        dimensions:
        - category
        - order_status
        metrics:
        - revenue
        sort:
        - field: revenue
          direction: desc
        limit: 60
      title: Category revenue by status
      presentation:
        type: cartesian
        stacking: normal
    orders_by_month_column:
      type: column
      query:
        type: aggregate
        dimensions:
        - purchase_month
        metrics:
        - order_count
        sort:
        - field: purchase_month
          direction: asc
        limit: 30
      title: Orders by month
      presentation:
        type: cartesian
    orders_by_month_status_grouped:
      type: column
      query:
        type: aggregate
        dimensions:
        - purchase_month
        - order_status
        metrics:
        - order_count
        sort:
        - field: purchase_month
          direction: asc
        limit: 60
      title: Orders by month and status grouped
      presentation:
        type: cartesian
        legend: bottom
    status_pie:
      type: pie
      query:
        type: aggregate
        dimensions:
        - order_status
        metrics:
        - order_count
        sort:
        - field: order_count
          direction: desc
      title: Orders by status pie
      presentation:
        type: proportional
    category_pie:
      type: pie
      query:
        type: aggregate
        dimensions:
        - category
        metrics:
        - revenue
        sort:
        - field: revenue
          direction: desc
        limit: 8
      title: Revenue by category pie
      presentation:
        type: proportional
    status_pie_rose:
      type: pie
      query:
        type: aggregate
        dimensions:
        - order_status
        metrics:
        - order_count
        sort:
        - field: order_count
          direction: desc
      title: Orders by status rose pie
      presentation:
        type: proportional
        rose: true
        labels:
          density: automatic
          priority: [selected, anomaly, threshold]
          maxCharacters: 24
          minimumSpacing: 6
          tooltipFallback: true
    category_pie_inside:
      type: pie
      query:
        type: aggregate
        dimensions:
        - category
        metrics:
        - revenue
        sort:
        - field: revenue
          direction: desc
        limit: 6
      title: Compact category pie
      presentation:
        type: proportional
        labelPosition: inside
        labels:
          density: automatic
          priority: [selected, anomaly, threshold]
          maxCharacters: 18
          minimumSpacing: 6
          tooltipFallback: true
    category_donut:
      type: donut
      query:
        type: aggregate
        dimensions:
        - category
        metrics:
        - revenue
        sort:
        - field: revenue
          direction: desc
        limit: 8
      title: Revenue by category donut
      presentation:
        type: proportional
    orders_donut_center:
      type: donut
      query:
        type: aggregate
        dimensions:
        - order_status
        metrics:
        - order_count
        sort:
        - field: order_count
          direction: desc
      title: Orders donut with center label
      presentation:
        type: proportional
        centerLabel: Orders
        innerRadius: 0.54
        outerRadius: 0.76
    delivery_scatter:
      type: scatter
      query:
        type: aggregate
        dimensions:
        - order_id
        - order_status
        metrics:
        - delivery_days
        - revenue
        sort:
        - field: order_id
          direction: asc
        limit: 500
      title: Delivery time vs order revenue
      presentation:
        type: point
        identity: [order_id]
        x: delivery_days
        y: revenue
        color: order_status
        tooltip: [order_id, order_status, delivery_days, revenue]
        colorScale:
          kind: categorical
        overplot:
          strategy: opacity
          opacity: 0.58
          largeMode: automatic
          largeThreshold: 2000
    delivery_scatter_status:
      type: scatter
      query:
        type: aggregate
        dimensions:
        - order_id
        - category
        metrics:
        - delivery_days
        - review_score
        - revenue
        sort:
        - field: order_id
          direction: asc
        limit: 500
      title: Review, revenue, and delivery bubble chart
      presentation:
        type: point
        identity: [order_id]
        x: review_score
        y: revenue
        size: delivery_days
        color: category
        tooltip: [order_id, category, review_score, revenue, delivery_days]
        colorScale:
          kind: categorical
        sizeScale:
          minimumPixels: 7
          maximumPixels: 34
        overplot:
          strategy: opacity
          opacity: 0.52
    delivery_scatter_labeled:
      type: scatter
      query:
        type: aggregate
        dimensions:
        - order_id
        - dimension: purchase_date
          grain: day
          alias: purchase_day
        metrics:
        - revenue
        sort:
        - field: purchase_day
          direction: asc
        limit: 30
      title: Labeled revenue by purchase time
      presentation:
        type: point
        labels:
          density: automatic
          priority: [selected, anomaly, threshold]
          maxCharacters: 16
          minimumSpacing: 6
          tooltipFallback: true
        identity: [order_id]
        x: purchase_day
        y: revenue
        label: order_id
        tooltip: [order_id, purchase_day, revenue]
        overplot:
          strategy: show_all
          largeMode: never
    status_funnel:
      type: funnel
      query:
        type: aggregate
        dimensions:
        - order_status
        metrics:
        - order_count
        sort:
        - field: order_count
          direction: desc
      title: Orders by status funnel
      presentation:
        type: proportional
    delivery_funnel:
      type: funnel
      query:
        type: aggregate
        dimensions:
        - delivery_bucket
        metrics:
        - order_count
        sort:
        - field: delivery_bucket
          direction: asc
      title: Delivery speed funnel
      presentation:
        type: proportional
    status_funnel_left:
      type: funnel
      query:
        type: aggregate
        dimensions:
        - order_status
        metrics:
        - order_count
        sort:
        - field: order_count
          direction: asc
