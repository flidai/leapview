apiVersion: leapview.dev/v1
kind: Model
metadata:
  id: model:variance_drivers
  name: variance_drivers
  displayName: EBITDA Variance Fact
  description: Variance fact with one signed EBITDA contribution per financial record and driver.
spec:
  fields:
    variance_row_id: {datatype: String, label: Variance row ID}
    finance_date: {datatype: Date, label: Date}
    segment: {datatype: String, label: Segment key}
    country: {datatype: String, label: Country key}
    product: {datatype: String, label: Product key}
    driver_order: {datatype: Integer, label: Order}
    impact: {datatype: Decimal, label: EBITDA impact}
  definition:
    type: sql
    sql: |
      WITH drivers AS (
        SELECT record_id, finance_date, segment, country, product, 10 AS driver_order, net_sales - budget_sales AS impact FROM model.financial_performance
        UNION ALL
        SELECT record_id, finance_date, segment, country, product, 20, budget_cogs - cogs FROM model.financial_performance
        UNION ALL
        SELECT record_id, finance_date, segment, country, product, 30, budget_sales_marketing_expense - sales_marketing_expense FROM model.financial_performance
        UNION ALL
        SELECT record_id, finance_date, segment, country, product, 40, budget_operations_expense - operations_expense FROM model.financial_performance
        UNION ALL
        SELECT record_id, finance_date, segment, country, product, 50, budget_research_development_expense - research_development_expense FROM model.financial_performance
        UNION ALL
        SELECT record_id, finance_date, segment, country, product, 60, budget_general_admin_expense - general_admin_expense FROM model.financial_performance
      )
      SELECT
        record_id || '-' || CAST(driver_order AS VARCHAR) AS variance_row_id,
        finance_date,
        segment,
        country,
        product,
        driver_order,
        CAST(round(impact, 2) AS DECIMAL(38,2)) AS impact
      FROM drivers
  entities:
    variance_row:
      type: primary
      fields: [variance_row_id]
    finance_date:
      type: foreign
      fields: [finance_date]
    segment:
      type: foreign
      fields: [segment]
    country:
      type: foreign
      fields: [country]
    product:
      type: foreign
      fields: [product]
    variance_driver:
      type: foreign
      fields: [driver_order]
  grain:
    entity: variance_row
