apiVersion: leapview.dev/v1
kind: SemanticModel
metadata:
  id: semantic-model:finance
  name: finance
  displayName: CFO Finance Model
  description: Governed actual, plan, forecast, profitability, P&L, and cash metrics for the CFO demonstration.
spec:
  datasets:
    financial_performance:
      model: financial_performance
      defaultTimeDimension: finance_date
    pnl_statement:
      model: pnl_statement
      defaultTimeDimension: finance_date
    pnl_long:
      model: pnl_long
      defaultTimeDimension: finance_date
    variance_drivers:
      model: variance_drivers
      defaultTimeDimension: finance_date
    cash_forecast:
      model: cash_forecast
      defaultTimeDimension: week_start
    cash_scenario_summary:
      model: cash_scenario_summary
  dimensions:
    finance_date:
      datatype: Date
      bindings:
        financial_performance: {field: financial_performance.finance_date}
        pnl_statement: {field: pnl_statement.finance_date}
        pnl_long: {field: pnl_long.finance_date}
        variance_drivers: {field: variance_drivers.finance_date}
      time:
        nativeGrain: day
        grains: [day, week, month, quarter, year]
        calendar: iso8601
    finance_month:
      datatype: String
      bindings:
        financial_performance: {field: financial_performance.finance_month}
        pnl_statement: {field: pnl_statement.finance_month}
        pnl_long: {field: pnl_long.finance_month}
        variance_drivers: {field: variance_drivers.finance_month}
    segment:
      datatype: String
      bindings:
        financial_performance: {field: financial_performance.segment}
        pnl_statement: {field: pnl_statement.segment}
        pnl_long: {field: pnl_long.segment}
        variance_drivers: {field: variance_drivers.segment}
    country:
      datatype: String
      bindings:
        financial_performance: {field: financial_performance.country}
        pnl_statement: {field: pnl_statement.country}
        pnl_long: {field: pnl_long.country}
        variance_drivers: {field: variance_drivers.country}
    product:
      datatype: String
      bindings:
        financial_performance: {field: financial_performance.product}
        pnl_statement: {field: pnl_statement.product}
        pnl_long: {field: pnl_long.product}
        variance_drivers: {field: variance_drivers.product}
    discount_band:
      datatype: String
      bindings:
        financial_performance: {field: financial_performance.discount_band}
    scorecard_group:
      datatype: String
      bindings:
        financial_performance: {field: financial_performance.scorecard_group}
    record_id:
      datatype: String
      bindings:
        financial_performance: {field: financial_performance.record_id}
    pnl_line:
      datatype: String
      bindings:
        pnl_statement: {field: pnl_statement.pnl_line}
        pnl_long: {field: pnl_long.pnl_line}
    pnl_group:
      datatype: String
      bindings:
        pnl_statement: {field: pnl_statement.pnl_group}
    line_order:
      label: Line
      datatype: Integer
      bindings:
        pnl_statement: {field: pnl_statement.line_order}
        pnl_long: {field: pnl_long.line_order}
    pnl_scenario:
      datatype: String
      bindings:
        pnl_long: {field: pnl_long.pnl_scenario}
    variance_driver:
      datatype: String
      bindings:
        variance_drivers: {field: variance_drivers.driver}
    driver_order:
      datatype: Integer
      bindings:
        variance_drivers: {field: variance_drivers.driver_order}
    week_start:
      datatype: Date
      bindings:
        cash_forecast: {field: cash_forecast.week_start}
      time:
        nativeGrain: day
        grains: [day, week, month]
        calendar: iso8601
    week_label:
      label: Week
      datatype: String
      bindings:
        cash_forecast: {field: cash_forecast.week_label}
    scenario:
      datatype: String
      bindings:
        cash_forecast: {field: cash_forecast.scenario}
        cash_scenario_summary: {field: cash_scenario_summary.scenario}
    scenario_group:
      datatype: String
      bindings:
        cash_forecast: {field: cash_forecast.scenario_group}
  metrics:
    units_sold:
      type: aggregate
      dataset: financial_performance
      aggregation: sum
      input: {field: financial_performance.units_sold}
      empty: zero
      label: Units sold
      format: decimal
    gross_sales:
      type: aggregate
      dataset: financial_performance
      aggregation: sum
      input: {field: financial_performance.gross_sales}
      empty: zero
      label: Gross sales
      unit: USD
      format: currency
    discounts:
      type: aggregate
      dataset: financial_performance
      aggregation: sum
      input: {field: financial_performance.discounts}
      empty: zero
      label: Discounts
      unit: USD
      format: currency
    net_sales:
      type: aggregate
      dataset: financial_performance
      aggregation: sum
      input: {field: financial_performance.net_sales}
      empty: zero
      label: Net revenue
      unit: USD
      format: currency
    cogs:
      type: aggregate
      dataset: financial_performance
      aggregation: sum
      input: {field: financial_performance.cogs}
      empty: zero
      label: Cost of goods sold
      unit: USD
      format: currency
    gross_profit:
      type: aggregate
      dataset: financial_performance
      aggregation: sum
      input: {field: financial_performance.gross_profit}
      empty: zero
      label: Gross profit
      unit: USD
      format: currency
    budget_sales:
      type: aggregate
      dataset: financial_performance
      aggregation: sum
      input: {field: financial_performance.budget_sales}
      empty: zero
      label: Budget revenue
      unit: USD
      format: currency
    budget_gross_profit:
      type: aggregate
      dataset: financial_performance
      aggregation: sum
      input: {field: financial_performance.budget_gross_profit}
      empty: zero
      label: Budget gross profit
      unit: USD
      format: currency
    forecast_sales:
      type: aggregate
      dataset: financial_performance
      aggregation: sum
      input: {field: financial_performance.forecast_sales}
      empty: zero
      label: Forecast revenue
      unit: USD
      format: currency
    forecast_gross_profit:
      type: aggregate
      dataset: financial_performance
      aggregation: sum
      input: {field: financial_performance.forecast_gross_profit}
      empty: zero
      label: Forecast gross profit
      unit: USD
      format: currency
    ebitda:
      type: aggregate
      dataset: financial_performance
      aggregation: sum
      input: {field: financial_performance.ebitda}
      empty: zero
      label: EBITDA
      unit: USD
      format: currency
    budget_ebitda:
      type: aggregate
      dataset: financial_performance
      aggregation: sum
      input: {field: financial_performance.budget_ebitda}
      empty: zero
      label: Budget EBITDA
      unit: USD
      format: currency
    forecast_ebitda:
      type: aggregate
      dataset: financial_performance
      aggregation: sum
      input: {field: financial_performance.forecast_ebitda}
      empty: zero
      label: Forecast EBITDA
      unit: USD
      format: currency
    gross_margin:
      type: ratio
      numerator: gross_profit
      denominator: net_sales
      label: Gross margin
      format: percent
    budget_gross_margin:
      type: ratio
      numerator: budget_gross_profit
      denominator: budget_sales
      label: Budget gross margin
      format: percent
    ebitda_margin:
      type: ratio
      numerator: ebitda
      denominator: net_sales
      label: EBITDA margin
      format: percent
    discount_rate:
      type: ratio
      numerator: discounts
      denominator: gross_sales
      label: Discount rate
      format: percent
    revenue_variance:
      type: derived
      expression: ${net_sales} - ${budget_sales}
      label: Revenue variance
      unit: USD
      format: currency
    revenue_variance_percent:
      type: ratio
      numerator: revenue_variance
      denominator: budget_sales
      label: Revenue variance %
      format: percent
    gross_profit_variance:
      type: derived
      expression: ${gross_profit} - ${budget_gross_profit}
      label: Gross profit variance
      unit: USD
      format: currency
    ebitda_variance:
      type: derived
      expression: ${ebitda} - ${budget_ebitda}
      label: EBITDA variance
      unit: USD
      format: currency
    pnl_actual:
      type: aggregate
      dataset: pnl_statement
      aggregation: sum
      input: {field: pnl_statement.actual_amount}
      empty: zero
      label: Actual
      unit: USD
      format: currency
    pnl_budget:
      type: aggregate
      dataset: pnl_statement
      aggregation: sum
      input: {field: pnl_statement.budget_amount}
      empty: zero
      label: Budget
      unit: USD
      format: currency
    pnl_forecast:
      type: aggregate
      dataset: pnl_statement
      aggregation: sum
      input: {field: pnl_statement.forecast_amount}
      empty: zero
      label: Forecast
      unit: USD
      format: currency
    pnl_variance:
      type: aggregate
      dataset: pnl_statement
      aggregation: sum
      input: {field: pnl_statement.variance_amount}
      empty: zero
      label: F/(U)
      unit: USD
      format: currency
    pnl_amount:
      type: aggregate
      dataset: pnl_long
      aggregation: sum
      input: {field: pnl_long.pnl_amount}
      empty: zero
      label: Amount
      unit: USD
      format: currency
    variance_impact:
      type: aggregate
      dataset: variance_drivers
      aggregation: sum
      input: {field: variance_drivers.impact}
      empty: zero
      label: EBITDA variance impact
      unit: USD
      format: currency
    collections:
      type: aggregate
      dataset: cash_forecast
      aggregation: sum
      input: {field: cash_forecast.collections}
      empty: zero
      label: Collections
      unit: USD
      format: currency
    supplier_payments:
      type: aggregate
      dataset: cash_forecast
      aggregation: sum
      input: {field: cash_forecast.supplier_payments}
      empty: zero
      label: Supplier payments
      unit: USD
      format: currency
    net_cash_flow:
      type: aggregate
      dataset: cash_forecast
      aggregation: sum
      input: {field: cash_forecast.net_cash_flow}
      empty: zero
      label: Net cash flow
      unit: USD
      format: currency
    base_collections:
      type: aggregate
      dataset: cash_forecast
      aggregation: sum
      input: {field: cash_forecast.base_collections}
      empty: zero
      label: Base collections
      unit: USD
      format: currency
    base_supplier_payments:
      type: aggregate
      dataset: cash_forecast
      aggregation: sum
      input: {field: cash_forecast.base_supplier_payments}
      empty: zero
      label: Base supplier payments
      unit: USD
      format: currency
    base_net_cash_flow:
      type: aggregate
      dataset: cash_forecast
      aggregation: sum
      input: {field: cash_forecast.base_net_cash_flow}
      empty: zero
      label: Base net cash flow
      unit: USD
      format: currency
    closing_cash:
      type: aggregate
      dataset: cash_forecast
      aggregation: sum
      input: {field: cash_forecast.closing_cash}
      empty: zero
      label: Closing cash
      unit: USD
      format: currency
    scenario_ending_cash:
      type: aggregate
      dataset: cash_forecast
      aggregation: max
      input: {field: cash_forecast.scenario_ending_cash}
      empty: 'null'
      label: Ending cash
      unit: USD
      format: currency
    scenario_headroom:
      type: aggregate
      dataset: cash_forecast
      aggregation: max
      input: {field: cash_forecast.scenario_headroom}
      empty: 'null'
      label: Headroom
      unit: USD
      format: currency
    scenario_cumulative_net_cash_flow:
      type: aggregate
      dataset: cash_forecast
      aggregation: sum
      input: {field: cash_forecast.net_cash_flow}
      empty: zero
      label: Net cash flow
      unit: USD
      format: currency
    current_cash:
      type: aggregate
      dataset: cash_forecast
      aggregation: max
      input: {field: cash_forecast.current_cash}
      empty: 'null'
      label: Current cash
      unit: USD
      format: currency
    base_ending_cash:
      type: aggregate
      dataset: cash_forecast
      aggregation: max
      input: {field: cash_forecast.base_ending_cash}
      empty: 'null'
      label: Base ending cash
      unit: USD
      format: currency
    base_headroom:
      type: aggregate
      dataset: cash_forecast
      aggregation: max
      input: {field: cash_forecast.base_headroom}
      empty: 'null'
      label: Base cash headroom
      unit: USD
      format: currency
    overdue_receivables:
      type: aggregate
      dataset: cash_forecast
      aggregation: max
      input: {field: cash_forecast.overdue_receivables}
      empty: 'null'
      label: Overdue receivables
      unit: USD
      format: currency
    dso_days:
      type: aggregate
      dataset: cash_forecast
      aggregation: max
      input: {field: cash_forecast.dso_days}
      empty: 'null'
      label: Days sales outstanding
      format: decimal
