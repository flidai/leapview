apiVersion: leapview.dev/v1
kind: Model
metadata:
  id: model:rating_genres
  name: rating_genres
  displayName: Rating Genres
  description: Rating-by-genre bridge model used to analyze genres without unsafe many-to-many joins.
spec:
  fields:
    - name: rating_genre_id
      datatype: String
      label: Rating genre ID
      description: Stable rating and genre identifier.
    - name: rating_id
      datatype: String
      label: Rating ID
      description: Rating-grain identifier.
    - name: user_id
      datatype: Integer
      label: User ID
      description: Anonymized MovieLens user identifier.
    - name: movie_id
      datatype: Integer
      label: Movie ID
      description: MovieLens movie identifier.
    - name: title
      datatype: String
      label: Title
      description: Movie title.
    - name: genre
      datatype: String
      label: Genre
      description: Single genre assigned to the rated movie.
    - name: rating
      datatype: Float
      label: Rating
      description: Rating value on the MovieLens scale.
    - name: rating_bucket
      datatype: String
      label: Rating bucket
      description: Rounded rating bucket for distribution charts.
    - name: rated_at
      datatype: DateTime
      label: Rated at
      description: Timestamp when the rating was applied.
    - name: rating_date
      datatype: Date
      label: Rating date
      description: Date when the rating was applied.
    - name: rating_month
      datatype: String
      label: Rating month
      description: Calendar month when the rating was applied.
    - name: rating_year
      datatype: Integer
      label: Rating year
      description: Calendar year when the rating was applied.
    - name: release_year
      datatype: Integer
      label: Release year
      description: Movie release year.
    - name: release_decade
      datatype: String
      label: Release decade
      description: Movie release decade.
  definition:
    type: sql
    sql: |
      WITH genre_rows AS (
        SELECT 'Action' AS genre UNION ALL
        SELECT 'Adventure' UNION ALL
        SELECT 'Animation' UNION ALL
        SELECT 'Children''s' UNION ALL
        SELECT 'Comedy' UNION ALL
        SELECT 'Crime' UNION ALL
        SELECT 'Documentary' UNION ALL
        SELECT 'Drama' UNION ALL
        SELECT 'Fantasy' UNION ALL
        SELECT 'Film-Noir' UNION ALL
        SELECT 'Horror' UNION ALL
        SELECT 'IMAX' UNION ALL
        SELECT 'Musical' UNION ALL
        SELECT 'Mystery' UNION ALL
        SELECT 'Romance' UNION ALL
        SELECT 'Sci-Fi' UNION ALL
        SELECT 'Thriller' UNION ALL
        SELECT 'War' UNION ALL
        SELECT 'Western'
      ),
      movie_genres AS MATERIALIZED (
        SELECT
          m.movie_id,
          m.title,
          m.release_year,
          m.release_decade,
          genre.genre
        FROM model.movies m
        JOIN genre_rows genre ON list_contains(str_split(m.genres, '|'), genre.genre)
      )
      SELECT
        concat(r.rating_id, '-', m.genre) AS rating_genre_id,
        r.rating_id,
        r.user_id,
        r.movie_id,
        m.title,
        m.genre,
        r.rating,
        r.rating_bucket,
        r.rated_at,
        r.rating_date,
        r.rating_month,
        r.rating_year,
        m.release_year,
        m.release_decade
      FROM model.ratings r
      JOIN movie_genres m ON m.movie_id = r.movie_id
  entities:
    - name: rating_genre
      type: primary
      fields:
      - rating_genre_id
    - name: movie
      type: foreign
      fields:
      - movie_id
    - name: user
      type: foreign
      fields:
      - user_id
  grain:
    entity: rating_genre
