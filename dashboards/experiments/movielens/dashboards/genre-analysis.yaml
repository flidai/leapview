apiVersion: leapview.dev/v1
kind: Dashboard
metadata:
  id: dashboard:genre-analysis
  name: genre-analysis
  displayName: Genre Analysis
  description: Genre-level rating volume, rating quality, trends, and release-decade
    comparisons.
  tags:
  - movies
  - genres
  - ratings
  - experiment
spec:
  semanticModel: genre_ratings
  filters:
  - id: rating_date
    label: Rating date
    dimension: rating_date
    control:
      type: relativePeriod
    urlParameter: period
    operators: []
  - id: genre
    label: Genre
    dimension: genre
    control:
      type: multiSelect
    operators:
    - in
    - notIn
    urlParameter: genre
  - id: release_decade
    label: Release decade
    dimension: release_decade
    control:
      type: multiSelect
    operators:
    - in
    - notIn
    urlParameter: decade
  visuals:
    genre_rating_count:
      type: kpi
      query:
        type: aggregate
        dimensions: []
        metrics:
        - genre_rating_count
      presentation:
        type: kpi
        note: Rating-genre rows
        tone: ink
    average_rating:
      type: kpi
      query:
        type: aggregate
        dimensions: []
        metrics:
        - average_rating
      presentation:
        type: kpi
        note: Mean rating
        tone: warning
    active_users:
      type: kpi
      query:
        type: aggregate
        dimensions: []
        metrics:
        - active_users
      presentation:
        type: kpi
        note: Distinct users
        tone: success
    rated_movies:
      type: kpi
      query:
        type: aggregate
        dimensions: []
        metrics:
        - rated_movies
      presentation:
        type: kpi
        note: Distinct movies
        tone: danger
    ratings_by_genre:
      type: bar
      query:
        type: aggregate
        dimensions:
        - genre
        metrics:
        - genre_rating_count
        sort:
        - field: genre_rating_count
          direction: desc
        limit: 20
      title: Ratings by genre
      presentation:
        type: cartesian
    average_by_genre:
      type: bar
      query:
        type: aggregate
        dimensions:
        - genre
        metrics:
        - average_rating
        sort:
        - field: average_rating
          direction: desc
        limit: 20
      title: Average rating by genre
      presentation:
        type: cartesian
    genre_trend:
      type: column
      query:
        type: aggregate
        dimensions:
        - dimension: rating_date
          grain: month
          alias: rating_year
        metrics:
        - genre_rating_count
        sort:
        - field: rating_year
          direction: asc
        limit: 120
      title: Genre ratings by year
      presentation:
        type: cartesian
    decade_genres:
      type: pivot
      query:
        type: pivot
        rows:
        - release_decade
        columns:
        - genre
        metrics:
        - average_rating
      title: Release decade by genre
      presentation:
        type: table
        rowHeight: 28
        showHeader: true
        striped: false
  pages:
  - id: overview
    title: Overview
    components:
    - id: rating-date-filter
      placement:
        column: 1
        row: 1
        columnSpan: 4
        rowSpan: 2
      type: filter
      filter: rating_date
    - id: genre-filter
      placement:
        column: 5
        row: 1
        columnSpan: 4
        rowSpan: 2
      type: filter
      filter: genre
    - id: decade-filter
      placement:
        column: 9
        row: 1
        columnSpan: 4
        rowSpan: 2
      type: filter
      filter: release_decade
    - id: genre-ratings
      placement:
        column: 1
        row: 3
        columnSpan: 3
        rowSpan: 3
      type: visual
      visual: genre_rating_count
    - id: average-rating
      placement:
        column: 4
        row: 3
        columnSpan: 3
        rowSpan: 3
      type: visual
      visual: average_rating
    - id: active-users
      placement:
        column: 7
        row: 3
        columnSpan: 3
        rowSpan: 3
      type: visual
      visual: active_users
    - id: rated-movies
      placement:
        column: 10
        row: 3
        columnSpan: 3
        rowSpan: 3
      type: visual
      visual: rated_movies
    - id: ratings-by-genre
      placement:
        column: 1
        row: 6
        columnSpan: 6
        rowSpan: 7
      type: visual
      visual: ratings_by_genre
    - id: average-by-genre
      placement:
        column: 7
        row: 6
        columnSpan: 6
        rowSpan: 7
      type: visual
      visual: average_by_genre
    - id: genre-trend
      placement:
        column: 1
        row: 13
        columnSpan: 6
        rowSpan: 7
      type: visual
      visual: genre_trend
    - id: decade-genres
      placement:
        column: 7
        row: 13
        columnSpan: 6
        rowSpan: 7
      type: visual
      visual: decade_genres
  layout:
    columns: 12
    rowHeight: 48
    gap: 16
    padding: 16
