apiVersion: leapview.dev/v1
kind: Dashboard
metadata:
  id: dashboard:ratings-overview
  name: ratings-overview
  displayName: Ratings Overview
  description: MovieLens rating volume, rating quality, users, movies, and trend overview.
  tags:
  - movies
  - ratings
  - experiment
spec:
  semanticModel: movie_ratings
  filters:
  - id: rating_date
    label: Rating date
    dimension: activity_date
    control:
      type: relativePeriod
    urlParameter: period
    operators: []
  - id: release_decade
    label: Release decade
    dimension: release_decade
    control:
      type: multiSelect
    operators:
    - in
    - notIn
    urlParameter: decade
  - id: rating_bucket
    label: Rating
    dimension: rating_bucket
    control:
      type: multiSelect
    operators:
    - in
    - notIn
    targets:
    - rating_distribution
    - movie_table
    urlParameter: rating
  - id: title
    label: Title
    dimension: movie_title
    control:
      type: text
    operators:
    - contains
    - equals
    - startsWith
    - notContains
    urlParameter: title
  visuals:
    rating_count:
      type: kpi
      query:
        type: aggregate
        dimensions: []
        metrics:
        - rating_count
      presentation:
        type: kpi
        note: Rating events
        tone: ink
    average_rating:
      type: kpi
      query:
        type: aggregate
        dimensions: []
        metrics:
        - average_rating
      presentation:
        type: kpi
        note: Mean rating
        tone: warning
    active_users:
      type: kpi
      query:
        type: aggregate
        dimensions: []
        metrics:
        - active_users
      presentation:
        type: kpi
        note: Distinct users
        tone: success
    rated_movies:
      type: kpi
      query:
        type: aggregate
        dimensions: []
        metrics:
        - rated_movies
      presentation:
        type: kpi
        note: Distinct movies
        tone: danger
    tags_per_rating:
      type: kpi
      query:
        type: aggregate
        dimensions: []
        metrics:
        - tags_per_rating
      presentation:
        type: kpi
        note: Independently aggregated tags / ratings
        tone: success
    activity_by_month:
      type: combo
      query:
        type: aggregate
        dimensions:
        - dimension: activity_date
          grain: month
          alias: activity_month
        metrics:
        - rating_count
        - tag_count
        sort:
        - field: activity_month
          direction: asc
        limit: 360
      title: Ratings and tags by activity month
      presentation:
        type: cartesian
    tags_per_rating_by_decade:
      type: bar
      query:
        type: aggregate
        dimensions:
        - release_decade
        metrics:
        - tags_per_rating
        sort:
        - field: release_decade
          direction: asc
        limit: 20
      title: Tags per rating by release decade
      presentation:
        type: cartesian
    ratings_by_month:
      type: area
      query:
        type: aggregate
        dimensions:
        - dimension: activity_date
          grain: month
          alias: rating_month
        metrics:
        - rating_count
        sort:
        - field: rating_month
          direction: asc
        limit: 360
      title: Ratings by month
      presentation:
        type: cartesian
    rating_distribution:
      type: bar
      query:
        type: aggregate
        dimensions:
        - rating_bucket
        metrics:
        - rating_count
        sort:
        - field: rating_bucket
          direction: asc
      title: Rating distribution
      presentation:
        type: cartesian
    top_movies:
      type: bar
      query:
        type: aggregate
        dimensions:
        - movie_title
        metrics:
        - rating_count
        sort:
        - field: rating_count
          direction: desc
        limit: 15
      title: Most rated movies
      presentation:
        type: cartesian
    average_by_decade:
      type: bar
      query:
        type: aggregate
        dimensions:
        - release_decade
        metrics:
        - average_rating
        sort:
        - field: release_decade
          direction: asc
        limit: 20
      title: Average rating by release decade
      presentation:
        type: cartesian
    movie_table:
      type: table
      query:
        type: records
        dataset: ratings
        fields:
        - rating_bucket
        - rating_month
        - rating
      title: Movie ratings
      presentation:
        type: table
        rowHeight: 32
        showHeader: true
        striped: false
  pages:
  - id: overview
    title: Overview
    components:
    - id: rating-date-filter
      placement:
        column: 1
        row: 1
        columnSpan: 3
        rowSpan: 2
      type: filter
      filter: rating_date
    - id: decade-filter
      placement:
        column: 4
        row: 1
        columnSpan: 3
        rowSpan: 2
      type: filter
      filter: release_decade
    - id: rating-filter
      placement:
        column: 7
        row: 1
        columnSpan: 3
        rowSpan: 2
      type: filter
      filter: rating_bucket
    - id: title-filter
      placement:
        column: 10
        row: 1
        columnSpan: 3
        rowSpan: 2
      type: filter
      filter: title
    - id: rating-count
      placement:
        column: 1
        row: 4
        columnSpan: 3
        rowSpan: 3
      type: visual
      visual: rating_count
    - id: average-rating
      placement:
        column: 4
        row: 4
        columnSpan: 3
        rowSpan: 3
      type: visual
      visual: average_rating
    - id: active-users
      placement:
        column: 7
        row: 4
        columnSpan: 3
        rowSpan: 3
      type: visual
      visual: active_users
    - id: rated-movies
      placement:
        column: 10
        row: 4
        columnSpan: 3
        rowSpan: 3
      type: visual
      visual: rated_movies
    - id: ratings-trend
      placement:
        column: 1
        row: 8
        columnSpan: 8
        rowSpan: 6
      type: visual
      visual: ratings_by_month
    - id: rating-distribution
      placement:
        column: 9
        row: 8
        columnSpan: 4
        rowSpan: 6
      type: visual
      visual: rating_distribution
    - id: top-movies
      placement:
        column: 1
        row: 15
        columnSpan: 6
        rowSpan: 7
      type: visual
      visual: top_movies
    - id: decade-average
      placement:
        column: 7
        row: 15
        columnSpan: 6
        rowSpan: 7
      type: visual
      visual: average_by_decade
    - id: movie-table
      placement:
        column: 1
        row: 23
        columnSpan: 12
        rowSpan: 8
      type: visual
      visual: movie_table
    - id: tags-per-rating
      placement:
        column: 1
        row: 32
        columnSpan: 3
        rowSpan: 3
      type: visual
      visual: tags_per_rating
    - id: activity-by-month
      placement:
        column: 4
        row: 32
        columnSpan: 9
        rowSpan: 7
      type: visual
      visual: activity_by_month
    - id: tags-per-rating-by-decade
      placement:
        column: 1
        row: 40
        columnSpan: 12
        rowSpan: 7
      type: visual
      visual: tags_per_rating_by_decade
  layout:
    columns: 12
    rowHeight: 48
    gap: 16
    padding: 16
