apiVersion: leapview.dev/v1
kind: Source
metadata:
  id: source:links
  name: movielens.links
  displayName: External Links
spec:
  connection: movielens
  location:
    type: path
    path: links.csv
    format: csv
  schema:
    mode: compatible
  fields:
    - {name: movieId, datatype: Integer, description: MovieLens movie identifier.}
    - {name: imdbId, datatype: String, description: IMDb identifier without the tt prefix; leading zeros are significant.}
    - {name: tmdbId, datatype: Integer, description: Numeric TMDb movie identifier.}
