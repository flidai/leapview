apiVersion: leapview.dev/v1
kind: Source
metadata:
  id: source:links
  name: movielens.links
  displayName: External Links
spec:
  connection: movielens
  location:
    type: path
    path: links.csv
    format: csv
  schema:
    mode: compatible
    fields:
      movieId: {datatype: Integer, description: MovieLens movie identifier.}
      imdbId: {datatype: String, description: IMDb identifier without the tt prefix.}
      tmdbId: {datatype: String, description: TMDb movie identifier.}
