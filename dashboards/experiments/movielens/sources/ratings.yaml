apiVersion: leapview.dev/v1
kind: Source
metadata:
  id: source:ratings
  name: movielens.ratings
  displayName: Ratings
spec:
  connection: movielens
  location:
    type: path
    path: ratings.csv
    format: csv
  schema:
    mode: compatible
    fields:
      userId: {datatype: Integer, description: Anonymized MovieLens user identifier.}
      movieId: {datatype: Integer, description: MovieLens movie identifier.}
      rating: {datatype: Float, description: Five-star rating in half-star increments.}
      timestamp: {datatype: Integer, description: Rating timestamp as Unix epoch seconds.}
