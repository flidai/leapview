apiVersion: leapview.dev/v1
kind: Source
metadata:
  id: source:tags
  name: movielens.tags
  displayName: Tags
spec:
  connection: movielens
  location:
    type: path
    path: tags.csv
    format: csv
  schema:
    mode: compatible
  fields:
    - {name: userId, datatype: Integer, description: Anonymized MovieLens user identifier.}
    - {name: movieId, datatype: Integer, description: MovieLens movie identifier.}
    - {name: tag, datatype: String, description: User-generated movie tag.}
    - {name: timestamp, datatype: Integer, description: Tag timestamp as Unix epoch seconds.}
