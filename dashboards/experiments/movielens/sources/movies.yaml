apiVersion: leapview.dev/v1
kind: Source
metadata:
  id: source:movies
  name: movielens.movies
  displayName: Movies
spec:
  connection: movielens
  location:
    type: path
    path: movies.csv
    format: csv
  schema:
    mode: compatible
    fields:
      movieId: {datatype: Integer, description: MovieLens movie identifier.}
      title: {datatype: String, description: Movie title with release year suffix when available.}
      genres: {datatype: String, description: Pipe-separated genre list.}
