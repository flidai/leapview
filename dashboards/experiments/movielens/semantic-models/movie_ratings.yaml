apiVersion: leapview.dev/v1
kind: SemanticModel
metadata:
  id: semantic-model:movie_ratings
  name: movie_ratings
  displayName: Movie Ratings Semantic Model
  description: Rating-grain semantic model for movie, user, and rating trend analysis.
spec:
  datasets:
    ratings:
      model: ratings
      defaultTimeDimension: activity_date
    movies:
      model: movies
    users:
      model: users
    tags:
      model: tags
      defaultTimeDimension: activity_date
  relationships:
    ratings_movies:
      from:
        dataset: ratings
        entity: movie
      to:
        dataset: movies
        entity: movie
      description: Links each rating to the rated movie.
    ratings_users:
      from:
        dataset: ratings
        entity: user
      to:
        dataset: users
        entity: user
      description: Links each rating to the anonymized user who made it.
    tags_movies:
      from:
        dataset: tags
        entity: movie
      to:
        dataset: movies
        entity: movie
      description: Links each tag event to its movie.
    tags_users:
      from:
        dataset: tags
        entity: user
      to:
        dataset: users
        entity: user
      description: Links each tag event to its anonymized user.
  filters:
    five_star_ratings_filter:
      field: ratings.rating
      operator: equals
      value: 5
  dimensions:
    activity_date:
      datatype: DateTime
      label: Activity date
      bindings:
        ratings:
          field: ratings.rated_at
        tags:
          field: tags.tagged_at
      time:
        nativeGrain: second
        grains:
        - day
        - week
        - month
        - quarter
        - year
        calendar: iso8601
    release_decade:
      datatype: String
      label: Release decade
      bindings:
        ratings:
          field: movies.release_decade
          path:
          - ratings_movies
        tags:
          field: movies.release_decade
          path:
          - tags_movies
    movie_title:
      datatype: String
      label: Movie title
      bindings:
        ratings:
          field: movies.title
          path:
          - ratings_movies
        tags:
          field: movies.title
          path:
          - tags_movies
    rating_bucket:
      datatype: String
      label: Rating bucket
      bindings:
        ratings:
          field: ratings.rating_bucket
  metrics:
    rating_count:
      type: aggregate
      dataset: ratings
      aggregation: count
      input:
        field: ratings.rating_id
      empty: zero
      label: Ratings
      description: Count of rating events.
      format: integer
    average_rating:
      type: aggregate
      dataset: ratings
      aggregation: avg
      input:
        field: ratings.rating
      empty: 'null'
      label: Average rating
      description: Average MovieLens rating.
      format: decimal
    active_users:
      type: aggregate
      dataset: ratings
      aggregation: count_distinct
      input:
        field: ratings.user_id
      empty: zero
      label: Active users
      description: Distinct users who submitted ratings.
      format: integer
    rated_movies:
      type: aggregate
      dataset: ratings
      aggregation: count_distinct
      input:
        field: ratings.movie_id
      empty: zero
      label: Rated movies
      description: Distinct movies with ratings.
      format: integer
    five_star_ratings:
      type: aggregate
      dataset: ratings
      aggregation: count
      input:
        field: ratings.rating_id
      where:
      - five_star_ratings_filter
      empty: zero
      label: Five-star ratings
      hidden: true
    tag_count:
      type: aggregate
      dataset: tags
      aggregation: count
      input:
        field: tags.tag_id
      empty: zero
      label: Tags
      description: Count of tag events.
      format: integer
    five_star_share:
      type: ratio
      numerator: five_star_ratings
      denominator: rating_count
      label: Five-star share
      description: Share of ratings that are exactly five stars.
      format: percent
    tags_per_rating:
      type: ratio
      numerator: tag_count
      denominator: rating_count
      label: Tags per rating
      description: Ratio of independently aggregated tag events to rating events.
      format: decimal
