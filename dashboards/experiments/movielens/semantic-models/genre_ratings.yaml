apiVersion: leapview.dev/v1
kind: SemanticModel
metadata:
  id: semantic-model:genre_ratings
  name: genre_ratings
  displayName: Genre Ratings Semantic Model
  description: Rating-by-genre semantic model for safe genre analysis.
spec:
  datasets:
    - name: rating_genres
      model: rating_genres
      defaultTimeDimension: rating_date
      metrics:
        - name: genre_rating_count
          type: simple
          empty: zero
          label: Genre ratings
          description: Count of rating-genre rows.
          format: integer
          agg: count
          field: rating_genre_id
        - name: average_rating
          type: simple
          empty: 'null'
          label: Average rating
          description: Average MovieLens rating for the rating-genre rows.
          format: decimal
          agg: avg
          field: rating
        - name: active_users
          type: simple
          empty: zero
          label: Active users
          description: Distinct users represented by the rating-genre rows.
          format: integer
          agg: count_distinct
          field: user_id
        - name: rated_movies
          type: simple
          empty: zero
          label: Rated movies
          description: Distinct movies represented by the rating-genre rows.
          format: integer
          agg: count_distinct
          field: movie_id
      dimensions:
        - name: rating_date
          datatype: Date
          time:
            nativeGrain: day
            grains:
              - day
              - week
              - month
            calendar: iso8601
        - name: genre
          datatype: String
        - name: release_decade
          datatype: String
    - name: ratings
      model: ratings
    - name: movies
      model: movies
    - name: users
      model: users
  relationships:
    - name: rating_genres_movies
      from:
        dataset: rating_genres
        entity: movie
      to:
        dataset: movies
        entity: movie
      description: Links each rating-genre row to the rated movie.
    - name: rating_genres_users
      from:
        dataset: rating_genres
        entity: user
      to:
        dataset: users
        entity: user
      description: Links each rating-genre row to the anonymized user who made the rating.
