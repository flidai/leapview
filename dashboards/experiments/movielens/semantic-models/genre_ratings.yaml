apiVersion: leapview.dev/v1
kind: SemanticModel
metadata:
  id: semantic-model:genre_ratings
  name: genre_ratings
  displayName: Genre Ratings Semantic Model
  description: Rating-by-genre semantic model for safe genre analysis.
spec:
  datasets:
    rating_genres:
      model: rating_genres
      defaultTimeDimension: rating_date
    ratings:
      model: ratings
    movies:
      model: movies
    users:
      model: users
  relationships:
    rating_genres_movies:
      from:
        dataset: rating_genres
        entity: movie
      to:
        dataset: movies
        entity: movie
      description: Links each rating-genre row to the rated movie.
    rating_genres_users:
      from:
        dataset: rating_genres
        entity: user
      to:
        dataset: users
        entity: user
      description: Links each rating-genre row to the anonymized user who made the rating.
  dimensions:
    rating_date:
      datatype: Date
      bindings:
        rating_genres:
          field: rating_genres.rating_date
      time:
        nativeGrain: day
        grains:
        - day
        - week
        - month
        calendar: iso8601
    genre:
      datatype: String
      bindings:
        rating_genres:
          field: rating_genres.genre
    release_decade:
      datatype: String
      bindings:
        rating_genres:
          field: rating_genres.release_decade
  metrics:
    genre_rating_count:
      type: aggregate
      dataset: rating_genres
      aggregation: count
      input:
        field: rating_genres.rating_genre_id
      empty: zero
      label: Genre ratings
      description: Count of rating-genre rows.
      format: integer
    average_rating:
      type: aggregate
      dataset: rating_genres
      aggregation: avg
      input:
        field: rating_genres.rating
      empty: 'null'
      label: Average rating
      description: Average MovieLens rating for the rating-genre rows.
      format: decimal
    active_users:
      type: aggregate
      dataset: rating_genres
      aggregation: count_distinct
      input:
        field: rating_genres.user_id
      empty: zero
      label: Active users
      description: Distinct users represented by the rating-genre rows.
      format: integer
    rated_movies:
      type: aggregate
      dataset: rating_genres
      aggregation: count_distinct
      input:
        field: rating_genres.movie_id
      empty: zero
      label: Rated movies
      description: Distinct movies represented by the rating-genre rows.
      format: integer
