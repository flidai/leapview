apiVersion: leapview.dev/v1
kind: Source
metadata:
  id: source:olist.reviews
  name: olist.reviews
  displayName: Reviews
spec:
  connection: olist
  location:
    type: path
    path: olist_order_reviews_dataset.csv
    format: csv
  schema:
    mode: compatible
  fields:
    - {name: order_id, datatype: String, description: Order identifier associated with the review.}
    - {name: review_score, datatype: Integer, description: Customer review score.}
