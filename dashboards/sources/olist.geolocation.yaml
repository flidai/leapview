apiVersion: leapview.dev/v1
kind: Source
metadata:
  id: source:olist.geolocation
  name: olist.geolocation
  displayName: Brazilian ZIP Geolocation
spec:
  connection: olist
  location:
    type: path
    path: olist_geolocation_dataset.csv
    format: csv
  schema:
    mode: compatible
    fields:
      geolocation_zip_code_prefix: {datatype: String, description: Five-digit Brazilian ZIP-code prefix.}
      geolocation_lat: {datatype: Decimal, description: Latitude supplied by the Olist geolocation dataset.}
      geolocation_lng: {datatype: Decimal, description: Longitude supplied by the Olist geolocation dataset.}
      geolocation_city: {datatype: String, description: City associated with the coordinate observation.}
      geolocation_state: {datatype: String, description: Brazilian state abbreviation associated with the coordinate observation.}
