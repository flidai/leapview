apiVersion: leapview.dev/v1
kind: Source
metadata:
  id: source:olist.products
  name: olist.products
  displayName: Products
spec:
  connection: olist
  location:
    type: path
    path: olist_products_dataset.csv
    format: csv
  schema:
    mode: compatible
    fields:
      product_id: {datatype: String, description: Stable product identifier.}
      product_category_name: {datatype: String, description: Product category name in the source language.}
