apiVersion: leapview.dev/v1
kind: Source
metadata:
  id: source:olist.translations
  name: olist.translations
  displayName: Product Category Translations
spec:
  connection: olist
  location:
    type: path
    path: product_category_name_translation.csv
    format: csv
  schema:
    mode: compatible
    fields:
      product_category_name: {datatype: String, description: Product category name in Portuguese.}
      product_category_name_english: {datatype: String, description: English product category name.}
