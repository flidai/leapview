apiVersion: leapview.dev/v1
kind: Source
metadata:
  id: source:olist.sellers
  name: olist.sellers
  displayName: Sellers
spec:
  connection: olist
  location:
    type: path
    path: olist_sellers_dataset.csv
    format: csv
  schema:
    mode: compatible
  fields:
    - {name: seller_id, datatype: String, description: Stable seller identifier used by order items.}
    - {name: seller_zip_code_prefix, datatype: String, description: Five-digit Brazilian ZIP-code prefix used for geographic joins.}
    - {name: seller_city, datatype: String, description: Seller city supplied by Olist.}
    - {name: seller_state, datatype: String, description: Brazilian state abbreviation for the seller.}
