apiVersion: leapview.dev/v1
kind: Source
metadata:
  id: source:olist.orders
  name: olist.orders
  displayName: Orders
spec:
  connection: olist
  location:
    type: path
    path: olist_orders_dataset.csv
    format: csv
  schema:
    mode: compatible
    fields:
      order_id: {datatype: String, description: Raw order identifier.}
      customer_id: {datatype: String, description: Customer identifier attached to the order.}
      order_status: {datatype: String, description: Raw lifecycle status.}
      order_purchase_timestamp: {datatype: String, description: Timestamp when the order was placed.}
      order_delivered_customer_date: {datatype: String, description: Timestamp when the order reached the customer.}
