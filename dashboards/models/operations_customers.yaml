apiVersion: leapview.dev/v1
kind: Model
metadata:
  id: model:operations_customers
  name: operations_customers
  displayName: Customers
spec:
  fields:
    customer_id:
      datatype: String
      label: Customer ID
    state:
      datatype: String
      label: State
  definition:
    type: sql
    sql: |
      SELECT customer_id, customer_state AS state
      FROM source."olist.customers"
  entities:
    customer:
      type: primary
      fields:
      - customer_id
  grain:
    entity: customer
