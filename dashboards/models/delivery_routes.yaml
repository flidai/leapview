apiVersion: leapview.dev/v1
kind: Model
metadata:
  id: model:delivery_routes
  name: delivery_routes
  displayName: Seller-to-Customer Delivery Routes
  description: Aggregated real Olist delivery corridors represented as ordered origin and destination vertices.
spec:
  description: Two vertices per actual order-seller delivery with seller-allocated revenue.
  sources:
  - olist.order_items
  - olist.sellers
  fields:
    vertex_id:
      datatype: String
      label: Route vertex
      description: Stable route and point-order identity
    route_id:
      datatype: String
      label: Route
      description: Stable order and seller delivery identity
    order_id:
      datatype: String
      label: Order ID
      description: Order identity used to join governed order filters
    point_order:
      datatype: String
      label: Point order
      description: Zero for seller origin and one for customer destination
    latitude:
      datatype: Float
      label: Latitude
      description: Latitude of the ordered route vertex
    longitude:
      datatype: Float
      label: Longitude
      description: Longitude of the ordered route vertex
    route_label:
      datatype: String
      label: Route
      description: Human-readable origin to destination route label
    destination_state:
      datatype: String
      label: Destination state
      description: Customer destination state used by dashboard filters
    route_revenue:
      datatype: Decimal
      label: Route revenue
      description: Order revenue allocated evenly across participating sellers
  transform:
    sql: |
      WITH order_sellers AS (
        SELECT DISTINCT order_id, seller_id
        FROM source."olist.order_items"
      ),
      allocated AS (
        SELECT
          os.order_id,
          os.seller_id,
          count(*) OVER (PARTITION BY os.order_id) AS seller_count
        FROM order_sellers os
      ),
      located AS (
        SELECT
          o.order_id,
          a.seller_id,
          printf('%05d', try_cast(s.seller_zip_code_prefix AS INTEGER)) AS seller_zip,
          coalesce(sg.city, lower(trim(s.seller_city))) AS seller_city,
          sg.latitude AS seller_latitude,
          sg.longitude AS seller_longitude,
          c.zip_prefix AS customer_zip,
          c.city AS customer_city,
          c.state AS destination_state,
          c.latitude AS customer_latitude,
          c.longitude AS customer_longitude,
          o.revenue / nullif(a.seller_count, 0) AS allocated_revenue
        FROM allocated a
        JOIN model.orders o ON o.order_id = a.order_id
        JOIN model.customers c ON c.customer_id = o.customer_id
        JOIN source."olist.sellers" s ON s.seller_id = a.seller_id
        LEFT JOIN model.zip_geolocations sg
          ON sg.zip_prefix = printf('%05d', try_cast(s.seller_zip_code_prefix AS INTEGER))
        WHERE sg.latitude IS NOT NULL
          AND sg.longitude IS NOT NULL
          AND c.latitude IS NOT NULL
          AND c.longitude IS NOT NULL
      ),
      vertices AS (
        SELECT
          order_id || ':' || seller_id || ':0' AS vertex_id,
          order_id || ':' || seller_id AS route_id,
          order_id,
          '0' AS point_order,
          seller_latitude AS latitude,
          seller_longitude AS longitude,
          seller_city || ' → ' || customer_city AS route_label,
          destination_state,
          CAST(round(allocated_revenue, 2) AS DECIMAL(38,2)) AS route_revenue
        FROM located
        UNION ALL
        SELECT
          order_id || ':' || seller_id || ':1' AS vertex_id,
          order_id || ':' || seller_id AS route_id,
          order_id,
          '1' AS point_order,
          customer_latitude AS latitude,
          customer_longitude AS longitude,
          seller_city || ' → ' || customer_city AS route_label,
          destination_state,
          CAST(round(allocated_revenue, 2) AS DECIMAL(38,2)) AS route_revenue
        FROM located
      )
      SELECT * FROM vertices
  entities:
    vertex:
      type: primary
      fields:
      - vertex_id
    order:
      type: foreign
      fields:
      - order_id
  grain:
    entity: vertex
