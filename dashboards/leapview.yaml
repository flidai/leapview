apiVersion: leapview.dev/v1
kind: Project
metadata:
  id: project:leapview-showcase
  name: leapview-showcase
spec:
  connections:
    include:
      - connections/*.yaml
  sources:
    include:
      - sources/*.yaml
  models:
    include:
      - models/*.yaml
  semanticModels:
    include:
      - semantic-models/*.yaml
  pipelines:
    include:
      - pipelines/*.yaml
  dashboards:
    include:
      - dashboards/*.yaml
  access:
    include:
      - access/*.yaml
  publications:
    include:
      - publications/*.yaml
