apiVersion: leapview.dev/v1
kind: SemanticModel
metadata:
  id: semantic-model:operations
  name: operations
  displayName: Operations Semantic Model
spec:
  datasets:
    - name: operations_orders
      model: operations_orders
      metrics:
        - name: order_count
          type: simple
          empty: zero
          label: Orders
          agg: count_distinct
          field: order_id
        - name: review_score
          type: simple
          empty: 'null'
          label: Review score
          agg: avg
        - name: delivery_days
          type: simple
          empty: 'null'
          label: Delivery days
          agg: avg
      dimensions:
        - name: status
          datatype: String
        - name: delivery_bucket
          datatype: String
    - name: operations_customers
      model: operations_customers
  relationships:
    - name: orders_customers
      from:
        dataset: operations_orders
        entity: customer
      to:
        dataset: operations_customers
        entity: customer
  dimensions:
    - name: state
      datatype: String
      bindings:
        - dataset: operations_orders
          field: operations_customers.state
          path:
            - orders_customers
