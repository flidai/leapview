apiVersion: leapview.dev/v1
kind: SemanticModel
metadata:
  id: semantic-model:operations
  name: operations
  displayName: Operations Semantic Model
spec:
  datasets:
    operations_orders:
      model: operations_orders
      metrics:
        order_count:
          type: simple
          empty: zero
          label: Orders
          agg: count_distinct
          field: order_id
        review_score:
          type: simple
          empty: 'null'
          label: Review score
          agg: avg
        delivery_days:
          type: simple
          empty: 'null'
          label: Delivery days
          agg: avg
      dimensions:
        status:
          datatype: String
        delivery_bucket:
          datatype: String
    operations_customers:
      model: operations_customers
  relationships:
    orders_customers:
      from:
        dataset: operations_orders
        entity: customer
      to:
        dataset: operations_customers
        entity: customer
  dimensions:
    state:
      datatype: String
      bindings:
        operations_orders:
          field: operations_customers.state
          path:
            - orders_customers
