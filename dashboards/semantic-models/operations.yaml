apiVersion: leapview.dev/v1
kind: SemanticModel
metadata:
  id: semantic-model:operations
  name: operations
  displayName: Operations Semantic Model
spec:
  datasets:
    operations_orders:
      model: operations_orders
    operations_customers:
      model: operations_customers
  relationships:
    orders_customers:
      from:
        dataset: operations_orders
        entity: customer
      to:
        dataset: operations_customers
        entity: customer
  dimensions:
    state:
      datatype: String
      bindings:
        operations_orders:
          field: operations_customers.state
          path:
          - orders_customers
    status:
      datatype: String
      bindings:
        operations_orders:
          field: operations_orders.status
    delivery_bucket:
      datatype: String
      bindings:
        operations_orders:
          field: operations_orders.delivery_bucket
  metrics:
    order_count:
      type: aggregate
      dataset: operations_orders
      aggregation: count_distinct
      input:
        field: operations_orders.order_id
      empty: zero
      label: Orders
    review_score:
      type: aggregate
      dataset: operations_orders
      aggregation: avg
      input:
        field: operations_orders.review_score
      empty: 'null'
      label: Review score
    delivery_days:
      type: aggregate
      dataset: operations_orders
      aggregation: avg
      input:
        field: operations_orders.delivery_days
      empty: 'null'
      label: Delivery days
