apiVersion: leapview.dev/v1
kind: SemanticModel
metadata:
  id: semantic-model:visuals
  name: visuals
  displayName: Visuals Semantic Model
  description: Rich Olist semantic model used for visual renderer and table QA coverage.
spec:
  datasets:
    - name: orders
      model: orders
      defaultTimeDimension: purchase_date
      metrics:
        - name: order_count
          type: simple
          empty: zero
          label: Orders
          description: Distinct order count.
          format: integer
          agg: count_distinct
          field: order_id
        - name: revenue
          type: simple
          empty: zero
          label: Revenue
          description: Total payment revenue.
          unit: BRL
          format: currency
          agg: sum
        - name: revenue_min
          type: simple
          empty: 'null'
          label: Revenue min
          description: Minimum order revenue.
          unit: BRL
          format: currency
          agg: min
          field: revenue
        - name: revenue_max
          type: simple
          empty: 'null'
          label: Revenue max
          description: Maximum order revenue.
          unit: BRL
          format: currency
          agg: max
          field: revenue
        - name: missing_revenue
          type: simple
          where:
            - missing_revenue_filter
          empty: 'null'
          label: Missing revenue comparison
          description: Documentation-only comparison metric with no matching rows.
          unit: BRL
          format: currency
          agg: sum
          field: revenue
        - name: review_score
          type: simple
          empty: 'null'
          label: Review
          description: Average order review score.
          format: decimal
          agg: avg
        - name: delivery_days
          type: simple
          empty: 'null'
          label: Delivery days
          description: Average delivery duration in days.
          format: decimal
          agg: avg
        - name: delivery_days_min
          type: simple
          empty: 'null'
          label: Delivery min
          description: Minimum delivery duration in days.
          format: decimal
          agg: min
          field: delivery_days
        - name: delivery_days_max
          type: simple
          empty: 'null'
          label: Delivery max
          description: Maximum delivery duration in days.
          format: decimal
          agg: max
          field: delivery_days
      dimensions:
        - name: purchase_timestamp
          datatype: DateTime
          time:
            nativeGrain: second
            grains:
              - second
              - minute
              - hour
              - day
              - week
              - month
              - quarter
              - year
            calendar: iso8601
        - name: purchase_date
          datatype: Date
          time:
            nativeGrain: day
            grains:
              - day
              - week
              - month
            calendar: iso8601
        - name: purchase_month
          datatype: String
        - name: delivery_bucket
          datatype: String
        - name: order_id
          datatype: String
        - name: order_status
          datatype: String
          field: status
        - name: category
          datatype: String
        - name: delivered
          datatype: Boolean
          field: is_delivered
        - name: delivery_days
          datatype: Integer
        - name: revenue_amount
          datatype: Decimal
          field: revenue
    - name: customers
      model: customers
    - name: zip_geolocations
      model: zip_geolocations
    - name: delivery_routes
      model: delivery_routes
      metrics:
        - name: route_orders
          type: simple
          empty: zero
          label: Route orders
          description: Distinct orders aggregated for a seller-to-customer ZIP corridor.
          format: integer
          agg: count_distinct
          field: order_id
        - name: route_revenue
          type: simple
          empty: zero
          label: Route revenue
          description: Seller-allocated revenue for actual order delivery routes.
          unit: BRL
          format: currency
          agg: sum
      dimensions:
        - name: route_id
          datatype: String
        - name: point_order
          datatype: String
        - name: route_label
          datatype: String
    - name: spatial_load_points
      model: spatial_load_points
      metrics:
        - name: fixture_points
          type: simple
          empty: zero
          label: Fixture points
          description: Count of deterministic locations in the spatial load fixture.
          format: integer
          agg: count
          field: point_id
      dimensions:
        - name: point_id
          datatype: String
  relationships:
    - name: orders_customers
      from:
        dataset: orders
        entity: customer
      to:
        dataset: customers
        entity: customer
      description: Links each order to the customer who placed it.
    - name: delivery_routes_orders
      from:
        dataset: delivery_routes
        entity: order
      to:
        dataset: orders
        entity: order
      description: Applies governed order and customer filters to delivery-route vertices.
  filters:
    - name: missing_revenue_filter
      definition:
        field: orders.status
        operator: equals
        value: comparison_fixture_without_rows
  dimensions:
    - name: state
      datatype: String
      bindings:
        - dataset: orders
          field: customers.state
          path:
            - orders_customers
        - dataset: delivery_routes
          field: customers.state
          path:
            - delivery_routes_orders
            - orders_customers
        - dataset: spatial_load_points
          field: spatial_load_points.state
    - name: zip_prefix
      datatype: String
      bindings:
        - dataset: orders
          field: customers.zip_prefix
          path:
            - orders_customers
        - dataset: spatial_load_points
          field: spatial_load_points.point_id
    - name: city
      datatype: String
      bindings:
        - dataset: orders
          field: customers.city
          path:
            - orders_customers
        - dataset: delivery_routes
          field: delivery_routes.route_label
        - dataset: spatial_load_points
          field: spatial_load_points.city
    - name: latitude
      datatype: Float
      bindings:
        - dataset: orders
          field: customers.latitude
          path:
            - orders_customers
        - dataset: delivery_routes
          field: delivery_routes.latitude
        - dataset: spatial_load_points
          field: spatial_load_points.latitude
    - name: longitude
      datatype: Float
      bindings:
        - dataset: orders
          field: customers.longitude
          path:
            - orders_customers
        - dataset: delivery_routes
          field: delivery_routes.longitude
        - dataset: spatial_load_points
          field: spatial_load_points.longitude
  metrics:
    - name: aov
      type: ratio
      numerator: revenue
      denominator: order_count
      label: AOV
      description: Average order value.
      unit: BRL
      format: currency
    - name: revenue_baseline
      type: derived
      label: Revenue baseline
      description: Filter-aligned baseline used by KPI comparison examples.
      expression: ${revenue} * 0.9
      unit: BRL
      format: currency
    - name: revenue_target
      type: derived
      label: Revenue target
      description: Filter-aligned target used by KPI goal examples.
      expression: ${revenue} * 1.1
      unit: BRL
      format: currency
    - name: revenue_q1
      type: derived
      label: Revenue lower bound
      description: Minimum order revenue used as the lower showcase bound.
      expression: ${revenue_min}
      unit: BRL
      format: currency
    - name: revenue_q3
      type: derived
      label: Revenue upper bound
      description: Maximum order revenue used as the upper showcase bound.
      expression: ${revenue_max}
      unit: BRL
      format: currency
    - name: delivery_days_q1
      type: derived
      label: Delivery lower bound
      description: Minimum delivery duration used as the lower showcase bound.
      expression: ${delivery_days_min}
      format: decimal
    - name: delivery_days_q3
      type: derived
      label: Delivery upper bound
      description: Maximum delivery duration used as the upper showcase bound.
      expression: ${delivery_days_max}
      format: decimal
