apiVersion: leapview.dev/v1
kind: SemanticModel
metadata:
  id: semantic-model:visuals
  name: visuals
  displayName: Visuals Semantic Model
  description: Rich Olist semantic model used for visual renderer and table QA coverage.
spec:
  datasets:
    orders:
      model: orders
      defaultTimeDimension: purchase_date
    customers:
      model: customers
    zip_geolocations:
      model: zip_geolocations
    delivery_routes:
      model: delivery_routes
    spatial_load_points:
      model: spatial_load_points
  relationships:
    orders_customers:
      from:
        dataset: orders
        entity: customer
      to:
        dataset: customers
        entity: customer
      description: Links each order to the customer who placed it.
    delivery_routes_orders:
      from:
        dataset: delivery_routes
        entity: order
      to:
        dataset: orders
        entity: order
      description: Applies governed order and customer filters to delivery-route vertices.
  filters:
    missing_revenue_filter:
      field: orders.status
      operator: equals
      value: comparison_fixture_without_rows
  dimensions:
    purchase_timestamp:
      datatype: DateTime
      bindings:
        orders:
          field: orders.purchase_timestamp
      time:
        nativeGrain: second
        grains:
        - second
        - minute
        - hour
        - day
        - week
        - month
        - quarter
        - year
        calendar: iso8601
    purchase_date:
      datatype: Date
      bindings:
        orders:
          field: orders.purchase_date
      time:
        nativeGrain: day
        grains:
        - day
        - week
        - month
        calendar: iso8601
    purchase_month:
      datatype: String
      bindings:
        orders:
          field: orders.purchase_month
    delivery_bucket:
      datatype: String
      bindings:
        orders:
          field: orders.delivery_bucket
    order_id:
      datatype: String
      bindings:
        orders:
          field: orders.order_id
    state:
      datatype: String
      bindings:
        orders:
          field: customers.state
          path:
          - orders_customers
        delivery_routes:
          field: customers.state
          path:
          - delivery_routes_orders
          - orders_customers
    zip_prefix:
      datatype: String
      bindings:
        orders:
          field: customers.zip_prefix
          path:
          - orders_customers
        spatial_load_points:
          field: spatial_load_points.point_id
    city:
      datatype: String
      bindings:
        orders:
          field: customers.city
          path:
          - orders_customers
        delivery_routes:
          field: delivery_routes.route_label
        spatial_load_points:
          field: spatial_load_points.city
    latitude:
      datatype: Float
      bindings:
        orders:
          field: customers.latitude
          path:
          - orders_customers
        delivery_routes:
          field: delivery_routes.latitude
        spatial_load_points:
          field: spatial_load_points.latitude
    longitude:
      datatype: Float
      bindings:
        orders:
          field: customers.longitude
          path:
          - orders_customers
        delivery_routes:
          field: delivery_routes.longitude
        spatial_load_points:
          field: spatial_load_points.longitude
    point_id:
      datatype: String
      bindings:
        spatial_load_points:
          field: spatial_load_points.point_id
    route_id:
      datatype: String
      bindings:
        delivery_routes:
          field: delivery_routes.route_id
    point_order:
      datatype: String
      bindings:
        delivery_routes:
          field: delivery_routes.point_order
    route_label:
      datatype: String
      bindings:
        delivery_routes:
          field: delivery_routes.route_label
    order_status:
      datatype: String
      bindings:
        orders:
          field: orders.status
    category:
      datatype: String
      bindings:
        orders:
          field: orders.category
    delivered:
      datatype: Boolean
      bindings:
        orders:
          field: orders.is_delivered
    delivery_days:
      datatype: Integer
      bindings:
        orders:
          field: orders.delivery_days
    revenue_amount:
      datatype: Decimal
      bindings:
        orders:
          field: orders.revenue
  metrics:
    fixture_points:
      type: aggregate
      dataset: spatial_load_points
      aggregation: count
      input:
        field: spatial_load_points.point_id
      empty: zero
      label: Fixture points
      description: Count of deterministic locations in the spatial load fixture.
      format: integer
    order_count:
      type: aggregate
      dataset: orders
      aggregation: count_distinct
      input:
        field: orders.order_id
      empty: zero
      label: Orders
      description: Distinct order count.
      format: integer
    revenue:
      type: aggregate
      dataset: orders
      aggregation: sum
      input:
        field: orders.revenue
      empty: zero
      label: Revenue
      description: Total payment revenue.
      unit: R$
      format: currency
    revenue_min:
      type: aggregate
      dataset: orders
      aggregation: min
      input:
        field: orders.revenue
      empty: 'null'
      label: Revenue min
      description: Minimum order revenue.
      unit: R$
      format: currency
    revenue_max:
      type: aggregate
      dataset: orders
      aggregation: max
      input:
        field: orders.revenue
      empty: 'null'
      label: Revenue max
      description: Maximum order revenue.
      unit: R$
      format: currency
    missing_revenue:
      type: aggregate
      dataset: orders
      aggregation: sum
      input:
        field: orders.revenue
      where:
      - missing_revenue_filter
      empty: 'null'
      label: Missing revenue comparison
      description: Documentation-only comparison metric with no matching rows.
      unit: R$
      format: currency
    review_score:
      type: aggregate
      dataset: orders
      aggregation: avg
      input:
        field: orders.review_score
      empty: 'null'
      label: Review
      description: Average order review score.
      format: decimal
    delivery_days:
      type: aggregate
      dataset: orders
      aggregation: avg
      input:
        field: orders.delivery_days
      empty: 'null'
      label: Delivery days
      description: Average delivery duration in days.
      format: decimal
    delivery_days_min:
      type: aggregate
      dataset: orders
      aggregation: min
      input:
        field: orders.delivery_days
      empty: 'null'
      label: Delivery min
      description: Minimum delivery duration in days.
      format: decimal
    delivery_days_max:
      type: aggregate
      dataset: orders
      aggregation: max
      input:
        field: orders.delivery_days
      empty: 'null'
      label: Delivery max
      description: Maximum delivery duration in days.
      format: decimal
    route_orders:
      type: aggregate
      dataset: delivery_routes
      aggregation: count_distinct
      input:
        field: delivery_routes.order_id
      empty: zero
      label: Route orders
      description: Distinct orders aggregated for a seller-to-customer ZIP corridor.
      format: integer
    route_revenue:
      type: aggregate
      dataset: delivery_routes
      aggregation: sum
      input:
        field: delivery_routes.route_revenue
      empty: zero
      label: Route revenue
      description: Seller-allocated revenue for actual order delivery routes.
      unit: R$
      format: currency
    aov:
      type: ratio
      numerator: revenue
      denominator: order_count
      label: AOV
      description: Average order value.
      unit: R$
      format: currency
    revenue_baseline:
      type: derived
      label: Revenue baseline
      description: Filter-aligned baseline used by KPI comparison examples.
      expression: ${revenue} * 0.9
      unit: R$
      format: currency
    revenue_target:
      type: derived
      label: Revenue target
      description: Filter-aligned target used by KPI goal examples.
      expression: ${revenue} * 1.1
      unit: R$
      format: currency
    revenue_q1:
      type: derived
      label: Revenue lower bound
      description: Minimum order revenue used as the lower showcase bound.
      expression: ${revenue_min}
      unit: R$
      format: currency
    revenue_q3:
      type: derived
      label: Revenue upper bound
      description: Maximum order revenue used as the upper showcase bound.
      expression: ${revenue_max}
      unit: R$
      format: currency
    delivery_days_q1:
      type: derived
      label: Delivery lower bound
      description: Minimum delivery duration used as the lower showcase bound.
      expression: ${delivery_days_min}
      format: decimal
    delivery_days_q3:
      type: derived
      label: Delivery upper bound
      description: Maximum delivery duration used as the upper showcase bound.
      expression: ${delivery_days_max}
      format: decimal
