apiVersion: leapview.dev/v1
kind: SemanticModel
metadata:
  id: semantic-model:sales
  name: sales
  displayName: Sales Semantic Model
spec:
  tables:
    - sales_orders
    - sales_customers
  relationships:
    - id: orders_customers
      from: sales_orders.customer_id
      to: sales_customers.customer_id
      cardinality: many_to_one
  dimensions:
    purchase_date:
      type: date
      bindings:
        sales_orders: {field: sales_orders.purchase_date}
    state:
      type: string
      bindings:
        sales_orders:
          field: sales_customers.state
          path: [orders_customers]
    category:
      type: string
      bindings:
        sales_orders: {field: sales_orders.category}
  measures:
    order_count:
      label: Orders
      fact: sales_orders
      aggregation: count_distinct
      input: {field: sales_orders.order_id}
      empty: zero
    revenue:
      label: Revenue
      fact: sales_orders
      aggregation: sum
      input: {field: sales_orders.revenue}
      empty: zero
      format: currency
  metrics:
    aov:
      label: Average order value
      expression: safe_divide(${revenue}, ${order_count})
      format: currency
