version: 1

# Every maintained dependency-bearing surface is listed separately. Keep
# paths repository-relative; the validator discovers these classes and fails
# when a new surface is added without an entry here.
surfaces:
  - path: go.mod
    kind: go-module
    updater: {ecosystem: gomod, directory: /}
    scanners: [govulncheck]
  - path: pkg/apigen/go.mod
    kind: go-module
    updater: {ecosystem: gomod, directory: /pkg/apigen}
    scanners: [govulncheck]
  - path: pkg/apigen/example/go.mod
    kind: go-module
    updater: {ecosystem: gomod, directory: /pkg/apigen/example}
    scanners: [govulncheck]

  - path: package.json
    kind: js-package
    updater: {ecosystem: npm, directory: /}
    scanners: [bun-audit]
  - path: desktop/package.json
    kind: js-package
    updater: {ecosystem: npm, directory: /desktop}
    scanners: [bun-audit]
  - path: deploy/compose/qualification/package.json
    kind: js-package
    updater: {ecosystem: npm, directory: /deploy/compose/qualification}
    scanners: [bun-audit]
  - path: internal/app/testing/maliciousinstance/electron/package.json
    kind: js-package
    updater: {ecosystem: npm, directory: /internal/app/testing/maliciousinstance/electron}
    scanners: [bun-audit]
  - path: pkg/apigen/typespec/package.json
    kind: js-package
    updater: {ecosystem: npm, directory: /pkg/apigen/typespec}
    scanners: [npm-audit]
  - path: bun.lock
    kind: js-lock
    updater: {ecosystem: npm, directory: /}
    scanners: [bun-audit]
  - path: deploy/compose/qualification/bun.lock
    kind: js-lock
    updater: {ecosystem: npm, directory: /deploy/compose/qualification}
    scanners: [bun-audit]
  - path: desktop/bun.lock
    kind: js-lock
    updater: {ecosystem: npm, directory: /desktop}
    scanners: [bun-audit]
  - path: internal/app/testing/maliciousinstance/electron/bun.lock
    kind: js-lock
    updater: {ecosystem: npm, directory: /internal/app/testing/maliciousinstance/electron}
    scanners: [bun-audit]
  - path: pkg/apigen/typespec/package-lock.json
    kind: js-lock
    updater: {ecosystem: npm, directory: /pkg/apigen/typespec}
    scanners: [npm-audit]

  - path: deploy/hetzner
    kind: terraform-root
    updater: {ecosystem: terraform, directory: /deploy/hetzner}
    scanners: [trivy]
  - path: deploy/hetzner-site
    kind: terraform-root
    updater: {ecosystem: terraform, directory: /deploy/hetzner-site}
    scanners: [trivy]

  - path: Dockerfile
    kind: dockerfile
    updater: {ecosystem: docker, directory: /}
    scanners: [trivy]
    images:
      - debian:bookworm-slim@sha256:88200866dfff7ea7f5cbcb6ec7c8a701889efe6fe859fe64d6990e4b07ea4171
      - golang:1.27.0-bookworm@sha256:ded31c68586d2e49e760acc2e65a884b23d032e9bbbed0ae0c55abd3fcaf4452
      - node:26-bookworm@sha256:9f94d34c787165dca03b74e5bf9c3bf90e8de79b19aa3d87fe1fa1694bf75c89
      - oven/bun:1.4.0@sha256:5ff609364c049b54eb0ff560ec96319729a972078ef2c755d758f0c6ef89c2d6
  - path: Dockerfile.site
    kind: dockerfile
    updater: {ecosystem: docker, directory: /}
    scanners: [trivy]
    images:
      - gcr.io/distroless/static-debian12:nonroot@sha256:afa5c872c891853ca7fcf1f12c3edb23f7eeef36189728842dd51042ff57f7ab
      - golang:1.27.0-bookworm@sha256:ded31c68586d2e49e760acc2e65a884b23d032e9bbbed0ae0c55abd3fcaf4452
      - node:26-bookworm@sha256:9f94d34c787165dca03b74e5bf9c3bf90e8de79b19aa3d87fe1fa1694bf75c89
      - oven/bun:1.4.0@sha256:5ff609364c049b54eb0ff560ec96319729a972078ef2c755d758f0c6ef89c2d6
  - path: deploy/compose/qualification/Dockerfile.authoring-client
    kind: dockerfile
    updater: {ecosystem: docker, directory: /deploy/compose/qualification}
    scanners: [trivy]
    images: ["${LEAPVIEW_IMAGE}"]
  - path: deploy/postgres/ha/Dockerfile
    kind: dockerfile
    updater: {ecosystem: docker, directory: /deploy/postgres/ha}
    scanners: [trivy]
    images:
      - docker.io/library/postgres:18-alpine@sha256:63bdc97d67b5133bf0e5ebd500bec6d046fa851dc81340d838f0347e616107e8
  - path: internal/app/testing/maliciousinstance/electron/Dockerfile.linux
    kind: dockerfile
    updater: {ecosystem: docker, directory: /internal/app/testing/maliciousinstance/electron}
    scanners: [trivy]
    images:
      - golang:1.27-bookworm
      - oven/bun:1.4.0-debian@sha256:5bb0f9be3a1a36a03e27c9a9dd894a3b1ad26657155c7df4dda771e17bf872ef

