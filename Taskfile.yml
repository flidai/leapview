  generated:git-check:
    desc: Verify build-only generated code is not tracked by Git
    cmds:
      - |
        tracked="$(
          git ls-files '*.go' | while IFS= read -r file; do
            [ -f "$file" ] || continue
            first_line="$(sed -n '1p' "$file")"
            if [ "$first_line" = '// Code generated by sqlc. DO NOT EDIT.' ]; then
              printf '%s\n' "$file"
            fi
          done
