version: '3'

env:
  GOFLAGS: -tags=duckdb_arrow

tasks:
  nix:build:
    desc: Build the sandboxed native Nix application and deployment CLI
    cmds:
      - nix build --no-update-lock-file .#leapview --out-link result-app

  nix:image:
    desc: Build the Nix container archive for Docker, Compose and Kamal
    cmds:
      - nix build --no-update-lock-file .#leapview-image --out-link result-image

  nix:cli:
    desc: Build CGO-disabled Linux deployment controller candidates for AMD64 and ARM64
    cmds:
      - nix build --no-update-lock-file .#leapviewctl-linux-amd64 --out-link result-cli-amd64
      # Nix adds the selected output's -arm64 suffix to this prefix.
      - nix build --no-update-lock-file .#leapviewctl-linux-arm64 --out-link result-cli

  nix:compose:controllers:
    desc: Build release-compatible controller candidates for Compose bundle assembly
    cmds:
      - nix build --no-update-lock-file .#leapviewctl-compose-linux-amd64 --out-link result-compose-cli-amd64
      - nix build --no-update-lock-file .#leapviewctl-compose-linux-arm64 --out-link result-compose-cli

  nix:qualify:
    desc: Qualify the Nix image through the existing production deployment checks
    cmds:
      - task: nix:build
      - task: nix:image
      - nix develop --no-update-lock-file -c bash scripts/check_nix_image.sh result-image result-app

  nix:check:
    desc: Check the locked Nix toolchain and real browser integration
    cmds:
      - nix flake check --no-update-lock-file
      - nix develop --no-update-lock-file -c task nix:smoke

  nix:smoke:
    desc: Exercise the Go toolchains and pinned Chromium inside nix develop
    deps: [node:deps]
    cmds:
      - node scripts/check_nix_development.mjs

  nix:ci:
    desc: Run the existing PR contract inside the locked Nix development environment
    cmds:
      - nix develop --no-update-lock-file -c task ci

  dev:
    desc: Start the managed LeapView dev server with real local authentication
    cmds:
      - task: postgres:dev:up
      - task: generate
      - task: build
      - task: bootstrap
      - task: map-assets:install
      - ./scripts/dev-server.sh start

  playground:
    desc: Start the standalone component and chart playground (no application services)
    cmds:
      - task: visualization-ir:generate
      - task: layout-contract:generate
      - task: lucide-icons:generate
      - bun run playground

  dev:reset-login:
    desc: Explicitly restore the private local development login and restart the managed server
    cmds:
      - LEAPVIEW_DEV_RESET_LOGIN=1 LEAPVIEW_DEV_RESTART=1 task dev

  dev:bypass:
    desc: Start the managed dev server with explicit local authentication bypass
    cmds:
      - task: postgres:dev:up
      - task: generate
      - task: build
      - task: bootstrap
      - task: map-assets:install
      - LEAPVIEW_DEV_AUTH_BYPASS=true LEAPVIEW_LOCAL_AUTH=false ./scripts/dev-server.sh start

  dev:movielens:
    desc: Seed and run the MovieLens 32M fixture with explicit auth bypass
    cmds:
      - task: postgres:dev:up
      - task: generate
      - task: build
      - task: bootstrap:movielens
      - LEAPVIEW_DEV_AUTH_BYPASS=true LEAPVIEW_LOCAL_AUTH=false LEAPVIEW_DEV_RESTART=1 LEAPVIEW_DEV_READY_ATTEMPTS=1800 LEAPVIEW_DEV_MCP_MODEL_QUERY=movie_ratings LEAPVIEW_DEV_MCP_METRIC=rating_count ./scripts/dev-server.sh start dashboards/experiments/movielens movielens .data/movielens

  dev:cfo:
    desc: Seed and run the CFO finance fixture with explicit auth bypass
    cmds:
      - task: postgres:dev:up
      - task: generate
      - task: build
      - task: bootstrap:cfo
      - task: map-assets:install
      - LEAPVIEW_DEV_AUTH_BYPASS=true LEAPVIEW_LOCAL_AUTH=false LEAPVIEW_DEV_RESTART=1 LEAPVIEW_DEV_READY_ATTEMPTS=1800 LEAPVIEW_DEV_MCP_MODEL_QUERY=finance LEAPVIEW_DEV_MCP_METRIC=net_sales ./scripts/dev-server.sh start dashboards/experiments/cfo-demo finance_files .data/cfo-demo

  dbt:warehouse:build:
    desc: Build and verify the pinned dbt-duckdb warehouse-boundary Parquet publication
    sources:
      - examples/dbt-warehouse-boundary/dbt/**/*.sql
      - examples/dbt-warehouse-boundary/dbt/**/*.yml
      - examples/dbt-warehouse-boundary/dbt/**/*.csv
      - examples/dbt-warehouse-boundary/dbt/requirements.txt
      - scripts/dbt-warehouse-boundary.sh
    generates:
      - examples/dbt-warehouse-boundary/published/dim_customers.parquet
      - examples/dbt-warehouse-boundary/published/fct_orders.parquet
    cmds:
      - ./scripts/dbt-warehouse-boundary.sh build

  dbt:warehouse:proof:
    desc: Prove independent physical producers and upstream dbt packages close into one Project
    cmds:
      - ./scripts/dbt-warehouse-boundary.sh proof

  dbt:warehouse:qualify:
    desc: Run the physical dbt Parquet publication through the ordinary headless LeapView candidate lifecycle
    cmds:
      - task: postgres:dev:up
      - task: generate
      - task: build
      - task: map-assets:install
      - task: dbt:warehouse:build
      - ./scripts/dev-server.sh once examples/dbt-warehouse-boundary/leapview warehouse examples/dbt-warehouse-boundary/published

  dbt:warehouse:
    desc: Build the dbt-duckdb showcase and start LeapView through the managed development flow
    cmds:
      - task: postgres:dev:up
      - task: generate
      - task: build
      - task: map-assets:install
      - task: dbt:warehouse:build
      - ./scripts/dev-server.sh start examples/dbt-warehouse-boundary/leapview warehouse examples/dbt-warehouse-boundary/published

  bootstrap:
    desc: Download/sync Olist CSVs if missing
    cmds:
      - go run ./internal/app/tools/bootstrapolist --shared-cache --out .data/olist

  map-style:generate:
    desc: Generate the pinned renderer-owned MapLibre style
    deps:
      - node:deps
    sources:
      - scripts/generate_map_style.ts
      - package.json
      - bun.lock
    generates:
      - static/map-assets/leapview-streets/style.json
    cmds:
      - bun scripts/generate_map_style.ts

  map-assets:install:
    desc: Install the pinned local PMTiles, glyph, and sprite assets used by development
    cmds:
      - go run ./internal/app/tools/mapassets --shared-cache --out .data/map-assets

  map-assets:publish:
    desc: Publish the verified content-addressed map package to managed S3 storage and optionally verify its public delivery
    requires:
      vars: [MAP_ASSET_S3_BUCKET]
    cmds:
      - >-
        go run ./internal/app/tools/mapassets
        --out .data/map-assets
        --shared-cache
        --publish-s3-bucket {{.MAP_ASSET_S3_BUCKET | quote}}
        --publish-s3-prefix {{default "map-assets" .MAP_ASSET_S3_PREFIX | quote}}
        {{if .MAP_ASSET_S3_REGION}}--publish-s3-region {{.MAP_ASSET_S3_REGION | quote}}{{end}}
        {{if .MAP_ASSET_S3_ENDPOINT}}--publish-s3-endpoint {{.MAP_ASSET_S3_ENDPOINT | quote}}{{end}}
        {{if .MAP_ASSET_S3_PATH_STYLE}}--publish-s3-path-style{{end}}
        {{if .MAP_ASSET_BASE_URL}}--verify-base-url {{.MAP_ASSET_BASE_URL | quote}}{{end}}

  map-assets:verify:
    desc: Verify the complete map package through its same-origin production delivery path
    requires:
      vars: [MAP_ASSET_BASE_URL]
    cmds:
      - >-
        go run ./internal/app/tools/mapassets
        --out .data/map-assets
        --shared-cache
        --verify-base-url {{.MAP_ASSET_BASE_URL | quote}}

  bootstrap:movielens:
    desc: Download/sync MovieLens 32M CSVs if missing
    cmds:
      - go run ./internal/app/tools/bootstrapmovielens --shared-cache --out .data/movielens

  bootstrap:cfo:
    desc: Download/sync the pinned Microsoft Financial Sample workbook if missing
    cmds:
      - go run ./internal/app/tools/bootstrapfinance --shared-cache --out .data/cfo-demo

  dev:stop:
    desc: Stop the managed LeapView dev server for this worktree
    cmds:
      - ./scripts/dev-server.sh stop

  dev:status:
    desc: Show managed LeapView dev server status
    cmds:
      - ./scripts/dev-server.sh status

  dev:credentials:
    desc: Show the private local development login after task dev has initialized it
    cmds:
      - ./scripts/dev-server.sh credentials

  dev:auth-smoke:
    desc: Verify real login, group role activation after release, and revocation
    cmds:
      - ./scripts/dev-server.sh auth-smoke

  dev:publish:
    desc: Publish the current development candidate with real scoped authority
    cmds:
      - LEAPVIEW_DEV_SKIP_DATA_SYNC=1 ./scripts/dev-server.sh publish

  dev:logs:
    desc: Tail managed LeapView dev server logs
    cmds:
      - ./scripts/dev-server.sh logs

  postgres:dev:up:
    desc: Provision the loopback-only PostgreSQL 18 development databases and roles
    cmds:
      - ./scripts/postgres-dev.sh up

  postgres:dev:
    desc: Provision the local PostgreSQL development databases and roles
    cmds:
      - task: postgres:dev:up

  postgres:dev:down:
    desc: Stop the local PostgreSQL development service (retains its volume)
    cmds:
      - ./scripts/postgres-dev.sh down

  postgres:dev:status:
    desc: Show the local PostgreSQL development service status
    cmds:
      - ./scripts/postgres-dev.sh status

  postgres:dev:env:
    desc: Print the path to the mode-0600 local PostgreSQL runtime environment file
    cmds:
      - ./scripts/postgres-dev.sh env

  postgres:dev:check:
    desc: Verify local PostgreSQL database and runtime-role isolation
    cmds:
      - ./scripts/postgres-dev.sh check

  postgres:test:up:
    desc: Provision an isolated PostgreSQL 18 test service on a worktree-scoped port
    env:
      LEAPVIEW_POSTGRES_PROJECT_SUFFIX: -test
      LEAPVIEW_POSTGRES_TEST_MODE: "1"
      LEAPVIEW_POSTGRES_DEV_ENV_FILE: "{{.ROOT_DIR}}/.tmp/postgres-test.env"
    cmds:
      - ./scripts/postgres-dev.sh up

  postgres:test:
    desc: Provision the isolated PostgreSQL test databases and roles
    cmds:
      - task: postgres:test:up

  postgres:test:down:
    desc: Stop the isolated PostgreSQL test service (retains its volume)
    env:
      LEAPVIEW_POSTGRES_PROJECT_SUFFIX: -test
      LEAPVIEW_POSTGRES_TEST_MODE: "1"
      LEAPVIEW_POSTGRES_DEV_ENV_FILE: "{{.ROOT_DIR}}/.tmp/postgres-test.env"
    cmds:
      - ./scripts/postgres-dev.sh down

  postgres:test:check:
    desc: Verify isolated PostgreSQL test database and runtime-role isolation
    env:
      LEAPVIEW_POSTGRES_PROJECT_SUFFIX: -test
      LEAPVIEW_POSTGRES_TEST_MODE: "1"
      LEAPVIEW_POSTGRES_DEV_ENV_FILE: "{{.ROOT_DIR}}/.tmp/postgres-test.env"
    cmds:
      - ./scripts/postgres-dev.sh check

  test:qualification:native-postgres:
    desc: Run native PostgreSQL topology, bundled retry, and cold restore regressions
    env:
      LEAPVIEW_TEST_CONTAINERS: "1"
      LEAPVIEW_TEST_BUNDLED_POSTGRES_DOCKER: "1"
    cmds:
      - task: generate
      - go test ./internal/app/cli/composectl -run '^TestQualificationNativePostgresTopologyContainerBackedContract$' -count=1 -v
      - go test ./internal/app/cli/composectl -run '^TestBundledPostgresPrepareSeedsAppEnvBeforeCompose$' -count=1 -v
      - go test ./internal/app/cli/composectl -run '^TestBundledPostgresDockerResumesProvisioningAndPreservesVolume$' -count=1 -v
      - go test ./internal/app/cli/composectl -run '^TestBundledPostgresColdSnapshotRestoreQualification$' -count=1 -v

  test:qualification:demo-host-recovery:
    desc: Run isolated host recovery and migration-boundary qualification with synthetic disposable fixtures
    cmds:
      - task generate
      - go run ./internal/app/tools/securitypolicy -root .
      - go test -race ./internal/app/cli/hostinstall -count=1
      - PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s scripts/tests -p 'test_demo*.py'
      - |
        set -eu
        migration_tests="$(go test -list '^Test(DemoUpgrade|HostUpgrade|UpgradeBoundary)' ./internal/platform/postgres/migrations)"
        for test_name in \
          TestDemoUpgradePostgreSQL18 \
          TestDemoUpgradePartialMigrationPostgreSQL18RequiresRecovery \
          TestHostUpgradeFutureRevisionUsesSameExecutor \
          TestUpgradeBoundaryRejectsUnknownTransitionsBeforeMigration \
          TestUpgradeBoundaryRequiresCompleteHistoricalPrefix \
          TestUpgradeBoundaryRejectsPartialAndPrematureCandidate \
          TestUpgradeBoundaryAllowsCompleteFutureAndPolicyOnlyTransitions; do
          if ! printf '%s\n' "$migration_tests" | grep -Fx "$test_name" >/dev/null; then
            printf 'required migration qualification test missing: %s\n' "$test_name" >&2
            exit 1
          fi
        done
        LEAPVIEW_POSTGRES_CONFORMANCE_REQUIRED=true \
          go test ./internal/platform/postgres/migrations \
            -run '^Test(DemoUpgrade|HostUpgrade|UpgradeBoundary)' -count=1 -timeout=5m -v
      - |
        set -eu
        recovery_tests="$(go test -list '^Test(ColdPostgreSQLPairRecovery|InternalNetworkRecoveryRelay|VolumeTLSMountQualification)$' ./internal/app/cli/hostinstall)"
        for test_name in TestColdPostgreSQLPairRecovery TestInternalNetworkRecoveryRelay TestVolumeTLSMountQualification; do
          if ! printf '%s\n' "$recovery_tests" | grep -Fx "$test_name" >/dev/null; then
            printf 'required physical recovery test missing: %s\n' "$test_name" >&2
            exit 1
          fi
        done
        LEAPVIEW_HOST_UPGRADE_QUALIFICATION=1 \
          go test ./internal/app/cli/hostinstall \
            -run '^Test(ColdPostgreSQLPairRecovery|InternalNetworkRecoveryRelay|VolumeTLSMountQualification)$' \
            -count=1 -timeout=10m -v

  test:qualification:historical-transition:
    desc: Run the required schema-32 to typed-access transition against a pinned predecessor and exact candidate image
    cmds:
      - |
        set -eu
        test "${LEAPVIEW_HISTORICAL_TRANSITION_REQUIRED:-}" = 1 || {
          printf 'LEAPVIEW_HISTORICAL_TRANSITION_REQUIRED=1 is required for the historical transition lane\n' >&2
          exit 64
        }
        test -n "${LEAPVIEW_HISTORICAL_TRANSITION_CANDIDATE_IMAGE:-}" || {
          printf 'candidate image identity is required\n' >&2
          exit 64
        }
        test -n "${LEAPVIEW_HISTORICAL_TRANSITION_CANDIDATE_REVISION:-}" || {
          printf 'candidate source revision is required\n' >&2
          exit 64
        }
        test -n "${LEAPVIEW_HISTORICAL_TRANSITION_EVIDENCE:-}" || {
          printf 'private transition receipt path is required\n' >&2
          exit 64
        }
        if [ "${LEAPVIEW_HISTORICAL_TRANSITION_FINAL_ARTIFACT:-0}" = 1 ]; then
          test -n "${LEAPVIEW_HISTORICAL_TRANSITION_ADMISSION:-}" || {
            printf 'final-artifact qualification requires OCI admission evidence\n' >&2
            exit 64
          }
        fi
        task generate
        go run ./internal/app/tools/securitypolicy -root .
        go test ./internal/app/cli/composectl \
          -run '^TestQualificationHistoricalTransitionInputsFailClosed$' \
          -count=1
        transition_tests="$(go test ./internal/app/cli/composectl -list '^TestQualificationHistoricalTransitionEndToEnd$' -count=1)"
        printf '%s\n' "${transition_tests}" | grep -Fx 'TestQualificationHistoricalTransitionEndToEnd' >/dev/null || {
          printf 'required historical transition end-to-end test is missing\n' >&2
          exit 1
        }
        go test ./internal/app/cli/composectl \
          -run '^TestQualificationHistoricalTransitionEndToEnd$' \
          -count=1 -timeout=110m -v

  test:qualification:historical-transition:local:
    desc: Build a local candidate image and run the mandatory historical transition fixture
    cmds:
      - |
        set -euo pipefail
        if [ -n "$(git status --porcelain=v1 --untracked-files=all)" ]; then
          printf 'local historical-transition image requires a clean Git source tree; commit or export an immutable snapshot first\n' >&2
          exit 64
        fi
        task generate
        revision="$(git rev-parse HEAD)"
        [[ "${revision}" =~ ^[0-9a-f]{40}$ ]]
        if [ -n "$(git status --porcelain=v1 --untracked-files=all)" ]; then
          printf 'generation changed the source tree; refusing to label a mutable tree as the exact historical-transition candidate\n' >&2
          exit 64
        fi
        build_time="$(git show -s --format=%cI "${revision}")"
        tag="leapview:historical-transition-${revision:0:12}"
        docker buildx build --load --platform linux/amd64 --file Dockerfile \
          --tag "${tag}" \
          --build-arg BUILD_VERSION=historical-transition \
          --build-arg BUILD_REVISION="${revision}" \
          --build-arg BUILD_TIME="${build_time}" \
          --build-arg BUILD_DIRTY=false \
          --build-arg BUILD_RELEASE=false .
        image="$(docker image inspect "${tag}" --format '{{"{{"}}.Id{{"}}"}}')"
        [[ "${image}" =~ ^sha256:[0-9a-f]{64}$ ]]
        evidence_dir="$(mktemp -d "${TMPDIR:-/tmp}/leapview-historical-transition.XXXXXX")"
        LEAPVIEW_HISTORICAL_TRANSITION_REQUIRED=1 \
          LEAPVIEW_HISTORICAL_TRANSITION_CANDIDATE_IMAGE="${image}" \
          LEAPVIEW_HISTORICAL_TRANSITION_CANDIDATE_REVISION="${revision}" \
          LEAPVIEW_HISTORICAL_TRANSITION_EVIDENCE="${evidence_dir}/transition.json" \
          LEAPVIEW_HISTORICAL_TRANSITION_FINAL_ARTIFACT=0 \
          task test:qualification:historical-transition

  test:qualification:authoring-package:
    desc: Verify the released authoring archive qualification contract without Docker
    cmds:
      - go test ./deploy/local -run '^TestReleasedAuthoringQualification' -count=1

  qa:authoring-package:
    desc: Qualify an exact released authoring archive and retain bounded evidence
    requires:
      vars: [LEAPVIEW_AUTHORING_ARCHIVE]
    cmds:
      - >-
        ./deploy/local/qualification/qualify.sh
        --archive "{{.LEAPVIEW_AUTHORING_ARCHIVE}}"
        --evidence-dir "{{.LEAPVIEW_AUTHORING_EVIDENCE_DIR | default .ROOT_DIR}}/.tmp/qualification/authoring-package"
        {{if .LEAPVIEW_AUTHORING_REQUIRED}}--required{{end}}
        {{if .LEAPVIEW_AUTHORING_RUN_LIFECYCLE}}--run-lifecycle --docker-host "{{.LEAPVIEW_AUTHORING_DOCKER_HOST}}"{{end}}

  test:qualification:postgres-ha:
    desc: Run the bounded disposable same-host PostgreSQL 18 Patroni HA qualification
    cmds:
      - timeout --signal=TERM --kill-after=30s 10m ./deploy/postgres/ha/run.sh

  node:deps:
    desc: Install JavaScript dependencies with Bun
    # Nested dependency paths must share one writer to this checkout's tree.
    # Verify the frozen graph on every Task invocation; a binary's presence
    # cannot establish that the complete installed dependency tree is sound.
    run: once
    cmds:
      - bun install --frozen-lockfile

  build:
    desc: Build browser assets
    deps:
      - node:deps
      - layout-contract:generate
    cmds:
      - bun run build

  desktop:deps:
    desc: Install the pinned LeapView Desktop dependencies
    dir: desktop
    cmds:
      - bun install --frozen-lockfile

  desktop:test:
    desc: Run LeapView Desktop discovery, profile, UI, and shared security contracts
    deps:
      - desktop:deps
    dir: desktop
    cmds:
      - bun run typecheck:tests
      - bun run test
      - bun run build

  desktop:start:
    desc: Start the unpackaged LeapView Desktop client
    deps:
      - desktop:deps
    dir: desktop
    cmds:
      - bun run start

  desktop:package:
    desc: Build an unpackaged LeapView Desktop application for the current platform
    deps:
      - desktop:deps
    dir: desktop
    env:
      LEAPVIEW_DESKTOP_DISTRIBUTION: preview
    cmds:
      - bun run package

  desktop:make:
    desc: Build and verify the native LeapView Desktop installer for the current platform
    deps:
      - desktop:deps
    dir: desktop
    env:
      LEAPVIEW_DESKTOP_DISTRIBUTION: preview
    cmds:
      - bun run make
      - bun run evidence

  site:build:
    desc: Build the LeapView public site assets from generated contracts
    cmds:
      - task: ui-signals:generate
      - task: visualization-ir:generate
      - task: layout-contract:generate
      - task: node:deps
      - bun run build:site

  ci:prepare:frontend:
    desc: Generate only the contracts and assets required by frontend CI
    cmds:
      - task: api:generate
      - task: ui-signals:generate
      - task: visualization-ir:generate
      - task: build

  ci:test:docs-site:
    desc: Prepare and validate complete documentation and site coverage independently
    cmds:
      - task: ci:prepare
      - task: ci:test:docs
      - task: ci:test:frontend:site

  ci:test:docs:
    desc: Validate documentation generation, snapshots, observation and site Go contracts on prepared assets
    cmds:
      - |
        bash scripts/check_generated_snapshots.sh \
          .env.example \
          docs/api/openapi.yaml \
          docs/llms.txt \
          docs/reference/agent-tools \
          docs/articles/reference/data-resource-connectors.md \
          internal/agent/contracts \
          internal/project/contracts \
          api/gen/data-resources-ir.json \
          web/generated/data-resources \
          schemas/config \
          schemas/desktop \
          schemas/json \
          -- task --force docs:generate
      - task: site:observation:test
      - task: docs:check
      - go test ./cmd/leapview-site ./docs ./site ./internal/app/site/...

  audit:inventory:
    desc: Inventory tracked files, feature declarations and frontend CI registration without running product tests
    deps: [node:deps]
    cmds:
      - node scripts/audit_inventory.mjs {{.CLI_ARGS}}

  audit:controller-catalogs:
    desc: Inventory explicit controller commands for both shipped builds without executing them
    deps:
      - node:deps
      - db:generate
      - config:generate
      - api:generate
      - ui-signals:generate
    cmds:
      # Bind the source before compilation as well as during construction.
      - node scripts/controller_catalogs.mjs {{.CLI_ARGS}}

  audit:go-receipt:
    desc: Capture bounded fresh named Go executions and bind their source, inputs, command and raw logs
    deps: [node:deps]
    cmds:
      # Prepare generated sources before capturing; keep logs in ignored/external storage.
      - node scripts/go_receipts.mjs {{.CLI_ARGS}}

  ci:test:frontend:core:
    desc: Run global browser contracts, typechecks, and core application tests
    cmds:
      - bun test scripts/generated_snapshot_check.test.ts
      - node --test scripts/ci_watchdog.test.mjs
      - node --test desktop/scripts/lifecycle-probe-policy.test.mjs desktop/scripts/lifecycle-probe-cdp.test.mjs
      - node --test scripts/run_performance_comparison.test.mjs
      - bun test scripts/performance_comparison_workflow.test.ts
      - node --test deploy/compose/qualification/performance-resources.test.mjs
      - node --test scripts/performance_baseline_review.test.mjs scripts/qualify_performance_reference.test.mjs
      - node --test scripts/audit_inventory.test.mjs scripts/controller_catalogs.test.mjs scripts/go_receipt_index.test.mjs scripts/go_receipts.test.mjs
      - bun test scripts/ci_optimization_contract.test.ts
      - bun test scripts/frontend_ci_contract.test.ts
      - bun test scripts/frontend_test_registration.test.ts && bun scripts/frontend_test_registration.mjs
      - bun test scripts/nix_ci_contract.test.ts
      - bun test scripts/nix_desktop_candidate_contract.test.ts
      - bun test scripts/nix_compose_candidate_contract.test.ts
      - bun test scripts/managed_admission_contract.test.ts
      - bun test scripts/managed_application_contract.test.ts
      - python3 -m unittest discover -s scripts/tests -p test_managed_admission_handoff.py
      - python3 -m unittest discover -s scripts/tests -p test_managed_application_inputs.py
      - python3 -m unittest discover -s deploy/managed/nixos/tests -p 'managed_application*_test.py'
      - python3 -m unittest discover -s scripts/tests -p test_qualification_release.py
      - python3 -m unittest discover -s scripts/tests -p test_ci_sqlc_layer_screen.py
      - python3 -m unittest discover -s scripts/tests -p 'test_ci_sqlc_hosted_*.py'
      - bun test scripts/sqlc_hosted_contract.test.ts
      - python3 -m unittest discover -s scripts/tests -p test_package_compose_bundle.py
      - python3 -m unittest discover -s scripts/tests -p test_release_image_promotion.py
      - python3 -m unittest discover -s scripts/tests -p test_nix_ci_environment.py
      - python3 -m unittest discover -s scripts/tests -p test_nix_cli_compatibility.py
      - python3 -m unittest discover -s scripts/tests -p test_nix_candidate_manifest.py
      - python3 -m unittest discover -s scripts/tests -p test_nix_desktop_qualification.py
      - python3 -m unittest discover -s scripts/tests -p test_nix_desktop_attestation.py
      - python3 -m unittest discover -s scripts/tests -p 'test_nix_desktop_lifecycle*.py'
