      - config:generate
      - api:generate
      - ui-signals:generate
      - data-resource-contracts:generate
      - ci:extensions:prepare
    method: checksum
    sources:
      - Taskfile.yml
      - docs/visuals/*.md
      - docs/visuals/catalog.json
      - internal/app/tools/visualdocgen/**/*.go
      - internal/app/tools/visualdocgen/testdata/**/*
      - internal/app/site/visualdocs/**/*.go
      - internal/dashboard/**/*.go
      - internal/analytics/**/*.go
      - internal/project/compiler/**/*.go
    generates:
      - docs/visuals/examples.gen.json
    cmds:
      - go run -tags=duckdb_arrow ./internal/app/tools/visualdocgen

