      - config:generate
      - api:generate
      - ui-signals:generate
    method: checksum
    sources:
      - internal/platform/clidoc/**/*.go
      - Taskfile.yml
      - internal/app/cli/**/*.go
      - internal/admin/cli/**/*.go
      - internal/access/cli/**/*.go
      - internal/agent/cli/**/*.go
      - internal/dashboard/cli/**/*.go
      - internal/manageddata/cli/**/*.go
      - internal/project/cli/**/*.go
      - internal/app/tools/clidocgen/**/*.go
    generates:
