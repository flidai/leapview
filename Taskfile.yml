      - docs/reference/cli/manifest.json
    cmds:
      - go run ./internal/app/tools/clidocgen

  agent-tool-docs:generate:
    desc: Generate the public agent tool reference from the canonical runtime catalog
    deps:
      - api:generate
      - agent-contracts:generate
    method: checksum
    sources:
      - Taskfile.yml
      - api/dashboard/**/*.tsp
      - api/visualization/**/*.tsp
      - internal/agent/contracts/typespec/**/*.tsp
      - api/typespec/**/*.tsp
      - internal/agent/contracts/**/*.go
      - internal/app/api/gen/**/*.go
      - internal/agent/tools/**/*.go
      - internal/app/tools/agenttooldocgen/**/*.go
    generates:
      - docs/reference/agent-tools/*.md
      - docs/reference/agent-tools/catalog.json
      - docs/reference/agent-tools/manifest.json
    cmds:
      - go run ./internal/app/tools/agenttooldocgen

  permission-docs:generate:
    desc: Generate the public typed permission and role reference from the canonical Go catalog
    method: checksum
    sources:
      - Taskfile.yml
      - internal/access/permission_catalog.go
      - internal/access/permission_roles.go
      - internal/app/tools/permissiondocgen/**/*.go
    generates:
      - docs/articles/reference/permissions.md
    cmds:
      - go run ./internal/app/tools/permissiondocgen

  permission-docs:check:
    desc: Verify the public typed permission and role reference is current
    cmds:
      - go run ./internal/app/tools/permissiondocgen --check

  permission-contracts:generate:
    desc: Generate typed permission transport, catalog, and PostgreSQL contracts
    method: checksum
    sources:
      - Taskfile.yml
      - internal/access/permission_catalog.go
      - internal/access/permission_roles.go
      - internal/app/tools/permissioncontractgen/**/*.go
    generates:
      - api/typespec/generated/permissions.tsp
      - internal/access/generated/permission_catalog.json
      - internal/access/postgres/permission_contract.sql
    cmds:
      - go run ./internal/app/tools/permissioncontractgen

  permission-contracts:check:
    desc: Verify generated typed permission contracts are current
    cmds:
      - go run ./internal/app/tools/permissioncontractgen --check

  db:generate:
    desc: Generate PostgreSQL adapter code from checked-in schemas and queries
    method: checksum
    sources:
      - Taskfile.yml
      - sqlc.yaml
      - internal/**/*.sql
    generates:
      - internal/**/internal/db/*.go
      - internal/project/postgres/internal/db/*.go
      - internal/access/postgres/internal/db/*.go
      - internal/platform/operation/postgres/internal/db/*.go
      - internal/platform/http/cursorsigning/postgres/internal/db/*.go
      - internal/manageddata/postgres/internal/db/*.go
      - internal/platform/events/postgres/internal/db/*.go
    # Match setup-ci's HTTP/1.1 workaround for checksum-service HTTP/2 stream
    # failures; transport only, with sqlc checksums and TLS integrity unchanged.
    cmds:
      - GODEBUG=http2client=0 GOTOOLCHAIN=go1.26.9 go run github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1 generate --no-remote

  db:verify:
    desc: Compile generated PostgreSQL sqlc packages and audit handwritten SQL boundaries
    cmds:
      - GODEBUG=http2client=0 GOTOOLCHAIN=go1.26.9 go run github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1 vet --no-remote
      - GODEBUG=http2client=0 GOTOOLCHAIN=go1.26.9 go run github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1 diff --no-remote
      - |
        packages="$(
          find internal -type f -name '*.go' -print |
            while IFS= read -r file; do
              IFS= read -r first_line <"$file" || true
              if [ "$first_line" = '// Code generated by sqlc. DO NOT EDIT.' ]; then
                dirname "$file"
              fi
            done |
            sort -u |
            sed 's#^#./#'
        )"
        if [ -z "$packages" ]; then
          printf '%s\n' 'sqlc generation produced no Go packages' >&2
          exit 1
        fi
        # Compile the generated leaves here. Aggregate consumers compile after
        # the independent APIGen/signal build inputs are prepared by task ci.
        go test -run '^$' $packages
      - go run ./internal/app/tools/sqlcaudit --root {{.ROOT_DIR | quote}}

  db:prepare:
    desc: Prepare every PostgreSQL sqlc query against the clean PostgreSQL 18 baseline
    # The baseline package composes capability schemas whose domain packages
    # consume APIGen types. A clean checkout must create those independent Go
    # build inputs before compiling the PostgreSQL 18 prepare harness.
    deps:
      - api:generate
    cmds:
      - >-
        LEAPVIEW_POSTGRES_CONFORMANCE_REQUIRED=true
        go test ./internal/app/postgresbaseline
        -run '^TestSQLCVetPreparesAgainstBaselinePostgreSQL18$'
        -count=1 -timeout=10m

  db:check:
    desc: Regenerate pinned sqlc output, reject tracked drift, compile consumers, and audit SQL
    cmds:
      - |
        tracked_sqlc="$(
          git ls-files '*.go' |
            while IFS= read -r file; do
              [ -f "$file" ] || continue
              IFS= read -r first_line <"$file" || true
              if [ "$first_line" = '// Code generated by sqlc. DO NOT EDIT.' ]; then
                printf '%s\n' "$file"
              fi
            done
        )"
        if [ -n "$tracked_sqlc" ]; then
          printf '%s\n%s\n' 'sqlc output is a build input and must not be tracked:' "$tracked_sqlc" >&2
          exit 1
        fi
        before="$(mktemp)"
        after="$(mktemp)"
        generated_after="$(mktemp)"
        generated_repeat="$(mktemp)"
        trap 'rm -f "$before" "$after" "$generated_after" "$generated_repeat"' EXIT
        generated_snapshot() {
          find . -type f -name '*.go' \
            -not -path './.git/*' -not -path './node_modules/*' -not -path './.tmp/*' -print |
            sort |
            while IFS= read -r file; do
              if grep -q -F 'Code generated by sqlc' "$file"; then sha256sum "$file"; fi
            done
        }
        git diff --binary -- '*.go' >"$before"
        GODEBUG=http2client=0 GOTOOLCHAIN=go1.26.9 go run github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1 generate --no-remote
        generated_snapshot >"$generated_after"
        git diff --binary -- '*.go' >"$after"
        if ! cmp -s "$before" "$after"; then
          printf '%s\n' 'sqlc generation changed tracked source files:' >&2
          git diff --stat -- '*.go' >&2 || true
          exit 1
        fi
        # A second local generation catches nondeterministic or newly emitted
        # untracked sqlc files without rejecting the intentionally build-only
        # output created by a clean checkout.
        GODEBUG=http2client=0 GOTOOLCHAIN=go1.26.9 go run github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1 generate --no-remote
        generated_snapshot >"$generated_repeat"
        cmp -s "$generated_after" "$generated_repeat" || {
          printf '%s\n' 'sqlc generation is nondeterministic across generated Go outputs' >&2
          diff -u "$generated_after" "$generated_repeat" >&2 || true
          exit 1
        }
      - task: db:verify
      - task: db:prepare

