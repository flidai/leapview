      - docs/navigation.yaml
      - docs/*.md
      - docs/articles/**/*.md
      - docs/guides/**/*.md
      - docs/api/*.md
      - docs/api/catalog.json
      - docs/api/operations.json
      - docs/reference/cli/*.md
      - docs/reference/cli/catalog.json
      - docs/reference/cli/manifest.json
      - docs/reference/agent-tools/*.md
      - docs/reference/agent-tools/catalog.json
      - docs/reference/agent-tools/manifest.json
      - docs/reference/config/*.md
      - docs/reference/config/catalog.json
      - docs/visuals/*.md
      - docs/visuals/catalog.json
      - internal/app/tools/docsitegen/**/*.go
    generates:
      - docs/catalog.json
      - docs/llms.txt
      - docs/search-index.json
    cmds:
      - bun run docs:validate-diagrams
      - go run ./internal/app/tools/docsitegen

