version: '3'

env:
  GOFLAGS: -tags=duckdb_arrow

tasks:
  dev:
    desc: Start the managed LeapView dev server for this worktree
    cmds:
      - task: generate
      - task: build
      - task: bootstrap
      - task: map-assets:install
      - ./scripts/dev-server.sh start

  dev:movielens:
    desc: Start the managed LeapView dev server with the MovieLens 32M experiment project
    cmds:
      - task: generate
      - task: build
      - task: bootstrap:movielens
      - LEAPVIEW_DEV_RESTART=1 LEAPVIEW_DEV_READY_ATTEMPTS=1800 ./scripts/dev-server.sh start dashboards/experiments/movielens/leapview.yaml movielens .data/movielens

  bootstrap:
    desc: Download/sync Olist CSVs if missing
    cmds:
      - go run ./internal/app/tools/bootstrapolist --shared-cache --out .data/olist

  map-style:generate:
    desc: Generate the pinned renderer-owned MapLibre style
    deps:
      - node:deps
    sources:
      - scripts/generate_map_style.ts
      - package.json
      - bun.lock
    generates:
      - static/map-assets/leapview-streets/style.json
    cmds:
      - bun scripts/generate_map_style.ts

  map-assets:install:
    desc: Install the pinned local PMTiles, glyph, and sprite assets used by development
    cmds:
      - go run ./internal/app/tools/mapassets --shared-cache --out .data/map-assets

  map-assets:publish:
    desc: Publish the verified content-addressed map package to managed S3 storage and optionally verify its public delivery
    requires:
      vars: [MAP_ASSET_S3_BUCKET]
    cmds:
      - >-
        go run ./internal/app/tools/mapassets
        --out .data/map-assets
        --shared-cache
        --publish-s3-bucket {{.MAP_ASSET_S3_BUCKET | quote}}
        --publish-s3-prefix {{default "map-assets" .MAP_ASSET_S3_PREFIX | quote}}
        {{if .MAP_ASSET_S3_REGION}}--publish-s3-region {{.MAP_ASSET_S3_REGION | quote}}{{end}}
        {{if .MAP_ASSET_S3_ENDPOINT}}--publish-s3-endpoint {{.MAP_ASSET_S3_ENDPOINT | quote}}{{end}}
        {{if .MAP_ASSET_S3_PATH_STYLE}}--publish-s3-path-style{{end}}
        {{if .MAP_ASSET_BASE_URL}}--verify-base-url {{.MAP_ASSET_BASE_URL | quote}}{{end}}

  map-assets:verify:
    desc: Verify the complete map package through its same-origin production delivery path
    requires:
      vars: [MAP_ASSET_BASE_URL]
    cmds:
      - >-
        go run ./internal/app/tools/mapassets
        --out .data/map-assets
        --shared-cache
        --verify-base-url {{.MAP_ASSET_BASE_URL | quote}}

  bootstrap:movielens:
    desc: Download/sync MovieLens 32M CSVs if missing
    cmds:
      - go run ./internal/app/tools/bootstrapmovielens --shared-cache --out .data/movielens

  dev:stop:
    desc: Stop the managed LeapView dev server for this worktree
    cmds:
      - ./scripts/dev-server.sh stop

  dev:status:
    desc: Show managed LeapView dev server status
    cmds:
      - ./scripts/dev-server.sh status

  dev:publish:
    desc: Sync Olist data and publish the exact current development candidate
    cmds:
      - ./scripts/dev-server.sh publish

  dev:logs:
    desc: Tail managed LeapView dev server logs
    cmds:
      - ./scripts/dev-server.sh logs

  node:deps:
    desc: Install JavaScript dependencies with Bun
    method: checksum
    sources:
      - package.json
      - bun.lock
    generates:
      - node_modules/.bin/esbuild
    cmds:
      - bun install --frozen-lockfile

  build:
    desc: Build browser assets
    deps:
      - node:deps
      - layout-contract:generate
    cmds:
      - bun run build

  desktop:deps:
    desc: Install the pinned LeapView Desktop dependencies
    dir: desktop
    cmds:
      - bun install --frozen-lockfile

  desktop:test:
    desc: Run LeapView Desktop discovery, profile, UI, and shared security contracts
    deps:
      - desktop:deps
    dir: desktop
    cmds:
      - bun run test
      - bun run build

  desktop:start:
    desc: Start the unpackaged LeapView Desktop client
    deps:
      - desktop:deps
    dir: desktop
    cmds:
      - bun run start

  desktop:package:
    desc: Build an unpackaged LeapView Desktop application for the current platform
    deps:
      - desktop:deps
    dir: desktop
    env:
      LEAPVIEW_DESKTOP_DISTRIBUTION: preview
    cmds:
      - bun run package

  desktop:make:
    desc: Build and verify the native LeapView Desktop installer for the current platform
    deps:
      - desktop:deps
    dir: desktop
    env:
      LEAPVIEW_DESKTOP_DISTRIBUTION: preview
    cmds:
      - bun run make
      - bun run evidence

  site:build:
    desc: Build the LeapView public site assets from generated contracts
    cmds:
      - task: ui-signals:generate
      - task: visualization-ir:generate
      - task: layout-contract:generate
      - task: node:deps
      - bun run build:site

  ci:prepare:frontend:
    desc: Generate only the contracts and assets required by frontend CI
    cmds:
      - task: api:generate
      - task: ui-signals:generate
      - task: visualization-ir:generate
      - task: build

  ci:test:docs-site:
    desc: Validate authored documentation and the independently deployable public site
    cmds:
      - task: docs:generate
      - task: docs:check
      - |
        changed="$(git status --porcelain -- .env.example docs/api/openapi.yaml docs/llms.txt docs/reference/agent-tools docs/articles/reference/data-resource-connectors.md internal/agent/contracts internal/project/contracts api/gen/data-resources-ir.json web/generated/data-resources schemas/config schemas/desktop schemas/json)"
        test -z "$changed" || { printf 'public contract snapshots are stale:\n%s\n' "$changed" >&2; exit 1; }
      - task: site:build
      - bun run test:docs-diagrams
      - bun run test:site
      - go test ./cmd/leapview-site ./docs ./site ./internal/app/site/...

  ci:test:frontend:core:
    desc: Run global browser contracts, typechecks, and core application tests
    cmds:
      - node --test scripts/ci_watchdog.test.mjs
      - bun test scripts/ensure_playwright.test.ts
      - bun run test:primer-primitives
      - bun run test:primer-alignment
      - bun run test:theme
      - bun run test:datastar-lit
      - bun run test:ui-command-boundaries
      - bun run test:app-shell
      - bun run typecheck:app
      - bun run typecheck:contracts
      - bun run test:production-assets
      - bun run test:movielens-performance-harness
      - bun run test:public-site-smoke

  ci:test:frontend:reports:
    desc: Run dashboard, visualization, and report browser tests
    cmds:
      - bun run test:visualization-ir
      - bun run test:table-selection
      - bun run test:interaction-selection
      - bun run test:record-table
      - bun run test:visual-modal
      - bun run test:catalog-page
      - bun run test:dashboard-page
      - bun run test:dashboard-builder
      - bun run test:windowed-table
      - bun run test:filter-menu

  ci:test:frontend:chat:
    desc: Run chat and shared content browser tests
    cmds:
      - bun run test:chat-composer
      - bun run test:chat-page
      - bun run test:chat-thread
      - bun run test:code-block
      - bun run test:markdown-view

  ci:test:frontend:data:
    desc: Run administration and data browser tests
    cmds:
      - bun run test:data-explorer
      - bun run test:project-page
      - bun run test:admin-page
      - bun run test:code-editor
      - bun run test:login-page
      - bun run test:asset-lineage
      - bun run test:semantic-model-graph
      - bun run test:datastar-inspector
      - bun run test:topology-background

  ci:test:frontend:site:
    desc: Run public documentation and site browser tests
    cmds:
      - bun run test:docs-diagrams
      # ci:pr builds the embedded site tree before starting concurrent lanes.
      # Rebuilding here would delete site/static while Go packages compile it.
      - bun run test:site:prepared

  site:binary:
    desc: Build the independently deployable public site from generated documentation
    cmds:
      - task: generate
      - task: site:build
      - go build -o bin/leapview-site ./cmd/leapview-site

  site:image:
    desc: Build the production LeapView public site OCI image
    cmds:
      - docker build --file Dockerfile.site --tag leapview-site:local .

  site:dev:
    desc: Start the public site from generated documentation on http://localhost:8081
    cmds:
      - task: generate
      - task: site:build
      - go run ./cmd/leapview-site

  site:product-screenshot:
    desc: Refresh light and dark homepage screenshots from the deployed Visual Showcase
    cmds:
      - task: generate
      - task: build
      - bun scripts/capture_site_product.ts

  bench:datastar-bridge:
    desc: Benchmark legacy, Ignition, and DatastarLit bridges in Chromium
    deps:
      - node:deps
    cmds:
      - bun run bench:datastar-bridge

  qa:ui-framework:
    desc: Run browser QA for the stream-first DatastarLit UI framework
    deps:
      - node:deps
    cmds:
      - bun test scripts/qa_ui_framework_config.test.ts
      - bun scripts/qa_ui_framework.ts

  qa:movielens-performance:
    desc: Run the local/nightly dashboard performance runner with the MovieLens scenario (not part of CI)
    deps:
      - node:deps
    cmds:
      - bun run qa:movielens-performance

  qa:dashboard-performance:
    desc: Run a configured local/nightly performance scenario against a running dev server (not part of CI)
    deps:
      - node:deps
    cmds:
      - bun run qa:dashboard-performance

  generate:
    desc: Generate all checked-out derived code needed for local development
    cmds:
      - task: duckdbsql:generate
      - task: db:generate
      - task: config:generate
      - task: api:generate
      - task: agent-contracts:generate
      - task: ui-signals:generate
      - task: schema:generate
      - task: data-resource-contracts:generate
      - task: desktop-discovery:generate
      - task: visualization-ir:generate
      - task: dashboard-contracts:generate
      - task: pipeline-contracts:generate
      - task: layout-contract:generate
      - task: map-style:generate
      - task: lucide-icons:generate
      - task: cli-docs:generate
      - task: agent-tool-docs:generate
      - task: node:deps
      - task: docs:render

  duckdbsql:generate:
    desc: Generate pinned DuckDB SQL runtime, AST, enum, and documentation metadata
    cmds:
      - go run ./pkg/duckdbsql/internal/cmd/duckdbsqlgen
      - go run ./pkg/duckdbsql/internal/cmd/duckdbsqldocsgen

  duckdbsql:generated:check:
    desc: Verify pinned DuckDB SQL metadata is current without network access
    cmds:
      - go run ./pkg/duckdbsql/internal/cmd/duckdbsqlgen -check
      - go run ./pkg/duckdbsql/internal/cmd/duckdbsqldocsgen -check

  duckdbsql:source:check:
    desc: Verify generated DuckDB SQL metadata against the exact pinned source checkout
    requires:
      vars: [DUCKDB_SOURCE]
    cmds:
      - go run ./pkg/duckdbsql/internal/cmd/duckdbsqlgen -check -source {{.DUCKDB_SOURCE | quote}}
      - go run ./pkg/duckdbsql/internal/cmd/duckdbsqldocsgen -check -source {{printf "%s/extension/core_functions" .DUCKDB_SOURCE | quote}}

  duckdbsql:qualification:
    desc: Run the independent Phase-1 DuckDB SQL qualification lane
    cmds:
      - task: duckdbsql:generated:check
      - go test ./pkg/duckdbsql -count=1 -run '^(TestPhase1QualificationCorpus|TestQualification|TestPinnedDuckDBModifierAST|TestDuckDBSQLArchitectureBoundary)$'
      - go test -race ./pkg/duckdbsql -count=1 -run '^(TestPhase1QualificationCorpus|TestQualification|TestPinnedDuckDBModifierAST|TestDuckDBSQLArchitectureBoundary)$'
      - go test ./pkg/duckdbsql -run '^$' -fuzz=FuzzDecodeDocumentQualification -fuzztime=2s -count=1

  lucide-icons:generate:
    desc: Generate the canonical Lucide icon catalog and server validator
    deps:
      - node:deps
    method: checksum
    sources:
      - scripts/generate_lucide_icon_catalog.ts
      - package.json
      - bun.lock
    generates:
      - web/generated/lucide-icon-catalog.ts
      - internal/dashboard/appearance/icons_gen.go
    cmds:
      - bun scripts/generate_lucide_icon_catalog.ts

  docs:generate:
    desc: Generate reference documentation, the unified catalog, and the FTS5 search index
    cmds:
      - task: schema:generate
      - task: data-resource-contracts:generate
      - task: cli-docs:generate
      - task: agent-tool-docs:generate
      - task: node:deps
      - task: docs:render

  docs:render:
    internal: true
    method: checksum
    deps:
      - visual-docs:generate
      - agent-tool-docs:generate
    sources:
      - Taskfile.yml
      - docs/navigation.yaml
      - docs/*.md
      - docs/articles/**/*.md
      - docs/guides/**/*.md
      - docs/api/*.md
      - docs/api/catalog.json
      - docs/api/operations.json
      - docs/reference/cli/*.md
      - docs/reference/cli/catalog.json
      - docs/reference/cli/manifest.json
      - docs/reference/agent-tools/*.md
      - docs/reference/agent-tools/catalog.json
      - docs/reference/agent-tools/manifest.json
      - docs/reference/config/*.md
      - docs/reference/config/catalog.json
      - docs/visuals/*.md
      - docs/visuals/catalog.json
      - internal/app/tools/docsitegen/**/*.go
    generates:
      - docs/catalog.json
      - docs/llms.txt
      - docs/search-index.sqlite3
    cmds:
      - bun run docs:validate-diagrams
      - go run ./internal/app/tools/docsitegen

  docs:check:
    desc: Verify the unified documentation catalog and FTS5 search index are current
    deps:
      - node:deps
      - ci:extensions:prepare
    cmds:
      - bun run docs:validate-diagrams
      - go run ./internal/app/tools/agenttooldocgen --check
      - go run -tags=duckdb_arrow ./internal/app/tools/visualdocgen --check
      - go run ./internal/app/tools/docsitegen --check
      - go test ./internal/app/site/http -run '^TestEveryRenderedDocumentationLinkResolves$' -count=1

  visual-docs:generate:
    desc: Compile executable visual documentation examples into browser payloads
    deps:
      - db:generate
      - config:generate
      - api:generate
      - ui-signals:generate
      - data-resource-contracts:generate
      - ci:extensions:prepare
    method: checksum
    sources:
      - Taskfile.yml
      - docs/visuals/*.md
      - docs/visuals/catalog.json
      - internal/app/tools/visualdocgen/**/*.go
      - internal/app/tools/visualdocgen/testdata/**/*
      - internal/app/site/visualdocs/**/*.go
      - internal/dashboard/**/*.go
      - internal/analytics/**/*.go
      - internal/project/compiler/**/*.go
    generates:
      - docs/visuals/examples.gen.json
    cmds:
      - go run -tags=duckdb_arrow ./internal/app/tools/visualdocgen

  cli-docs:generate:
    desc: Generate public CLI reference documentation from Cobra commands
    deps:
      - db:generate
      - config:generate
      - api:generate
      - ui-signals:generate
    method: checksum
    sources:
      - Taskfile.yml
      - internal/app/cli/**/*.go
      - internal/app/tools/clidocgen/**/*.go
    generates:
      - docs/reference/cli/catalog.json
      - docs/reference/cli/manifest.json
    cmds:
      - go run ./internal/app/tools/clidocgen

  agent-tool-docs:generate:
    desc: Generate the public agent tool reference from the canonical runtime catalog
    deps:
      - api:generate
      - agent-contracts:generate
    method: checksum
    sources:
      - Taskfile.yml
      - internal/agent/contracts/typespec/**/*.tsp
      - api/typespec/**/*.tsp
      - internal/agent/contracts/**/*.go
      - internal/app/api/gen/**/*.go
      - internal/agent/tools/**/*.go
      - internal/app/tools/agenttooldocgen/**/*.go
    generates:
      - docs/reference/agent-tools/*.md
      - docs/reference/agent-tools/catalog.json
      - docs/reference/agent-tools/manifest.json
    cmds:
      - go run ./internal/app/tools/agenttooldocgen

  db:generate:
    desc: Generate SQLite adapter code from the checked-in schema and queries
    method: checksum
    sources:
      - Taskfile.yml
      - sqlc.yaml
      - internal/**/*.sql
    generates:
      - internal/platform/db/db.go
      - internal/platform/db/models.go
      - internal/platform/db/*.sql.go
      - internal/*/internal/db/*.go
      - internal/platform/**/sqlite/*db/*.go
    cmds:
      - go run github.com/sqlc-dev/sqlc/cmd/sqlc@v1.30.0 generate

  config:generate:
    desc: Generate runtime configuration, reference documentation, example environment, and schema
    method: checksum
    sources:
      - Taskfile.yml
      - internal/app/config/spec/spec.go
      - internal/app/tools/configgen/main.go
    generates:
      - internal/app/config/config_gen.go
      - internal/app/config/spec/names_gen.go
      - docs/configuration.md
      - .env.example
      - schemas/config/environment.schema.json
    cmds:
      - go run ./internal/app/tools/configgen

  config:check:
    desc: Verify generated configuration artifacts are current
    cmds:
      - go run ./internal/app/tools/configgen --check

  apigen:test:
    desc: Test the vendored APIGen Go module and TypeSpec library
    cmds:
      - go -C pkg/apigen test ./...
      - npm --prefix pkg/apigen/typespec ci
      - npm --prefix pkg/apigen/typespec test

  apigen:build:
    desc: Build the vendored APIGen TypeSpec emitter used by generation
    method: checksum
    sources:
      - pkg/apigen/typespec/src/**/*.ts
      - pkg/apigen/typespec/lib/**/*.tsp
      - pkg/apigen/typespec/package.json
      - pkg/apigen/typespec/package-lock.json
      - pkg/apigen/typespec/tsconfig.json
    generates:
      - pkg/apigen/typespec/dist/src/**/*.js
      - pkg/apigen/typespec/dist/src/**/*.d.ts
    cmds:
      - npm --prefix pkg/apigen/typespec ci
      - npm --prefix pkg/apigen/typespec run build

  generated:check:
    desc: Verify intentional public contract snapshots are current
    deps:
      - generate
    cmds:
      - task: duckdbsql:generated:check
      - task: generated:git-check
      - task: config:check
      - |
        changed="$(git status --porcelain -- .env.example docs/api/openapi.yaml docs/llms.txt docs/reference/agent-tools docs/articles/reference/data-resource-connectors.md internal/agent/contracts internal/project/contracts api/gen/data-resources-ir.json api/gen/pipeline-ir.json web/generated/data-resources web/generated/pipeline schemas/config schemas/desktop schemas/json pkg/duckdbsql/metadata_generated.go pkg/duckdbsql/ast_schema_generated.go pkg/duckdbsql/function_docs_generated.go pkg/duckdbsql/upstream.lock.json pkg/duckdbsql/internal/cmd/duckdbsqlgen/ast_schema_snapshot.json pkg/duckdbsql/internal/cmd/duckdbsqlgen/enum_schema_snapshot.json pkg/duckdbsql/internal/upstream/function_docs.lock.json)"
        test -z "$changed" || { printf 'public contract snapshots are stale:\n%s\n' "$changed" >&2; exit 1; }

  generated:git-check:
    desc: Verify build-only generated code is not tracked by Git
    cmds:
      - |
        tracked="$(git grep -l -F '// Code generated by sqlc. DO NOT EDIT.' -- '*.go' || true)"
        test -z "$tracked" || { printf 'build-only sqlc output is tracked:\n%s\n' "$tracked" >&2; exit 1; }

  api:generate:
    desc: Generate headless API contract artifacts and APIGen Go surfaces
    deps:
      - apigen:build
    method: checksum
    run: once
    sources:
      - Taskfile.yml
      - api/apigen.yaml
      - api/typespec/**/*.tsp
      - api/visualization/**/*.tsp
      - internal/app/tools/openapidocgen/**/*.go
      - pkg/apigen/**/*.go
      - pkg/apigen/typespec/dist/src/**/*
    generates:
      - api/gen/json-ir.json
      - api/gen/openapi.yaml
      - internal/access/api/gen/request_models.gen.go
      - internal/access/api/gen/server.apigen.gen.go
      - internal/access/api/gen/client.apigen.gen.go
      - internal/agent/api/gen/request_models.gen.go
      - internal/agent/api/gen/server.apigen.gen.go
      - internal/agent/api/gen/client.apigen.gen.go
      - internal/analytics/api/gen/request_models.gen.go
      - internal/analytics/api/gen/server.apigen.gen.go
      - internal/analytics/api/gen/client.apigen.gen.go
      - internal/dashboard/api/gen/request_models.gen.go
      - internal/dashboard/api/gen/server.apigen.gen.go
      - internal/dashboard/api/gen/client.apigen.gen.go
      - internal/deployment/api/gen/request_models.gen.go
      - internal/deployment/api/gen/server.apigen.gen.go
      - internal/deployment/api/gen/client.apigen.gen.go
      - internal/manageddata/api/gen/request_models.gen.go
      - internal/manageddata/api/gen/server.apigen.gen.go
      - internal/manageddata/api/gen/client.apigen.gen.go
      - internal/app/api/aggregate/server.apigen.gen.go
      - internal/app/api/gen/request_models.gen.go
      - internal/app/api/gen/server.apigen.gen.go
      - internal/app/cli/gen/apigen_registry.gen.go
      - internal/platform/http/api/gen/request_models.gen.go
      - internal/project/api/gen/request_models.gen.go
      - internal/project/api/gen/server.apigen.gen.go
      - internal/project/api/gen/client.apigen.gen.go
      - internal/refresh/api/gen/request_models.gen.go
      - internal/refresh/api/gen/server.apigen.gen.go
      - internal/refresh/api/gen/client.apigen.gen.go
      - internal/release/api/gen/request_models.gen.go
      - internal/release/api/gen/server.apigen.gen.go
      - internal/release/api/gen/client.apigen.gen.go
      - web/generated/api/failures.ts
      - docs/api/catalog.json
      - docs/api/openapi.yaml
      - docs/api/operations.json
    cmds:
      - go -C pkg/apigen run ./cmd/apigen typespec-compile -manifest ../../api/apigen.yaml -target leapview-v1
      - go -C pkg/apigen run ./cmd/apigen all -manifest ../../api/apigen.yaml -target leapview-v1
      - go run ./internal/app/tools/apigenpatch
      - go run ./internal/app/tools/openapidocgen

  agent-contracts:generate:
    desc: Generate compact agent-tool DTOs and JSON Schemas
    deps:
      - apigen:build
    method: checksum
    sources:
      - Taskfile.yml
      - api/apigen.yaml
      - internal/agent/contracts/typespec/**/*.tsp
      - internal/agent/contracts/generate/**/*.go
      - pkg/apigen/**/*.go
      - pkg/apigen/typespec/dist/src/**/*
    generates:
      - internal/agent/contracts/gen/agent-tools-ir.json
      - internal/agent/contracts/gen/agent-tools.schema.json
      - internal/agent/contracts/models.gen.go
      - internal/agent/contracts/schemas.gen.go
    cmds:
      - go -C pkg/apigen run ./cmd/apigen typespec-compile -manifest ../../api/apigen.yaml -target agent-tool-contracts
      - go -C pkg/apigen run ./cmd/apigen all -manifest ../../api/apigen.yaml -target agent-tool-contracts
      - go run ./internal/agent/contracts/generate

  data-resource-contracts:generate:
    desc: Generate strict Connection, Source, Model DTOs and connector registry
    deps:
      - apigen:build
    method: checksum
    sources:
      - Taskfile.yml
      - api/apigen.yaml
      - api/data-resources/**/*.tsp
      - internal/project/contracts/generate/**/*.go
      - internal/analytics/connectors/**/*.go
      - pkg/apigen/**/*.go
      - pkg/apigen/typespec/dist/src/**/*
    generates:
      - api/gen/data-resources-ir.json
      - internal/project/contracts/gen/data-resources.schema.json
      - internal/project/contracts/models.gen.go
      - internal/project/contracts/registry.gen.go
      - internal/project/contracts/path_options.gen.go
      - web/generated/data-resources/index.ts
      - docs/articles/reference/data-resource-connectors.md
    cmds:
      - go -C pkg/apigen run ./cmd/apigen typespec-compile -manifest ../../api/apigen.yaml -target data-resource-contracts
      - go -C pkg/apigen run ./cmd/apigen all -manifest ../../api/apigen.yaml -target data-resource-contracts
      - go run ./internal/project/contracts/generate

  desktop-discovery:generate:
    desc: Generate the public desktop discovery and failure contracts
    deps:
      - apigen:build
    method: checksum
    sources:
      - Taskfile.yml
      - api/apigen.yaml
      - api/desktop-discovery/**/*.tsp
      - pkg/apigen/**/*.go
      - pkg/apigen/typespec/dist/src/**/*
    generates:
      - api/gen/desktop-discovery-ir.json
      - schemas/desktop/discovery.schema.json
      - internal/app/desktopdiscovery/models.gen.go
      - desktop/src/generated/desktop-discovery.ts
    cmds:
      - go -C pkg/apigen run ./cmd/apigen typespec-compile -manifest ../../api/apigen.yaml -target desktop-discovery-contracts
      - go -C pkg/apigen run ./cmd/apigen all -manifest ../../api/apigen.yaml -target desktop-discovery-contracts

  schema:generate:
    desc: Generate JSON Schema artifacts for LeapView YAML contracts
    deps:
      - db:generate
      - config:generate
      - api:generate
      - ui-signals:generate
    method: checksum
    sources:
      - Taskfile.yml
      - cmd/leapview/**/*.go
      - internal/app/cli/**/*.go
      - internal/project/schema/**/*.go
      - internal/project/schema/**/*.cue
      - internal/dashboard/report/**/*.go
      - internal/semantic/**/*.go
      - internal/app/tools/schemadocgen/**/*.go
      - dashboards/**/*.yaml
    generates:
      - schemas/json/project.schema.json
      - schemas/json/connection.schema.json
      - schemas/json/source.schema.json
      - schemas/json/model.schema.json
      - schemas/json/semantic-model.schema.json
      - schemas/json/pipeline.schema.json
      - schemas/json/group.schema.json
      - schemas/json/role-binding.schema.json
      - schemas/json/grant.schema.json
      - schemas/json/data-policy.schema.json
      - schemas/json/dashboard-publication.schema.json
      - docs/reference/config/catalog.json
    cmds:
      - go run ./cmd/leapview schema export --format json-schema --out schemas/json
      - go run ./internal/app/tools/schemadocgen

  # APIGen materializes one bundled TypeSpec package in the user cache.
  # Initialize it through the canonical API target before another target can
  # enter the compiler on a cold machine.
  ui-signals:generate:
    desc: Generate UI signal Go and TypeScript contracts from TypeSpec
    deps:
      - api:generate
    method: checksum
    sources:
      - Taskfile.yml
      - api/apigen.yaml
      - api/signals/**/*.tsp
      - api/visualization/**/*.tsp
      - internal/app/tools/signalcontracts/**/*.go
      - pkg/apigen/**/*.go
      - pkg/apigen/typespec/dist/src/**/*
    generates:
      - api/gen/ui-signals-ir.json
      - internal/access/ui/signals/models.gen.go
      - internal/admin/ui/signals/models.gen.go
      - internal/agent/ui/signals/models.gen.go
      - internal/dashboard/ui/signals/models.gen.go
      - internal/project/ui/signals/models.gen.go
      - web/generated/signals/index.ts
    cmds:
      - go -C pkg/apigen run ./cmd/apigen typespec-compile -manifest ../../api/apigen.yaml -target ui-signals
      - go -C pkg/apigen run ./cmd/apigen all -manifest ../../api/apigen.yaml -target ui-signals
      - go run ./internal/app/tools/signalcontracts

  visualization-ir:generate:
    desc: Generate renderer-independent visualization IR contracts from TypeSpec
    deps:
      - node:deps
      - apigen:build
    method: checksum
    sources:
      - Taskfile.yml
      - api/apigen.yaml
      - api/visualization/**/*.tsp
      - scripts/generate_visualization_validator.ts
      - pkg/apigen/**/*.go
      - pkg/apigen/typespec/dist/src/**/*
    generates:
      - api/gen/visualization-ir.json
      - internal/dashboard/visualization/ir/models.gen.go
      - internal/dashboard/visualization/ir/schema_version.gen.go
      - web/generated/visualization/index.ts
      - web/generated/visualization/schema-version.ts
      - web/generated/visualization/validate.ts
      - api/gen/visualization.schema.json
    cmds:
      - go -C pkg/apigen run ./cmd/apigen typespec-compile -manifest ../../api/apigen.yaml -target visualization-ir
      - go -C pkg/apigen run ./cmd/apigen all -manifest ../../api/apigen.yaml -target visualization-ir
      - bun scripts/generate_visualization_validator.ts

  dashboard-contracts:generate:
    desc: Generate the canonical Dashboard authoring document contract
    deps:
      - node:deps
      - apigen:build
      - visualization-ir:generate
    sources:
      - Taskfile.yml
      - api/apigen.yaml
      - api/dashboard/**/*.tsp
      - api/visualization/**/*.tsp
      - pkg/apigen/**/*.go
      - pkg/apigen/typespec/src/**/*.ts
      - pkg/apigen/typespec/dist/src/**/*
    generates:
      - api/gen/dashboard-ir.json
      - internal/dashboard/document/models.gen.go
      - web/generated/dashboard/index.ts
      - schemas/json/dashboard-document.schema.json
    cmds:
      - go -C pkg/apigen run ./cmd/apigen typespec-compile -manifest ../../api/apigen.yaml -target dashboard-contracts
      - go -C pkg/apigen run ./cmd/apigen all -manifest ../../api/apigen.yaml -target dashboard-contracts

  pipeline-contracts:generate:
    desc: Generate the canonical asset-selected Pipeline authoring contract
    deps:
      - apigen:build
    method: checksum
    sources:
      - Taskfile.yml
      - api/apigen.yaml
      - api/pipeline/**/*.tsp
      - pkg/apigen/**/*.go
      - pkg/apigen/typespec/dist/src/**/*
    generates:
      - api/gen/pipeline-ir.json
      - internal/project/contracts/pipeline_models.gen.go
      - web/generated/pipeline/index.ts
      - schemas/json/pipeline.schema.json
    cmds:
      - go -C pkg/apigen run ./cmd/apigen typespec-compile -manifest ../../api/apigen.yaml -target pipeline-contracts
      - go -C pkg/apigen run ./cmd/apigen all -manifest ../../api/apigen.yaml -target pipeline-contracts

  layout-contract:generate:
    desc: Generate the browser responsive-widget layout contract
    method: checksum
    sources:
      - Taskfile.yml
      - internal/dashboard/layoutcontract/contracts.json
      - internal/app/tools/layoutcontractgen/**/*.go
    generates:
      - web/generated/dashboard-layout/contracts.json
    cmds:
      - go run ./internal/app/tools/layoutcontractgen

  ci:
    desc: Run the fast pull-request contract on the current machine
    cmds:
      - task: ci:pr

  image:qualify:production:
    desc: Qualify an immutable LeapView production image
    requires:
      vars: [IMAGE]
    cmds:
      - task: api:generate
      - mkdir -p {{.ROOT_DIR}}/.tmp/qualification/tmp
      - >-
        env TMPDIR={{.ROOT_DIR}}/.tmp/qualification/tmp
        LEAPVIEWCTL_ROOT={{.ROOT_DIR}}/deploy/compose
        go run ./cmd/leapviewctl qualify image
        --image {{.IMAGE | quote}}
        --require-immutable
        --evidence-dir {{.ROOT_DIR}}/.tmp/qualification/production-image

  image:qualify:site:
    desc: Qualify an immutable LeapView public-site image
    requires:
      vars: [IMAGE]
    cmds:
      - task: api:generate
      - >-
        env LEAPVIEWCTL_ROOT={{.ROOT_DIR}}/deploy/compose
        go run ./cmd/leapviewctl qualify site-image
        --image {{.IMAGE | quote}}

  test:go:
    desc: Run Go tests with bounded package parallelism and stable application shards
    cmds:
      - task: generate
      - task: test:go:prepared

  test:go:prepared:
    internal: true
    desc: Run Go tests after shared generated inputs are ready
    cmds:
      - task --parallel test:go:packages test:go:app:shards
      - task: test:go:external

  test:go:app:shards:
    desc: Run stable application shards with three-process parallelism
    cmds:
      - task --parallel --concurrency 3 test:go:app:0 test:go:app:1 test:go:app:2 test:go:app:3

  test:go:packages:
    cmds:
      - go list ./... | grep -v '/internal/app$' | xargs go test -p 2

  test:go:app:0:
    cmds:
      - |
        pattern="$(go run ./internal/app/tools/testshard --package ./internal/app --shard-index 0 --shard-count 4)"
        go test ./internal/app -run "$pattern" -skip '^TestMinIOParquetSourceRefreshContract$'

  test:go:app:1:
    cmds:
      - |
        pattern="$(go run ./internal/app/tools/testshard --package ./internal/app --shard-index 1 --shard-count 4)"
        go test ./internal/app -run "$pattern" -skip '^TestMinIOParquetSourceRefreshContract$'

  test:go:app:2:
    cmds:
      - |
        pattern="$(go run ./internal/app/tools/testshard --package ./internal/app --shard-index 2 --shard-count 4)"
        go test ./internal/app -run "$pattern" -skip '^TestMinIOParquetSourceRefreshContract$'

  test:go:app:3:
    cmds:
      - |
        pattern="$(go run ./internal/app/tools/testshard --package ./internal/app --shard-index 3 --shard-count 4)"
        go test ./internal/app -run "$pattern" -skip '^TestMinIOParquetSourceRefreshContract$'

  test:go:external:
    desc: Run container-backed external-service integration tests serially
    cmds:
      - go test ./internal/app -run '^TestMinIOParquetSourceRefreshContract$' -count=1

  test:workload:qualify:
    desc: Qualify the reusable workload scheduler independently of LeapView
    cmds:
      - go test ./pkg/workload -count=1
      - go test -race ./pkg/workload -count=1
      - go test ./pkg/workload -run '^$' -fuzz '^FuzzQualificationConfigValidation$' -fuzztime=3s
      - go test ./pkg/workload -run '^$' -fuzz '^FuzzQualificationIdentityCanonicalization$' -fuzztime=3s
      - go test ./pkg/workload -run '^$' -fuzz '^FuzzQualificationRequestValidation$' -fuzztime=3s
      - go test ./pkg/workload -run '^$' -fuzz '^FuzzQualificationBoundedSchedulerOperation$' -fuzztime=3s
      - go test ./pkg/workload -run '^$' -bench 'Workload$' -benchmem -benchtime=100ms -count=1

  test:go:minio-conformance:
    desc: Run the object-backed candidate-catalog, shared-pool, and GC namespace MinIO conformance tests
    deps:
      - db:generate
      - api:generate
    env:
      LEAPVIEW_MINIO_CONFORMANCE_REQUIRED: "1"
      LEAPVIEW_CONFORMANCE_EVIDENCE_OUT: "{{.ROOT_DIR}}/.tmp/minio-conformance/shared-pool-evidence.json"
    cmds:
      - rm -f "{{.ROOT_DIR}}/.tmp/minio-conformance/shared-pool-evidence.json"
      - go test -tags 'duckdb_arrow ducklake_minio' -count=1 -run '^TestCandidateCatalogMinIOSealedBaseRetainsUnchangedRefs$' -v ./internal/analytics/candidatecatalog
      - go test -tags 'duckdb_arrow ducklake_minio' -count=1 -run '^TestSharedPoolConformanceMinIOLane$' -v ./internal/analytics/ducklake

  test:go:plan-gc-conformance:
    desc: Run the maintained plan-to-GC lifecycle, failure, crash, concurrency, race, and provenance matrix
    deps:
      - db:generate
      - api:generate
      - config:generate
      - ui-signals:generate
    cmds:
      # The deployment subtree owns the maintained plan/build/seal/publication,
      # restart, crash, fencing, lease/retirement, and GC race matrix. Keep
      # this package-wide so adding a reviewed failure boundary cannot silently
      # leave the release gate running a stale selective subset.
      - go test ./internal/deployment/... -count=1 -v
      # Candidate catalog isolation and destination promotion are part of the
      # same plan-to-GC contract, but live in their owning packages.
      - go test -tags duckdb_arrow ./internal/analytics/candidatecatalog -count=1 -v
      - go test ./internal/app/runtimefactory -count=1 -v
      # Recovery is part of the lifecycle: audit stays query-only and repair
      # revalidates the exact root revision atomically before mutation.
      - go test ./internal/admin/offline ./internal/admin/cli ./internal/app/adminoffline ./internal/app/gcadapter ./internal/platform/architecture -count=1 -v
      # Protected targets must prove that source ownership and retained
      # attestations are enforced, rather than trusting client provenance text.
      - go test ./internal/project/module -run '^(TestCandidateSourceSynchronizerAuthorizesOnlyPlannedOwnerUploads|TestCandidateSourceSynchronizerRetainsActivePlanAcrossRestart)$' -count=1 -v

  ci:lane:go:
    desc: Run the bounded Go unit and integration lane
    cmds:
      - task: apigen:test
      - task: test:go:prepared

  ci:lane:go:packages:
    desc: Run non-application Go package tests
    cmds:
      - task: test:go:packages

  ci:lane:go:apigen:
    desc: Run the vendored APIGen Go module and TypeSpec tests
    cmds:
      - task: apigen:test

  ci:lane:go:application:
    desc: Run sharded application and external-service Go tests
    cmds:
      - task: test:go:app:shards
      - task: test:go:external

  ci:lane:frontend:
    desc: Run the bounded frontend and browser-contract lane
    cmds:
      - task: ci:test:frontend:core
      - task: ci:test:frontend:reports
      - task: ci:test:frontend:chat
      - task: ci:test:frontend:data
      - task: ci:test:frontend:site

  ci:prepare:
    desc: Generate and build the shared inputs required by every CI validation lane
    cmds:
      - task: ci:extensions:prepare
      - task: generate
      - task: build
      - task: site:build

  ci:extensions:prepare:
    desc: Provision CI fixtures and validate the production offline supply contract
    cmds:
      - go run ./internal/app/tools/ducklakeprepare
      - task: extension-supply:check

  extension-supply:check:
    desc: Check generated connector/format requirements and exact supply admission contracts
    cmds:
      - go test ./internal/project/contracts ./internal/deployment/extensionsupply ./internal/app/tools/extensionsupply

  ci:pr:
    desc: Run the fast required contract for every pull-request update
    cmds:
      - task: ci:prepare
      # Keep local composition bounded to two top-level lanes. GitHub-hosted CI
      # runs each lane on its own runner to avoid cross-lane CPU contention.
      - task --parallel --concurrency 2 ci:lane:go ci:lane:frontend
      - task: generated:check

  ci:full:
    desc: Run deterministic validation for the exact merge-queue candidate
    cmds:
      - task: ci:pr
      - task: ci:full:extras

  ci:full:extras:
    desc: Run merge-only validation after the fast CI contract has passed
    cmds:
      - task: desktop:test
      - go vet ./...
      - go test -race ./pkg/... ./internal/access ./internal/runtimehost
      - task: test:workload:qualify
      - task: qa:ui-framework
      - task: deploy:check
      - task: test:go:minio-conformance
      - task: test:go:plan-gc-conformance

  ci:nightly:
    desc: Run exhaustive scheduled validation, including dependency security scans
    cmds:
      - task: ci:full
      - task: ci:nightly:extras

  ci:nightly:extras:
    desc: Run the security scans added by the nightly CI tier
    cmds:
      - task: generate
      - task: security:check

  ci:local:
    desc: Compatibility alias for the full current-environment contract
    cmds:
      - task: ci:full

  deploy:check:
    desc: Validate product and public-site deployment contracts
    deps:
      - api:generate
    cmds:
      - go test ./cmd/leapviewctl ./internal/app/cli/composectl ./internal/app/cli/hostinstall ./deploy/compose ./deploy/host
      - LEAPVIEW_TEST_CONTAINERS=1 go test ./internal/app/cli/composectl -run '^TestQualificationContainerRuntimeLifecycle$'
      - go test ./deploy/hetzner
      - go test ./deploy/hetzner-site
      - terraform fmt -check -recursive deploy/hetzner
      - terraform -chdir=deploy/hetzner init -backend=false -input=false
      - terraform -chdir=deploy/hetzner validate
      - terraform -chdir=deploy/hetzner test
      - terraform fmt -check -recursive deploy/hetzner-site
      - terraform -chdir=deploy/hetzner-site init -backend=false -input=false
      - terraform -chdir=deploy/hetzner-site validate
      - terraform -chdir=deploy/hetzner-site test

  site:deploy:
    desc: Bootstrap or recover pull-based deployment with an immutable public-site image
    requires:
      vars: [LEAPVIEW_SITE_IMAGE]
    cmds:
      - >-
        infisical run --silent
        --env prod
        --path /hetzner-site/operator
        --projectId c52a0183-fc82-4614-b437-c237a889d79c
        -- ./scripts/deploy_site.sh

  node:audit:
    desc: Scan JavaScript dependencies for known vulnerabilities
    deps:
      - node:deps
    cmds:
      - bun audit

  vuln:
    desc: Scan Go dependencies and call paths for known vulnerabilities
    cmds:
      - go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...

  security:policy:
    desc: Validate security coverage, updater ownership, exceptions, and pinned actions
    cmds:
      - go test ./internal/app/tools/securitypolicy
      - go run ./internal/app/tools/securitypolicy -root .

  security:dependencies:
    desc: Scan every maintained Go and JavaScript dependency graph
    deps:
      - ci:prepare
    cmds:
      - ./scripts/security_dependencies.sh

  security:secrets:
    desc: Scan the current tree and candidate history for secrets with redacted output
    cmds:
      - ./scripts/security_secrets.sh

  security:source:
    desc: Scan secrets, infrastructure, Dockerfiles, and workflows with pinned tools
    cmds:
      - ./scripts/security_source.sh

  security:oci-contracts:
    desc: Exercise fail-closed OCI provenance and promotion admission contracts
    cmds:
      - node --test scripts/oci_admission_contract.test.mjs

  security:promotion-contracts:
    desc: Exercise OCI and Desktop promotion admission contracts
    cmds:
      - task: security:oci-contracts
      - node --test desktop/scripts/workflow-contract.test.mjs

  security:governance:test:
    desc: Exercise the read-only repository governance audit
    cmds:
      - go test ./internal/app/tools/governanceaudit

  security:governance:
    desc: Audit live GitHub rulesets and protected deployment environments read-only
    cmds:
      - go run ./internal/app/tools/governanceaudit --live --repo flidai/leapview

  security:test:
    desc: Run hermetic security and provenance contract tests
    cmds:
      - task: security:policy
      - node --test scripts/security_workflow_contract.test.mjs
      - task: security:promotion-contracts
      - task: security:governance:test
      - bash -n scripts/security_dependencies.sh scripts/security_secrets.sh scripts/security_source.sh scripts/admit_oci_artifact.sh

  security:check:
    desc: Run all required security gates for the current candidate
    cmds:
      - task: security:test
      - task: security:dependencies
      - task: security:source

  agent:e2e:
    desc: Run opt-in DeepSeek-backed headless agent E2E
    cmds:
      - bash scripts/agent_e2e.sh
