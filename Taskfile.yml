    desc: Parse the application template with locked Kamal dependencies (no SSH)
    dir: deploy/managed/kamal
    cmds:
      - bundle exec ruby config_test.rb
      - bundle exec ruby maintenance_test.rb

  managed:kamal:transport-test:
    desc: Exercise pinned Kamal, Docker and TLS in isolated namespaces (requires sudo; transport evidence only)
    cmds:
      - python3 deploy/managed/nixos/tests/kamal_transport_contract_test.py
      - bash deploy/managed/nixos/tests/run-kamal-transport.sh

  managed:application:qualify:
    desc: Qualify real admitted image enrollment, handoff and offline recovery in private namespaces (requires sudo)
    cmds:
      - bash deploy/managed/nixos/tests/run-managed-application.sh {{.CLI_ARGS}}

  observability:check:
    desc: Validate all repository-owned Prometheus rules and fixtures
    cmds:
      - task: observability:alerts:check
      - task: observability:sli:check

  observability:alerts:check:
    desc: Validate repository-owned Prometheus alert rules and fixtures
    cmds:
      - ./scripts/promtool.sh check rules deploy/observability/prometheus/leapview-alerts.yaml
      - ./scripts/promtool.sh test rules deploy/observability/prometheus/testdata/leapview-alerts.test.yaml

  observability:sli:check:
    desc: Validate repository-owned Prometheus SLI recording rules and fixtures
    cmds:
      - ./scripts/promtool.sh check rules deploy/observability/prometheus/leapview-recording-rules.yaml
      - ./scripts/promtool.sh test rules deploy/observability/prometheus/testdata/leapview-recording-rules.test.yaml

  image:qualify:production:
    desc: Qualify an immutable LeapView production image
    requires:
      vars: [IMAGE]
    cmds:
      - task: db:generate
      - task: api:generate
      - task: ui-signals:generate
      - mkdir -p {{.ROOT_DIR}}/.tmp/qualification/tmp
      - >-
        env TMPDIR={{.ROOT_DIR}}/.tmp/qualification/tmp
        LEAPVIEWCTL_ROOT={{.ROOT_DIR}}/deploy/compose
        go run ./cmd/leapviewctl qualify image
        --image {{.IMAGE | quote}}
        --require-immutable
        --evidence-dir {{.ROOT_DIR}}/.tmp/qualification/production-image

  image:qualify:site:
    desc: Qualify an immutable LeapView public-site image
    requires:
      vars: [IMAGE]
    cmds:
      - task: db:generate
      - task: api:generate
      - task: ui-signals:generate
      - >-
        env LEAPVIEWCTL_ROOT={{.ROOT_DIR}}/deploy/compose
        go run ./cmd/leapviewctl qualify site-image
        --image {{.IMAGE | quote}}

  qualify:ubdr:managed-data-s3-dr:
    desc: Capture the managed-data S3 disaster-recovery seed evidence without restoring it
    deps:
      - db:generate
    env:
      LEAPVIEW_POSTGRES_CONFORMANCE_REQUIRED: "1"
      LEAPVIEW_TEST_UBDR_MANAGED_DATA_S3_DR_EVIDENCE_DIR: "{{.ROOT_DIR}}/.tmp/qualification/ubdr/managed-data-s3"
    cmds:
      - rm -rf "{{.ROOT_DIR}}/.tmp/qualification/ubdr/managed-data-s3"
      - >-
        go test -race -tags='duckdb_arrow fai520qualification'
        ./internal/recoveryset/postgres
        -run '^TestFAI520ManagedDataS3DRSeedQualification$'
        -count=1 -timeout=15m -v

  qualify:ubdr:recovery-ledger-postgres:
    desc: Qualify durable PostgreSQL recovery scheduling, fencing, publication retry, and retention
    deps:
      - db:generate
    env:
      LEAPVIEW_POSTGRES_CONFORMANCE_REQUIRED: "1"
      LEAPVIEW_TEST_FAI1001_RECOVERY_LEDGER_EVIDENCE_DIR: "{{.ROOT_DIR}}/.tmp/qualification/ubdr/recovery-ledger-postgres"
    cmds:
      - rm -rf "{{.ROOT_DIR}}/.tmp/qualification/ubdr/recovery-ledger-postgres"
      - >-
        go test -race -tags='fai1001qualification'
        ./internal/refresh/postgres
        -run '^TestFAI1001PostgresRecoveryLedgerQualification$'
        -count=1 -timeout=15m -v

  qualify:ubdr:migration-interruption:
    desc: Qualify transition interruption, stopped-target restart, fencing, and PostgreSQL-ledger resume
    deps:
      - db:generate
    env:
      LEAPVIEW_POSTGRES_CONFORMANCE_REQUIRED: "1"
      LEAPVIEW_TEST_FAI519_INTERRUPTION_EVIDENCE_DIR: "{{.ROOT_DIR}}/.tmp/qualification/ubdr/migration-interruption"
    cmds:
      - rm -rf "{{.ROOT_DIR}}/.tmp/qualification/ubdr/migration-interruption"
      - >-
        go test -race -tags='duckdb_arrow fai518qualification fai519qualification'
        ./internal/recoveryset/postgres
        -run '^TestFAI519TransitionAndStoppedTargetInterruptionQualification$'
        -count=1 -timeout=30m -v

  qualify:ubdr:provider-restore:
    desc: Qualify coordinated provider restoration and its replacement-host handoff
    deps:
      - db:generate
    vars:
      PROVIDER_HOST:
        sh: ip route get 1.1.1.1 | awk '{for (i=1;i<=NF;i++) if ($i=="src") {print $(i+1); exit}}'
    env:
      LEAPVIEW_POSTGRES_CONFORMANCE_REQUIRED: "1"
      TESTCONTAINERS_RYUK_DISABLED: "true"
      LEAPVIEW_TEST_FAI981_PROVIDER_RESTORE_EVIDENCE_DIR: "{{.ROOT_DIR}}/.tmp/qualification/ubdr/provider-restore"
      LEAPVIEW_TEST_FAI981_HANDOFF_PRIVATE_DIR: "{{.ROOT_DIR}}/.tmp/qualification/ubdr-private/provider-restore"
      LEAPVIEW_TEST_FAI981_RESOURCE_MANIFEST: "{{.ROOT_DIR}}/.tmp/qualification/ubdr-resources/provider-restore.json"
      LEAPVIEW_TEST_FAI981_HANDOFF_IMAGE: "ghcr.io/flidai/leapview@sha256:5b0cec900c5182f42654d07e58ca4ea9911ab1200f410670628601ab66085b85"
      LEAPVIEW_TEST_FAI981_HANDOFF_REVISION: "69652fb20101de80497cbf47ecfb402f700d6552"
      LEAPVIEW_TEST_FAI981_PROVIDER_HOST: "{{.PROVIDER_HOST}}"
    cmds:
      - task: qualify:ubdr:provider-restore:cleanup
      - rm -rf "{{.ROOT_DIR}}/.tmp/qualification/ubdr/provider-restore"
      - rm -rf "{{.ROOT_DIR}}/.tmp/qualification/ubdr-private/provider-restore"
      - >-
        go test -race -tags='fai981qualification'
        ./internal/app/providerrestore
        -run '^TestFAI981CoordinatedProviderRestoreQualification$'
        -count=1 -timeout=15m -v
      - >-
        go test -race -tags='fai981qualification'
        ./internal/app/providerrestore
        -run '^TestFAI981DownstreamHandoffSurvivesProducerExit$'
        -count=1 -timeout=10m -v

  qualify:ubdr:provider-restore:cleanup:
    desc: Remove provider resources retained for the FAI-981 downstream handoff
    vars:
      MANIFEST: "{{.ROOT_DIR}}/.tmp/qualification/ubdr-resources/provider-restore.json"
    cmds:
      - >-
        test ! -f "{{.MANIFEST}}" ||
        jq -r '.resources[] | select(.kind == "container") | .id' "{{.MANIFEST}}" |
        while IFS= read -r id; do
        if docker inspect "$id" >/dev/null 2>&1; then docker rm -f "$id"; fi;
        done
      - >-
        test ! -f "{{.MANIFEST}}" ||
        jq -r '.resources[] | select(.kind == "network") | .id' "{{.MANIFEST}}" |
        while IFS= read -r id; do
        if docker network inspect "$id" >/dev/null 2>&1; then docker network rm "$id"; fi;
        done
      - rm -f "{{.MANIFEST}}"
      - rm -rf "{{.ROOT_DIR}}/.tmp/qualification/ubdr-private/provider-restore"

  qualify:ubdr:release-transition-preflight:
    desc: Qualify authoritative PostgreSQL-era transition resolution without executing a transition
    deps:
      - db:generate
    env:
      LEAPVIEW_POSTGRES_CONFORMANCE_REQUIRED: "1"
    cmds:
      - >-
        go test -race -tags='fai518qualification'
        ./internal/recoveryset/postgres
        -run '^(TestFAI518AuthoritativeTransitionPreflightQualification|TestFAI518PublishedRecoveryFrontierRejectsTargetAndTamperedValidation|TestFAI518ProductionPreflightCompositionUsesAuthoritativeV2Evidence)$'
        -count=1 -timeout=10m -v

  qualify:ubdr:release-transition:
    desc: Qualify the forward-only PostgreSQL-era transition, restart, and durable readback contract
    deps:
      - db:generate
    env:
      LEAPVIEW_POSTGRES_CONFORMANCE_REQUIRED: "1"
      LEAPVIEW_TEST_FAI518_RELEASE_TRANSITION_EVIDENCE_DIR: "{{.ROOT_DIR}}/.tmp/qualification/ubdr/release-transition"
    cmds:
      - rm -rf "{{.ROOT_DIR}}/.tmp/qualification/ubdr/release-transition"
      - >-
        go test -race -tags='duckdb_arrow fai518qualification'
        ./internal/recoveryset/postgres
        -run '^TestFAI518Revision019To020TransitionQualification$'
        -count=1 -timeout=30m -v
      - >-
        go test -race -tags='duckdb_arrow fai518qualification'
        ./internal/recoveryset/postgres
        -run '^TestFAI518ForwardOnlyReleaseTransitionQualification$'
        -count=1 -timeout=30m -v

  qualify:ubdr:release-transition-artifact:
    desc: Qualify live-admitted predecessor and candidate distributions through the revision-019 forward transition
    deps:
      - db:generate
    cmds:
      - bash scripts/qualify_fai518_real_artifact.sh

  test:go:
    desc: Run Go tests with bounded package parallelism and stable application shards
    cmds:
      - task: generate
      - task: test:go:prepared

  test:go:prepared:
    internal: true
    desc: Run Go tests after shared generated inputs are ready
    cmds:
      - task --parallel test:go:packages test:go:app:shards
      - task: test:go:external

  test:go:app:shards:
    desc: Run stable application shards with three-process parallelism
    cmds:
      - task: go:deps
      - task --parallel --concurrency 3 test:go:app:0 test:go:app:1 test:go:app:2 test:go:app:3

  go:deps:
    desc: Prepare the locked module graph before parallel test compilation
    run: once
    cmds:
      # Match sqlc's proxy transport setting only for module acquisition.
      # Test processes retain the caller's GODEBUG and HTTP/2 behavior.
      - GODEBUG=http2client=0 go mod download

  test:go:packages:
    cmds:
      - task: go:deps
      # Container-backed PostgreSQL tests are run once, fail closed, by the
      # dedicated conformance lane. Derive the exclusion by source so a new
      # harness user cannot silently run in both lanes. App tests use the same
      # skip flag in their stable shards below.
      - |
        set -eu
        export LEAPVIEW_POSTGRES_CONFORMANCE_SKIP=1
        inventory_file="$(mktemp)"
        trap 'rm -f "$inventory_file"' EXIT
        bash scripts/postgres-conformance-tests.sh list >"$inventory_file"
        test -s "$inventory_file"
        all_packages="$(go list ./...)"
        printf '%s\n' "$all_packages" |
          grep -v '/internal/app$' |
          grep -Fvx -f "$inventory_file" |
          xargs -r go test -p 2

  test:cache:qualification:
    desc: Race-qualify stable cache cutover, generation execution, and bounded cache observers
    cmds:
      - go test -race -tags=duckdb_arrow -p 1 ./internal/analytics/resultcache ./internal/analytics/materialize ./internal/analytics/module ./internal/dashboard/observability -count=1

  test:cache:rollout:
    desc: Enforce repeated correctness, metrics, and race-stability cache cutover gates
    cmds:
      - go test -tags=duckdb_arrow ./internal/analytics/resultcache ./internal/analytics/materialize ./internal/analytics/module ./internal/dashboard/observability -run 'CutoverQualification|CacheCutoverRolloutMetrics|CacheCutoverReuseMetric' -count=100
      - go test -race -tags=duckdb_arrow -p 1 ./internal/analytics/resultcache ./internal/analytics/materialize ./internal/analytics/module ./internal/dashboard/observability -run 'CutoverQualification|CacheCutoverRolloutMetrics|CacheCutoverReuseMetric' -count=20

  test:go:app:0:
    cmds:
      - |
        pattern="$(go run ./internal/app/tools/testshard --package ./internal/app --shard-index 0 --shard-count 4)"
        LEAPVIEW_POSTGRES_CONFORMANCE_SKIP=1 go test ./internal/app -run "$pattern" -skip '^TestMinIOParquetSourceRefreshContract$'

  test:go:app:1:
    cmds:
      - |
        pattern="$(go run ./internal/app/tools/testshard --package ./internal/app --shard-index 1 --shard-count 4)"
        LEAPVIEW_POSTGRES_CONFORMANCE_SKIP=1 go test ./internal/app -run "$pattern" -skip '^TestMinIOParquetSourceRefreshContract$'

  test:go:app:2:
    cmds:
      - |
        pattern="$(go run ./internal/app/tools/testshard --package ./internal/app --shard-index 2 --shard-count 4)"
        LEAPVIEW_POSTGRES_CONFORMANCE_SKIP=1 go test ./internal/app -run "$pattern" -skip '^TestMinIOParquetSourceRefreshContract$'

  test:go:app:3:
    cmds:
      - |
        pattern="$(go run ./internal/app/tools/testshard --package ./internal/app --shard-index 3 --shard-count 4)"
        LEAPVIEW_POSTGRES_CONFORMANCE_SKIP=1 go test ./internal/app -run "$pattern" -skip '^TestMinIOParquetSourceRefreshContract$'

  test:go:external:
    desc: Run container-backed external-service integration tests serially
    cmds:
      - go test -tags integration ./internal/platform/testminio -count=1
      - go test ./internal/app -run '^TestMinIOParquetSourceRefreshContract$' -count=1
      - task: test:go:postgres-conformance

  test:go:postgres-conformance:
    desc: Run every source-inventoried PostgreSQL container suite once, fail closed, under the pinned PostgreSQL 18 harness
    env:
      LEAPVIEW_POSTGRES_CONFORMANCE_REQUIRED: "1"
    cmds:
      - bash scripts/postgres-conformance-tests.sh run

  test:go:postgres-multinode-qualification:
    desc: Run the FAI-572 independent PostgreSQL multi-node fencing qualification suites
    env:
      LEAPVIEW_POSTGRES_CONFORMANCE_REQUIRED: "1"
    cmds:
      - |
        output="$$(mktemp)"
        trap 'rm -f "$$output"' EXIT
        status=0
        go test -tags 'integration duckdb_arrow' -p 1 -count=1 -v -run '^TestPostgreSQL18MultiNode.*Qualification$$' ./internal/platform/jobs/module ./internal/deployment/postgres >"$$output" 2>&1 || status=$$?
        cat "$$output"
        test "$$status" -eq 0
        grep -Eq '^=== RUN   TestPostgreSQL18MultiNodeRiverQualification$$' "$$output"
        grep -Eq '^=== RUN   TestPostgreSQL18MultiNodeActivationServingStateQualification$$' "$$output"

  test:workload:qualify:
    desc: Qualify the reusable workload scheduler independently of LeapView
    cmds:
      - go test ./pkg/workload -count=1
      - go test -race ./pkg/workload -count=1
      - go test ./pkg/workload -run '^$' -fuzz '^FuzzQualificationConfigValidation$' -fuzztime=3s
      - go test ./pkg/workload -run '^$' -fuzz '^FuzzQualificationIdentityCanonicalization$' -fuzztime=3s
      - go test ./pkg/workload -run '^$' -fuzz '^FuzzQualificationRequestValidation$' -fuzztime=3s
      - go test ./pkg/workload -run '^$' -fuzz '^FuzzQualificationBoundedSchedulerOperation$' -fuzztime=3s
      - go test ./pkg/workload -run '^$' -bench 'Workload$' -benchmem -benchtime=100ms -count=1

  test:go:minio-conformance:
    desc: Run the object-backed shared-pool and GC namespace MinIO conformance tests
    deps:
      - db:generate
      - api:generate
    env:
      LEAPVIEW_MINIO_CONFORMANCE_REQUIRED: "1"
      LEAPVIEW_CONFORMANCE_EVIDENCE_OUT: "{{.ROOT_DIR}}/.tmp/minio-conformance/shared-pool-evidence.json"
    cmds:
      - rm -f "{{.ROOT_DIR}}/.tmp/minio-conformance/shared-pool-evidence.json"
      - go test -tags 'duckdb_arrow ducklake_minio' -count=1 -run '^TestSharedPoolConformanceMinIOLane$' -v ./internal/analytics/ducklake

  test:go:plan-gc-conformance:
    desc: Run the maintained native-delivery lifecycle, retention, concurrency, and provenance matrix
    deps:
      - db:generate
      - api:generate
      - config:generate
      - ui-signals:generate
    cmds:
      # The deployment subtree owns the maintained plan/build/seal/publication,
      # restart, crash, fencing, lease/retirement, and GC race matrix. Keep
      # this package-wide so adding a reviewed failure boundary cannot silently
      # leave the release gate running a stale selective subset.
      - go test ./internal/deployment/... -count=1 -v
      - go test ./internal/app/runtimefactory -count=1 -v
      # Recovery and physical-pool retention stay in their owning native
      # PostgreSQL/runtime packages; no legacy audit/repair path is composed.
      - go test ./internal/admin/offline ./internal/admin/cli ./internal/app/adminpostgres ./internal/app/gcadapter ./internal/platform/architecture -count=1 -v
      # Protected targets must prove that source ownership and retained
      # attestations are enforced, rather than trusting client provenance text.
      - go test ./internal/project/module -run '^(TestCandidateSourceSynchronizerAuthorizesOnlyPlannedOwnerUploads|TestCandidateSourceSynchronizerRetainsActivePlanAcrossRestart)$' -count=1 -v

  ci:lane:go:
    desc: Run the bounded Go unit and integration lane
    cmds:
      # Local PR/full CI enters through this aggregate lane rather than the
      # hosted package shard, so retain the SQL quality gate here as well.
      - task: db:check
      - task: apigen:test
      - task: test:go:prepared
      # Keep the documented local contract aligned with the quality checks
      # enforced by the hosted package lane without invoking that lane twice.
      - task: quality:budget:check
      - task: quality:exceptions:check
      - task: quality:trends:report
      - task: quality:critical:coverage
      - task: deadexports:check

  odcs:oracle:
    desc: Validate ODCS 3.1 golden exports with the pinned independent CI-only CLI
    cmds:
      - bash scripts/validate_odcs_oracle.sh

  ci:lane:go:packages:
    desc: Run non-application Go package tests
    cmds:
      # Keep the SQL generation, PostgreSQL conformance, and audit gate out
      # of the watchdog-wrapped shared preparation. It runs once here after
      # preparation instead of being repeated on every preparation retry.
      - task: db:check
      - task: quality:budget:check
      - task: quality:exceptions:check
      - task: quality:trends:report
      - task: quality:critical:coverage
      - task: deadexports:check
      - task: test:go:packages

  ci:lane:quality:
    desc: Run cross-language quality and architecture contracts
    cmds:
      - task: quality:budget:check
      - task: quality:exceptions:check
      - task: quality:trends:report
      - task: deadexports:check
      - go test ./internal/platform/architecture -count=1

  ci:lane:go:apigen:
    desc: Run the vendored APIGen Go module and TypeSpec tests
    cmds:
      - task: apigen:test

  ci:lane:go:application:
    desc: Run sharded application and external-service Go tests
    cmds:
      - task: test:go:app:shards
      - task: test:go:external

  ci:lane:frontend:
    desc: Run every bounded frontend shard sequentially on a shared local machine
    cmds:
      - task: ci:lane:frontend:shard
        vars: { SHARD: core }
      - task: ci:lane:frontend:shard
        vars: { SHARD: reports }
      - task: ci:lane:frontend:shard
        vars: { SHARD: chat }
      - task: ci:lane:frontend:shard
        vars: { SHARD: data }
      - task: ci:lane:frontend:shard
        vars: { SHARD: site }

  ci:lane:frontend:shard:
    desc: Run one isolated frontend shard with the hosted-CI hang watchdog
    requires:
      vars:
        - name: SHARD
          enum: [core, reports, chat, data, site]
    cmds:
      # Bound a single unit of work, not the cumulative runtime of all five.
      # Hosted CI gives each shard its own runner; local CI avoids CPU contention.
      # Reports retains every viewer and builder test, with separate bounds
      # for those units rather than one cumulative timeout for both suites.
      - |
        {{if eq .SHARD "reports"}}
        task ci:lane:frontend:reports
        {{else}}
        node scripts/ci_watchdog.mjs --timeout-seconds 180 --attempts 2 -- task ci:test:frontend:{{.SHARD}}
        {{end}}

  ci:lane:frontend:reports:
    desc: Run independently bounded viewer and builder validation
    cmds:
      - node scripts/ci_watchdog.mjs --timeout-seconds 300 --attempts 2 -- task ci:test:frontend:reports:viewer
      - node scripts/ci_watchdog.mjs --timeout-seconds 300 --attempts 2 -- task ci:test:frontend:reports:builder

  ci:lane:frontend:local:
    desc: Run the frontend lane locally with the hosted-CI hang watchdog
    cmds:
      - task: ci:lane:frontend

  ci:prepare:
    desc: Generate and build the shared inputs required by every CI validation lane
    cmds:
      - task: go:deps
      - task: ci:extensions:prepare
      - task: generate
      - task: build
      - task: site:build

  ci:extensions:prepare:
    desc: Provision CI fixtures and validate the production offline supply contract
    cmds:
      - go run ./internal/app/tools/ducklakeprepare
      - task: extension-supply:check

  extension-supply:check:
    desc: Check generated connector/format requirements and exact supply admission contracts
    cmds:
      - go test ./internal/project/contracts ./internal/deployment/extensionsupply ./internal/app/tools/extensionsupply

  ci:pr:
    desc: Run the fast required contract for every pull-request update
    cmds:
      - task: generated:check
      - task: ci:prepare
      # Hosted CI runs these lanes in parallel on separate runners. Keep local
      # execution sequential: concurrent Go builds can make Bun's bundler spin,
      # costing more time than the overlap saves on a shared workstation.
      - task: ci:lane:go
      - task: ci:lane:frontend:local
      - task: generated:check

  ci:full:
    desc: Run deterministic validation for the exact merge-queue candidate
    cmds:
      - task: ci:pr
      - task: ci:full:extras

  ci:full:extras:
    desc: Run merge-only validation sequentially on prepared inputs for local and nightly CI
    cmds:
      - task: desktop:test
      - task: ci:full:extras:static
      - task: ci:full:extras:runtime:multinode
      - task: qa:ui-framework
      - task: ci:full:extras:runtime:tail
      - task: test:qualification:demo-host-recovery
      - task: test:qualification:historical-transition:local

  ci:full:extras:static:
    internal: true
    desc: Run static merge-only validation
    cmds:
      - go vet ./...
      - go test -race ./pkg/...
      - task: quality:critical:race
      - task: test:workload:qualify

  ci:full:extras:runtime:
    internal: true
    desc: Run runtime merge-only validation
    cmds:
      - task: ci:full:extras:runtime:multinode
      - task: ci:full:extras:runtime:tail

  ci:full:extras:parallel:
    internal: true
    desc: Run independent static and runtime validation concurrently
    deps:
      - task: ci:full:extras:static
      - task: ci:full:extras:runtime

  ci:full:extras:runtime:multinode:
    internal: true
    desc: Run container-backed PostgreSQL multinode validation
    cmds:
      - task: test:go:postgres-multinode-qualification

  ci:full:extras:runtime:tail:
    internal: true
    desc: Run deployment and object-backed runtime validation
    cmds:
      - task: deploy:check
      - task: test:go:minio-conformance
      - task: test:go:plan-gc-conformance

  ci:full:extras:hosted:
    desc: Run merge-only validation with bounded hosted parallelism
    cmds:
      - task: desktop:test
      - task: ci:full:extras:parallel

  ci:nightly:
    desc: Run exhaustive scheduled validation, including dependency security scans
    cmds:
      - task: ci:full
      - task: ci:nightly:extras

  ci:nightly:extras:
    desc: Run the security scans added by the nightly CI tier
    cmds:
      - task: generate
      - task: security:check
      - task: dependency-security

  dependency-security:
    desc: Prepare and scan every checked-in JavaScript and Go dependency graph
    cmds:
      # Recreate each package-manager graph from its checked-in lockfile before
      # generation. The security lane must not inherit an incomplete workspace.
      - task: node:deps
      - task: desktop:deps
      - npm --prefix pkg/apigen/typespec ci
      - task: generate
      - task: node:audit
      - task: desktop:audit
      - task: apigen:audit
      - task: vuln

  security:report:
    desc: Generate content-bound dependency clearance evidence from a clean checkout
    deps:
      - dependency-security
    cmds:
      - mkdir -p .tmp/release-security
      - >-
        go run ./internal/app/tools/dependencyreport report
        --output .tmp/release-security/dependency-clearance.json

  security:report:check:
    desc: Re-scan and validate retained dependency clearance evidence
    cmds:
      - >-
        go run ./internal/app/tools/dependencyreport check
        --input .tmp/release-security/dependency-clearance.json

  ci:local:
    desc: Compatibility alias for the full current-environment contract
    cmds:
      - task: ci:full

  deploy:check:
    desc: Validate product and public-site deployment contracts
    deps:
      - db:generate
      - api:generate
    cmds:
      - go test ./cmd/leapviewctl ./internal/app/cli/composectl ./internal/app/cli/hostinstall ./deploy/compose ./deploy/host
      - LEAPVIEW_TEST_CONTAINERS=1 go test ./internal/app/cli/composectl -run '^TestQualification(ContainerRuntimeLifecycle|HistoricalDockerClientPortable)$'
      - go test ./deploy/hetzner
      - go test ./deploy/hetzner-site
      - PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s deploy/kamal-site -p 'test_*.py'
      - terraform fmt -check -recursive deploy/hetzner
      - terraform -chdir=deploy/hetzner init -backend=false -input=false -lockfile=readonly
      - terraform -chdir=deploy/hetzner validate
      - terraform -chdir=deploy/hetzner test
      - terraform fmt -check -recursive deploy/hetzner-site
      - terraform -chdir=deploy/hetzner-site init -backend=false -input=false -lockfile=readonly
      - terraform -chdir=deploy/hetzner-site validate
      - terraform -chdir=deploy/hetzner-site test

  site:deploy:
    desc: Run the manual public-site operator (pass commands after --)
    cmds:
      - python3 -B deploy/kamal-site/deploy.py {{.CLI_ARGS}}

  site:access-check:
    desc: Inspect the public-site host over the operator's pinned SSH connection
    cmds:
      - python3 -B deploy/kamal-site/deploy.py status

  site:observe:
    desc: Run or inspect the read-only public-site observation
    cmds:
      - python3 -B deploy/kamal-site/observe.py {{.CLI_ARGS}}

  site:acceptance:
    desc: Freeze or verify observation and public adoption smoke evidence
    cmds:
      - python3 -B deploy/kamal-site/acceptance.py {{.CLI_ARGS}}

  site:observation:test:
    desc: Test the public-site observer and acceptance gates with local fixtures
    cmds:
      - python3 -B -m unittest discover -s deploy/kamal-site -p 'test_observe.py'
      - python3 -B -m unittest discover -s deploy/kamal-site -p 'test_acceptance.py'

  node:audit:
    desc: Scan JavaScript dependencies for known vulnerabilities
    deps:
      - node:deps
    cmds:
      - bun audit

  desktop:audit:
    desc: Scan LeapView Desktop dependencies for known vulnerabilities
    deps:
      - desktop:deps
    dir: desktop
    cmds:
      - bun audit

  apigen:audit:
    desc: Scan the vendored APIGen TypeSpec dependencies for known vulnerabilities
    cmds:
      - npm --prefix pkg/apigen/typespec ci
      - npm --prefix pkg/apigen/typespec audit

  vuln:
    desc: Scan Go dependencies and call paths for known vulnerabilities
    env:
      GOMEMLIMIT: 4GiB
    cmds:
      - go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...

  security:policy:
    desc: Validate security coverage, updater ownership, exceptions, and pinned actions
    cmds:
      - go test ./internal/app/securitypolicy ./internal/app/tools/securitycontracts ./internal/app/tools/securityresults ./internal/app/tools/securitysast
      - go run ./internal/app/tools/securitypolicy -root .

  security:sast:prepare:
    desc: Prepare generated source in this SAST runner without building release assets
    env:
      NPM_CONFIG_AUDIT: "false"
    cmds:
      - task: go:deps
      - task: db:generate
      - task: config:generate
      - task: api:generate
      - task: ui-signals:generate
      - task: agent-contracts:generate
      - task: data-resource-contracts:generate
      - task: pipeline-contracts:generate
      - task: desktop-discovery:generate
      - task: layout-contract:generate
      - task: map-style:generate
      - task: lucide-icons:generate
      - task: visual-docs:generate

  security:sast:typescript:
    desc: Check maintained TypeScript graphs against prepared SAST source
    cmds:
      - ./node_modules/.bin/tsc --noEmit --project tsconfig.app.json
      - ./node_modules/.bin/tsc --noEmit --project tsconfig.contracts.json
      - ./node_modules/.bin/tsc --noEmit --project tsconfig.test.json
      - ./node_modules/.bin/tsc --noEmit --project tsconfig.playground.json
      - npm --prefix pkg/apigen/typespec run typecheck
      - task: desktop:deps
      - ./desktop/node_modules/.bin/tsc --noEmit --project desktop/tsconfig.json
      - ./desktop/node_modules/.bin/tsc --noEmit --project desktop/tsconfig.test.json

  security:dependencies:
    desc: Evaluate .security/javascript-vulnerability-evidence.json offline and run live source-aware Go dependency checks
    cmds:
      - go run ./internal/app/tools/securitydependencies -root .

  security:dependencies:evidence:refresh:
    desc: Refresh the checked-in JavaScript vulnerability evidence from live registries
    deps:
      - ci:prepare
    cmds:
      - go run ./internal/app/tools/securitydependencies -root . -refresh-javascript-evidence

  security:source:
    desc: Scan secrets, infrastructure, Dockerfiles, and workflows with pinned tools
    cmds:
      - go run ./internal/app/tools/securitysource -root .

  security:oci-contracts:
    desc: Exercise fail-closed OCI provenance and promotion admission contracts
    cmds:
      - go test ./internal/app/tools/ociadmission

  security:promotion-contracts:
    desc: Exercise OCI and Desktop promotion admission contracts
    cmds:
      - task: security:oci-contracts
      - node --test desktop/scripts/workflow-contract.test.mjs

  security:governance:test:
    desc: Exercise the read-only repository governance audit
    cmds:
      - go test ./internal/app/tools/governanceaudit

  security:governance:
    desc: Audit live GitHub rulesets and protected deployment environments read-only
    cmds:
      - go run ./internal/app/tools/governanceaudit --live --repo flidai/leapview

  security:test:
    desc: Run hermetic security and provenance contract tests
    cmds:
      - task: security:policy
      - go test ./internal/app/tools/securitydependencies ./internal/app/tools/securitysource
      - task: security:promotion-contracts
      - task: security:governance:test

  security:check:
    desc: Run all required security gates for the current candidate
    cmds:
      - task: security:test
      - task: security:dependencies
      - task: security:source

  agent:e2e:
    desc: Run opt-in OpenAI-compatible headless agent E2E
    deps:
      - postgres:dev:up
    cmds:
      - bash scripts/agent_e2e.sh
