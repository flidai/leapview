      - go run ./pkg/duckdbsql/internal/cmd/duckdbsqldocsgen -check

  duckdbsql:source:check:
    desc: Verify generated DuckDB SQL metadata against the exact pinned source checkout
    requires:
      vars: [DUCKDB_SOURCE]
    cmds:
      - go run ./pkg/duckdbsql/internal/cmd/duckdbsqlgen -check -source {{.DUCKDB_SOURCE | quote}}
      - go run ./pkg/duckdbsql/internal/cmd/duckdbsqldocsgen -check -source {{printf "%s/extension/core_functions" .DUCKDB_SOURCE | quote}}

  duckdbsql:qualification:
    desc: Run the independent Phase-1 DuckDB SQL qualification lane
    cmds:
      - task: duckdbsql:generated:check
      - go test ./pkg/duckdbsql -count=1 -run '^(TestPhase1QualificationCorpus|TestQualification|TestPinnedDuckDBModifierAST|TestDuckDBSQLArchitectureBoundary)$'
      - go test -race ./pkg/duckdbsql -count=1 -run '^(TestPhase1QualificationCorpus|TestQualification|TestPinnedDuckDBModifierAST|TestDuckDBSQLArchitectureBoundary)$'
      - go test ./pkg/duckdbsql -run '^$' -fuzz=FuzzDecodeDocumentQualification -fuzztime=2s -count=1

