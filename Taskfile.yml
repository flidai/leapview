    desc: Exercise managed-host updates and rollback plus network and GRUB reboot checks in NixOS guests
    cmds:
      - nix build path:./deploy/managed/nixos#boot-test --no-link --no-update-lock-file -L

  managed:hosts:network-test:
    desc: Exercise IPv4/IPv6 Docker ingress in fresh kernel namespaces (requires sudo)
    cmds:
      - sudo unshare --mount --net --fork python3 deploy/managed/nixos/tests/docker_firewall_test.py

  managed:hosts:docker-test:
    desc: Exercise real Docker forwarding and restart in isolated namespaces (requires sudo)
    cmds:
      - python3 deploy/managed/nixos/tests/namespace_test.py
      - |
        probe_image="$(nix build path:./deploy/managed/nixos#port-probe --no-link --no-update-lock-file --print-out-paths)"
        docker_package="$(nix build path:./deploy/managed/nixos#nixosConfigurations.example-app.config.virtualisation.docker.package --no-link --no-update-lock-file --print-out-paths)"
        sudo python3 deploy/managed/nixos/tests/docker_daemon_test.py "$probe_image" --docker-package "$docker_package"

