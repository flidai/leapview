    desc: Generate pinned DuckDB SQL runtime, AST, enum, and documentation metadata
    cmds:
      - go run ./pkg/duckdbsql/internal/cmd/duckdbsqlgen
      - go run ./pkg/duckdbsql/internal/cmd/duckdbsqldocsgen

  duckdbsql:generated:check:
    desc: Verify pinned DuckDB SQL metadata is current without network access
    cmds:
