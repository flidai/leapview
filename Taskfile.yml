  bench:arrow:quick:
    desc: Run the bounded Arrow evidence benchmark matrix for local iteration
    cmds:
      - go test ./pkg/arrowresult -run '^$' -bench '^BenchmarkArrow(CaptureCopy|IPCExistingDashboardString|IPCNativeReference)$/(narrow|wide|dictionary)/(rows_50|rows_1000)$' -benchmem -benchtime=100ms -count=3 -cpu=1
      - go test ./internal/analytics/arrowdecode -run '^$' -bench '^BenchmarkArrowDecodeRows$/(narrow|wide|dictionary)/(rows_50|rows_1000)$' -benchmem -benchtime=100ms -count=3 -cpu=1
      - go test ./internal/analytics/resultcache -run '^$' -bench '^BenchmarkWarmArrowCacheLookupLease$/(narrow|wide)/(rows_50|rows_1000)$' -benchmem -benchtime=100ms -count=3 -cpu=1
      - go test ./internal/dashboard/arrowbench -run '^$' -bench '^BenchmarkDashboard(RowShaping|StringProjection)$/(narrow|wide)/(rows_50|rows_1000)$' -benchmem -benchtime=100ms -count=3 -cpu=1
      - go test ./internal/dashboard/runtime -run '^$' -bench '^BenchmarkDashboardWarmShapingStages$/(kpi|wide_chart|table_window_narrow|table_window_wide)/(rows_1|rows_50|rows_1000)$' -benchmem -benchtime=100ms -count=3 -cpu=1
      - go test ./internal/dashboard/http -run '^TestDashboard(Baseline|Warm)' -bench '^BenchmarkDashboardBaseline(EndToEnd|Stages)$/(detail_narrow|detail_wide|matrix|pivot)/(rows_50|rows_1000)$' -benchmem -benchtime=100ms -count=3 -cpu=1
      - go test ./internal/dashboard/http -run '^TestDashboardWarm' -bench '^BenchmarkDashboardWarmCacheConcurrency$/(kpi|chart_bundle|wide_chart|table_window_arrow)/(users_1|users_20)$' -benchmem -benchtime=1x -count=3 -cpu=1
      - go test ./internal/dashboard/http -run '^$' -bench '^BenchmarkDashboardWarmSerializationStages$' -benchmem -benchtime=100ms -count=3 -cpu=1

  bench:arrow:full:
    desc: Run all Arrow evidence workloads with comparison-grade sample counts
    cmds:
      - go test ./pkg/arrowresult -run '^$' -bench '^BenchmarkArrow(CaptureCopy|IPCExistingDashboardString|IPCNativeReference)$' -benchmem -benchtime=500ms -count=10 -cpu=1
      - go test ./internal/analytics/arrowdecode -run '^$' -bench '^BenchmarkArrowDecodeRows$' -benchmem -benchtime=500ms -count=10 -cpu=1
      - go test ./internal/analytics/resultcache -run '^$' -bench '^BenchmarkWarmArrowCacheLookupLease$' -benchmem -benchtime=500ms -count=10 -cpu=1
      - go test ./internal/dashboard/arrowbench -run '^$' -bench '^BenchmarkDashboard(RowShaping|StringProjection)$' -benchmem -benchtime=500ms -count=10 -cpu=1
