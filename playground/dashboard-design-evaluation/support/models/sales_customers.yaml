apiVersion: leapview.dev/v1
kind: Model
metadata:
  id: model:sales_customers
  name: sales_customers
  displayName: Customers
spec:
  fields:
    - name: customer_id
      datatype: String
      label: Customer ID
    - name: state
      datatype: String
      label: State
  definition:
    type: sql
    sql: |
      SELECT customer_id, customer_state AS state
      FROM source."olist.customers"
  entities:
    - name: customer
      type: primary
      fields:
      - customer_id
  grain:
    entity: customer
