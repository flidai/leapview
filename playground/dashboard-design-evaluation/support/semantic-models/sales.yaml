apiVersion: leapview.dev/v1
kind: SemanticModel
metadata:
  id: semantic-model:sales
  name: sales
  displayName: Sales Semantic Model
spec:
  datasets:
    - name: sales_orders
      model: sales_orders
      defaultTimeDimension: purchase_date
      metrics:
        - name: order_count
          type: simple
          empty: zero
          label: Orders
          agg: count_distinct
          field: order_id
        - name: revenue
          type: simple
          empty: zero
          label: Revenue
          format: currency
          agg: sum
      dimensions:
        - name: purchase_date
          datatype: Date
          time:
            nativeGrain: day
            grains:
              - day
              - week
              - month
            calendar: iso8601
        - name: category
          datatype: String
    - name: sales_customers
      model: sales_customers
  relationships:
    - name: orders_customers
      from:
        dataset: sales_orders
        entity: customer
      to:
        dataset: sales_customers
        entity: customer
  dimensions:
    - name: state
      datatype: String
      bindings:
        - dataset: sales_orders
          field: sales_customers.state
          path:
            - orders_customers
  metrics:
    - name: aov
      type: ratio
      numerator: revenue
      denominator: order_count
      label: Average order value
      format: currency
