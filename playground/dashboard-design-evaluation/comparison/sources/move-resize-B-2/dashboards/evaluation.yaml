apiVersion: leapview.dashboard-prototype/b1
kind: Dashboard
metadata:
  id: dashboard:evaluation
  name: evaluation
  displayName: Design qualification
spec:
  semanticModel: sales
  layout:
    columns: 12
    rowHeight: 48
    gap: 16
    padding: 16
  filters: []
  visuals:
    - id: revenue-by-month
      title: Revenue by month
      type: area
      query:
        type: aggregate
        metrics:
          - revenue
        sort:
          - field: purchase_month
            direction: asc
        limit: 30
        group:
          category:
            dimension: purchase_date
            grain: month
            alias: purchase_month
    - id: total-revenue
      title: Total revenue
      type: kpi
      query:
        type: aggregate
        metrics:
          - revenue
        group: {}
      presentation:
        displayUnits: auto
  pages:
    - id: overview
      title: Overview
      components:
        - id: revenue-trend
          type: visual
          visual: revenue-by-month
          placement:
            column: 1
            row: 1
            columnSpan: 8
            rowSpan: 6
        - id: revenue-kpi
          type: visual
          visual: total-revenue
          placement:
            column: 9
            row: 1
            columnSpan: 4
            rowSpan: 3
