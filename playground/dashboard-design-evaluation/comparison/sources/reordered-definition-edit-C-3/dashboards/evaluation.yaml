apiVersion: leapview.dashboard-prototype/c1
kind: Dashboard
metadata:
  id: dashboard:evaluation
  name: evaluation
  displayName: Design qualification
spec:
  semanticModel: sales
  layout:
    columns: 12
    rowHeight: 48
    gap: 16
    padding: 16
  filters: []
  visuals:
    - id: unrelated-trend
      title: Revenue by month
      type: area
      query:
        type: aggregate
        dimensions:
          - dimension: purchase_date
            grain: month
            alias: purchase_month
        metrics:
          - order_count
        sort:
          - field: purchase_month
            direction: asc
        limit: 30
      presentation:
        type: cartesian
    - id: total-revenue
      title: Total revenue
      type: kpi
      query:
        type: aggregate
        dimensions: []
        metrics:
          - revenue
      presentation:
        type: kpi
        displayUnits: auto
    - id: revenue-by-month
      title: Revenue across months
      type: area
      query:
        type: aggregate
        dimensions:
          - dimension: purchase_date
            grain: month
            alias: purchase_month
        metrics:
          - revenue
        sort:
          - field: purchase_month
            direction: asc
        limit: 12
      presentation:
        type: cartesian
  pages:
    - id: overview
      title: Overview
      components:
        - id: revenue-trend
          type: visual
          visual: revenue-by-month
        - id: revenue-kpi
          type: visual
          visual: total-revenue
      rows:
        - id: row-revenue-trend
          height: 8
          items:
            - component: revenue-trend
              columnSpan: 12
        - id: row-revenue-kpi
          height: 3
          gapBefore: 1
          items:
            - component: revenue-kpi
              columnSpan: 3
    - id: detail
      title: Detail
      components:
        - id: revenue-detail
          type: visual
          visual: revenue-by-month
        - id: unrelated-detail
          type: visual
          visual: unrelated-trend
      rows:
        - id: row-revenue-detail
          height: 8
          items:
            - component: revenue-detail
              columnSpan: 12
        - id: row-unrelated-detail
          height: 8
          gapBefore: 1
          items:
            - component: unrelated-detail
              columnSpan: 12
