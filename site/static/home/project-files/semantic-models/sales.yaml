apiVersion: leapview.dev/v1
kind: SemanticModel
metadata:
  id: semantic-model:sales
  name: sales
  displayName: Sales Semantic Model
spec:
  datasets:
    sales_orders:
      model: sales_orders
      defaultTimeDimension: purchase_date
    sales_customers:
      model: sales_customers
  relationships:
    orders_customers:
      from:
        dataset: sales_orders
        entity: customer
      to:
        dataset: sales_customers
        entity: customer
  dimensions:
    purchase_date:
      datatype: Date
      bindings:
        sales_orders:
          field: sales_orders.purchase_date
      time:
        nativeGrain: day
        grains:
        - day
        - week
        - month
        calendar: iso8601
    state:
      datatype: String
      bindings:
        sales_orders:
          field: sales_customers.state
          path:
          - orders_customers
    category:
      datatype: String
      bindings:
        sales_orders:
          field: sales_orders.category
  metrics:
    order_count:
      type: aggregate
      dataset: sales_orders
      aggregation: count_distinct
      input:
        field: sales_orders.order_id
      empty: zero
      label: Orders
    revenue:
      type: aggregate
      dataset: sales_orders
      aggregation: sum
      input:
        field: sales_orders.revenue
      empty: zero
      label: Revenue
      format: currency
    aov:
      type: ratio
      numerator: revenue
      denominator: order_count
      label: Average order value
      format: currency
