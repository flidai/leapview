[extend]
useDefault = true

[[allowlists]]
description = "Deterministic non-secret values used by configuration and storage tests"
targetRules = ["generic-api-key"]
stopwords = [
  "0123456789abcdef0123456789abcdef",
  "replace-with-at-least-32-characters",
  "s3DeletionLeaseKey",
  "prefixed/blobs",
  "allowed_regions_2",
]

[[allowlists]]
description = "S3 garbage-collection marker constant comparison"
targetRules = ["generic-api-key"]
regexTarget = "line"
regexes = ['''key == s3OwnershipMarkerKey \|\| key == s3DeletionLeaseKey''']

[[allowlists]]
description = "Deterministic MinIO KMS fixture in candidate-history test revisions"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "line"
regexes = ['''(?:l3MinIOKMS|targetL3KMS)\s*=\s*"leapview-sse-key:''']
paths = ['''^internal/analytics/cache/l3/(s3_store_minio_test|target_cache_minio_test)\.go$''']

[[allowlists]]
description = "Deterministic PostgreSQL credential in ADR-0026 candidate-history test revisions"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "line"
regexes = ['''Password:\s*"adr0026-qualification-secret"''']
paths = ['''^internal/analytics/materialize/adr0026_qualification_test\.go$''']

[[allowlists]]
description = "Non-secret instance identity constant in offline setup tests"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "line"
regexes = ['''(?m)^const credentialSetupInstance = "lvinst_0123456789abcdefghijklmnopqrstuv"$''']
paths = ['''(?:^|/)internal/app/adminpostgres/credential_setup_test\.go$''']

# These exact non-secret UUID fixtures were extracted from D02, but remain in
# candidate history at c49346d6a. The history scan still requires their narrowly
# scoped exceptions; deleting the current files does not remove prior revisions.
[[allowlists]]
description = "Non-secret credential-version UUID identity validation fixtures in candidate-history revisions"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "line"
regexes = ['''CredentialVersionID:\s*"(?:8b8d2f2e-92dd-4f2a-85ac-154831c16a4d|8b8d2f2e92dd4f2a85ac154831c16a4d|8B8D2F2E-92DD-4F2A-85AC-154831C16A4D)"''']
paths = ['''(?:^|/)internal/analytics/connectionbinding/binding_test\.go$''']

[[allowlists]]
description = "Non-secret mismatched credential-version UUID in candidate-history local pool test"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "line"
regexes = ['''CredentialVersionID:\s*"c9f9b69c-4706-49dc-a6bf-28096d0df596"''']
paths = ['''(?:^|/)internal/analytics/duckdb/target_pool_local_test\.go$''']

[[allowlists]]
description = "Non-secret local runtime credential-version UUID test constant in candidate-history revisions"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "line"
regexes = ['''(?m)^const localRuntimeCredentialVersion = "93d623e3-8d75-41ea-b006-aed3375d0592"$''']
paths = ['''(?:^|/)internal/analytics/module/local_runtime_credential_test\.go$''']
