apiVersion: leapview.dev/v1
kind: Dashboard
metadata:
  id: dashboard:visual-docs
  name: visual-docs
  displayName: Visual documentation
spec:
  semanticModel: visual_examples
  visuals:
    placeholder:
      type: kpi
      query:
        type: aggregate
        dimensions: []
        metrics:
        - order_count
      presentation:
        type: kpi
  pages:
  - id: placeholder
    title: Placeholder
    components:
    - id: placeholder
      placement:
        column: 1
        row: 1
        columnSpan: 3
        rowSpan: 2
      type: visual
      visual: placeholder
  filters: []
