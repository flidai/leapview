apiVersion: leapview.dev/v1
kind: SemanticModel
metadata:
  id: semantic-model:visual_examples
  name: visual_examples
  displayName: Visual documentation examples
spec:
  tables:
  - orders
  - conversion_stages
  - revenue_bridge
  - market_ohlc
  - service_teams
  dimensions:
    purchase_date:
      type: date
      grains: [day, week, month]
      bindings:
        orders: {field: orders.purchase_date}
  measures:
    active_work_items:
      label: Active work items
      fact: service_teams
      aggregation: sum
      input: {field: service_teams.active_work_items}
      empty: zero
      format: integer
    conversions:
      label: Conversions
      fact: conversion_stages
      aggregation: sum
      input: {field: conversion_stages.conversions}
      empty: zero
      format: integer
    revenue_impact:
      label: Revenue impact
      fact: revenue_bridge
      aggregation: sum
      input: {field: revenue_bridge.amount}
      empty: zero
      unit: USD
      format: currency
    market_open:
      label: Open
      fact: market_ohlc
      aggregation: sum
      input: {field: market_ohlc.open}
      empty: "null"
      format: decimal
    market_close:
      label: Close
      fact: market_ohlc
      aggregation: sum
      input: {field: market_ohlc.close}
      empty: "null"
      format: decimal
    market_low:
      label: Low
      fact: market_ohlc
      aggregation: sum
      input: {field: market_ohlc.low}
      empty: "null"
      format: decimal
    market_high:
      label: High
      fact: market_ohlc
      aggregation: sum
      input: {field: market_ohlc.high}
      empty: "null"
      format: decimal
    order_count:
      label: Orders
      fact: orders
      aggregation: count_distinct
      input: {field: orders.order_id}
      empty: zero
      unit: orders
      format: integer
    revenue:
      label: Revenue
      fact: orders
      aggregation: sum
      input: {field: orders.revenue}
      empty: zero
      unit: USD
      format: currency
    revenue_min:
      label: Revenue minimum
      fact: orders
      aggregation: min
      input: {field: orders.revenue}
      empty: "null"
      unit: USD
      format: currency
    revenue_max:
      label: Revenue maximum
      fact: orders
      aggregation: max
      input: {field: orders.revenue}
      empty: "null"
      unit: USD
      format: currency
    missing_revenue:
      label: Missing revenue comparison
      fact: orders
      aggregation: sum
      input: {field: orders.revenue}
      filters:
      - field: orders.status
        operator: equals
        values: [comparison_fixture_without_rows]
      empty: "null"
      unit: USD
      format: currency
    review_score:
      label: Review score
      fact: orders
      aggregation: avg
      input: {field: orders.review_score}
      empty: "null"
      format: decimal
    delivery_days:
      label: Delivery days
      fact: orders
      aggregation: avg
      input: {field: orders.delivery_days}
      empty: "null"
      format: decimal
    delivery_days_min:
      label: Delivery minimum
      fact: orders
      aggregation: min
      input: {field: orders.delivery_days}
      empty: "null"
      format: decimal
    delivery_days_max:
      label: Delivery maximum
      fact: orders
      aggregation: max
      input: {field: orders.delivery_days}
      empty: "null"
      format: decimal
  metrics:
    aov:
      label: Average order value
      expression: safe_divide(${revenue}, ${order_count})
      unit: USD
      format: currency
    revenue_baseline:
      label: Revenue baseline
      expression: ${revenue} * 0.9
      unit: USD
      format: currency
    revenue_target:
      label: Revenue target
      expression: ${revenue} * 1.1
      unit: USD
      format: currency
    revenue_q1:
      label: Revenue open
      expression: ${revenue_min}
      unit: USD
      format: currency
    revenue_q3:
      label: Revenue close
      expression: ${revenue_max}
      unit: USD
      format: currency
    delivery_days_q1:
      label: Delivery open
      expression: ${delivery_days_min}
      format: decimal
    delivery_days_q3:
      label: Delivery close
      expression: ${delivery_days_max}
      format: decimal
