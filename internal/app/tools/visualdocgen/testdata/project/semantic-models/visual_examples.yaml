apiVersion: leapview.dev/v1
kind: SemanticModel
metadata:
  id: semantic-model:visual_examples
  name: visual_examples
  displayName: Visual documentation examples
spec:
  datasets:
    orders:
      model: orders
      defaultTimeDimension: purchase_date
      metrics:
        order_count:
          type: simple
          empty: zero
          label: Orders
          format: integer
          agg: count_distinct
          field: order_id
        revenue:
          type: simple
          empty: zero
          label: Revenue
          unit: USD
          format: currency
          agg: sum
        revenue_min:
          type: simple
          empty: 'null'
          label: Revenue minimum
          unit: USD
          format: currency
          agg: min
          field: revenue
        revenue_max:
          type: simple
          empty: 'null'
          label: Revenue maximum
          unit: USD
          format: currency
          agg: max
          field: revenue
        missing_revenue:
          type: simple
          where:
            - missing_revenue_filter
          empty: 'null'
          label: Missing revenue comparison
          unit: USD
          format: currency
          agg: sum
          field: revenue
        review_score:
          type: simple
          empty: 'null'
          label: Review score
          format: decimal
          agg: avg
        delivery_days:
          type: simple
          empty: 'null'
          label: Delivery days
          format: decimal
          agg: avg
        delivery_days_min:
          type: simple
          empty: 'null'
          label: Delivery minimum
          format: decimal
          agg: min
          field: delivery_days
        delivery_days_max:
          type: simple
          empty: 'null'
          label: Delivery maximum
          format: decimal
          agg: max
          field: delivery_days
      dimensions:
        order_id:
          datatype: String
        purchase_date:
          datatype: Date
          time:
            nativeGrain: day
            grains:
              - day
              - week
              - month
            calendar: iso8601
        purchase_month:
          datatype: String
        status:
          datatype: String
        category:
          datatype: String
        state:
          datatype: String
        delivery_bucket:
          datatype: String
        latitude:
          datatype: Float
        longitude:
          datatype: Float
    conversion_stages:
      model: conversion_stages
      metrics:
        conversions:
          type: simple
          empty: zero
          label: Conversions
          format: integer
          agg: sum
      dimensions:
        stage:
          datatype: String
    revenue_bridge:
      model: revenue_bridge
      metrics:
        revenue_impact:
          type: simple
          empty: zero
          label: Revenue impact
          unit: USD
          format: currency
          agg: sum
          field: amount
      dimensions:
        component:
          datatype: String
    market_ohlc:
      model: market_ohlc
      metrics:
        market_open:
          type: simple
          empty: 'null'
          label: Open
          format: decimal
          agg: sum
          field: open
        market_close:
          type: simple
          empty: 'null'
          label: Close
          format: decimal
          agg: sum
          field: close
        market_low:
          type: simple
          empty: 'null'
          label: Low
          format: decimal
          agg: sum
          field: low
        market_high:
          type: simple
          empty: 'null'
          label: High
          format: decimal
          agg: sum
          field: high
      dimensions:
        month:
          datatype: String
    service_teams:
      model: service_teams
      metrics:
        active_work_items:
          type: simple
          empty: zero
          label: Active work items
          format: integer
          agg: sum
      dimensions:
        division:
          datatype: String
        team:
          datatype: String
  filters:
    missing_revenue_filter:
      field: orders.status
      operator: equals
      value: comparison_fixture_without_rows
  metrics:
    aov:
      type: ratio
      numerator: revenue
      denominator: order_count
      label: Average order value
      unit: USD
      format: currency
    revenue_baseline:
      type: derived
      label: Revenue baseline
      expression: ${revenue} * 0.9
      unit: USD
      format: currency
    revenue_target:
      type: derived
      label: Revenue target
      expression: ${revenue} * 1.1
      unit: USD
      format: currency
    revenue_q1:
      type: derived
      label: Revenue open
      expression: ${revenue_min}
      unit: USD
      format: currency
    revenue_q3:
      type: derived
      label: Revenue close
      expression: ${revenue_max}
      unit: USD
      format: currency
    delivery_days_q1:
      type: derived
      label: Delivery open
      expression: ${delivery_days_min}
      format: decimal
    delivery_days_q3:
      type: derived
      label: Delivery close
      expression: ${delivery_days_max}
      format: decimal
