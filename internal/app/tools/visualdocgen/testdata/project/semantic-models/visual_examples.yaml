apiVersion: leapview.dev/v1
kind: SemanticModel
metadata:
  id: semantic-model:visual_examples
  name: visual_examples
  displayName: Visual documentation examples
spec:
  datasets:
    - name: orders
      model: orders
      defaultTimeDimension: purchase_date
      metrics:
        - name: order_count
          type: simple
          empty: zero
          label: Orders
          format: integer
          agg: count_distinct
          field: order_id
        - name: revenue
          type: simple
          empty: zero
          label: Revenue
          unit: USD
          format: currency
          agg: sum
        - name: revenue_min
          type: simple
          empty: 'null'
          label: Revenue minimum
          unit: USD
          format: currency
          agg: min
          field: revenue
        - name: revenue_max
          type: simple
          empty: 'null'
          label: Revenue maximum
          unit: USD
          format: currency
          agg: max
          field: revenue
        - name: missing_revenue
          type: simple
          where:
            - missing_revenue_filter
          empty: 'null'
          label: Missing revenue comparison
          unit: USD
          format: currency
          agg: sum
          field: revenue
        - name: review_score
          type: simple
          empty: 'null'
          label: Review score
          format: decimal
          agg: avg
        - name: delivery_days
          type: simple
          empty: 'null'
          label: Delivery days
          format: decimal
          agg: avg
        - name: delivery_days_min
          type: simple
          empty: 'null'
          label: Delivery minimum
          format: decimal
          agg: min
          field: delivery_days
        - name: delivery_days_max
          type: simple
          empty: 'null'
          label: Delivery maximum
          format: decimal
          agg: max
          field: delivery_days
      dimensions:
        - name: order_id
          datatype: String
        - name: purchase_date
          datatype: Date
          time:
            nativeGrain: day
            grains:
              - day
              - week
              - month
            calendar: iso8601
        - name: purchase_month
          datatype: String
        - name: status
          datatype: String
        - name: category
          datatype: String
        - name: state
          datatype: String
        - name: delivery_bucket
          datatype: String
        - name: latitude
          datatype: Float
        - name: longitude
          datatype: Float
    - name: conversion_stages
      model: conversion_stages
      metrics:
        - name: conversions
          type: simple
          empty: zero
          label: Conversions
          format: integer
          agg: sum
      dimensions:
        - name: stage
          datatype: String
    - name: revenue_bridge
      model: revenue_bridge
      metrics:
        - name: revenue_impact
          type: simple
          empty: zero
          label: Revenue impact
          unit: USD
          format: currency
          agg: sum
          field: amount
      dimensions:
        - name: component
          datatype: String
    - name: market_ohlc
      model: market_ohlc
      metrics:
        - name: market_open
          type: simple
          empty: 'null'
          label: Open
          format: decimal
          agg: sum
          field: open
        - name: market_close
          type: simple
          empty: 'null'
          label: Close
          format: decimal
          agg: sum
          field: close
        - name: market_low
          type: simple
          empty: 'null'
          label: Low
          format: decimal
          agg: sum
          field: low
        - name: market_high
          type: simple
          empty: 'null'
          label: High
          format: decimal
          agg: sum
          field: high
      dimensions:
        - name: month
          datatype: String
    - name: service_teams
      model: service_teams
      metrics:
        - name: active_work_items
          type: simple
          empty: zero
          label: Active work items
          format: integer
          agg: sum
      dimensions:
        - name: division
          datatype: String
        - name: team
          datatype: String
  filters:
    - name: missing_revenue_filter
      definition:
        field: orders.status
        operator: equals
        value: comparison_fixture_without_rows
  metrics:
    - name: aov
      type: ratio
      numerator: revenue
      denominator: order_count
      label: Average order value
      unit: USD
      format: currency
    - name: revenue_baseline
      type: derived
      label: Revenue baseline
      expression: ${revenue} * 0.9
      unit: USD
      format: currency
    - name: revenue_target
      type: derived
      label: Revenue target
      expression: ${revenue} * 1.1
      unit: USD
      format: currency
    - name: revenue_q1
      type: derived
      label: Revenue open
      expression: ${revenue_min}
      unit: USD
      format: currency
    - name: revenue_q3
      type: derived
      label: Revenue close
      expression: ${revenue_max}
      unit: USD
      format: currency
    - name: delivery_days_q1
      type: derived
      label: Delivery open
      expression: ${delivery_days_min}
      format: decimal
    - name: delivery_days_q3
      type: derived
      label: Delivery close
      expression: ${delivery_days_max}
      format: decimal
