apiVersion: leapview.dev/v1
kind: Source
metadata:
  id: source:docs.orders
  name: docs.orders
  displayName: Documentation orders
spec:
  connection: docs
  path: orders.csv
  fields:
    order_id: {type: string}
    purchase_month: {type: string}
    status: {type: string}
    category: {type: string}
    state: {type: string}
    revenue: {type: number}
    review_score: {type: number}
    delivery_days: {type: number}
    delivery_bucket: {type: string}
