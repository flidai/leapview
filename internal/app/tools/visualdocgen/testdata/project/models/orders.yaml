apiVersion: leapview.dev/v1
kind: Model
metadata:
  id: model:orders
  name: orders
  displayName: Documentation orders
spec:
  fields:
    - name: order_id
      datatype: String
      label: Order ID
    - name: purchase_month
      datatype: String
      label: Purchase month
    - name: purchase_date
      datatype: Date
      label: Purchase date
    - name: status
      datatype: String
      label: Status
    - name: category
      datatype: String
      label: Category
    - name: state
      datatype: String
      label: State
    - name: latitude
      datatype: Float
      label: Latitude
    - name: longitude
      datatype: Float
      label: Longitude
    - name: revenue
      datatype: Decimal
      label: Revenue
    - name: review_score
      datatype: Float
      label: Review score
    - name: delivery_days
      datatype: Float
      label: Delivery days
    - name: delivery_bucket
      datatype: String
      label: Delivery speed
  definition:
    type: sql
    sql: |
      SELECT
        order_id,
        purchase_month,
        CAST(purchase_month || '-01' AS DATE) AS purchase_date,
        status,
        category,
        state,
        CAST(-33 + (hash(order_id) % 3800) / 100.0 AS DOUBLE) AS latitude,
        CAST(-74 + (hash(order_id || '-longitude') % 4000) / 100.0 AS DOUBLE) AS longitude,
        CAST(revenue AS DECIMAL(18, 3)) AS revenue,
        CAST(review_score AS DOUBLE) AS review_score,
        CAST(delivery_days AS DOUBLE) AS delivery_days,
        delivery_bucket
      FROM source."docs.orders"
  entities:
    - name: order
      type: primary
      fields:
      - order_id
  grain:
    entity: order
