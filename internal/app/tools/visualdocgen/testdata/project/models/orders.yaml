apiVersion: leapview.dev/v1
kind: Model
metadata:
  id: model:orders
  name: orders
  displayName: Documentation orders
spec:
  fields:
    order_id:
      datatype: String
      label: Order ID
    purchase_month:
      datatype: String
      label: Purchase month
    purchase_date:
      datatype: Date
      label: Purchase date
    status:
      datatype: String
      label: Status
    category:
      datatype: String
      label: Category
    state:
      datatype: String
      label: State
    latitude:
      datatype: Float
      label: Latitude
    longitude:
      datatype: Float
      label: Longitude
    revenue:
      datatype: Decimal
      label: Revenue
    review_score:
      datatype: Float
      label: Review score
    delivery_days:
      datatype: Float
      label: Delivery days
    delivery_bucket:
      datatype: String
      label: Delivery speed
  definition:
    type: sql
    sql: |
      SELECT
        order_id,
        purchase_month,
        CAST(purchase_month || '-01' AS DATE) AS purchase_date,
        status,
        category,
        state,
        CAST(-33 + (hash(order_id) % 3800) / 100.0 AS DOUBLE) AS latitude,
        CAST(-74 + (hash(order_id || '-longitude') % 4000) / 100.0 AS DOUBLE) AS longitude,
        CAST(revenue AS DECIMAL(18, 3)) AS revenue,
        CAST(review_score AS DOUBLE) AS review_score,
        CAST(delivery_days AS DOUBLE) AS delivery_days,
        delivery_bucket
      FROM source."docs.orders"
  entities:
    order:
      type: primary
      fields:
      - order_id
  grain:
    entity: order
