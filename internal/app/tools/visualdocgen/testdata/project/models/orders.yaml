apiVersion: leapview.dev/v1
kind: Model
metadata:
  id: model:orders
  name: orders
  displayName: Documentation orders
spec:
  primaryKey: order_id
  sources:
  - docs.orders
  fields:
    order_id: {label: Order ID, type: string}
    purchase_month: {label: Purchase month, type: string}
    purchase_date: {label: Purchase date, type: date}
    status: {label: Status, type: string}
    category: {label: Category, type: string}
    state: {label: State, type: string}
    latitude: {label: Latitude, type: number}
    longitude: {label: Longitude, type: number}
    revenue: {label: Revenue, type: number}
    review_score: {label: Review score, type: number}
    delivery_days: {label: Delivery days, type: number}
    delivery_bucket: {label: Delivery speed, type: string}
  transform:
    sql: |
      SELECT
        order_id,
        purchase_month,
        CAST(purchase_month || '-01' AS DATE) AS purchase_date,
        status,
        category,
        state,
        CAST(-33 + (hash(order_id) % 3800) / 100.0 AS DOUBLE) AS latitude,
        CAST(-74 + (hash(order_id || '-longitude') % 4000) / 100.0 AS DOUBLE) AS longitude,
        CAST(revenue AS DOUBLE) AS revenue,
        CAST(review_score AS DOUBLE) AS review_score,
        CAST(delivery_days AS DOUBLE) AS delivery_days,
        delivery_bucket
      FROM source."docs.orders"
