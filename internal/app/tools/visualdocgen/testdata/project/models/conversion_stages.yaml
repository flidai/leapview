apiVersion: leapview.dev/v1
kind: Model
metadata:
  id: model:conversion_stages
  name: conversion_stages
  displayName: Conversion stages
spec:
  fields:
    stage:
      datatype: String
      label: Stage
    conversions:
      datatype: Float
      label: Conversions
  definition:
    type: sql
    sql: |
      SELECT stage, CAST(conversions AS DOUBLE) AS conversions
      FROM source."docs.conversion_stages"
  entities:
    stage:
      type: primary
      fields:
      - stage
  grain:
    entity: stage
