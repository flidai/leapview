apiVersion: leapview.dev/v1
kind: Model
metadata:
  id: model:revenue_bridge
  name: revenue_bridge
  displayName: Revenue bridge
spec:
  sources:
  - docs.revenue_bridge
  fields:
    component:
      datatype: String
      label: Driver
    amount:
      datatype: Float
      label: Revenue impact
  transform:
    sql: |
      SELECT component, CAST(amount AS DOUBLE) AS amount
      FROM source."docs.revenue_bridge"
  entities:
    component:
      type: primary
      fields:
      - component
  grain:
    entity: component
