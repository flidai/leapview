apiVersion: leapview.dev/v1
kind: Model
metadata:
  id: model:revenue_bridge
  name: revenue_bridge
  displayName: Revenue bridge
spec:
  fields:
    - name: component
      datatype: String
      label: Driver
    - name: amount
      datatype: Float
      label: Revenue impact
  definition:
    type: sql
    sql: |
      SELECT component, CAST(amount AS DOUBLE) AS amount
      FROM source."docs.revenue_bridge"
  entities:
    - name: component
      type: primary
      fields:
      - component
  grain:
    entity: component
