apiVersion: leapview.dev/v1
kind: Model
metadata:
  id: model:service_teams
  name: service_teams
  displayName: Service teams
spec:
  definition:
    type: sql
    sql: |
      SELECT division, team, CAST(active_work_items AS DOUBLE) AS active_work_items
      FROM source."docs.service_teams"
  fields:
    division:
      datatype: String
      label: Division
    team:
      datatype: String
      label: Team
    active_work_items:
      datatype: Float
      label: Active work items
  entities:
    team:
      type: primary
      fields:
      - team
  grain:
    entity: team
