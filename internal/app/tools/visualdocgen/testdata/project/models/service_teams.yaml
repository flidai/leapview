apiVersion: leapview.dev/v1
kind: Model
metadata:
  id: model:service_teams
  name: service_teams
  displayName: Service teams
spec:
  primaryKey: team
  sources: [docs.service_teams]
  fields:
    division: {label: Division, type: string}
    team: {label: Team, type: string}
    active_work_items: {label: Active work items, type: number}
  transform:
    sql: |
      SELECT division, team, CAST(active_work_items AS DOUBLE) AS active_work_items
      FROM source."docs.service_teams"
