apiVersion: leapview.dev/v1
kind: Model
metadata:
  id: model:market_ohlc
  name: market_ohlc
  displayName: Monthly market prices
spec:
  definition:
    type: sql
    sql: |
      SELECT
        month,
        CAST(open AS DOUBLE) AS open,
        CAST(close AS DOUBLE) AS close,
        CAST(low AS DOUBLE) AS low,
        CAST(high AS DOUBLE) AS high
      FROM source."docs.market_ohlc"
  fields:
    month:
      datatype: String
      label: Month
    open:
      datatype: Float
      label: Open
    close:
      datatype: Float
      label: Close
    low:
      datatype: Float
      label: Low
    high:
      datatype: Float
      label: High
  entities:
    month:
      type: primary
      fields:
      - month
  grain:
    entity: month
