apiVersion: leapview.dev/v1
kind: Model
metadata:
  id: model:market_ohlc
  name: market_ohlc
  displayName: Monthly market prices
spec:
  primaryKey: month
  sources: [docs.market_ohlc]
  fields:
    month: {label: Month, type: string}
    open: {label: Open, type: number}
    close: {label: Close, type: number}
    low: {label: Low, type: number}
    high: {label: High, type: number}
  transform:
    sql: |
      SELECT
        month,
        CAST(open AS DOUBLE) AS open,
        CAST(close AS DOUBLE) AS close,
        CAST(low AS DOUBLE) AS low,
        CAST(high AS DOUBLE) AS high
      FROM source."docs.market_ohlc"
