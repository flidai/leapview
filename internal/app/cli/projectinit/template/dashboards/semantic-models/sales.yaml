apiVersion: leapview.dev/v1
kind: SemanticModel
metadata:
  id: semantic-model:sales_metrics
  name: sales_metrics
  displayName: Sales
spec:
  datasets:
    sales:
      model: sales
      defaultTimeDimension: sale_date
      metrics:
        revenue:
          type: simple
          empty: zero
          label: Revenue
          format: currency
          agg: sum
          field: amount
        sale_count:
          type: simple
          empty: zero
          label: Sales
          format: integer
          agg: count_distinct
          field: sale_id
      dimensions:
        sale_date:
          datatype: Date
          label: Sale date
          time:
            nativeGrain: day
            grains: [day, week, month, quarter, year]
            calendar: iso8601
        region: {datatype: String, label: Region}
        category: {datatype: String, label: Category}
