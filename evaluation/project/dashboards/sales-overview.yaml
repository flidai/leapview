apiVersion: leapview.dev/v1
kind: Dashboard
metadata:
  id: dashboard:sales-overview
  name: sales-overview
  displayName: Five-minute Sales Evaluation
  description: Filter a governed dataset and inspect its KPI, chart, and order table.
  tags:
  - evaluation
  - sales
spec:
  semanticModel: sales
  filters:
  - id: state
    label: State
    dimension: state
    control:
      type: multiSelect
      options:
        type: static
        values:
        - value: {type: string, value: SP}
          label: SP
        - value: {type: string, value: RJ}
          label: RJ
        - value: {type: string, value: MG}
          label: MG
        - value: {type: string, value: PR}
          label: PR
    operators:
    - in
    - notIn
    urlParameter: state
  - id: category
    label: Category
    dimension: category
    control:
      type: text
    operators:
    - contains
    - equals
    - startsWith
    - notContains
    urlParameter: category
  visuals:
    revenue_kpi:
      type: kpi
      query:
        type: aggregate
        dimensions: []
        metrics:
        - revenue
      presentation:
        type: kpi
        note: Governed revenue
        tone: success
    total_orders:
      type: kpi
      query:
        type: aggregate
        dimensions: []
        metrics:
        - order_count
      presentation:
        type: kpi
        note: Filtered orders
        tone: ink
    category_revenue:
      type: bar
      query:
        type: aggregate
        dimensions:
        - category
        metrics:
        - revenue
        sort:
        - field: revenue
          direction: desc
        limit: 10
      title: Revenue by category
      presentation:
        type: cartesian
    orders_table:
      type: table
      query:
        type: records
        dataset: orders
        fields:
        - order_id
        - purchase_date
        - state
        - category
        - status
        - revenue
      title: Governed order rows
      presentation:
        type: table
        rowHeight: 32
        showHeader: true
        striped: false
  pages:
  - id: overview
    title: Overview
    components:
    - id: state-filter
      placement:
        column: 1
        row: 1
        columnSpan: 6
        rowSpan: 2
      type: filter
      filter: state
    - id: category-filter
      placement:
        column: 7
        row: 1
        columnSpan: 6
        rowSpan: 2
      type: filter
      filter: category
    - id: total-orders
      placement:
        column: 1
        row: 4
        columnSpan: 6
        rowSpan: 3
      type: visual
      visual: total_orders
    - id: revenue
      placement:
        column: 7
        row: 4
        columnSpan: 6
        rowSpan: 3
      type: visual
      visual: revenue_kpi
    - id: categories
      placement:
        column: 1
        row: 8
        columnSpan: 12
        rowSpan: 6
      type: visual
      visual: category_revenue
    - id: orders
      placement:
        column: 1
        row: 15
        columnSpan: 12
        rowSpan: 8
      type: visual
      visual: orders_table
  layout:
    columns: 12
    rowHeight: 48
    gap: 16
    padding: 16
