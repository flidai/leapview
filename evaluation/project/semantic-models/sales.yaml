apiVersion: leapview.dev/v1
kind: SemanticModel
metadata:
  id: semantic-model:sales
  name: sales
  displayName: Governed Sales
spec:
  datasets:
    orders:
      model: orders
      defaultTimeDimension: purchase_date
      metrics:
        order_count:
          type: simple
          empty: zero
          label: Orders
          agg: count_distinct
          field: order_id
        revenue:
          type: simple
          empty: zero
          label: Revenue
          format: currency
          agg: sum
      dimensions:
        purchase_date:
          datatype: Date
          time:
            nativeGrain: day
            grains:
              - day
              - week
              - month
            calendar: iso8601
        state:
          datatype: String
        category:
          datatype: String
        status:
          datatype: String
  metrics:
    aov:
      type: ratio
      numerator: revenue
      denominator: order_count
      label: Average order value
      format: currency
