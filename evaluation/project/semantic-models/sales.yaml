apiVersion: leapview.dev/v1
kind: SemanticModel
metadata:
  id: semantic-model:sales
  name: sales
  displayName: Governed Sales
spec:
  datasets:
    - name: orders
      model: orders
      defaultTimeDimension: purchase_date
      metrics:
        - name: order_count
          type: simple
          empty: zero
          label: Orders
          agg: count_distinct
          field: order_id
        - name: revenue
          type: simple
          empty: zero
          label: Revenue
          format: currency
          agg: sum
      dimensions:
        - name: purchase_date
          datatype: Date
          time:
            nativeGrain: day
            grains:
              - day
              - week
              - month
            calendar: iso8601
        - name: state
          datatype: String
        - name: category
          datatype: String
        - name: status
          datatype: String
  metrics:
    - name: aov
      type: ratio
      numerator: revenue
      denominator: order_count
      label: Average order value
      format: currency
