apiVersion: leapview.dev/v1
kind: SemanticModel
metadata:
  id: semantic-model:sales
  name: sales
  displayName: Governed Sales
spec:
  datasets:
    orders:
      model: orders
      defaultTimeDimension: purchase_date
  dimensions:
    purchase_date:
      datatype: Date
      bindings:
        orders:
          field: orders.purchase_date
      time:
        nativeGrain: day
        grains:
        - day
        - week
        - month
        calendar: iso8601
    state:
      datatype: String
      bindings:
        orders:
          field: orders.state
    category:
      datatype: String
      bindings:
        orders:
          field: orders.category
    status:
      datatype: String
      bindings:
        orders:
          field: orders.status
  metrics:
    order_count:
      type: aggregate
      dataset: orders
      aggregation: count_distinct
      input:
        field: orders.order_id
      empty: zero
      label: Orders
    revenue:
      type: aggregate
      dataset: orders
      aggregation: sum
      input:
        field: orders.revenue
      empty: zero
      label: Revenue
      format: currency
    aov:
      type: ratio
      numerator: revenue
      denominator: order_count
      label: Average order value
      format: currency
