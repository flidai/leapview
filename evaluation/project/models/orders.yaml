apiVersion: leapview.dev/v1
kind: Model
metadata:
  id: model:orders
  name: orders
  displayName: Governed Orders
  description: Order-grain synthetic sales data with typed dimensions and revenue.
spec:
  fields:
    - name: order_id
      datatype: String
      label: Order
    - name: purchase_timestamp
      datatype: DateTime
      label: Purchased at
    - name: purchase_date
      datatype: Date
      label: Purchase date
    - name: purchase_month
      datatype: String
      label: Purchase month
    - name: state
      datatype: String
      label: State
    - name: category
      datatype: String
      label: Category
    - name: status
      datatype: String
      label: Status
    - name: revenue
      datatype: Decimal
      label: Revenue
  definition:
    type: sql
    sql: |
      SELECT
        order_id,
        CAST(purchased_at AS TIMESTAMP) AS purchase_timestamp,
        CAST(purchased_at AS DATE) AS purchase_date,
        strftime(CAST(purchased_at AS TIMESTAMP), '%Y-%m') AS purchase_month,
        state,
        category,
        status,
        try_cast(revenue AS DECIMAL(18, 2)) AS revenue
      FROM source."sample.orders"
  entities:
    - name: order
      type: primary
      fields:
      - order_id
  grain:
    entity: order
