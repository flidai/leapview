apiVersion: leapview.dev/v1
kind: Model
metadata:
  id: model:orders
  name: orders
  displayName: Governed Orders
  description: Order-grain synthetic sales data with typed dimensions and revenue.
spec:
  fields:
    order_id:
      datatype: String
      label: Order
    purchase_timestamp:
      datatype: DateTime
      label: Purchased at
    purchase_date:
      datatype: Date
      label: Purchase date
    purchase_month:
      datatype: String
      label: Purchase month
    state:
      datatype: String
      label: State
    category:
      datatype: String
      label: Category
    status:
      datatype: String
      label: Status
    revenue:
      datatype: Decimal
      label: Revenue
  definition:
    type: sql
    sql: |
      SELECT
        order_id,
        CAST(purchased_at AS TIMESTAMP) AS purchase_timestamp,
        CAST(purchased_at AS DATE) AS purchase_date,
        strftime(CAST(purchased_at AS TIMESTAMP), '%Y-%m') AS purchase_month,
        state,
        category,
        status,
        try_cast(revenue AS DECIMAL(18, 2)) AS revenue
      FROM source."sample.orders"
  entities:
    order:
      type: primary
      fields:
      - order_id
  grain:
    entity: order
