# Disposable same-host PostgreSQL HA qualification fixture.
#
# This is deliberately not the application's development PostgreSQL service.
# It runs two PostgreSQL 18 members under Patroni, a three-member etcd quorum,
# and an HAProxy leader endpoint. The runner removes this Compose project and
# all of its named volumes on every exit.
name: ${COMPOSE_PROJECT_NAME:-leapview-postgres-ha}

x-patroni-common: &patroni-common
  build:
    context: .
    dockerfile: Dockerfile
  image: ${COMPOSE_PROJECT_NAME:-leapview-postgres-ha}-patroni:4.1.5
  depends_on:
    etcd1:
      condition: service_healthy
    etcd2:
      condition: service_healthy
    etcd3:
      condition: service_healthy
  environment: &patroni-environment
    PATRONI_SCOPE: leapview-postgres-ha
    PATRONI_NAMESPACE: /service/
    PATRONI_ETCD3_HOSTS: etcd1:2379,etcd2:2379,etcd3:2379
    PATRONI_SUPERUSER_PASSWORD: ${LEAPVIEW_POSTGRES_HA_SUPERUSER_PASSWORD:-leapview-ha-superuser}
    PATRONI_REPLICATION_PASSWORD: ${LEAPVIEW_POSTGRES_HA_REPLICATION_PASSWORD:-leapview-ha-replication}
    PATRONI_REWIND_PASSWORD: ${LEAPVIEW_POSTGRES_HA_REWIND_PASSWORD:-leapview-ha-rewind}
    # PostgreSQL 18's official image uses this major-version-specific path;
    # the volume is mounted at /var/lib/postgresql below.
    PGDATA: /var/lib/postgresql/18/docker
  healthcheck:
    test: [CMD-SHELL, "wget -qO /dev/null http://127.0.0.1:8008/health"]
    interval: 2s
    timeout: 3s
    retries: 45
  restart: "no"

services:
  etcd1:
    image: quay.io/coreos/etcd:v3.5.15@sha256:63ca0fa512664b8351bfa6175e88bea0beeff9857326f973227d47a3181ae602
    command:
      - /usr/local/bin/etcd
      - --name=etcd1
      - --data-dir=/etcd-data
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://etcd1:2379
      - --listen-peer-urls=http://0.0.0.0:2380
      - --initial-advertise-peer-urls=http://etcd1:2380
      - --initial-cluster=etcd1=http://etcd1:2380,etcd2=http://etcd2:2380,etcd3=http://etcd3:2380
      - --initial-cluster-state=new
      - --initial-cluster-token=leapview-postgres-ha
    volumes:
      - etcd1-data:/etcd-data
    healthcheck:
      test: [CMD, etcdctl, --endpoints=http://127.0.0.1:2379, endpoint, health]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: "no"

  etcd2:
    image: quay.io/coreos/etcd:v3.5.15@sha256:63ca0fa512664b8351bfa6175e88bea0beeff9857326f973227d47a3181ae602
    command:
      - /usr/local/bin/etcd
      - --name=etcd2
      - --data-dir=/etcd-data
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://etcd2:2379
      - --listen-peer-urls=http://0.0.0.0:2380
      - --initial-advertise-peer-urls=http://etcd2:2380
      - --initial-cluster=etcd1=http://etcd1:2380,etcd2=http://etcd2:2380,etcd3=http://etcd3:2380
      - --initial-cluster-state=new
      - --initial-cluster-token=leapview-postgres-ha
    volumes:
      - etcd2-data:/etcd-data
    healthcheck:
      test: [CMD, etcdctl, --endpoints=http://127.0.0.1:2379, endpoint, health]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: "no"

  etcd3:
    image: quay.io/coreos/etcd:v3.5.15@sha256:63ca0fa512664b8351bfa6175e88bea0beeff9857326f973227d47a3181ae602
    command:
      - /usr/local/bin/etcd
      - --name=etcd3
      - --data-dir=/etcd-data
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://etcd3:2379
      - --listen-peer-urls=http://0.0.0.0:2380
      - --initial-advertise-peer-urls=http://etcd3:2380
      - --initial-cluster=etcd1=http://etcd1:2380,etcd2=http://etcd2:2380,etcd3=http://etcd3:2380
      - --initial-cluster-state=new
      - --initial-cluster-token=leapview-postgres-ha
    volumes:
      - etcd3-data:/etcd-data
    healthcheck:
      test: [CMD, etcdctl, --endpoints=http://127.0.0.1:2379, endpoint, health]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: "no"

  pg1:
    <<: *patroni-common
    hostname: pg1
    environment:
      <<: *patroni-environment
      PATRONI_NAME: pg1
    volumes:
      - pg1-data:/var/lib/postgresql

  pg2:
    <<: *patroni-common
    hostname: pg2
    environment:
      <<: *patroni-environment
      PATRONI_NAME: pg2
    volumes:
      - pg2-data:/var/lib/postgresql

  haproxy:
    image: docker.io/library/haproxy:3.0.8-alpine@sha256:3ad414bdb5c94d712e0e9a7dc1517eca45cce652afc85a002fd7bb42b44d5dde
    depends_on:
      pg1:
        condition: service_started
      pg2:
        condition: service_started
    volumes:
      - ./haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    restart: "no"

volumes:
  etcd1-data:
  etcd2-data:
  etcd3-data:
  pg1-data:
  pg2-data:
