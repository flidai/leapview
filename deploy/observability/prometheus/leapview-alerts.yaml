groups:
  - name: leapview-health
    rules:
      - alert: LeapViewTargetUnavailable
        expr: max by (job, instance) (up{job="leapview"}) == 0
        for: 2m
        labels:
          service: leapview
          severity: critical
        annotations:
          summary: "LeapView target {{ $labels.instance }} is unavailable"
          description: "Prometheus has been unable to scrape the LeapView target for more than 2 minutes."
          runbook_url: "https://leapview.dev/docs/guides/operate/troubleshooting#target-unavailable-alert-fires"

      - alert: LeapViewSustainedHTTP5xx
        expr: |
          sum by (job, instance) (
            rate(leapview_http_requests_total{job="leapview",status=~"5.."}[5m])
          ) > 0
        for: 10m
        labels:
          service: leapview
          severity: warning
        annotations:
          summary: "LeapView target {{ $labels.instance }} is returning sustained 5xx responses"
          description: "LeapView has continuously observed 5xx responses on {{ $labels.instance }} for more than 10 minutes."
          runbook_url: "https://leapview.dev/docs/guides/operate/troubleshooting#sustained-http-5xx-alert-fires"

      - alert: LeapViewDuckDBFatalHealth
        expr: max by (job, instance) (leapview_duckdb_fatal_health{job="leapview"}) > 0
        for: 1m
        labels:
          service: leapview
          severity: critical
        annotations:
          summary: "LeapView DuckDB runtime on {{ $labels.instance }} is fatally unhealthy"
          description: "The process-owned DuckDB runtime on {{ $labels.instance }} reports a fatal cleanup-safety failure."
          runbook_url: "https://leapview.dev/docs/guides/operate/troubleshooting#duckdb-fatal-health-alert-fires"

      - alert: LeapViewPostgresPoolSaturation
        expr: |
          (
            max by (job, instance, pool) (
              leapview_postgres_pool_acquired_connections{job="leapview"}
            )
            /
            max by (job, instance, pool) (
              leapview_postgres_pool_max_connections{job="leapview"}
            )
          ) >= 0.90
          and on (job, instance, pool)
          max by (job, instance, pool) (
            leapview_postgres_pool_max_connections{job="leapview"}
          ) > 0
        for: 10m
        labels:
          service: leapview
          severity: warning
        annotations:
          summary: "LeapView PostgreSQL pool {{ $labels.pool }} on {{ $labels.instance }} is saturated"
          description: "The {{ $labels.pool }} PostgreSQL pool on {{ $labels.instance }} has remained at or above 90% acquired capacity for more than 10 minutes."
          runbook_url: "https://leapview.dev/docs/guides/operate/troubleshooting#postgresql-pool-saturation-alert-fires"

      - alert: LeapViewPostgresPoolCriticalSaturation
        expr: |
          (
            max by (job, instance, pool) (
              leapview_postgres_pool_acquired_connections{job="leapview"}
            )
            /
            max by (job, instance, pool) (
              leapview_postgres_pool_max_connections{job="leapview"}
            )
          ) >= 0.98
          and on (job, instance, pool)
          max by (job, instance, pool) (
            leapview_postgres_pool_max_connections{job="leapview"}
          ) > 0
        for: 5m
        labels:
          service: leapview
          severity: critical
        annotations:
          summary: "LeapView PostgreSQL pool {{ $labels.pool }} on {{ $labels.instance }} has critical saturation"
          description: "The {{ $labels.pool }} PostgreSQL pool on {{ $labels.instance }} has remained at or above 98% acquired capacity for more than 5 minutes."
          runbook_url: "https://leapview.dev/docs/guides/operate/troubleshooting#postgresql-pool-critical-saturation-alert-fires"

      - alert: LeapViewPostgresPoolNoHeadroom
        expr: |
          (
            (
              max by (job, instance, pool) (
                leapview_postgres_pool_idle_connections{job="leapview"}
              ) == 0
              and on (job, instance, pool)
              (
                max by (job, instance, pool) (
                  leapview_postgres_pool_acquired_connections{job="leapview"}
                )
                /
                max by (job, instance, pool) (
                  leapview_postgres_pool_max_connections{job="leapview"}
                )
              ) >= 0.95
            )
            or
            sum by (job, instance, pool) (
              rate(leapview_postgres_pool_empty_acquire_count_total{job="leapview"}[5m])
            ) > 0
          )
          and on (job, instance, pool)
          max by (job, instance, pool) (
            leapview_postgres_pool_max_connections{job="leapview"}
          ) > 0
        for: 5m
        labels:
          service: leapview
          severity: critical
        annotations:
          summary: "LeapView PostgreSQL pool {{ $labels.pool }} on {{ $labels.instance }} has no headroom"
          description: "The {{ $labels.pool }} PostgreSQL pool on {{ $labels.instance }} has had no idle capacity at high utilization or has waited for an empty pool for more than 5 minutes."
          runbook_url: "https://leapview.dev/docs/guides/operate/troubleshooting#postgresql-pool-no-headroom-alert-fires"

      - alert: LeapViewPostgresPoolCanceledAcquire
        expr: |
          sum by (job, instance, pool) (
            rate(leapview_postgres_pool_canceled_acquire_count_total{job="leapview"}[5m])
          ) > 0
        for: 10m
        labels:
          service: leapview
          severity: warning
        annotations:
          summary: "LeapView PostgreSQL pool {{ $labels.pool }} on {{ $labels.instance }} has canceled acquires"
          description: "The {{ $labels.pool }} PostgreSQL pool on {{ $labels.instance }} has recorded canceled connection acquisitions for more than 10 minutes."
          runbook_url: "https://leapview.dev/docs/guides/operate/troubleshooting#postgresql-pool-canceled-acquire-alert-fires"

      - alert: LeapViewPostgresPoolAcquireLatency
        expr: |
          (
            sum by (job, instance, pool) (
              rate(leapview_postgres_pool_acquire_duration_seconds_total{job="leapview"}[10m])
            )
            /
            sum by (job, instance, pool) (
              rate(leapview_postgres_pool_acquire_count_total{job="leapview"}[10m])
            )
          ) > 2
          and on (job, instance, pool)
          sum by (job, instance, pool) (
            rate(leapview_postgres_pool_acquire_count_total{job="leapview"}[10m])
          ) > 0
        for: 10m
        labels:
          service: leapview
          severity: warning
        annotations:
          summary: "LeapView PostgreSQL pool {{ $labels.pool }} on {{ $labels.instance }} has high acquire latency"
          description: "The ten-minute average connection-acquire wait for the {{ $labels.pool }} PostgreSQL pool on {{ $labels.instance }} has remained above 2 seconds for more than 10 minutes."
          runbook_url: "https://leapview.dev/docs/guides/operate/troubleshooting#postgresql-pool-acquire-latency-alert-fires"

      - alert: LeapViewPostgresPoolConnectionChurn
        expr: max by (job, instance, pool) (leapview_postgres_pool_constructing_connections{job="leapview"}) > 0
        for: 10m
        labels:
          service: leapview
          severity: warning
        annotations:
          summary: "LeapView PostgreSQL pool {{ $labels.pool }} on {{ $labels.instance }} is constructing connections"
          description: "The {{ $labels.pool }} PostgreSQL pool on {{ $labels.instance }} has continuously had connections under construction for more than 10 minutes."
          runbook_url: "https://leapview.dev/docs/guides/operate/troubleshooting#postgresql-pool-connection-churn-alert-fires"

      - alert: LeapViewDashboardRefreshFastBurn
        expr: |
          (leapview:dashboard_refresh_reliability:burn_rate_5m >= 14.4)
          and on (job, instance)
          (leapview:dashboard_refresh_reliability:burn_rate_1h >= 14.4)
          and on (job, instance)
          (leapview:dashboard_refresh_reliability:eligible_events_1h >= 10)
        labels:
          service: leapview
          severity: critical
        annotations:
          summary: "LeapView dashboard refresh reliability on {{ $labels.instance }} is burning error budget rapidly"
          description: "Dashboard refresh failures on {{ $labels.instance }} meet or exceed the 14.4x burn-rate threshold over both 5 minutes and 1 hour, with at least 10 eligible refreshes in the 1-hour window."
          runbook_url: "https://leapview.dev/docs/guides/operate/troubleshooting#dashboard-refresh-fast-burn-alert-fires"

      - alert: LeapViewDashboardRefreshSlowBurn
        expr: |
          (leapview:dashboard_refresh_reliability:burn_rate_30m >= 6)
          and on (job, instance)
          (leapview:dashboard_refresh_reliability:burn_rate_6h >= 6)
          and on (job, instance)
          (leapview:dashboard_refresh_reliability:eligible_events_6h >= 60)
        labels:
          service: leapview
          severity: warning
        annotations:
          summary: "LeapView dashboard refresh reliability on {{ $labels.instance }} is steadily consuming error budget"
          description: "Dashboard refresh failures on {{ $labels.instance }} meet or exceed the 6x burn-rate threshold over both 30 minutes and 6 hours, with at least 60 eligible refreshes in the 6-hour window."
          runbook_url: "https://leapview.dev/docs/guides/operate/troubleshooting#dashboard-refresh-slow-burn-alert-fires"

      - alert: LeapViewDashboardRefreshLatencyFastBurn
        expr: |
          (leapview:dashboard_refresh_latency:burn_rate_5m >= 14.4)
          and on (job, instance)
          (leapview:dashboard_refresh_latency:burn_rate_1h >= 14.4)
          and on (job, instance)
          (leapview:dashboard_refresh_latency:completed_events_1h >= 10)
        labels:
          service: leapview
          severity: critical
        annotations:
          summary: "LeapView dashboard refresh latency on {{ $labels.instance }} is burning error budget rapidly"
          description: "Slow completed dashboard refreshes on {{ $labels.instance }} meet or exceed the 14.4x burn-rate threshold over both 5 minutes and 1 hour, with at least 10 completed refreshes in the 1-hour window."
          runbook_url: "https://leapview.dev/docs/guides/operate/troubleshooting#dashboard-refresh-latency-fast-burn-alert-fires"

      - alert: LeapViewDashboardRefreshLatencySlowBurn
        expr: |
          (leapview:dashboard_refresh_latency:burn_rate_30m >= 6)
          and on (job, instance)
          (leapview:dashboard_refresh_latency:burn_rate_6h >= 6)
          and on (job, instance)
          (leapview:dashboard_refresh_latency:completed_events_6h >= 60)
        labels:
          service: leapview
          severity: warning
        annotations:
          summary: "LeapView dashboard refresh latency on {{ $labels.instance }} is steadily consuming error budget"
          description: "Slow completed dashboard refreshes on {{ $labels.instance }} meet or exceed the 6x burn-rate threshold over both 30 minutes and 6 hours, with at least 60 completed refreshes in the 6-hour window."
          runbook_url: "https://leapview.dev/docs/guides/operate/troubleshooting#dashboard-refresh-latency-slow-burn-alert-fires"
