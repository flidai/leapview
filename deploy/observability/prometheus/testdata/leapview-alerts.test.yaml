rule_files:
  - ../leapview-recording-rules.yaml
  - ../leapview-alerts.yaml

evaluation_interval: 1m

tests:
  - name: healthy target does not alert
    interval: 1m
    input_series:
      - series: 'up{job="leapview",instance="app:8080",pod="leapview-healthy"}'
        values: '1x20'
      - series: 'leapview_http_requests_total{job="leapview",instance="app:8080",method="GET",route="/healthz",status="200"}'
        values: '0+5x20'
      - series: 'leapview_duckdb_fatal_health{job="leapview",instance="app:8080",pod="leapview-healthy"}'
        values: '0x20'
      - series: 'leapview_recovery_qualification_scrape_error{job="leapview",instance="app:8080"}'
        values: '0x20'
      - series: 'leapview_recovery_qualification_overdue{job="leapview",instance="app:8080"}'
        values: '0x20'
      - series: 'leapview_recovery_qualification_evidence{job="leapview",instance="app:8080",state="failed"}'
        values: '0x20'
    alert_rule_test:
      - eval_time: 15m
        alertname: LeapViewTargetUnavailable
        exp_alerts: []
      - eval_time: 15m
        alertname: LeapViewSustainedHTTP5xx
        exp_alerts: []
      - eval_time: 15m
        alertname: LeapViewDuckDBFatalHealth
        exp_alerts: []
      - eval_time: 15m
        alertname: LeapViewRecoveryQualificationLedgerScrapeFailure
        exp_alerts: []
      - eval_time: 15m
        alertname: LeapViewRecoveryQualificationOverdue
        exp_alerts: []
      - eval_time: 15m
        alertname: LeapViewRecoveryQualificationEvidencePublicationFailure
        exp_alerts: []
      - eval_time: 15m
        alertname: LeapViewDashboardRefreshFastBurn
        exp_alerts: []
      - eval_time: 15m
        alertname: LeapViewDashboardRefreshSlowBurn
        exp_alerts: []

  - name: unavailable target fires after two minutes
    interval: 1m
    input_series:
      - series: 'up{job="leapview",instance="app:8080",pod="leapview-unavailable",route="/forbidden",request_id="req-forbidden",trace_id="trace-forbidden",user_id="user-forbidden",project_id="project-forbidden",resource_id="resource-forbidden"}'
        values: '0x4 1x3'
    alert_rule_test:
      - eval_time: 3m
        alertname: LeapViewTargetUnavailable
        exp_alerts:
          - exp_labels:
              instance: app:8080
              job: leapview
              service: leapview
              severity: critical
            exp_annotations:
              summary: "LeapView target app:8080 is unavailable"
              description: "Prometheus has been unable to scrape the LeapView target for more than 2 minutes."
              runbook_url: "https://leapview.dev/docs/guides/operate/troubleshooting#target-unavailable-alert-fires"
      - eval_time: 5m
        alertname: LeapViewTargetUnavailable
        exp_alerts: []

  - name: transient 5xx activity does not fire
    interval: 1m
    input_series:
      - series: 'leapview_http_requests_total{job="leapview",instance="app:8080",method="POST",route="/api/v1/projects/{project}",status="500",request_id="req-forbidden",trace_id="trace-forbidden",user_id="user-forbidden",project_id="project-forbidden",resource_id="resource-forbidden"}'
        values: '0x4 1 1x15'
    alert_rule_test:
      - eval_time: 8m
        alertname: LeapViewSustainedHTTP5xx
        exp_alerts: []

  - name: sustained 5xx activity aggregates request dimensions
    interval: 1m
    input_series:
      - series: 'leapview_http_requests_total{job="leapview",instance="app:8080",method="POST",route="/api/v1/projects/{project}",status="500",request_id="req-forbidden",trace_id="trace-forbidden",user_id="user-forbidden",project_id="project-forbidden",resource_id="resource-forbidden"}'
        values: '0+1x15 15x10'
      - series: 'leapview_http_requests_total{job="leapview",instance="app:8080",method="GET",route="/updates",status="503"}'
        values: '0+1x15 15x10'
    alert_rule_test:
      - eval_time: 15m
        alertname: LeapViewSustainedHTTP5xx
        exp_alerts:
          - exp_labels:
              instance: app:8080
              job: leapview
              service: leapview
              severity: warning
            exp_annotations:
              summary: "LeapView target app:8080 is returning sustained 5xx responses"
              description: "LeapView has continuously observed 5xx responses on app:8080 for more than 10 minutes."
              runbook_url: "https://leapview.dev/docs/guides/operate/troubleshooting#sustained-http-5xx-alert-fires"
      - eval_time: 21m
        alertname: LeapViewSustainedHTTP5xx
        exp_alerts: []

  - name: fatal DuckDB runtime health fires
    interval: 1m
    input_series:
      - series: 'leapview_duckdb_fatal_health{job="leapview",instance="app:8080",pod="leapview-fatal",resource_id="resource-forbidden",trace_id="trace-forbidden"}'
        values: '1x3 0x3'
    alert_rule_test:
      - eval_time: 2m
        alertname: LeapViewDuckDBFatalHealth
        exp_alerts:
          - exp_labels:
              instance: app:8080
              job: leapview
              service: leapview
              severity: critical
            exp_annotations:
              summary: "LeapView DuckDB runtime on app:8080 is fatally unhealthy"
              description: "The process-owned DuckDB runtime on app:8080 reports a fatal cleanup-safety failure."
              runbook_url: "https://leapview.dev/docs/guides/operate/troubleshooting#duckdb-fatal-health-alert-fires"
      - eval_time: 5m
        alertname: LeapViewDuckDBFatalHealth
        exp_alerts: []

  - name: recovery ledger scrape failure fires and recovers
    interval: 1m
    input_series:
      - series: 'leapview_recovery_qualification_scrape_error{job="leapview",instance="app:8080",operation="restore",state="failed",occurrence="occurrence-forbidden",schedule="schedule-forbidden",artifact="artifact-forbidden",target="target-forbidden",request_id="req-forbidden",trace_id="trace-forbidden",user_id="user-forbidden",project_id="project-forbidden",resource_id="resource-forbidden"}'
        values: '1x7 0x4'
    alert_rule_test:
      - eval_time: 6m
        alertname: LeapViewRecoveryQualificationLedgerScrapeFailure
        exp_alerts:
          - exp_labels:
              instance: app:8080
              job: leapview
              service: leapview
              severity: warning
            exp_annotations:
              summary: "LeapView recovery qualification ledger on app:8080 is unavailable"
              description: "LeapView has been unable to collect recovery qualification ledger status on app:8080 for more than 5 minutes."
              runbook_url: "https://leapview.dev/docs/guides/operate/troubleshooting#recovery-qualification-freshness-alerts-fire"
      - eval_time: 9m
        alertname: LeapViewRecoveryQualificationLedgerScrapeFailure
        exp_alerts: []

  - name: policy overdue qualification fires and recovers
    interval: 1m
    input_series:
      - series: 'leapview_recovery_qualification_overdue{job="leapview",instance="app:8080",operation="backup",state="overdue",occurrence="occurrence-forbidden",schedule="schedule-forbidden",artifact="artifact-forbidden",target="target-forbidden",request_id="req-forbidden",trace_id="trace-forbidden",user_id="user-forbidden",project_id="project-forbidden",resource_id="resource-forbidden"}'
        values: '1x12 0x4'
    alert_rule_test:
      - eval_time: 11m
        alertname: LeapViewRecoveryQualificationOverdue
        exp_alerts:
          - exp_labels:
              instance: app:8080
              job: leapview
              service: leapview
              severity: critical
            exp_annotations:
              summary: "LeapView recovery qualification on app:8080 is overdue"
              description: "At least one recovery qualification on app:8080 has remained past its policy-defined stale deadline for more than 10 minutes."
              runbook_url: "https://leapview.dev/docs/guides/operate/troubleshooting#recovery-qualification-freshness-alerts-fire"
      - eval_time: 14m
        alertname: LeapViewRecoveryQualificationOverdue
        exp_alerts: []

  - name: delayed reconciliation remains healthy before the policy deadline
    interval: 1m
    input_series:
      - series: 'leapview_recovery_qualification_missing{job="leapview",instance="app:8080",schedule="schedule-forbidden"}'
        values: '1x20'
      - series: 'leapview_recovery_qualification_due{job="leapview",instance="app:8080",occurrence="occurrence-forbidden"}'
        values: '1x20'
      - series: 'leapview_recovery_qualification_overdue{job="leapview",instance="app:8080"}'
        values: '0x20'
      - series: 'leapview_recovery_qualification_scrape_error{job="leapview",instance="app:8080"}'
        values: '0x20'
      - series: 'leapview_recovery_qualification_evidence{job="leapview",instance="app:8080",state="failed"}'
        values: '0x20'
    alert_rule_test:
      - eval_time: 15m
        alertname: LeapViewRecoveryQualificationLedgerScrapeFailure
        exp_alerts: []
      - eval_time: 15m
        alertname: LeapViewRecoveryQualificationOverdue
        exp_alerts: []
      - eval_time: 15m
        alertname: LeapViewRecoveryQualificationEvidencePublicationFailure
        exp_alerts: []

  - name: evidence publication failure fires and recovers
    interval: 1m
    input_series:
      - series: 'leapview_recovery_qualification_evidence{job="leapview",instance="app:8080",state="failed",operation="restore",occurrence="occurrence-forbidden",schedule="schedule-forbidden",artifact="artifact-forbidden",target="target-forbidden",request_id="req-forbidden",trace_id="trace-forbidden",user_id="user-forbidden",project_id="project-forbidden",resource_id="resource-forbidden"}'
        values: '1x17 0x4'
    alert_rule_test:
      - eval_time: 16m
        alertname: LeapViewRecoveryQualificationEvidencePublicationFailure
        exp_alerts:
          - exp_labels:
              instance: app:8080
              job: leapview
              service: leapview
              severity: warning
            exp_annotations:
              summary: "LeapView recovery evidence publication on app:8080 is failing"
              description: "At least one recovery qualification on app:8080 has remained in failed evidence publication state for more than 15 minutes."
              runbook_url: "https://leapview.dev/docs/guides/operate/troubleshooting#recovery-qualification-freshness-alerts-fire"
      - eval_time: 19m
        alertname: LeapViewRecoveryQualificationEvidencePublicationFailure
        exp_alerts: []

  - name: dashboard refresh single-window spike does not fire
    interval: 1m
    input_series:
      - series: 'leapview_dashboard_refresh_duration_seconds_count{job="leapview",instance="app:8080",command="initial",outcome="complete"}'
        values: '0+10x60'
      - series: 'leapview_dashboard_refresh_duration_seconds_count{job="leapview",instance="app:8080",command="initial",outcome="error"}'
        values: '0x56 0+3x4'
    promql_expr_test:
      - expr: 'leapview:dashboard_refresh_reliability:burn_rate_5m >= bool 14.4'
        eval_time: 1h
        exp_samples:
          - labels: '{instance="app:8080",job="leapview"}'
            value: 1
      - expr: 'leapview:dashboard_refresh_reliability:burn_rate_1h < bool 14.4'
        eval_time: 1h
        exp_samples:
          - labels: '{instance="app:8080",job="leapview"}'
            value: 1
    alert_rule_test:
      - eval_time: 1h
        alertname: LeapViewDashboardRefreshFastBurn
        exp_alerts: []

  - name: sustained dashboard refresh fast burn fires with bounded labels
    interval: 1m
    input_series:
      - series: 'leapview_dashboard_refresh_duration_seconds_count{job="leapview",instance="app:8080",command="initial",outcome="complete",route="/dashboards/{dashboard}",request_id="req-forbidden",trace_id="trace-forbidden",user_id="user-forbidden",project_id="project-forbidden",resource_id="resource-forbidden"}'
        values: '0+4x60'
      - series: 'leapview_dashboard_refresh_duration_seconds_count{job="leapview",instance="app:8080",command="filter_change",outcome="partial",route="/updates",request_id="req-other",trace_id="trace-other",user_id="user-other",project_id="project-other",resource_id="resource-other"}'
        values: '0+1x60'
    alert_rule_test:
      - eval_time: 1h
        alertname: LeapViewDashboardRefreshFastBurn
        exp_alerts:
          - exp_labels:
              instance: app:8080
              job: leapview
              service: leapview
              severity: critical
            exp_annotations:
              summary: "LeapView dashboard refresh reliability on app:8080 is burning error budget rapidly"
              description: "Dashboard refresh failures on app:8080 meet or exceed the 14.4x burn-rate threshold over both 5 minutes and 1 hour, with at least 10 eligible refreshes in the 1-hour window."
              runbook_url: "https://leapview.dev/docs/guides/operate/troubleshooting#dashboard-refresh-fast-burn-alert-fires"

  - name: dashboard refresh fast burn fires at the exact threshold
    interval: 1m
    input_series:
      - series: 'leapview_dashboard_refresh_duration_seconds_count{job="leapview",instance="app:8080",command="initial",outcome="complete"}'
        values: '0+214x60'
      - series: 'leapview_dashboard_refresh_duration_seconds_count{job="leapview",instance="app:8080",command="initial",outcome="error"}'
        values: '0+36x60'
    alert_rule_test:
      - eval_time: 1h
        alertname: LeapViewDashboardRefreshFastBurn
        exp_alerts:
          - exp_labels:
              instance: app:8080
              job: leapview
              service: leapview
              severity: critical
            exp_annotations:
              summary: "LeapView dashboard refresh reliability on app:8080 is burning error budget rapidly"
              description: "Dashboard refresh failures on app:8080 meet or exceed the 14.4x burn-rate threshold over both 5 minutes and 1 hour, with at least 10 eligible refreshes in the 1-hour window."
              runbook_url: "https://leapview.dev/docs/guides/operate/troubleshooting#dashboard-refresh-fast-burn-alert-fires"

  - name: dashboard refresh fast burn respects sparse traffic floor
    interval: 1m
    input_series:
      - series: 'leapview_dashboard_refresh_duration_seconds_count{job="leapview",instance="app:8080",command="initial",outcome="complete"}'
        values: '0x55 0 3 3 3 3 6'
      - series: 'leapview_dashboard_refresh_duration_seconds_count{job="leapview",instance="app:8080",command="initial",outcome="error"}'
        values: '0x55 0 1 1 1 1 2'
    alert_rule_test:
      - eval_time: 1h
        alertname: LeapViewDashboardRefreshFastBurn
        exp_alerts: []

  - name: dashboard refresh fast burn fires at sparse traffic floor
    interval: 1m
    input_series:
      - series: 'leapview_dashboard_refresh_duration_seconds_count{job="leapview",instance="app:8080",command="initial",outcome="complete"}'
        values: '0x55 0 4 4 4 4 8 8 8 8'
      - series: 'leapview_dashboard_refresh_duration_seconds_count{job="leapview",instance="app:8080",command="initial",outcome="error"}'
        values: '0x55 0 1 1 1 1 2 2 2 2'
    alert_rule_test:
      - eval_time: 1h3m
        alertname: LeapViewDashboardRefreshFastBurn
        exp_alerts:
          - exp_labels:
              instance: app:8080
              job: leapview
              service: leapview
              severity: critical
            exp_annotations:
              summary: "LeapView dashboard refresh reliability on app:8080 is burning error budget rapidly"
              description: "Dashboard refresh failures on app:8080 meet or exceed the 14.4x burn-rate threshold over both 5 minutes and 1 hour, with at least 10 eligible refreshes in the 1-hour window."
              runbook_url: "https://leapview.dev/docs/guides/operate/troubleshooting#dashboard-refresh-fast-burn-alert-fires"

  - name: dashboard refresh fast burn recovers with the short window
    interval: 1m
    input_series:
      - series: 'leapview_dashboard_refresh_duration_seconds_count{job="leapview",instance="app:8080",command="initial",outcome="complete"}'
        values: '0+4x10 40+1x10'
      - series: 'leapview_dashboard_refresh_duration_seconds_count{job="leapview",instance="app:8080",command="initial",outcome="error"}'
        values: '0+1x10 10x10'
    promql_expr_test:
      - expr: 'leapview:dashboard_refresh_reliability:burn_rate_5m < bool 14.4'
        eval_time: 20m
        exp_samples:
          - labels: '{instance="app:8080",job="leapview"}'
            value: 1
      - expr: 'leapview:dashboard_refresh_reliability:burn_rate_1h >= bool 14.4'
        eval_time: 20m
        exp_samples:
          - labels: '{instance="app:8080",job="leapview"}'
            value: 1
    alert_rule_test:
      - eval_time: 10m
        alertname: LeapViewDashboardRefreshFastBurn
        exp_alerts:
          - exp_labels:
              instance: app:8080
              job: leapview
              service: leapview
              severity: critical
            exp_annotations:
              summary: "LeapView dashboard refresh reliability on app:8080 is burning error budget rapidly"
              description: "Dashboard refresh failures on app:8080 meet or exceed the 14.4x burn-rate threshold over both 5 minutes and 1 hour, with at least 10 eligible refreshes in the 1-hour window."
              runbook_url: "https://leapview.dev/docs/guides/operate/troubleshooting#dashboard-refresh-fast-burn-alert-fires"
      - eval_time: 20m
        alertname: LeapViewDashboardRefreshFastBurn
        exp_alerts: []

  - name: dashboard refresh slow burn ignores a short-window-only spike
    interval: 1m
    input_series:
      - series: 'leapview_dashboard_refresh_duration_seconds_count{job="leapview",instance="app:8080",command="initial",outcome="complete"}'
        values: '0+10x360'
      - series: 'leapview_dashboard_refresh_duration_seconds_count{job="leapview",instance="app:8080",command="initial",outcome="error"}'
        values: '0x331 0+1x29'
    promql_expr_test:
      - expr: 'leapview:dashboard_refresh_reliability:burn_rate_30m >= bool 6'
        eval_time: 6h
        exp_samples:
          - labels: '{instance="app:8080",job="leapview"}'
            value: 1
      - expr: 'leapview:dashboard_refresh_reliability:burn_rate_6h < bool 6'
        eval_time: 6h
        exp_samples:
          - labels: '{instance="app:8080",job="leapview"}'
            value: 1
    alert_rule_test:
      - eval_time: 6h
        alertname: LeapViewDashboardRefreshSlowBurn
        exp_alerts: []

  - name: sustained dashboard refresh slow burn fires with bounded labels
    interval: 1m
    input_series:
      - series: 'leapview_dashboard_refresh_duration_seconds_count{job="leapview",instance="app:8080",command="initial",outcome="complete",route="/dashboards/{dashboard}",request_id="req-forbidden",trace_id="trace-forbidden",user_id="user-forbidden",project_id="project-forbidden",resource_id="resource-forbidden"}'
        values: '0+9x360'
      - series: 'leapview_dashboard_refresh_duration_seconds_count{job="leapview",instance="app:8080",command="filter_change",outcome="partial",route="/updates",request_id="req-other",trace_id="trace-other",user_id="user-other",project_id="project-other",resource_id="resource-other"}'
        values: '0+1x360'
    alert_rule_test:
      - eval_time: 6h
        alertname: LeapViewDashboardRefreshSlowBurn
        exp_alerts:
          - exp_labels:
              instance: app:8080
              job: leapview
              service: leapview
              severity: warning
            exp_annotations:
              summary: "LeapView dashboard refresh reliability on app:8080 is steadily consuming error budget"
              description: "Dashboard refresh failures on app:8080 meet or exceed the 6x burn-rate threshold over both 30 minutes and 6 hours, with at least 60 eligible refreshes in the 6-hour window."
              runbook_url: "https://leapview.dev/docs/guides/operate/troubleshooting#dashboard-refresh-slow-burn-alert-fires"

  - name: dashboard refresh slow burn fires at the exact threshold
    interval: 1m
    input_series:
      - series: 'leapview_dashboard_refresh_duration_seconds_count{job="leapview",instance="app:8080",command="initial",outcome="complete"}'
        values: '0x350 0 94x10'
      - series: 'leapview_dashboard_refresh_duration_seconds_count{job="leapview",instance="app:8080",command="initial",outcome="error"}'
        values: '0x350 0 6x10'
    promql_expr_test:
      - expr: 'leapview:dashboard_refresh_reliability:burn_rate_30m'
        eval_time: 6h
        exp_samples:
          - labels: '{__name__="leapview:dashboard_refresh_reliability:burn_rate_30m",instance="app:8080",job="leapview"}'
            value: 6
      - expr: 'leapview:dashboard_refresh_reliability:burn_rate_6h'
        eval_time: 6h
        exp_samples:
          - labels: '{__name__="leapview:dashboard_refresh_reliability:burn_rate_6h",instance="app:8080",job="leapview"}'
            value: 6
    alert_rule_test:
      - eval_time: 6h
        alertname: LeapViewDashboardRefreshSlowBurn
        exp_alerts:
          - exp_labels:
              instance: app:8080
              job: leapview
              service: leapview
              severity: warning
            exp_annotations:
              summary: "LeapView dashboard refresh reliability on app:8080 is steadily consuming error budget"
              description: "Dashboard refresh failures on app:8080 meet or exceed the 6x burn-rate threshold over both 30 minutes and 6 hours, with at least 60 eligible refreshes in the 6-hour window."
              runbook_url: "https://leapview.dev/docs/guides/operate/troubleshooting#dashboard-refresh-slow-burn-alert-fires"

  - name: dashboard refresh slow burn respects sparse traffic floor
    interval: 1m
    input_series:
      - series: 'leapview_dashboard_refresh_duration_seconds_count{job="leapview",instance="app:8080",command="initial",outcome="complete"}'
        values: '0x350 0 53x10'
      - series: 'leapview_dashboard_refresh_duration_seconds_count{job="leapview",instance="app:8080",command="initial",outcome="error"}'
        values: '0x350 0 6x10'
    promql_expr_test:
      - expr: 'leapview:dashboard_refresh_reliability:eligible_events_6h'
        eval_time: 6h
        exp_samples:
          - labels: '{__name__="leapview:dashboard_refresh_reliability:eligible_events_6h",instance="app:8080",job="leapview"}'
            value: 59
    alert_rule_test:
      - eval_time: 6h
        alertname: LeapViewDashboardRefreshSlowBurn
        exp_alerts: []

  - name: dashboard refresh slow burn fires at sparse traffic floor
    interval: 1m
    input_series:
      - series: 'leapview_dashboard_refresh_duration_seconds_count{job="leapview",instance="app:8080",command="initial",outcome="complete"}'
        values: '0x350 0 54x10'
      - series: 'leapview_dashboard_refresh_duration_seconds_count{job="leapview",instance="app:8080",command="initial",outcome="error"}'
        values: '0x350 0 6x10'
    promql_expr_test:
      - expr: 'leapview:dashboard_refresh_reliability:eligible_events_6h'
        eval_time: 6h
        exp_samples:
          - labels: '{__name__="leapview:dashboard_refresh_reliability:eligible_events_6h",instance="app:8080",job="leapview"}'
            value: 60
    alert_rule_test:
      - eval_time: 6h
        alertname: LeapViewDashboardRefreshSlowBurn
        exp_alerts:
          - exp_labels:
              instance: app:8080
              job: leapview
              service: leapview
              severity: warning
            exp_annotations:
              summary: "LeapView dashboard refresh reliability on app:8080 is steadily consuming error budget"
              description: "Dashboard refresh failures on app:8080 meet or exceed the 6x burn-rate threshold over both 30 minutes and 6 hours, with at least 60 eligible refreshes in the 6-hour window."
              runbook_url: "https://leapview.dev/docs/guides/operate/troubleshooting#dashboard-refresh-slow-burn-alert-fires"

  - name: dashboard refresh slow burn recovers with the short window
    interval: 1m
    input_series:
      - series: 'leapview_dashboard_refresh_duration_seconds_count{job="leapview",instance="app:8080",command="initial",outcome="complete"}'
        values: '0+9x360 3240+10x30'
      - series: 'leapview_dashboard_refresh_duration_seconds_count{job="leapview",instance="app:8080",command="initial",outcome="error"}'
        values: '0+1x360 360x30'
    promql_expr_test:
      - expr: 'leapview:dashboard_refresh_reliability:burn_rate_30m < bool 6'
        eval_time: 6h30m
        exp_samples:
          - labels: '{instance="app:8080",job="leapview"}'
            value: 1
      - expr: 'leapview:dashboard_refresh_reliability:burn_rate_6h >= bool 6'
        eval_time: 6h30m
        exp_samples:
          - labels: '{instance="app:8080",job="leapview"}'
            value: 1
    alert_rule_test:
      - eval_time: 6h
        alertname: LeapViewDashboardRefreshSlowBurn
        exp_alerts:
          - exp_labels:
              instance: app:8080
              job: leapview
              service: leapview
              severity: warning
            exp_annotations:
              summary: "LeapView dashboard refresh reliability on app:8080 is steadily consuming error budget"
              description: "Dashboard refresh failures on app:8080 meet or exceed the 6x burn-rate threshold over both 30 minutes and 6 hours, with at least 60 eligible refreshes in the 6-hour window."
              runbook_url: "https://leapview.dev/docs/guides/operate/troubleshooting#dashboard-refresh-slow-burn-alert-fires"
      - eval_time: 6h30m
