# Maintained reference workflow. Copy it into .github/workflows in the project
# repository after providing `leapview` on the runner.
name: LeapView enterprise authoring

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]
  push:
    branches: [main]
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

env:
  LEAPVIEW_PROJECT_FILE: dashboards/leapview.yaml
  LEAPVIEW_TARGET: ${{ vars.LEAPVIEW_TARGET }}
  LEAPVIEW_WORKLOAD_PROJECT: ${{ vars.LEAPVIEW_PROJECT_ID }}

jobs:
  validate:
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Verify CLI is available
        run: leapview version
      - name: Validate without target credentials
        run: leapview validate --project "$LEAPVIEW_PROJECT_FILE" --json

  candidate:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    needs: validate
    runs-on: ubuntu-latest
    environment: leapview-authoring
    env:
      LEAPVIEW_WORKLOAD_CLIENT_ID: ${{ secrets.LEAPVIEW_WORKLOAD_CLIENT_ID }}
      LEAPVIEW_WORKLOAD_CLIENT_SECRET: ${{ secrets.LEAPVIEW_WORKLOAD_CLIENT_SECRET }}
      CHANGE_KEY: github:pull/${{ github.event.pull_request.number }}
      SOURCE_REPOSITORY: ${{ github.server_url }}/${{ github.repository }}
      SOURCE_REF: refs/pull/${{ github.event.pull_request.number }}/merge
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Create exact source-attested plan for review
        run: |
          leapview plan "$LEAPVIEW_PROJECT_FILE" --format json

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    environment: leapview-production
    concurrency:
      group: leapview-production
      cancel-in-progress: false
    env:
      LEAPVIEW_WORKLOAD_CLIENT_ID: ${{ secrets.LEAPVIEW_WORKLOAD_CLIENT_ID }}
      LEAPVIEW_WORKLOAD_CLIENT_SECRET: ${{ secrets.LEAPVIEW_WORKLOAD_CLIENT_SECRET }}
      CHANGE_KEY: github:branch/main
      SOURCE_REPOSITORY: ${{ github.server_url }}/${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Create and build exact protected-branch plan
        run: |
          plan_json=$(leapview plan "$LEAPVIEW_PROJECT_FILE" --format json)
          plan_id=$(printf '%s' "$plan_json" | jq -r .planId)
          build_json=$(leapview build "$plan_id" --format json)
          status=$(printf '%s' "$build_json" | jq -r .status)
          candidate_id=$(printf '%s' "$build_json" | jq -r '.candidateId // empty')
          [ "$status" = sealed ] || { echo "delivery build did not seal: $status" >&2; exit 1; }
          [ -n "$candidate_id" ] || { echo "delivery build returned no sealed candidate" >&2; exit 1; }
          printf 'LEAPVIEW_CANDIDATE_ID=%s\n' "$candidate_id" >> "$GITHUB_ENV"
      - name: Request policy-governed publication
        run: |
          leapview publish "$LEAPVIEW_CANDIDATE_ID"


  # Closed candidates are retained only for their target-defined lifetime and
  # expire automatically; the canonical Delivery API has no cancellation
  # operation to call from a workflow.
