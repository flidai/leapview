name: Set up LeapView CI
description: Uses locked Nix tools on x86_64 Linux and restores bounded validation caches.

inputs:
  profile:
    description: validation retains the complete development toolchain; orchestration provides only locked Go and scripting tools on x86_64 Linux.
    required: false
    default: "validation"
  toolchain:
    description: auto uses the locked Nix development shell on x86_64 Linux; conventional retains the existing release compiler and other platforms.
    required: false
    default: "auto"
  go-cache-restore-workload:
    description: Existing default-branch workload to restore on candidate refs; publication always uses this job's own identity.
    required: false
    default: ""
  browser:
    description: Verify locked Chromium on Nix, or install Chromium and host dependencies on conventional platforms.
    required: false
    default: "false"
  terraform:
    description: Install Terraform and restore its provider cache.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Validate toolchain selection
      shell: bash
      env:
        TOOLCHAIN: ${{ inputs.toolchain }}
        CI_PROFILE: ${{ inputs.profile }}
        CI_BROWSER: ${{ inputs.browser }}
        CI_TERRAFORM: ${{ inputs.terraform }}
        CI_PLATFORM: ${{ runner.os }}-${{ runner.arch }}
      run: |
        case "$TOOLCHAIN" in
          auto|conventional) ;;
          *) echo "unknown CI toolchain: $TOOLCHAIN" >&2; exit 1 ;;
        esac
        case "$CI_PROFILE" in
          validation) ;;
          orchestration)
            test "$TOOLCHAIN" = auto
            test "$CI_PLATFORM" = Linux-X64
            test "$CI_BROWSER" = false
            test "$CI_TERRAFORM" = false
            ;;
          *) echo "unknown CI profile: $CI_PROFILE" >&2; exit 1 ;;
        esac

    - name: Configure hosted Docker pulls
      if: inputs.profile == 'validation' && runner.os == 'Linux' && runner.environment == 'github-hosted'
      uses: ./.github/actions/setup-docker

    - name: Install locked Nix
      if: inputs.toolchain == 'auto' && runner.os == 'Linux' && runner.arch == 'X64'
      uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
      with:
        install_url: https://releases.nixos.org/nix/nix-2.31.2/install
        extra_nix_config: |
          experimental-features = nix-command flakes
          sandbox = true

    - name: Restore exact orchestration toolchain archive
      if: inputs.profile == 'orchestration'
      id: orchestration-cache
      continue-on-error: true
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/orchestration-cache
        key: nix-orchestration-v1-Linux-X64-2.31.2-${{ hashFiles('flake.nix', 'flake.lock', 'nix/**/*.nix', 'go.mod', 'package.json', 'scripts/export_nix_ci_environment.py', 'scripts/measure_orchestration_cache.py', '.github/workflows/orchestration-cache.yml', '.github/actions/setup-ci/action.yml', '.github/workflows/ci.yml') }}

    - name: Import orchestration archive and realize the complete locked environment
      if: inputs.profile == 'orchestration'
      shell: bash
      env:
        CACHE_INPUT_ID: ${{ hashFiles('flake.nix', 'flake.lock', 'nix/**/*.nix', 'go.mod', 'package.json', 'scripts/export_nix_ci_environment.py', 'scripts/measure_orchestration_cache.py', '.github/workflows/orchestration-cache.yml', '.github/actions/setup-ci/action.yml', '.github/workflows/ci.yml') }}
        CACHE_HIT: ${{ steps.orchestration-cache.outputs.cache-hit }}
      run: python3 scripts/measure_orchestration_cache.py restore

    - name: Export locked compiler and browser environment
      if: inputs.profile == 'validation' && inputs.toolchain == 'auto' && runner.os == 'Linux' && runner.arch == 'X64'
      shell: bash
      env:
        CI_PROFILE: ${{ inputs.profile }}
        NIX_SHELL: ${{ inputs.profile == 'orchestration' && 'orchestration' || 'default' }}
      run: nix develop --no-update-lock-file ".#${NIX_SHELL}" -c python3 scripts/export_nix_ci_environment.py --profile "$CI_PROFILE"

    - name: Set up Go
      if: inputs.toolchain == 'conventional' || runner.os != 'Linux' || runner.arch != 'X64'
      uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
      with:
        go-version-file: go.mod
        cache: false

    - name: Resolve selected compiler identity
      if: inputs.profile == 'validation'
      id: toolchain
      shell: bash
      run: |
        version="$(go env GOVERSION)"
        echo "go-version=${version#go}" >> "$GITHUB_OUTPUT"

    - name: Resolve Go validation cache paths
      if: inputs.profile == 'validation'
      id: go-cache-paths
      shell: bash
      run: |
        set -eu
        gomodcache="$(go env GOMODCACHE)"
        gocache="$(go env GOCACHE)"
        image="${ImageOS:-}"
        if [ -z "$image" ] && [ -r /etc/os-release ]; then
          . /etc/os-release
          if [ -n "${ID:-}" ] && [ -n "${VERSION_ID:-}" ]; then
            image="${ID}-${VERSION_ID}"
          fi
        fi
        if [ -z "$image" ]; then
          echo "unable to determine the runner image identity from ImageOS or /etc/os-release" >&2
          exit 1
        fi
        if [ -z "$gomodcache" ] || [ -z "$gocache" ]; then
          echo "Go module and build cache paths must be non-empty" >&2
          exit 1
        fi
        {
          echo "gomodcache=$gomodcache"
          echo "gocache=$gocache"
          echo "image=$image"
        } >> "$GITHUB_OUTPUT"

    # Only default-branch archives are reusable by new PRs and merge groups.
    # Candidate writes consume gigabytes per ref and evict those shared inputs.
    - name: Restore and publish default-branch Go validation cache
      if: inputs.profile == 'validation' && (github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ${{ steps.go-cache-paths.outputs.gomodcache }}
          ${{ steps.go-cache-paths.outputs.gocache }}
        key: go-validation-v2-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}-${{ inputs.toolchain }}-${{ steps.go-cache-paths.outputs.image }}-${{ steps.toolchain.outputs.go-version }}-${{ hashFiles('flake.lock', 'nix/toolchain.nix') }}-${{ hashFiles('**/go.mod', '**/go.sum', 'Taskfile.yml', '.github/actions/setup-ci/action.yml') }}
        restore-keys: |
          go-validation-v2-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}-${{ inputs.toolchain }}-${{ steps.go-cache-paths.outputs.image }}-${{ steps.toolchain.outputs.go-version }}-${{ hashFiles('flake.lock', 'nix/toolchain.nix') }}-

    - name: Restore candidate Go validation cache
      if: inputs.profile == 'validation' && (github.ref != format('refs/heads/{0}', github.event.repository.default_branch))
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ${{ steps.go-cache-paths.outputs.gomodcache }}
          ${{ steps.go-cache-paths.outputs.gocache }}
        key: go-validation-v2-${{ inputs.go-cache-restore-workload || github.job }}-${{ runner.os }}-${{ runner.arch }}-${{ inputs.toolchain }}-${{ steps.go-cache-paths.outputs.image }}-${{ steps.toolchain.outputs.go-version }}-${{ hashFiles('flake.lock', 'nix/toolchain.nix') }}-${{ hashFiles('**/go.mod', '**/go.sum', 'Taskfile.yml', '.github/actions/setup-ci/action.yml') }}
        restore-keys: |
          go-validation-v2-${{ inputs.go-cache-restore-workload || github.job }}-${{ runner.os }}-${{ runner.arch }}-${{ inputs.toolchain }}-${{ steps.go-cache-paths.outputs.image }}-${{ steps.toolchain.outputs.go-version }}-${{ hashFiles('flake.lock', 'nix/toolchain.nix') }}-

    - name: Set up Node.js
      if: inputs.profile == 'validation' && (inputs.toolchain == 'conventional' || runner.os != 'Linux' || runner.arch != 'X64')
      uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
      with:
        node-version: "24"

    - name: Set up Bun
      if: inputs.profile == 'validation' && (inputs.toolchain == 'conventional' || runner.os != 'Linux' || runner.arch != 'X64')
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      with:
        bun-version: 1.3.14

    - name: Configure bounded tool caches
      if: inputs.profile == 'validation'
      shell: bash
      run: |
        mkdir -p "${HOME}/.bun/install/cache" "${HOME}/.cache/terraform"
        {
          echo "BUN_INSTALL_CACHE_DIR=${HOME}/.bun/install/cache"
          echo "BUN_FEATURE_FLAG_NO_ORPHANS=1"
          echo "TF_PLUGIN_CACHE_DIR=${HOME}/.cache/terraform"
        } >> "${GITHUB_ENV}"

    - name: Restore Bun download cache
      if: inputs.profile == 'validation'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.bun/install/cache
        key: bun-v2-${{ runner.os }}-${{ runner.arch }}-1.3.14-${{ hashFiles('bun.lock', 'desktop/bun.lock') }}
        restore-keys: |
          bun-v2-${{ runner.os }}-${{ runner.arch }}-1.3.14-
          bun-${{ runner.os }}-${{ runner.arch }}-1.3.14-

    - name: Restore Playwright browser cache
      if: inputs.profile == 'validation' && (inputs.browser == 'true' && (inputs.toolchain == 'conventional' || runner.os != 'Linux' || runner.arch != 'X64'))
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ runner.arch }}-1.61.1

    - name: Restore Terraform provider cache
      if: inputs.profile == 'validation' && (inputs.terraform == 'true')
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/terraform
        key: terraform-${{ runner.os }}-${{ runner.arch }}-1.13.5-${{ hashFiles('deploy/**/.terraform.lock.hcl') }}
        restore-keys: |
          terraform-${{ runner.os }}-${{ runner.arch }}-1.13.5-

    - name: Set up Terraform
      if: inputs.profile == 'validation' && (inputs.terraform == 'true')
      uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
      with:
        terraform_version: 1.13.5
        terraform_wrapper: false

    - name: Install pinned CI tools
      if: inputs.profile == 'validation' && (inputs.toolchain == 'conventional' || runner.os != 'Linux' || runner.arch != 'X64')
      shell: bash
      run: |
        install_go_tool() {
          local package="$1"
          local attempt
          for attempt in 1 2 3; do
            if GODEBUG=http2client=0 go install "${package}"; then
              return 0
            fi
            if [ "${attempt}" -eq 3 ]; then
              echo "failed to install ${package} after ${attempt} attempts" >&2
              return 1
            fi
            echo "retrying ${package} after failed attempt ${attempt}/3" >&2
            sleep "$((attempt * 5))"
          done
        }
        install_go_tool github.com/go-task/task/v3/cmd/task@v3.50.0
        echo "$(go env GOPATH)/bin" >> "${GITHUB_PATH}"

    - name: Install cached Chromium and system dependencies
      if: inputs.profile == 'validation' && (inputs.browser == 'true' && (inputs.toolchain == 'conventional' || runner.os != 'Linux' || runner.arch != 'X64'))
      shell: bash
      run: |
        echo "PLAYWRIGHT_BROWSERS_PATH=${HOME}/.cache/ms-playwright" >> "${GITHUB_ENV}"
        export PLAYWRIGHT_BROWSERS_PATH="${HOME}/.cache/ms-playwright"
        bunx --package @playwright/test@1.61.1 playwright install --with-deps chromium
        echo "LEAPVIEW_PLAYWRIGHT_READY=1" >> "${GITHUB_ENV}"

    - name: Verify locked Chromium and compiler pairing
      if: inputs.profile == 'validation' && (inputs.browser == 'true' && inputs.toolchain == 'auto' && runner.os == 'Linux' && runner.arch == 'X64')
      shell: bash
      run: task nix:smoke
