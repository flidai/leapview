name: Configure hosted Docker pulls
description: Prefer Google's Docker Hub cache and verify the pinned Testcontainers reaper on GitHub-hosted Linux runners.

runs:
  using: composite
  steps:
    - name: Mask ambient registry credentials before Docker diagnostics
      if: runner.os == 'Linux' && runner.environment == 'github-hosted'
      shell: bash
      run: python3 scripts/mask_ci_docker_credentials.py

    - name: Configure Docker mirror and pinned reaper before starting containers
      if: runner.os == 'Linux' && runner.environment == 'github-hosted'
      shell: bash
      run: sudo --preserve-env=GITHUB_ACTIONS,RUNNER_OS,RUNNER_ENVIRONMENT python3 scripts/configure_ci_docker_mirror.py
