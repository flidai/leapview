name: Admit immutable OCI artifact
description: Fail-closed digest, provenance, SBOM, and vulnerability admission.

inputs:
  image:
    description: OCI image reference. Must be repository@sha256:<64 lowercase hex>.
    required: true
  repository:
    description: Expected OCI repository (for example ghcr.io/flidai/leapview).
    required: true
  expected-workflow:
    description: GitHub Actions workflow identity that must have signed the image.
    required: true
  source-revision:
    description: Full 40-character source commit recorded by the attestation.
    required: true
  policy:
    description: Pinned container vulnerability policy JSON.
    required: false
    default: .github/security/container-vulnerability-policy.json
  platform:
    description: Optional target image platform for deterministic vulnerability scanning.
    required: false
  mode:
    description: live performs registry verification; hermetic validates evidence.
    required: false
    default: live
  evidence:
    description: Hermetic evidence JSON (required when mode is hermetic).
    required: false
  output:
    description: Optional path for the verified admission record.
    required: false
  vulnerability-report:
    description: Optional path for a sanitized vulnerability diagnostic report.
    required: false
  admission-bundle:
    description: Optional fresh directory for a canonical owner receipt and its verified evidence. Live supported main producers only.
    required: false
  release-id:
    description: Exact release identity for an explicitly requested owner receipt.
    required: false
  release-version:
    description: Expected image version label for an explicitly requested owner receipt.
    required: false

outputs:
  image:
    description: Exact digest reference that passed admission.
    value: ${{ steps.admit.outputs.image }}
  digest:
    description: Exact sha256 digest that passed admission.
    value: ${{ steps.admit.outputs.digest }}

runs:
  using: composite
  steps:
    - name: Set up Go for repository-owned admission
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: go.mod
        cache: false

    - name: Verify immutable OCI artifact admission
      id: admit
      shell: bash
      env:
        IMAGE: ${{ inputs.image }}
        OCI_REPOSITORY: ${{ inputs.repository }}
        EXPECTED_WORKFLOW: ${{ inputs.expected-workflow }}
        SOURCE_REVISION: ${{ inputs.source-revision }}
        POLICY: ${{ inputs.policy }}
        PLATFORM: ${{ inputs.platform }}
        MODE: ${{ inputs.mode }}
        EVIDENCE: ${{ inputs.evidence }}
        ADMISSION_OUTPUT: ${{ inputs.output }}
        VULNERABILITY_REPORT: ${{ inputs.vulnerability-report }}
        ADMISSION_BUNDLE: ${{ inputs.admission-bundle }}
        RELEASE_ID: ${{ inputs.release-id }}
        RELEASE_VERSION: ${{ inputs.release-version }}
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        output_path="$ADMISSION_OUTPUT"
        if [[ -z "$output_path" ]]; then
          output_path="$RUNNER_TEMP/oci-admission.json"
        fi
        cd "$GITHUB_ACTION_PATH/../../.."
        platform_args=()
        if [[ -n "$PLATFORM" ]]; then
          platform_args=(--platform "$PLATFORM")
        fi
        vulnerability_report_args=()
        if [[ -n "$VULNERABILITY_REPORT" ]]; then
          vulnerability_report_args=(--vulnerability-report "$VULNERABILITY_REPORT")
        fi
        admission_bundle_args=()
        if [[ -n "$ADMISSION_BUNDLE" ]]; then
          admission_bundle_args=(--admission-bundle "$ADMISSION_BUNDLE" --release-id "$RELEASE_ID" --release-version "$RELEASE_VERSION")
        fi
        go run ./internal/app/tools/ociadmission \
          --image "$IMAGE" \
          --repository "$OCI_REPOSITORY" \
          --expected-workflow "$EXPECTED_WORKFLOW" \
          --source-revision "$SOURCE_REVISION" \
          --policy "$POLICY" \
          "${platform_args[@]}" \
          "${vulnerability_report_args[@]}" \
          "${admission_bundle_args[@]}" \
          --mode "$MODE" \
          --evidence "$EVIDENCE" \
          --output "$output_path"
