name: Image qualification diagnostics

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/actions/oci-admission/action.yml'
      - '.github/security/container-vulnerability-policy.json'
      - '.github/workflows/artifacts.yml'
      - '.github/workflows/demo-upgrade-qualification.yml'
      - '.github/workflows/image-qualification-diagnostics.yml'
      - 'scripts/scan_image_baselines.py'
      - 'scripts/check_image_diagnostic_wiring.py'
      - 'internal/app/tools/ociadmission/**'
      - 'internal/app/tools/securitycontracts/**'

permissions:
  contents: read
  packages: read

concurrency:
  group: image-qualification-diagnostics-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  admission-report-tests:
    name: OCI admission report tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out exact pull request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Run focused vulnerability report admission tests
        run: >-
          python3 scripts/check_image_admission_regression.py &&
          go test ./internal/app/tools/ociadmission
          -run 'TestVulnerabilityReportParsesAndAccountsForExceptions|TestLiveVulnerabilityReport'
          -count=1

      - name: Check diagnostic upload contract
        run: >-
          go test ./internal/app/tools/securitycontracts
          -run '^TestOCIAdmissionDiagnosticUploadsAreBoundedAndAttemptScoped$'
          -count=1

  frozen-baseline-scans:
    name: Frozen baseline image scans
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read
    steps:
      - name: Check out exact pull request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Validate workflow and security policy wiring
        run: python3 scripts/check_image_diagnostic_wiring.py

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Scan the two frozen baseline images
        run: python3 scripts/scan_image_baselines.py --output "${RUNNER_TEMP}/image-baseline-vulnerabilities.json"

      - name: Upload sanitized baseline diagnostic
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frozen-image-baseline-diagnostic-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/image-baseline-vulnerabilities.json
          if-no-files-found: ignore
          retention-days: 14

  reusable-upload-probe:
    name: Probe the called workflow's real uploader
    uses: ./.github/workflows/demo-upgrade-qualification.yml
    with:
      candidate_image: ghcr.io/flidai/leapview@sha256:d03a12efcd20e7383f8973f5ef5e32e909ca6495ca49c70860222fe926398f86
      candidate_revision: ${{ github.event.pull_request.head.sha }}
      final_artifact: true
      upload_probe: true
    permissions:
      contents: read
      packages: read
      attestations: read

  verify-reusable-upload-probe:
    name: Verify reusable upload and absence of receipts
    needs: [reusable-upload-probe]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    steps:
      - name: Require the deliberate stop before qualification
        env:
          REUSABLE_RESULT: ${{ needs.reusable-upload-probe.result }}
        run: test "${REUSABLE_RESULT}" = failure

      - name: Download the reusable workflow's diagnostic artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: oci-vulnerability-diagnostic-historical-transition-${{ github.run_id }}-${{ github.run_attempt }}
          path: reusable-upload-probe

      - name: Validate the uploaded probe and verify no qualification receipts exist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          jq -e '.schemaVersion == 1 and .diagnosticOnly == true and .probe == "reusable-upload" and .outcome == "upload-probe" and .unresolvedCount == 0 and .findings == []' \
            reusable-upload-probe/oci-vulnerability-report.json >/dev/null
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?per_page=100" \
            | jq -e '.artifacts | map(.name) as $names | any($names[]; startswith("oci-vulnerability-diagnostic-historical-transition-")) and all($names[]; (startswith("historical-transition-") or startswith("production-image-qualification-")) | not)' \
            >/dev/null
