name: Merge validation

on:
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

concurrency:
  group: merge-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apigen-validation:
    name: APIGen tests (merge queue)
    if: github.repository == 'flidai/leapview'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Check out merge group
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up the cached CI toolchain
        uses: ./.github/actions/setup-ci
        with:
          browser: "false"

      - name: Run APIGen validation
        run: task ci:lane:go:apigen

  go-packages-validation:
    name: Go package tests (merge queue)
    if: github.repository == 'flidai/leapview'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read

    steps:
      - name: Check out merge group
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up the cached CI toolchain
        uses: ./.github/actions/setup-ci
        with:
          browser: "false"

      - name: Prepare generated and embedded assets
        run: node scripts/ci_watchdog.mjs --timeout-seconds 420 --attempts 2 -- task ci:prepare

      - name: Run Go package validation
        run: task ci:lane:go:packages

      - name: Verify generated artifacts
        run: task generated:check

  go-application-validation:
    name: Go application tests (merge queue)
    if: github.repository == 'flidai/leapview'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read

    steps:
      - name: Check out merge group
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up the cached CI toolchain
        uses: ./.github/actions/setup-ci
        with:
          browser: "false"

      - name: Prepare generated and embedded assets
        run: node scripts/ci_watchdog.mjs --timeout-seconds 420 --attempts 2 -- task ci:prepare

      - name: Run Go application validation
        run: task ci:lane:go:application

  frontend-validation:
    name: Frontend tests (merge queue)
    if: github.repository == 'flidai/leapview'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Check out merge group
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up the cached CI toolchain
        uses: ./.github/actions/setup-ci
        with:
          browser: "true"

      - name: Prepare generated and embedded assets
        run: node scripts/ci_watchdog.mjs --timeout-seconds 420 --attempts 2 -- task ci:prepare

      - name: Run frontend validation
        run: node scripts/ci_watchdog.mjs --timeout-seconds 180 --attempts 2 -- task ci:lane:frontend

      - name: Verify generated artifacts
        run: task generated:check

  full-validation:
    name: Full merge validation
    if: github.repository == 'flidai/leapview'
    needs: [apigen-validation, go-packages-validation, go-application-validation, frontend-validation]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read

    steps:
      - name: Check out merge group
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up the cached CI toolchain
        uses: ./.github/actions/setup-ci
        with:
          browser: "true"
          terraform: "true"

      - name: Prepare generated and embedded assets
        run: node scripts/ci_watchdog.mjs --timeout-seconds 420 --attempts 2 -- task ci:prepare

      - name: Run merge-only validation
        run: task ci:full:extras

  ci-gate:
    name: CI gate
    if: ${{ always() }}
    needs: [apigen-validation, go-packages-validation, go-application-validation, frontend-validation, full-validation]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require full merge validation
        env:
          APIGEN_RESULT: ${{ needs.apigen-validation.result }}
          GO_PACKAGES_RESULT: ${{ needs.go-packages-validation.result }}
          GO_APPLICATION_RESULT: ${{ needs.go-application-validation.result }}
          FRONTEND_RESULT: ${{ needs.frontend-validation.result }}
          FULL_VALIDATION_RESULT: ${{ needs.full-validation.result }}
        run: |
          test "${APIGEN_RESULT}" = success || {
            printf 'APIGen validation: %s\n' "${APIGEN_RESULT}" >&2
            exit 1
          }
          test "${GO_PACKAGES_RESULT}" = success || {
            printf 'Go package validation: %s\n' "${GO_PACKAGES_RESULT}" >&2
            exit 1
          }
          test "${GO_APPLICATION_RESULT}" = success || {
            printf 'Go application validation: %s\n' "${GO_APPLICATION_RESULT}" >&2
            exit 1
          }
          test "${FRONTEND_RESULT}" = success || {
            printf 'Frontend validation: %s\n' "${FRONTEND_RESULT}" >&2
            exit 1
          }
          test "${FULL_VALIDATION_RESULT}" = success || {
            printf 'Full merge validation: %s\n' "${FULL_VALIDATION_RESULT}" >&2
            exit 1
          }
