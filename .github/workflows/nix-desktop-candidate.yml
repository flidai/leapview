name: Qualification / Protected Nix desktop candidate

on:
  workflow_dispatch:
    inputs:
      source_revision:
        description: Exact open pull-request head directly based on main
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: nix-desktop-candidate-${{ inputs.source_revision }}
  cancel-in-progress: false

jobs:
  authorize:
    if: github.repository == 'flidai/leapview' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: leapview-ephemeral-qualification
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.source_revision }}
          persist-credentials: false
      - name: Require one exact open PR head directly based on main
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_REVISION: ${{ inputs.source_revision }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_REVISION" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_REVISION"
          gh api "repos/$GITHUB_REPOSITORY/commits/$SOURCE_REVISION/pulls" \
            | jq -e --arg revision "$SOURCE_REVISION" \
              'map(select(.base.ref == "main" and .state == "open" and .head.sha == $revision)) | length == 1' >/dev/null

  build:
    needs: authorize
    if: github.repository == 'flidai/leapview' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    permissions:
      contents: read
    outputs:
      artifact_id: ${{ steps.candidate.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.source_revision }}
          persist-credentials: false
      - name: Install pinned Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
        with:
          install_url: https://releases.nixos.org/nix/nix-2.31.2/install
          extra_nix_config: |
            experimental-features = nix-command flakes
            sandbox = true
      - name: Build the Linux x64 Desktop Debian candidate without publication credentials
        env:
          SOURCE_REVISION: ${{ inputs.source_revision }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_REVISION"
          test "$(uname -m)" = x86_64
          nix build --no-update-lock-file .#leapview-desktop-linux-x64 --out-link result-desktop -L
          mkdir -p candidate
          cp --dereference result-desktop/leapview-desktop-linux-x64.deb candidate/
          test -s candidate/leapview-desktop-linux-x64.deb
      - name: Retain the exact Debian candidate
        id: candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nix-desktop-candidate-${{ github.run_id }}-${{ github.run_attempt }}-amd64
          path: candidate/leapview-desktop-linux-x64.deb
          if-no-files-found: error
          retention-days: 14

  qualify:
    needs: [authorize, build]
    if: github.repository == 'flidai/leapview' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    timeout-minutes: 100
    permissions:
      actions: read
      contents: read
    env:
      LEAPVIEW_DESKTOP_DISTRIBUTION: preview
    steps:
      - name: Check out protected qualification tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          path: protected
          persist-credentials: false
      - name: Check out candidate source identity
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.source_revision }}
          path: source
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.13.14
      - name: Set up Bun and Go from protected inputs
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: protected/go.mod
          cache: false
      - name: Install the native GUI test host tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes xvfb xauth xdg-utils
      - name: Resolve this run's exact candidate artifact
        id: artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" \
            > "$RUNNER_TEMP/nix-artifacts.json"
          python3 protected/scripts/nix_candidate_artifacts.py \
            --metadata "$RUNNER_TEMP/nix-artifacts.json" --run-id "$GITHUB_RUN_ID" \
            --attempt "$GITHUB_RUN_ATTEMPT" --revision "$GITHUB_SHA" --architecture amd64 \
            --phase desktop-candidate --github-output "$GITHUB_OUTPUT"
      - name: Download the exact candidate Debian package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ steps.artifact.outputs.desktop-candidate_id }}
          merge-multiple: true
          path: candidate
      - name: Test the protected Desktop qualification contract
        run: |
          python3 -m unittest discover -s protected/scripts/tests -p 'test_nix_desktop_qualification.py'
          python3 -m unittest discover -s protected/scripts/tests -p 'test_nix_candidate_manifest.py'
          python3 -m unittest discover -s protected/scripts/tests -p 'test_nix_candidate_artifacts.py'
      - name: Qualify the exact Debian payload and installed candidate
        env:
          SOURCE_REVISION: ${{ inputs.source_revision }}
        run: |
          python3 protected/scripts/nix_desktop_qualification.py qualify \
            --deb candidate/leapview-desktop-linux-x64.deb --source-root source \
            --verifier-root protected --source-revision "$SOURCE_REVISION" \
            --evidence-dir qualified
      - name: Reverify qualification, policy and unchanged Debian bytes
        env:
          SOURCE_REVISION: ${{ inputs.source_revision }}
        run: |
          set -euo pipefail
          python3 protected/scripts/nix_desktop_qualification.py verify \
            --deb candidate/leapview-desktop-linux-x64.deb --source-root source \
            --verifier-root protected --source-revision "$SOURCE_REVISION" \
            --evidence-dir qualified
      - name: Retain the exact unsigned Desktop candidate and qualification evidence
        id: qualified
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nix-desktop-qualified-${{ github.run_id }}-${{ github.run_attempt }}-amd64
          path: |
            candidate/leapview-desktop-linux-x64.deb
            qualified/
          if-no-files-found: error
          retention-days: 14
      - name: Retain qualification diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nix-desktop-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}-amd64
          path: qualified/
          if-no-files-found: ignore
          retention-days: 14
