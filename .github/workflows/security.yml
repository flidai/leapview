name: Security / Policy and scans

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, stacked]
  push:
    branches: [main]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:
    inputs:
      fault:
        description: Disposable CodeQL qualification scenario; never merge this branch
        required: true
        type: choice
        options: [missing-generated, warning, missing-sarif]

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  policy-validation:
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    name: Security policy contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out the exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up the cached security toolchain
        uses: ./.github/actions/setup-ci
        with:
          browser: "false"

      - name: Verify inventory, exceptions, updaters, and workflow contracts
        run: task security:policy

      - name: Execute platform integer boundaries on 386
        env:
          GOARCH: "386"
          CGO_ENABLED: "0"
        run: go test ./pkg/duckdbsql/decode_integer.go ./pkg/duckdbsql/decode_integer_test.go

  dependency-validation:
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    name: Dependency vulnerability policy
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out the exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up the cached security toolchain
        uses: ./.github/actions/setup-ci
        with:
          browser: "false"

      - name: Prepare generated Go source for dependency scan
        env:
          NPM_CONFIG_AUDIT: "false"
        run: |
          task db:generate
          task config:generate
          task ui-signals:generate

      - name: Scan every maintained dependency graph
        run: task security:dependencies

  source-validation:
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    name: Secret and IaC policy
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up the cached security toolchain
        uses: ./.github/actions/setup-ci
        with:
          browser: "false"

      - name: Scan source, infrastructure, and candidate history
        run: task security:source

  sast-validation:
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    name: Selected SAST (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GOFLAGS: -tags=duckdb_arrow
      NPM_CONFIG_AUDIT: "false"
      CODEQL_OVERLAY_DATABASE_MODE: none
      CODEQL_ACTION_DIFF_INFORMED_QUERIES: "false"
      CODEQL_ACTION_EXPORT_DIAGNOSTICS: "true"
    permissions:
      contents: read
      packages: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: go
            build-mode: manual
            sarif: go.sarif
          - language: javascript-typescript
            build-mode: none
            sarif: javascript.sarif

    steps:
      - name: Check out the exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Capture immutable SAST checkout baseline
        run: git rev-parse HEAD > "$RUNNER_TEMP/security-sast-revision"

      - name: Set up the locked SAST toolchain
        uses: ./.github/actions/setup-ci
        with:
          profile: validation
          browser: "false"

      - name: Build the SAST contract helper before tracing
        id: sast_helper
        run: go build -mod=readonly -o "$RUNNER_TEMP/securitysast" ./internal/app/tools/securitysast

      - name: Prepare generated source in this runner
        run: task security:sast:prepare

      - name: Prove changed TypeSpec source was regenerated before extraction
        run: |
          rg -n --fixed-strings codeqlQualificationProbe web/generated/signals/index.ts
          rg -n --fixed-strings codeqlQualificationProbe internal/dashboard/ui/signals/models.gen.go

      - name: Check maintained TypeScript source graphs
        if: matrix.language == 'javascript-typescript'
        run: task security:sast:typescript

      - name: Verify checkout integrity before extraction
        run: '"$RUNNER_TEMP/securitysast" integrity -root . -revision "$(cat "$RUNNER_TEMP/security-sast-revision")"'

      - name: Initialize selected CodeQL analysis
        id: codeql_init
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Remove a required generated package for disposable qualification
        if: matrix.language == 'go' && inputs.fault == 'missing-generated'
        run: |
          test -n "$(find internal/access/postgres/internal/db -maxdepth 1 -name '*.go' -print -quit)"
          test -z "$(git ls-files internal/access/postgres/internal/db)"
          find internal/access/postgres/internal/db -maxdepth 1 -name '*.go' -print -delete

      - name: Trace every maintained Go module
        if: matrix.language == 'go'
        # The pinned action cannot trace a static Go program as the build entry
        # point. Keep compiler invocations in the runner's dynamic system shell;
        # retain the initialized CodeQL PATH and locked compiler environment.
        shell: /bin/bash --noprofile --norc -eo pipefail {0}
        run: |
          "$RUNNER_TEMP/securitysast" modules -root . > "$RUNNER_TEMP/security-sast-modules"
          while IFS= read -r -d '' module; do
            (
              cd -- "$module"
              echo "Tracing Go module: $module"
              go list -mod=readonly -deps -tags=duckdb_arrow ./...
              go build -a -p=2 -mod=readonly -tags=duckdb_arrow ./...
            )
          done < "$RUNNER_TEMP/security-sast-modules"

      - name: Analyze selected source language
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: /language:${{ matrix.language }}
          output: ${{ runner.temp }}/codeql-results
          # Disposable fault proof must not publish synthetic scan findings.
          upload: never
          upload-database: false

      - name: Alter raw diagnostics for disposable qualification
        if: matrix.language == 'javascript-typescript' && (inputs.fault == 'warning' || inputs.fault == 'missing-sarif')
        env:
          QUALIFICATION_FAULT: ${{ inputs.fault }}
        run: |
          python3 - <<'PYCODE'
          import json, os
          from pathlib import Path
          path = Path(os.environ["RUNNER_TEMP"]) / "codeql-results/javascript.sarif"
          if os.environ["QUALIFICATION_FAULT"] == "missing-sarif":
              path.rename(path.with_name("javascript-withheld.sarif"))
              print("Withheld expected SARIF; retained original under javascript-withheld.sarif")
          else:
              report = json.loads(path.read_text())
              report["runs"][0]["invocations"][0].setdefault("toolExecutionNotifications", []).append({
                  "level": "warning",
                  "descriptor": {"id": "qualification/injected-warning"},
                  "message": {"text": "Disposable warning must fail analysis health and Security gate"},
              })
              path.write_text(json.dumps(report))
              print("Injected qualification/injected-warning into actual raw SARIF")
          PYCODE

      - name: Require complete analysis diagnostics
        if: ${{ !cancelled() && steps.codeql_init.outcome == 'success' }}
        env:
          SAST_SARIF: ${{ matrix.sarif }}
          SAST_CATEGORY: /language:${{ matrix.language }}
        run: '"$RUNNER_TEMP/securitysast" sarif -input "$RUNNER_TEMP/codeql-results/$SAST_SARIF" -category "$SAST_CATEGORY"'

      - name: Verify checkout integrity after analysis
        if: ${{ !cancelled() && steps.sast_helper.outcome == 'success' }}
        run: '"$RUNNER_TEMP/securitysast" integrity -root . -revision "$(cat "$RUNNER_TEMP/security-sast-revision")"'

      - name: Retain raw CodeQL diagnostics
        if: ${{ !cancelled() && steps.codeql_init.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: codeql-${{ matrix.language }}-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/codeql-results/*.sarif
          if-no-files-found: ignore
          retention-days: 14

  security-gate:
    name: Security gate
    if: ${{ always() && (github.event_name != 'pull_request' || !github.event.pull_request.draft) }}
    needs: [policy-validation, dependency-validation, source-validation, sast-validation]
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Check out the aggregate gate contract
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go for the aggregate contract
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Require every security lane
        env:
          POLICY_RESULT: ${{ needs.policy-validation.result }}
          DEPENDENCY_RESULT: ${{ needs.dependency-validation.result }}
          SOURCE_RESULT: ${{ needs.source-validation.result }}
          SAST_RESULT: ${{ needs.sast-validation.result }}
        run: >-
          go run ./internal/app/tools/securityresults
          "$POLICY_RESULT" "$DEPENDENCY_RESULT" "$SOURCE_RESULT" "$SAST_RESULT"
