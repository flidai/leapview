name: Nightly CI

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-ci-${{ github.repository }}
  cancel-in-progress: true

jobs:
  apigen-validation:
    name: APIGen tests (nightly)
    if: github.repository == 'flidai/leapview'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up the cached CI toolchain
        uses: ./.github/actions/setup-ci
        with:
          browser: "false"

      - name: Run APIGen validation
        run: task ci:lane:go:apigen

  go-packages-validation:
    name: Go package tests (nightly)
    if: github.repository == 'flidai/leapview'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up the cached CI toolchain
        uses: ./.github/actions/setup-ci
        with:
          browser: "false"

      - name: Prepare generated and embedded assets
        run: node scripts/ci_watchdog.mjs --timeout-seconds 420 --attempts 2 -- task ci:prepare

      - name: Run Go package validation
        run: task ci:lane:go:packages

      - name: Verify generated artifacts
        run: task generated:check

  go-application-validation:
    name: Go application tests (nightly)
    if: github.repository == 'flidai/leapview'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up the cached CI toolchain
        uses: ./.github/actions/setup-ci
        with:
          browser: "false"

      - name: Prepare generated and embedded assets
        run: node scripts/ci_watchdog.mjs --timeout-seconds 420 --attempts 2 -- task ci:prepare

      - name: Run Go application validation
        run: task ci:lane:go:application

  frontend-validation:
    name: Frontend tests (nightly)
    if: github.repository == 'flidai/leapview'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up the cached CI toolchain
        uses: ./.github/actions/setup-ci
        with:
          browser: "true"

      - name: Prepare generated and embedded assets
        run: node scripts/ci_watchdog.mjs --timeout-seconds 420 --attempts 2 -- task ci:prepare

      - name: Run frontend validation
        run: node scripts/ci_watchdog.mjs --timeout-seconds 180 --attempts 2 -- task ci:lane:frontend

      - name: Verify generated artifacts
        run: task generated:check

  full-validation:
    name: Full nightly validation
    if: github.repository == 'flidai/leapview'
    needs: [apigen-validation, go-packages-validation, go-application-validation, frontend-validation]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up the cached CI toolchain
        uses: ./.github/actions/setup-ci
        with:
          browser: "true"
          terraform: "true"

      - name: Prepare generated and embedded assets
        run: node scripts/ci_watchdog.mjs --timeout-seconds 420 --attempts 2 -- task ci:prepare

      - name: Run merge-only validation
        run: task ci:full:extras

  security-validation:
    name: Nightly dependency security
    if: github.repository == 'flidai/leapview'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up the cached CI toolchain
        uses: ./.github/actions/setup-ci
        with:
          browser: "false"

      - name: Run dependency security scans
        id: dependency-scans
        run: task ci:nightly:extras

      - name: Build dependency security clearance report
        id: dependency-report
        if: ${{ always() }}
        continue-on-error: true
        run: >-
          go run ./internal/app/tools/dependencyreport report
          --output dependency-security-report.json

      - name: Upload failed dependency security diagnostics
        if: ${{ always() && steps.dependency-report.outcome == 'failure' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dependency-security-report-failed
          retention-days: 30
          if-no-files-found: warn
          path: dependency-security-report.json

      - name: Validate dependency security clearance report
        id: dependency-check
        if: ${{ steps.dependency-report.outcome == 'success' }}
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
        run: >-
          go run ./internal/app/tools/dependencyreport check
          --input dependency-security-report.json
          --expected-commit "${EXPECTED_COMMIT}"

      - name: Upload validated dependency security clearance report
        if: ${{ steps.dependency-scans.outcome == 'success' && steps.dependency-report.outcome == 'success' && steps.dependency-check.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dependency-security-report
          retention-days: 30
          if-no-files-found: warn
          path: dependency-security-report.json

      - name: Require dependency security clearance
        if: ${{ always() }}
        env:
          SCANS_RESULT: ${{ steps.dependency-scans.outcome }}
          REPORT_RESULT: ${{ steps.dependency-report.outcome }}
          CHECK_RESULT: ${{ steps.dependency-check.outcome }}
        run: |
          for result in "${SCANS_RESULT}" "${REPORT_RESULT}" "${CHECK_RESULT}"; do
            test "${result}" = success || {
              printf 'Dependency security validation result: %s\n' "${result}" >&2
              exit 1
            }
          done

  agent-tool-evaluation:
    name: Agent all-tools evaluation (diagnostic)
    if: github.repository == 'flidai/leapview'
    continue-on-error: true
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up the cached CI toolchain
        uses: ./.github/actions/setup-ci
        with:
          browser: "false"

      - name: Detect live-model credentials
        id: credentials
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          if [[ -n "${DEEPSEEK_API_KEY}" ]]; then
            echo "available=true" >> "${GITHUB_OUTPUT}"
          else
            echo "available=false" >> "${GITHUB_OUTPUT}"
            echo "DeepSeek evaluation skipped because DEEPSEEK_API_KEY is unavailable." >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Run all-tools headless evaluation
        if: steps.credentials.outputs.available == 'true'
        env:
          AGENT_EVAL_REPORT: ${{ github.workspace }}/.data/agent-e2e/report.json
          AGENT_EVAL_TRANSCRIPT: ${{ github.workspace }}/.data/agent-e2e/transcript-summary.jsonl
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: task agent:e2e

      - name: Upload agent evaluation report and transcript summary
        if: ${{ always() && steps.credentials.outputs.available == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: agent-all-tools-evaluation
          retention-days: 30
          if-no-files-found: warn
          path: |
            .data/agent-e2e/report.json
            .data/agent-e2e/transcript-summary.jsonl

  ci-gate:
    name: CI gate
    if: ${{ always() }}
    needs: [apigen-validation, go-packages-validation, go-application-validation, frontend-validation, full-validation, security-validation]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require exhaustive nightly validation
        env:
          APIGEN_RESULT: ${{ needs.apigen-validation.result }}
          GO_PACKAGES_RESULT: ${{ needs.go-packages-validation.result }}
          GO_APPLICATION_RESULT: ${{ needs.go-application-validation.result }}
          FRONTEND_RESULT: ${{ needs.frontend-validation.result }}
          FULL_RESULT: ${{ needs.full-validation.result }}
          SECURITY_RESULT: ${{ needs.security-validation.result }}
        run: |
          for result in "${APIGEN_RESULT}" "${GO_PACKAGES_RESULT}" "${GO_APPLICATION_RESULT}" "${FRONTEND_RESULT}" "${FULL_RESULT}" "${SECURITY_RESULT}"; do
            test "${result}" = success || {
              printf 'Nightly validation result: %s\n' "${result}" >&2
              exit 1
            }
          done
