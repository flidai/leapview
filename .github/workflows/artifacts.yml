name: Build / Main image

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      source_revision:
        description: Exact open pull-request head commit to qualify
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: production-artifacts-${{ github.event_name == 'workflow_dispatch' && inputs.source_revision || 'main' }}
  cancel-in-progress: true

env:
  IMAGE_REPOSITORY: ghcr.io/flidai/leapview

jobs:
  authorize-candidate:
    name: Authorize pull-request candidate
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: leapview-ephemeral-qualification
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Check out exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.source_revision }}
          fetch-depth: 0

      - name: Require the exact head of one open pull request to main
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_REVISION: ${{ inputs.source_revision }}
        run: |
          set -euo pipefail
          revision="${SOURCE_REVISION}"
          [[ "${revision}" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "${revision}"
          gh api "repos/${GITHUB_REPOSITORY}/commits/${revision}/pulls" \
            | jq -e --arg revision "${revision}" \
              'map(select(.base.ref == "main" and .state == "open" and .head.sha == $revision)) | length == 1' \
              >/dev/null

  build-production-image:
    name: Build production image
    needs: [authorize-candidate]
    if: >-
      ${{ !cancelled() && github.repository == 'flidai/leapview' &&
          ((github.event_name == 'push' && github.ref == 'refs/heads/main') ||
           (github.event_name == 'workflow_dispatch' && needs.authorize-candidate.result == 'success')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      version: ${{ steps.identity.outputs.version }}
      revision: ${{ steps.identity.outputs.revision }}
      build_time: ${{ steps.identity.outputs.build_time }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.source_revision || github.sha }}
          fetch-depth: 0

      - name: Resolve authoritative build identity
        id: identity
        env:
          SOURCE_REVISION: ${{ inputs.source_revision }}
        run: |
          set -euo pipefail
          revision="$(git rev-parse HEAD)"
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            test "$revision" = "$SOURCE_REVISION"
            channel="candidate"
          else
            test "$GITHUB_REF" = refs/heads/main
            test "$revision" = "$GITHUB_SHA"
            channel="main"
          fi
          canonical_version="$(tr -d '[:space:]' < VERSION)"
          test -n "$canonical_version"
          build_time="$(git show -s --format=%cI "$revision")"
          version="${canonical_version}+${channel}.${revision:0:12}"
          {
            echo "version=$version"
            echo "revision=$revision"
            echo "build_time=$build_time"
            echo "channel=$channel"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish the production image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          build-args: |
            BUILD_VERSION=${{ steps.identity.outputs.version }}
            BUILD_REVISION=${{ steps.identity.outputs.revision }}
            BUILD_TIME=${{ steps.identity.outputs.build_time }}
            BUILD_DIRTY=false
            BUILD_RELEASE=false
          push: true
          pull: true
          tags: ${{ env.IMAGE_REPOSITORY }}:${{ steps.identity.outputs.channel }}-${{ steps.identity.outputs.revision }}
          cache-from: type=gha,scope=production-amd64
          cache-to: type=gha,mode=max,scope=production-amd64,ignore-error=true
          provenance: mode=max
          sbom: true

      - name: Attest production image provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_REPOSITORY }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  qualify-production-image:
    name: Qualify production image
    needs: build-production-image
    if: ${{ !cancelled() && needs.build-production-image.result == 'success' }}
    runs-on: ubuntu-24.04
    # The release gate now includes the policy-driven performance and repeated
    # native-refresh phase. Its bounded phase budgets total 115 minutes before
    # toolchain setup and evidence cleanup, so retain enough outer headroom for
    # the controller to finish and publish diagnostics on a slow runner.
    timeout-minutes: 150
    permissions:
      contents: read
      packages: read
      attestations: read
    outputs:
      image: ${{ steps.admission.outputs.image }}
      revision: ${{ needs.build-production-image.outputs.revision }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.build-production-image.outputs.revision }}

      - name: Set up the cached CI toolchain
        uses: ./.github/actions/setup-ci

      - name: Populate main-branch Bun cache
        run: |
          bun install --frozen-lockfile
          bun install --cwd desktop --frozen-lockfile

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Admit the exact production image
        id: admission
        uses: ./.github/actions/oci-admission
        with:
          image: ${{ env.IMAGE_REPOSITORY }}@${{ needs.build-production-image.outputs.digest }}
          repository: ${{ env.IMAGE_REPOSITORY }}
          expected-workflow: flidai/leapview/.github/workflows/artifacts.yml
          # GitHub signs workflow_dispatch attestations with the protected
          # workflow event SHA. Candidate identity is checked independently
          # against the image below after the open-PR authorization gate.
          source-revision: ${{ github.sha }}
          platform: linux/amd64
          vulnerability-report: ${{ runner.temp }}/oci-vulnerability-report.json
          # PR-dispatch provenance names the protected workflow SHA rather
          # than the image source, so it cannot issue canonical owner receipts.
          admission-bundle: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && format('{0}/managed-admission', runner.temp) || '' }}
          release-id: main-${{ needs.build-production-image.outputs.revision }}
          release-version: ${{ needs.build-production-image.outputs.version }}

      - name: Upload OCI vulnerability diagnostic
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: oci-vulnerability-diagnostic-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/oci-vulnerability-report.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Retain canonical image admission and verified evidence
        id: admission-bundle
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: managed-admission-${{ github.run_id }}-${{ github.run_attempt }}-amd64
          path: ${{ runner.temp }}/managed-admission
          if-no-files-found: error
          retention-days: 14

      - name: Qualify the immutable production image
        id: qualification
        env:
          IMAGE_REFERENCE: ${{ steps.admission.outputs.image }}
          IMAGE_VERSION: ${{ needs.build-production-image.outputs.version }}
          IMAGE_REVISION: ${{ needs.build-production-image.outputs.revision }}
          IMAGE_BUILD_TIME: ${{ needs.build-production-image.outputs.build_time }}
        run: |
          set -euo pipefail
          immutable_image="${IMAGE_REFERENCE}"
          [[ "${immutable_image}" =~ ^ghcr\.io/flidai/leapview@sha256:[0-9a-f]{64}$ ]]
          task image:qualify:production IMAGE="${immutable_image}"
          test -s .tmp/qualification/production-image/performance-report.json
          identity="$(docker run --rm "${immutable_image}" version --format json)"
          jq -e \
            --arg version "${IMAGE_VERSION}" \
            --arg revision "${IMAGE_REVISION}" \
            --arg build_time "${IMAGE_BUILD_TIME}" \
            '.version == $version and .revision == $revision and .buildTime == $build_time and .dirty == false and .development == true' \
            <<<"${identity}" >/dev/null
          printf 'Production image: `%s`\n' "${immutable_image}" >> "${GITHUB_STEP_SUMMARY}"

      - name: Record bounded performance artifact identity
        if: always() && (steps.qualification.outcome == 'success' || steps.qualification.outcome == 'failure')
        env:
          IMAGE_REFERENCE: ${{ steps.admission.outputs.image }}
          IMAGE_REVISION: ${{ needs.build-production-image.outputs.revision }}
        run: |
          mkdir -p .tmp/qualification/production-image
          jq -n --arg sourceRevision "${IMAGE_REVISION}" --arg image "${IMAGE_REFERENCE}" \
            '{sourceRevision:$sourceRevision,image:$image}' \
            > .tmp/qualification/production-image/performance-identity.json

      # Only these bounded JSON files may establish a future reviewed reference.
      # The surrounding directory contains credentials and private instance state.
      - name: Retain bounded performance evidence
        if: always() && (steps.qualification.outcome == 'success' || steps.qualification.outcome == 'failure')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: performance-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .tmp/qualification/production-image/performance-report.json
            .tmp/qualification/production-image/performance-identity.json
          if-no-files-found: ${{ steps.qualification.outcome == 'success' && 'error' || 'warn' }}
          retention-days: 90

      # This typed report contains only image identity and bounded phase
      # names/results/codes/timings. Never upload the surrounding evidence
      # directory: it can include credentials, database state and raw logs.
      - name: Upload failed qualification phase summary
        if: failure() && steps.qualification.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: production-image-qualification-failure-${{ github.run_attempt }}
          path: .tmp/qualification/production-image/image-qualification-report.json
          if-no-files-found: warn
          retention-days: 14

  qualify-historical-transition:
    name: Qualify schema-32 predecessor transition against exact image
    needs: build-production-image
    if: ${{ !cancelled() && needs.build-production-image.result == 'success' }}
    uses: ./.github/workflows/demo-upgrade-qualification.yml
    with:
      candidate_image: ghcr.io/flidai/leapview@${{ needs.build-production-image.outputs.digest }}
      candidate_revision: ${{ needs.build-production-image.outputs.revision }}
      final_artifact: true
    permissions:
      contents: read
      packages: read
      attestations: read

  record-production-image-qualification:
    name: Record exact production image and historical transition
    needs: [build-production-image, qualify-production-image, qualify-historical-transition]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Require both exact-image qualifications
        env:
          IMAGE_QUALIFICATION_RESULT: ${{ needs.qualify-production-image.result }}
          HISTORICAL_TRANSITION_RESULT: ${{ needs.qualify-historical-transition.result }}
          IMAGE_BUILD_RESULT: ${{ needs.build-production-image.result }}
        run: |
          set -euo pipefail
          test "${IMAGE_BUILD_RESULT}" = success
          test "${IMAGE_QUALIFICATION_RESULT}" = success
          test "${HISTORICAL_TRANSITION_RESULT}" = success

      - name: Download the exact historical transition receipt
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: historical-transition-${{ github.run_attempt }}
          path: transition-evidence

      - name: Bind both receipts to this exact workflow attempt
        env:
          IMAGE: ${{ needs.qualify-production-image.outputs.image }}
          REVISION: ${{ needs.qualify-production-image.outputs.revision }}
        run: |
          set -euo pipefail
          [[ "${IMAGE}" =~ ^ghcr\.io/flidai/leapview@sha256:[0-9a-f]{64}$ ]]
          [[ "${REVISION}" =~ ^[0-9a-f]{40}$ ]]
          jq -e --arg image "${IMAGE}" --arg revision "${REVISION}" \
            '.version == 1 and .status == "passed" and .candidate.image == $image and .candidate.revision == $revision and .validatorRevision == $revision and (.checks as $checks | ["legacyPublication", "legacyViewer", "typedPolicyCaptured", "independentApproval", "publisherNoSelfApproval", "viewerLeastPrivilege", "realPublicationAdapter", "subsequentDeploy"] | all(.[]; $checks[.] == true))' \
            transition-evidence/transition.json >/dev/null
          jq --arg runId "${GITHUB_RUN_ID}" --arg runAttempt "${GITHUB_RUN_ATTEMPT}" \
            '. + {runId:$runId,runAttempt:$runAttempt}' \
            transition-evidence/transition.json > transition.json
          jq -n --arg image "${IMAGE}" --arg revision "${REVISION}" \
            --arg runId "${GITHUB_RUN_ID}" --arg runAttempt "${GITHUB_RUN_ATTEMPT}" \
            '{image:$image,revision:$revision,runId:$runId,runAttempt:$runAttempt,qualified:true}' > qualification.json

      - name: Upload exact image and historical transition qualification
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: production-image-qualification-${{ github.run_attempt }}
          path: |
            qualification.json
            transition.json
          if-no-files-found: error
          retention-days: 90
