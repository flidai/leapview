name: Main artifacts

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: main-artifacts
  cancel-in-progress: true

env:
  IMAGE_REPOSITORY: ghcr.io/flidai/leapview

jobs:
  build-production-image:
    name: Build production image
    if: github.repository == 'flidai/leapview' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      version: ${{ steps.identity.outputs.version }}
      revision: ${{ steps.identity.outputs.revision }}
      build_time: ${{ steps.identity.outputs.build_time }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Resolve authoritative main build identity
        id: identity
        run: |
          test "$GITHUB_REF" = refs/heads/main
          revision="$(git rev-parse HEAD)"
          test "$revision" = "$GITHUB_SHA"
          canonical_version="$(tr -d '[:space:]' < VERSION)"
          test -n "$canonical_version"
          build_time="$(git show -s --format=%cI "$revision")"
          version="${canonical_version}+main.${revision:0:12}"
          {
            echo "version=$version"
            echo "revision=$revision"
            echo "build_time=$build_time"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish the production image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          build-args: |
            BUILD_VERSION=${{ steps.identity.outputs.version }}
            BUILD_REVISION=${{ steps.identity.outputs.revision }}
            BUILD_TIME=${{ steps.identity.outputs.build_time }}
            BUILD_DIRTY=false
            BUILD_RELEASE=false
          push: true
          pull: true
          tags: ${{ env.IMAGE_REPOSITORY }}:main-${{ github.sha }}
          cache-from: type=gha,scope=production-amd64
          cache-to: type=gha,mode=max,scope=production-amd64,ignore-error=true
          provenance: mode=max
          sbom: true

      - name: Attest production image provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_REPOSITORY }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  qualify-production-image:
    name: Qualify production image
    needs: build-production-image
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      packages: read
      attestations: read

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up the cached CI toolchain
        uses: ./.github/actions/setup-ci

      - name: Populate main-branch Bun cache
        run: |
          bun install --frozen-lockfile
          bun install --cwd desktop --frozen-lockfile

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Admit the exact production image
        id: admission
        uses: ./.github/actions/oci-admission
        with:
          image: ${{ env.IMAGE_REPOSITORY }}@${{ needs.build-production-image.outputs.digest }}
          repository: ${{ env.IMAGE_REPOSITORY }}
          expected-workflow: flidai/leapview/.github/workflows/artifacts.yml
          source-revision: ${{ needs.build-production-image.outputs.revision }}

      - name: Qualify the immutable production image
        env:
          IMAGE_REFERENCE: ${{ steps.admission.outputs.image }}
          IMAGE_VERSION: ${{ needs.build-production-image.outputs.version }}
          IMAGE_REVISION: ${{ needs.build-production-image.outputs.revision }}
          IMAGE_BUILD_TIME: ${{ needs.build-production-image.outputs.build_time }}
        run: |
          set -euo pipefail
          immutable_image="${IMAGE_REFERENCE}"
          [[ "${immutable_image}" =~ ^ghcr\.io/flidai/leapview@sha256:[0-9a-f]{64}$ ]]
          task image:qualify:production IMAGE="${immutable_image}"
          identity="$(docker run --rm "${immutable_image}" version --json)"
          jq -e \
            --arg version "${IMAGE_VERSION}" \
            --arg revision "${IMAGE_REVISION}" \
            --arg build_time "${IMAGE_BUILD_TIME}" \
            '.version == $version and .revision == $revision and .buildTime == $build_time and .dirty == false and .development == true' \
            <<<"${identity}" >/dev/null
          printf 'Production image: `%s`\n' "${immutable_image}" >> "${GITHUB_STEP_SUMMARY}"
