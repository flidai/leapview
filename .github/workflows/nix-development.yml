name: Nix development

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'flake.nix'
      - 'flake.lock'
      - 'nix/**'
      - 'go.mod'
      - 'go.sum'
      - 'package.json'
      - 'bun.lock'
      - 'Taskfile.yml'
      - 'scripts/check_nix_development.mjs'
      - 'scripts/develop.sh'
      - 'scripts/export_nix_ci_environment.py'
      - 'scripts/nix_ci_contract.test.ts'
      - 'scripts/tests/test_nix_ci_environment.py'
      - '.github/actions/setup-ci/**'
      - 'scripts/check_nix_image.sh'
      - 'scripts/testdata/nix/**'
      - 'scripts/check_nix_runtime_security.py'
      - 'scripts/tests/test_nix_runtime_security.py'
      - 'scripts/nix_candidate_manifest.py'
      - 'scripts/tests/test_nix_candidate_manifest.py'
      - 'scripts/nix_oci_content.py'
      - 'scripts/tests/test_nix_oci_content.py'
      - 'scripts/nix_registry_content.py'
      - 'scripts/tests/test_nix_registry_content.py'
      - 'scripts/nix_signed_evidence.py'
      - 'scripts/tests/test_nix_signed_evidence.py'
      - 'scripts/generate_build_sources.sh'
      - 'pkg/apigen/**'
      - 'scripts/ensure_playwright*'
      - '.github/workflows/nix-development.yml'
  workflow_dispatch:
    inputs:
      checks:
        description: Validation lanes (pull requests always run both)
        type: choice
        default: all
        options: [all, development, image]
      contract:
        description: Existing development contract to qualify (image lane is independent)
        type: choice
        default: pr
        options: [pr, full, nightly]

permissions:
  contents: read

concurrency:
  group: nix-development-${{ github.ref }}-${{ inputs.checks || 'all' }}
  cancel-in-progress: true

jobs:
  development:
    if: ${{ (github.event_name != 'pull_request' || !github.event.pull_request.draft) && (github.event_name != 'workflow_dispatch' || inputs.checks != 'image') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
        with:
          install_url: https://releases.nixos.org/nix/nix-2.31.2/install
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Check the pinned toolchain and native compiler
        run: nix flake check --no-update-lock-file -L
      - name: Check formatting
        run: nix fmt -- --check flake.nix nix/*.nix
      - name: Exercise the pinned browser and sqlc toolchain
        run: nix develop --no-update-lock-file -c task nix:smoke
      - name: Prepare generated and embedded assets for the fresh checkout
        run: nix develop --no-update-lock-file -c task ci:prepare
      - name: Set up Terraform for deployment validation
        if: inputs.contract == 'full' || inputs.contract == 'nightly'
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: 1.13.5
          terraform_wrapper: false
      - name: Run the selected existing contract with the same development environment
        env:
          CONTRACT: ${{ inputs.contract || 'pr' }}
        run: |
          case "$CONTRACT" in
            pr) nix develop --no-update-lock-file -c task ci ;;
            full) nix develop --no-update-lock-file -c task ci:full ;;
            nightly) nix develop --no-update-lock-file -c task ci:nightly ;;
            *) echo "unknown Nix qualification contract: $CONTRACT" >&2; exit 1 ;;
          esac

  image:
    name: Application and image
    if: ${{ (github.event_name != 'pull_request' || !github.event.pull_request.draft) && (github.event_name != 'workflow_dispatch' || inputs.checks != 'development') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
        with:
          install_url: https://releases.nixos.org/nix/nix-2.31.2/install
          extra_nix_config: |
            experimental-features = nix-command flakes
            sandbox = true
      - name: Build application and container without undeclared network access
        run: nix build --no-update-lock-file .#leapview .#leapview-image --no-link -L
      - name: Qualify the exact image with PostgreSQL and browser workflows
        run: nix develop --no-update-lock-file -c bash scripts/check_nix_image.sh
      - name: Test runtime inventory and vulnerability coverage guards
        run: |
          python3 -m unittest discover -s scripts/tests -p test_nix_runtime_security.py
          python3 -m unittest discover -s scripts/tests -p test_nix_candidate_manifest.py
          python3 -m unittest discover -s scripts/tests -p test_nix_oci_content.py
          python3 -m unittest discover -s scripts/tests -p test_nix_registry_content.py
          python3 -m unittest discover -s scripts/tests -p test_nix_signed_evidence.py
          nix develop --no-update-lock-file .#runtime-security -c \
            env LEAPVIEW_TEST_NIX_REGISTRY=1 python3 -m unittest discover -s scripts/tests -p test_nix_registry_content.py
      - name: Enforce assessed Nix runtime findings (not release clearance)
        run: >-
          nix develop --no-update-lock-file .#runtime-security -c
          python3 scripts/check_nix_runtime_security.py result-image
          --evidence-dir .tmp/nix-runtime-security
      - name: Bind exact candidate identity and enforced runtime evidence
        run: |
          python3 scripts/nix_candidate_manifest.py result-image --kind application-image \
            --runtime-evidence .tmp/nix-runtime-security \
            --output .tmp/nix-runtime-security/candidate-manifest.json
          python3 scripts/nix_candidate_manifest.py result-image --kind application-image \
            --runtime-evidence .tmp/nix-runtime-security \
            --verify .tmp/nix-runtime-security/candidate-manifest.json
      - name: Bind candidate content to the converted OCI manifest (not release clearance)
        run: |
          python3 scripts/nix_oci_content.py export --layout .tmp/nix-exported-oci \
            --platform linux/amd64 --kind application-image \
            --candidate result-image .tmp/nix-runtime-security/candidate-manifest.json .tmp/nix-runtime-security
          nix develop --no-update-lock-file .#runtime-security -c \
            skopeo copy --preserve-digests oci:.tmp/nix-exported-oci:candidate oci:.tmp/nix-candidate-oci:candidate
          digest=$(python3 -c 'import json; print(json.load(open(".tmp/nix-exported-oci/index.json"))["manifests"][0]["digest"])')
          python3 scripts/nix_oci_content.py bind --layout .tmp/nix-candidate-oci \
            --manifest-digest "$digest" --platform linux/amd64 --kind application-image \
            --candidate result-image .tmp/nix-runtime-security/candidate-manifest.json .tmp/nix-runtime-security \
            --output .tmp/nix-runtime-security/oci-content-binding.json
          python3 scripts/nix_oci_content.py bind --layout .tmp/nix-candidate-oci \
            --manifest-digest "$digest" --platform linux/amd64 --kind application-image \
            --candidate result-image .tmp/nix-runtime-security/candidate-manifest.json .tmp/nix-runtime-security \
            --verify .tmp/nix-runtime-security/oci-content-binding.json
      - name: Retain runtime inventory, matching controls and unresolved findings
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nix-runtime-security-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: warn
          include-hidden-files: true
          path: |
            .tmp/nix-runtime-security/summary.json
            .tmp/nix-runtime-security/candidate-manifest.json
            .tmp/nix-runtime-security/oci-content-binding.json
            .tmp/nix-runtime-security/sbom.syft.json
            .tmp/nix-runtime-security/sbom.spdx.json
            .tmp/nix-runtime-security/runtime.syft.json
            .tmp/nix-runtime-security/runtime.grype.json
            .tmp/nix-runtime-security/runtime.assessed.grype.json
            .tmp/nix-runtime-security/assessments.vex.json
            .tmp/nix-runtime-security/controls.synthetic.syft.json
            .tmp/nix-runtime-security/controls.grype.json
            .tmp/nix-runtime-security/syft-config.json
            .tmp/nix-runtime-security/grype-config.json
      - name: Retain bounded image qualification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nix-image-qualification-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: warn
          include-hidden-files: true
          path: .tmp/nix-image-qualification/evidence/image-qualification-report.json
