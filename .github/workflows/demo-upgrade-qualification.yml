name: Qualification / Host recovery and migration

on:
  workflow_call:
    inputs:
      candidate_image:
        description: Exact admitted candidate image for final-artifact qualification
        required: false
        type: string
      candidate_revision:
        description: Exact candidate source revision
        required: false
        type: string
      final_artifact:
        description: Qualify a published immutable artifact instead of a local pre-merge image
        required: false
        default: false
        type: boolean
  workflow_dispatch:

permissions:
  contents: read
  packages: read
  attestations: read

concurrency:
  group: demo-upgrade-qualification-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  recovery:
    name: Isolated host recovery and migration boundary contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    if: ${{ !inputs.final_artifact }}
    permissions:
      contents: read
      packages: read
    steps:
      - name: Check out the candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up the pinned toolchain
        uses: ./.github/actions/setup-ci
        with:
          go-cache-restore-workload: full-validation
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Run isolated host recovery qualification
        run: task test:qualification:demo-host-recovery

  historical-transition:
    name: Schema-32 legacy access transition
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      packages: read
      attestations: read
    env:
      CANDIDATE_REVISION: ${{ inputs.candidate_revision || github.sha }}
      FINAL_ARTIFACT: ${{ inputs.final_artifact && '1' || '0' }}
      CANDIDATE_IMAGE_INPUT: ${{ inputs.candidate_image }}

    steps:
      - name: Check out the exact candidate source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.candidate_revision || github.sha }}
          fetch-depth: 0

      - name: Set up the pinned toolchain
        uses: ./.github/actions/setup-ci
        with:
          go-cache-restore-workload: full-validation
          browser: "true"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx for the local transition candidate
        if: ${{ !inputs.final_artifact }}
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Resolve the exact local candidate build identity
        id: local-identity
        if: ${{ !inputs.final_artifact }}
        env:
          SOURCE_REVISION: ${{ inputs.candidate_revision || github.sha }}
        run: |
          set -euo pipefail
          [[ "${SOURCE_REVISION}" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "${SOURCE_REVISION}"
          build_time="$(git show -s --format=%cI "${SOURCE_REVISION}")"
          echo "build_time=${build_time}" >> "$GITHUB_OUTPUT"

      - name: Build a local candidate image for pre-merge transition testing
        if: ${{ !inputs.final_artifact }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: leapview:historical-transition-local
          build-args: |
            BUILD_VERSION=historical-transition
            BUILD_REVISION=${{ inputs.candidate_revision || github.sha }}
            BUILD_TIME=${{ steps.local-identity.outputs.build_time }}
            BUILD_DIRTY=false
            BUILD_RELEASE=false
          # Restore compatible default-branch layers. Candidates do not publish
          # new cache namespaces or persistent Go cache mounts.
          cache-from: type=gha,scope=production-amd64

      - name: Verify the local candidate revision
        if: ${{ !inputs.final_artifact }}
        env:
          SOURCE_REVISION: ${{ inputs.candidate_revision || github.sha }}
        run: |
          set -euo pipefail
          docker run --rm leapview:historical-transition-local version --format json \
            | jq -e --arg revision "${SOURCE_REVISION}" '.revision == $revision and .dirty == false' >/dev/null

      - name: Admit the exact final candidate image
        id: admission
        if: ${{ inputs.final_artifact }}
        uses: ./.github/actions/oci-admission
        with:
          image: ${{ inputs.candidate_image }}
          repository: ghcr.io/flidai/leapview
          expected-workflow: flidai/leapview/.github/workflows/artifacts.yml
          # Dispatch candidates are attested by the protected caller's event
          # SHA. The fixture separately checks the image's candidate revision.
          source-revision: ${{ github.sha }}
          platform: linux/amd64
          output: ${{ runner.temp }}/oci-admission.json
          vulnerability-report: ${{ runner.temp }}/oci-vulnerability-report.json

      - name: Upload OCI vulnerability diagnostic
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: oci-vulnerability-diagnostic-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/oci-vulnerability-report.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Pull the admitted final candidate image
        if: ${{ inputs.final_artifact }}
        env:
          IMAGE: ${{ steps.admission.outputs.image }}
        run: docker pull "${IMAGE}"

      - name: Resolve candidate image identity
        id: candidate
        env:
          FINAL_IMAGE: ${{ steps.admission.outputs.image }}
          FINAL_ARTIFACT: ${{ inputs.final_artifact }}
          SOURCE_REVISION: ${{ inputs.candidate_revision || github.sha }}
        run: |
          set -euo pipefail
          [[ "${SOURCE_REVISION}" =~ ^[0-9a-f]{40}$ ]]
          if [[ "${FINAL_ARTIFACT}" == "true" ]]; then
            [[ "${FINAL_IMAGE}" =~ ^ghcr\.io/flidai/leapview@sha256:[0-9a-f]{64}$ ]]
            image="${FINAL_IMAGE}"
          else
            image="$(docker image inspect leapview:historical-transition-local --format '{{.Id}}')"
            [[ "${image}" =~ ^sha256:[0-9a-f]{64}$ ]]
          fi
          {
            echo "image=${image}"
            echo "revision=${SOURCE_REVISION}"
          } >> "${GITHUB_OUTPUT}"

      - name: Prepare the real publication browser validator
        run: bun install --frozen-lockfile

      - name: Run the required historical transition fixture
        env:
          LEAPVIEW_HISTORICAL_TRANSITION_REQUIRED: "1"
          LEAPVIEW_HISTORICAL_TRANSITION_CANDIDATE_IMAGE: ${{ steps.candidate.outputs.image }}
          LEAPVIEW_HISTORICAL_TRANSITION_CANDIDATE_REVISION: ${{ steps.candidate.outputs.revision }}
          LEAPVIEW_HISTORICAL_TRANSITION_EVIDENCE: ${{ runner.temp }}/historical-transition/transition.json
          LEAPVIEW_HISTORICAL_TRANSITION_FINAL_ARTIFACT: ${{ inputs.final_artifact && '1' || '0' }}
          LEAPVIEW_HISTORICAL_TRANSITION_ADMISSION: ${{ runner.temp }}/oci-admission.json
        run: task test:qualification:historical-transition

      - name: Upload passed historical transition receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: historical-transition-${{ github.run_attempt }}
          path: ${{ runner.temp }}/historical-transition/transition.json
          if-no-files-found: error
          retention-days: 90
