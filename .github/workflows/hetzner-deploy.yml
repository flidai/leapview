name: Ephemeral Hetzner deployment

on:
  workflow_dispatch:
    inputs:
      image_digest:
        description: Immutable LeapView image reference
        required: true
        type: string
      source_revision:
        description: Full source commit recorded by the image attestation
        required: true
        type: string
      transition_policy_url:
        description: HTTPS URL for the candidate-bound release-transition-policy.json
        required: true
        type: string
      transition_policy_sha256:
        description: SHA-256 of the candidate-bound transition policy
        required: true
        type: string

permissions:
  contents: read
  id-token: write
  attestations: read
  packages: read

concurrency:
  group: ephemeral-hetzner-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy, recover, and destroy
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    environment: leapview-ephemeral-qualification
    env:
      TF_IN_AUTOMATION: "true"
      TF_VAR_name: leapview-ci-${{ github.run_id }}
      TF_VAR_admin_email: ci-${{ github.run_id }}@leapview.local
      TF_VAR_leapview_image: ${{ inputs.image_digest }}
      TF_VAR_ssh_allowed_cidrs: '["203.0.113.10/32"]'

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Log in to GHCR for admission
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Admit the exact ephemeral deployment image
        id: admission
        uses: ./.github/actions/oci-admission
        with:
          image: ${{ inputs.image_digest }}
          repository: ghcr.io/flidai/leapview
          expected-workflow: flidai/leapview/.github/workflows/artifacts.yml
          source-revision: ${{ inputs.source_revision }}

      - name: Pin Terraform to the admitted image
        run: echo "TF_VAR_leapview_image=${{ steps.admission.outputs.image }}" >> "$GITHUB_ENV"

      - name: Fetch verified candidate-bound transition policy
        env:
          POLICY_URL: ${{ inputs.transition_policy_url }}
          POLICY_SHA256: ${{ inputs.transition_policy_sha256 }}
        run: |
          [[ "$POLICY_URL" == https://* ]]
          [[ "$POLICY_SHA256" =~ ^[0-9a-f]{64}$ ]]
          policy="$RUNNER_TEMP/release-transition-policy.json"
          curl --fail --location --retry 4 --retry-all-errors --silent --show-error \
            --output "$policy" "$POLICY_URL"
          printf '%s  %s\n' "$POLICY_SHA256" "$policy" | sha256sum --check
          echo "TF_VAR_release_transition_policy_path=$policy" >> "$GITHUB_ENV"

      - name: Fetch ephemeral infrastructure secrets
        uses: Infisical/secrets-action@6cd3f7c0e4cc0d2395ee4ef414eb6eeb5d3e73db # v1.0.17
        with:
          method: "oidc"
          identity-id: "6aac9c3e-4f33-45b5-aa4e-884839b950a7"
          oidc-audience: "https://github.com/flidai"
          domain: "https://us.infisical.com"
          project-slug: "leapview"
          env-slug: "prod"
          secret-path: "/hetzner-qualification/infrastructure"

      - name: Configure Terraform credentials
        run: |
          test -n "$HCLOUD_TOKEN"
          echo "TF_VAR_hcloud_token=$HCLOUD_TOKEN" >> "$GITHUB_ENV"
          echo "HCLOUD_TOKEN=" >> "$GITHUB_ENV"

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false

      - name: Restrict SSH to this runner
        run: |
          ssh-keygen -q -t ed25519 -N '' -f "$RUNNER_TEMP/leapview-ci"
          runner_ip="$(curl -4fsS https://api.ipify.org)"
          [[ "$runner_ip" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "TF_VAR_ssh_public_key_path=$RUNNER_TEMP/leapview-ci.pub" >> "$GITHUB_ENV"
          echo "TF_VAR_ssh_allowed_cidrs=[\"$runner_ip/32\"]" >> "$GITHUB_ENV"

      - name: Initialize Terraform
        working-directory: deploy/hetzner
        run: terraform init -input=false

      - name: Validate deployment
        working-directory: deploy/hetzner
        run: |
          terraform validate
          terraform test

      - name: Apply ephemeral deployment
        working-directory: deploy/hetzner
        run: terraform apply -input=false -auto-approve

      - name: Wait for provisioning
        working-directory: deploy/hetzner
        run: |
          server_ip="$(terraform output -raw server_ipv4)"
          for _ in $(seq 1 90); do
            if ssh -i "$RUNNER_TEMP/leapview-ci" -o StrictHostKeyChecking=accept-new -o ConnectTimeout=5 root@"$server_ip" 'cloud-init status --wait'; then
              exit 0
            fi
            sleep 5
          done
          exit 1

      - name: Verify public and container health
        working-directory: deploy/hetzner
        run: |
          url="$(terraform output -raw url)"
          server_ip="$(terraform output -raw server_ipv4)"
          public_ready=false
          for _ in $(seq 1 60); do
            if curl -fsS --connect-timeout 5 --max-time 10 "$url/healthz" >/dev/null 2>&1 && \
              curl -fsS --connect-timeout 5 --max-time 10 "$url/readyz" >/dev/null 2>&1; then
              public_ready=true
              break
            fi
            sleep 5
          done
          if [[ "$public_ready" != "true" ]]; then
            echo "Public HTTPS did not become ready" >&2
            ssh -i "$RUNNER_TEMP/leapview-ci" root@"$server_ip" 'leapviewctl status' || true
            ssh -i "$RUNNER_TEMP/leapview-ci" root@"$server_ip" 'leapviewctl logs caddy' || true
            exit 1
          fi
          curl -fsS -L "$url/" >/dev/null
          ssh -i "$RUNNER_TEMP/leapview-ci" root@"$server_ip" 'leapviewctl status'

      - name: Consume first-login credentials
        working-directory: deploy/hetzner
        run: |
          server_ip="$(terraform output -raw server_ipv4)"
          credentials="$(ssh -i "$RUNNER_TEMP/leapview-ci" root@"$server_ip" 'leapviewctl first-login')"
          jq -e '.email and .temporaryPassword and .publisherToken and .publisherTokenExpiresAt' <<<"$credentials" >/dev/null
          if ssh -i "$RUNNER_TEMP/leapview-ci" root@"$server_ip" 'leapviewctl first-login'; then
            echo "first-login credentials were retrievable more than once" >&2
            exit 1
          fi

      - name: Verify backup and restore
        working-directory: deploy/hetzner
        run: |
          server_ip="$(terraform output -raw server_ipv4)"
          ssh -i "$RUNNER_TEMP/leapview-ci" root@"$server_ip" 'bash -se' <<'REMOTE'
          install -m 0600 /dev/null /etc/leapview/restic.env
          printf '%s\n' \
            'RESTIC_REPOSITORY=/opt/leapview/qualification-restic' \
            'RESTIC_PASSWORD=ephemeral-qualification-only' \
            > /etc/leapview/restic.env
          set -a
          source /etc/leapview/restic.env
          set +a
          leapview-backup-hook --init
          archive="$(leapviewctl backup)"
          restore_root=/opt/leapview/qualification-restic-restore
          restic restore latest --tag leapview --target "$restore_root"
          cmp "$archive" "$restore_root$archive"
          cmp "$archive.sha256" "$restore_root$archive.sha256"
          leapviewctl restore "$archive"
          leapview-backup-hook --maintain
          leapviewctl status
          REMOTE

      - name: Destroy ephemeral deployment
        if: always()
        working-directory: deploy/hetzner
        run: |
          if [[ -d .terraform ]]; then
            terraform destroy -input=false -auto-approve
          fi
