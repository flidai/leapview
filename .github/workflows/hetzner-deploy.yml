name: Deploy / Ephemeral Hetzner

on:
  workflow_dispatch:
    inputs:
      image_digest:
        description: Immutable LeapView image reference
        required: true
        type: string
      source_revision:
        description: Full source commit recorded by the image attestation
        required: true
        type: string
permissions:
  contents: read
  id-token: write
  attestations: read
  packages: read

concurrency:
  group: ephemeral-hetzner-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Prepare fresh host; first-install acceptance pending
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    environment: leapview-ephemeral-qualification
    env:
      TF_IN_AUTOMATION: "true"
      TF_VAR_name: leapview-ci-${{ github.run_id }}
      TF_VAR_target_id: leapview-ci-${{ github.run_id }}
      TF_VAR_admin_email: ci-${{ github.run_id }}@leapview.local
      TF_VAR_leapview_image: ${{ inputs.image_digest }}
      TF_VAR_ssh_allowed_cidrs: '["203.0.113.10/32"]'

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Log in to GHCR for admission
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Admit the exact ephemeral deployment image
        id: admission
        uses: ./.github/actions/oci-admission
        with:
          image: ${{ inputs.image_digest }}
          repository: ghcr.io/flidai/leapview
          expected-workflow: flidai/leapview/.github/workflows/artifacts.yml
          source-revision: ${{ inputs.source_revision }}

      - name: Pin Terraform to the admitted image
        run: echo "TF_VAR_leapview_image=${{ steps.admission.outputs.image }}" >> "$GITHUB_ENV"

      - name: Fetch ephemeral infrastructure secrets
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d # v1.0.18
        with:
          method: "oidc"
          identity-id: "6aac9c3e-4f33-45b5-aa4e-884839b950a7"
          oidc-audience: "https://github.com/flidai"
          domain: "https://us.infisical.com"
          project-slug: "leapview"
          env-slug: "prod"
          secret-path: "/hetzner-qualification/infrastructure"

      - name: Configure Terraform credentials
        run: |
          test -n "$HCLOUD_TOKEN"
          echo "TF_VAR_hcloud_token=$HCLOUD_TOKEN" >> "$GITHUB_ENV"
          echo "HCLOUD_TOKEN=" >> "$GITHUB_ENV"

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false

      - name: Restrict SSH to this runner
        run: |
          ssh-keygen -q -t ed25519 -N '' -f "$RUNNER_TEMP/leapview-ci"
          runner_ip="$(curl -4fsS https://api.ipify.org)"
          [[ "$runner_ip" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "TF_VAR_ssh_public_key_path=$RUNNER_TEMP/leapview-ci.pub" >> "$GITHUB_ENV"
          echo "TF_VAR_ssh_allowed_cidrs=[\"$runner_ip/32\"]" >> "$GITHUB_ENV"

      - name: Initialize Terraform
        working-directory: deploy/hetzner
        run: terraform init -input=false

      - name: Validate deployment
        working-directory: deploy/hetzner
        run: |
          terraform validate
          terraform test

      - name: Apply ephemeral deployment
        working-directory: deploy/hetzner
        run: terraform apply -input=false -auto-approve

      - name: Wait for provisioning
        working-directory: deploy/hetzner
        run: |
          server_ip="$(terraform output -raw server_ipv4)"
          for _ in $(seq 1 90); do
            if ssh -i "$RUNNER_TEMP/leapview-ci" -o StrictHostKeyChecking=accept-new -o ConnectTimeout=5 root@"$server_ip" 'cloud-init status --wait'; then
              exit 0
            fi
            sleep 5
          done
          exit 1

      - name: Report private bootstrap and first-install acceptance pending
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## Host preparation complete; first-install acceptance pending

          Terraform created a fresh disposable Ubuntu host and `cloud-init status --wait` completed.
          Cloud-init runs only `leapview-bootstrap prepare-host`. This workflow has no private
          delivery channel for `/run/leapview/operator-bootstrap.json`, which must contain external
          PostgreSQL credentials and reviewed physical-pool evidence. It did not install LeapView,
          check application health, consume first-login credentials, or qualify recovery. This run
          is infrastructure preparation only, not host/application acceptance.
          EOF
          echo "::warning title=First-install acceptance pending::Private PostgreSQL and pool bootstrap input has no automated delivery channel."

      - name: Destroy ephemeral deployment
        if: always()
        working-directory: deploy/hetzner
        run: |
          if [[ -d .terraform ]]; then
            terraform destroy -input=false -auto-approve
          fi
