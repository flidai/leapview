name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, stacked, labeled, unlabeled]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.stack.id || github.ref }}
  cancel-in-progress: true

env:
  DEFERRED: ${{ github.event_name == 'pull_request' && github.event.pull_request.stack != null && github.event.pull_request.stack.position < github.event.pull_request.stack.size }}

jobs:
  prepare:
    name: Plan PR validation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      apigen_validation: ${{ steps.plan.outputs.apigen_validation }}
      go_packages_validation: ${{ steps.plan.outputs.go_packages_validation }}
      go_application_validation: ${{ steps.plan.outputs.go_application_validation }}
      frontend_validation: ${{ steps.plan.outputs.frontend_validation }}
      postgres_isolation_validation: ${{ steps.plan.outputs.postgres_isolation_validation }}
      spatial_tile_benchmarks: ${{ steps.plan.outputs.spatial_tile_benchmarks }}
      dbt_warehouse_boundary_validation: ${{ steps.plan.outputs.dbt_warehouse_boundary_validation }}
      docs_validation: ${{ steps.plan.outputs.docs_validation }}
      quality_validation: ${{ steps.plan.outputs.quality_validation }}
      frontend_matrix: ${{ steps.plan.outputs.frontend_matrix }}

    steps:
      - name: Check out the exact candidate and full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Set up planner Go toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Plan cumulative candidate validation
        id: plan
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number || 0 }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          STACK_BASE: ${{ github.event.pull_request.stack != null && format('refs/remotes/origin/{0}', github.event.repository.default_branch) || '' }}
        run: |
          go run ./internal/app/tools/ciplan \
            --event "$GITHUB_EVENT_NAME" --base "$BASE_SHA" --head "$GITHUB_SHA" \
            --stack-base "$STACK_BASE" --deferred="$DEFERRED" \
            --pr-number "$PR_NUMBER" --labels "$PR_LABELS" \
            --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" \
            --github-output "$GITHUB_OUTPUT" --github-summary "$GITHUB_STEP_SUMMARY"
      - name: Publish versioned selection evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-plan
          path: ci-plan.json
          if-no-files-found: error
          overwrite: true
          retention-days: 30
  apigen-validation:
    name: APIGen tests (PR)
    needs: [prepare]
    if: needs.prepare.outputs.apigen_validation == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up the cached CI toolchain
        uses: ./.github/actions/setup-ci
        with:
          browser: "false"

      - name: Run APIGen validation
        run: task ci:lane:go:apigen

  go-packages-validation:
    name: Go package tests (PR)
    needs: [prepare]
    if: needs.prepare.outputs.go_packages_validation == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Check out pinned DuckDB metadata sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: duckdb/duckdb
          ref: 08e34c447bae34eaee3723cac61f2878b6bdf787
          path: .duckdb-source
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            extension/core_functions
            src/include/duckdb/storage/serialization
            src/include/duckdb/common/enums/aggregate_handling.hpp
            src/include/duckdb/common/enums/cte_materialize.hpp
            src/include/duckdb/common/enums/expression_type.hpp
            src/include/duckdb/common/enums/order_type.hpp
            src/include/duckdb/common/enums/set_operation_type.hpp
            src/include/duckdb/common/types.hpp
            src/include/duckdb/parser/expression/window_expression.hpp

      - name: Set up the cached CI toolchain
        uses: ./.github/actions/setup-ci
        with:
          browser: "false"

      - name: Validate Prometheus rules and fixtures
        run: task observability:check

      - name: Prepare generated and embedded assets
        run: node scripts/ci_watchdog.mjs --timeout-seconds 420 --attempts 2 -- task ci:prepare

      - name: Run Go package validation
        run: task ci:lane:go:packages

      - name: Verify generated artifacts
        run: task generated:check

      - name: Verify DuckDB metadata against pinned source
        env:
          DUCKDB_SOURCE: ${{ github.workspace }}/.duckdb-source
        run: task duckdbsql:source:check

  go-application-validation:
    name: Go application tests (PR)
    needs: [prepare]
    if: needs.prepare.outputs.go_application_validation == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up the cached CI toolchain
        uses: ./.github/actions/setup-ci
        with:
          browser: "false"

      - name: Prepare generated and embedded assets
        run: node scripts/ci_watchdog.mjs --timeout-seconds 420 --attempts 2 -- task ci:prepare

      - name: Run Go application validation
        run: task ci:lane:go:application

  frontend-validation:
    name: Frontend tests (PR, ${{ matrix.shard }})
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.frontend_matrix) }}
    needs: [prepare]
    if: needs.prepare.outputs.frontend_validation == 'true'
    runs-on: ubuntu-24.04
    # Browser system dependencies come from Ubuntu mirrors and can consume
    # most of the old budget before validation starts. Keep the lane bounded
    # while leaving room for transient mirror retries.
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up the cached CI toolchain
        uses: ./.github/actions/setup-ci
        with:
          browser: "true"

      - name: Prepare generated and embedded assets
        run: node scripts/ci_watchdog.mjs --timeout-seconds 420 --attempts 2 -- task ci:prepare

      - name: Run frontend validation
        run: task ci:lane:frontend:shard SHARD=${{ matrix.shard }}

      - name: Verify generated artifacts
        run: task generated:check

      - name: Upload frontend bundle evidence
        if: ${{ always() && matrix.shard == 'core' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-bundle-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: .tmp/frontend-bundle-evidence.json
          include-hidden-files: true
          retention-days: 90
          if-no-files-found: error

  postgres-isolation-validation:
    name: PostgreSQL topology isolation (PR)
    needs: [prepare]
    if: needs.prepare.outputs.postgres_isolation_validation == 'true'
    runs-on: ubuntu-24.04
    # The native qualification starts a pinned PostgreSQL 18 sidecar, runs
    # the canonical init hook, and exercises a deliberate fail-closed case.
    # Keep enough room for a cold image pull while bounding the required lane.
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up the cached CI toolchain
        uses: ./.github/actions/setup-ci
        with:
          browser: "false"

      - name: Provision PostgreSQL test topology
        run: task postgres:test:up

      - name: Check PostgreSQL topology isolation
        run: task postgres:test:check

      - name: Run native PostgreSQL qualification contract
        run: task test:qualification:native-postgres

      - name: Tear down PostgreSQL test topology
        if: always()
        run: task postgres:test:down

  spatial-tile-benchmarks:
    name: Spatial tile benchmarks (PR)
    needs: [prepare]
    if: needs.prepare.outputs.spatial_tile_benchmarks == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up the cached CI toolchain
        uses: ./.github/actions/setup-ci
        with:
          browser: "false"

      - name: Record cold, pan, raw, and forced-fallback benchmarks
        run: |
          go test ./internal/analytics/query -run '^$' -bench '^BenchmarkSpatial' -benchmem -benchtime=1x -count=10 | tee spatial-tile-backend.txt

      - name: Record warm child-tile byte-cache benchmark
        run: |
          go test ./internal/analytics/resultcache -run '^$' -bench '^BenchmarkWarmTileByteLookup$' -benchmem -benchtime=100x -count=10 | tee spatial-tile-cache.txt

      - name: Upload spatial benchmark evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: spatial-tile-benchmarks
          path: |
            spatial-tile-backend.txt
            spatial-tile-cache.txt
          retention-days: 30

  dbt-warehouse-boundary-validation:
    name: dbt physical contract (PR)
    needs: [prepare]
    if: needs.prepare.outputs.dbt_warehouse_boundary_validation == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up pinned Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13.14"
          cache: pip
          cache-dependency-path: examples/dbt-warehouse-boundary/dbt/requirements.txt

      - name: Install the pinned dbt toolchain
        run: python -m pip install --disable-pip-version-check --requirement examples/dbt-warehouse-boundary/dbt/requirements.txt

      - name: Set up the cached LeapView CI toolchain
        uses: ./.github/actions/setup-ci
        with:
          browser: "false"

      - name: Run real dbt Parquet through the headless LeapView lifecycle
        run: DBT_BIN="$(command -v dbt)" task dbt:warehouse:qualify

      - name: Stop the isolated PostgreSQL development service
        if: always()
        run: task postgres:dev:down

  docs-validation:
    name: Documentation and public site (PR)
    needs: [prepare]
    if: needs.prepare.outputs.docs_validation == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Set up the cached CI toolchain
        uses: ./.github/actions/setup-ci
        with:
          browser: "true"
      - name: Prepare generated and embedded assets
        run: node scripts/ci_watchdog.mjs --timeout-seconds 420 --attempts 2 -- task ci:prepare
      - name: Validate documentation and embedded site contracts
        run: task ci:test:docs-site
      - name: Verify generated artifacts
        run: task generated:check

  quality-validation:
    name: Cross-language quality (PR)
    needs: [prepare]
    if: needs.prepare.outputs.quality_validation == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Set up the cached CI toolchain
        uses: ./.github/actions/setup-ci
        with:
          browser: "false"
      - name: Prepare generated and embedded assets
        run: node scripts/ci_watchdog.mjs --timeout-seconds 420 --attempts 2 -- task ci:prepare
      - name: Run cross-language quality validation
        run: task ci:lane:quality

  ci-gate:
    name: CI gate
    if: ${{ always() }}
    needs: [prepare, apigen-validation, go-packages-validation, go-application-validation, frontend-validation, postgres-isolation-validation, spatial-tile-benchmarks, dbt-warehouse-boundary-validation, docs-validation, quality-validation]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Require successful planning
        env:
          PREPARE_RESULT: ${{ needs.prepare.result }}
        run: test "$PREPARE_RESULT" = success
      - name: Check out the gate contract
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Verify independent review of changed performance governance
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_REVISION: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          # Use the base branch's guard once installed. A candidate cannot
          # authorize its baseline by changing the checker in the same PR.
          guard=scripts/performance_baseline_review.mjs
          base_revision="$BASE_REVISION"
          if [[ -z "$base_revision" ]]; then
            # workflow_dispatch has no pull_request payload. Resolve exactly
            # one open PR for this head before trusting its main base.
            base_revision="$(gh api --paginate --slurp \
              "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls?per_page=100" |
              jq -r --arg sha "$GITHUB_SHA" '
                [.[][] | select(.state == "open" and .base.ref == "main" and .head.sha == $sha) | .base.sha] |
                if length == 1 then .[0] else error("manual CI requires exactly one open PR to main at this commit") end
              ')"
          fi
          if [[ ! "$base_revision" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "performance review base revision is not a full commit SHA" >&2
            exit 1
          fi
          if git cat-file -e "$base_revision:$guard" 2>/dev/null; then
            git show "$base_revision:$guard" > "$RUNNER_TEMP/performance-baseline-review.mjs"
            guard="$RUNNER_TEMP/performance-baseline-review.mjs"
          else
            # First installation has no trusted base guard; the candidate
            # guard is the explicit bootstrap fallback until the next PR.
            echo "performance review guard is absent from the trusted base; using candidate bootstrap guard" >&2
          fi
          node "$guard"
      - name: Set up gate Go toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Read the exact plan artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ci-plan
      - name: Require every planned validation result
        env:
          PREPARE_RESULT: ${{ needs.prepare.result }}
          APIGEN_RESULT: ${{ needs.apigen-validation.result }}
          GO_PACKAGES_RESULT: ${{ needs.go-packages-validation.result }}
          GO_APPLICATION_RESULT: ${{ needs.go-application-validation.result }}
          FRONTEND_RESULT: ${{ needs.frontend-validation.result }}
          POSTGRES_ISOLATION_RESULT: ${{ needs.postgres-isolation-validation.result }}
          SPATIAL_BENCHMARK_RESULT: ${{ needs.spatial-tile-benchmarks.result }}
          DBT_WAREHOUSE_RESULT: ${{ needs.dbt-warehouse-boundary-validation.result }}
          DOCS_RESULT: ${{ needs.docs-validation.result }}
          QUALITY_RESULT: ${{ needs.quality-validation.result }}
          FRONTEND_MATRIX: ${{ needs.prepare.outputs.frontend_matrix }}
        run: |
          jq -n '{
            "prepare": env.PREPARE_RESULT,
            "apigen-validation": env.APIGEN_RESULT,
            "go-packages-validation": env.GO_PACKAGES_RESULT,
            "go-application-validation": env.GO_APPLICATION_RESULT,
            "frontend-validation": env.FRONTEND_RESULT,
            "postgres-isolation-validation": env.POSTGRES_ISOLATION_RESULT,
            "spatial-tile-benchmarks": env.SPATIAL_BENCHMARK_RESULT,
            "dbt-warehouse-boundary-validation": env.DBT_WAREHOUSE_RESULT,
            "docs-validation": env.DOCS_RESULT,
            "quality-validation": env.QUALITY_RESULT
          }' > ci-results.json
          go run ./internal/app/tools/ciplan gate --plan ci-plan.json --results ci-results.json \
            --expected-head "$GITHUB_SHA" --expected-run-id "$GITHUB_RUN_ID" \
            --expected-attempt "$GITHUB_RUN_ATTEMPT" --expected-deferred="$DEFERRED" \
            --frontend-matrix "$FRONTEND_MATRIX" --github-summary "$GITHUB_STEP_SUMMARY"
