name: October CI efficiency screening

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: october-ci-efficiency-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci-efficiency:
    name: Prospective application compile screening (12 arms)
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      STUDY_SOURCE: d197a5e44d36a4faf5cbaa79d1a5082321d77122
      STUDY_TREE: 499ae5f1d280795e0066752cb2395d230faa88f6
      STUDY_WORKFLOW_SHA: ${{ github.workflow_sha }}
      STUDY_DISPATCH_SHA: ${{ github.sha }}
      STUDY_ROOT: ${{ runner.temp }}/october-ci-efficiency
      GOMAXPROCS: "2"
      GOMEMLIMIT: 2GiB
      GOFLAGS: -p=1 -tags=duckdb_arrow -mod=readonly
      GOENV: "off"
      GOWORK: "off"
      GOTOOLCHAIN: local
      CGO_ENABLED: "1"
      LEAPVIEW_POSTGRES_CONFORMANCE_SKIP: "1"
    steps:
      - name: Check out the exact tested source, independently of the workflow branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: d197a5e44d36a4faf5cbaa79d1a5082321d77122
          fetch-depth: 0
          persist-credentials: false

      - name: Reserve owned evidence and record the workflow identity
        shell: bash
        run: |
          set -euo pipefail
          mkdir "$STUDY_ROOT"
          mkdir "$STUDY_ROOT/artifact"
          test "$(git rev-parse HEAD)" = "$STUDY_SOURCE"
          test "$(git rev-parse HEAD^{tree})" = "$STUDY_TREE"
          test -z "$(git status --porcelain)"
          git show "$STUDY_WORKFLOW_SHA:.github/workflows/ci.yml" > "$STUDY_ROOT/artifact/workflow.yml"
          printf 'GOCACHE=%s\n' "$STUDY_ROOT/preparation-cache" >> "$GITHUB_ENV"
          printf 'GOMODCACHE=%s\n' "$STUDY_ROOT/module-cache" >> "$GITHUB_ENV"

      - name: Set up the locked Nix validation toolchain
        uses: ./.github/actions/setup-ci
        with:
          profile: validation
          browser: "false"

      - name: Prepare canonical generated and native fixture inputs outside timing
        shell: bash
        run: |
          set -euo pipefail
          unset LEAPVIEW_POSTGRES_CONFORMANCE_REQUIRED DEBUG DEBUG_FILE
          task ci:prepare > "$STUDY_ROOT/artifact/preparation.log" 2>&1
          task generated:check >> "$STUDY_ROOT/artifact/preparation.log" 2>&1
          test "$(git rev-parse HEAD)" = "$STUDY_SOURCE"
          test "$(git rev-parse HEAD^{tree})" = "$STUDY_TREE"
          test -z "$(git status --porcelain --untracked-files=no)"

      - name: Declare prospective hosted protocol and resource admission
        shell: bash
        run: |
          set -euo pipefail
          unset LEAPVIEW_POSTGRES_CONFORMANCE_REQUIRED DEBUG DEBUG_FILE
          python3 - <<'PY'
          import hashlib, json, os, shutil, subprocess, time
          from pathlib import Path
          root = Path(os.environ['STUDY_ROOT'])
          artifact = root / 'artifact'
          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          def digest(path):
              with Path(path).open('rb') as file:
                  return hashlib.file_digest(file, 'sha256').hexdigest()
          allowed = sorted(os.sched_getaffinity(0))
          if len(allowed) < 2:
              raise SystemExit('two admitted CPUs are required')
          memory = dict((line.split(':')[0], int(line.split()[1])) for line in Path('/proc/meminfo').read_text().splitlines())
          disk = shutil.disk_usage(root)
          cpus = allowed[:2]
          drivers = ['performance_ci_study.py', 'performance_process.py', 'performance_capacity.py',
                     'performance_ci_inputs.mjs', 'performance_ci_events.mjs', 'go_receipts.mjs',
                     'audit_source.mjs', 'go_receipt_index.mjs']
          inventory = [{'path': 'scripts/' + name, 'sha256': digest('scripts/' + name)} for name in drivers]
          protocol = {
              'createdAtUnixSeconds': time.time(), 'issue': 'FAI-1106',
              'kind': 'prospective hosted application-only CI screening; separate from VPS population',
              'source': {'commit': git('rev-parse', 'HEAD'), 'tree': git('rev-parse', 'HEAD^{tree}')},
              'workflow': {'commit': os.environ['STUDY_WORKFLOW_SHA'], 'dispatchCommit': os.environ['STUDY_DISPATCH_SHA'],
                           'sha256': digest(artifact / 'workflow.yml')},
              'host': {'runnerOS': os.environ.get('RUNNER_OS'), 'runnerArch': os.environ.get('RUNNER_ARCH'),
                       'runnerName': os.environ.get('RUNNER_NAME'), 'imageOS': os.environ.get('ImageOS'),
                       'imageVersion': os.environ.get('ImageVersion'), 'runID': os.environ.get('GITHUB_RUN_ID'),
                       'runAttempt': os.environ.get('GITHUB_RUN_ATTEMPT'),
                       'kernel': subprocess.check_output(['uname', '-srmo'], text=True).strip(),
                       'cpu': subprocess.check_output(['lscpu', '-J'], text=True),
                       'memory': Path('/proc/meminfo').read_text(), 'disk': {'free': disk.free, 'total': disk.total},
                       'affinityBefore': allowed, 'affinityStudy': cpus},
              'toolchain': {'nix': subprocess.check_output(['nix', '--version'], text=True).strip(),
                            'go': subprocess.check_output(['go', 'version'], text=True).strip(),
                            'node': subprocess.check_output(['node', '--version'], text=True).strip(),
                            'bun': subprocess.check_output(['bun', '--version'], text=True).strip(),
                            'python': subprocess.check_output(['python3', '--version'], text=True).strip(),
                            'nixLockSHA256': digest('flake.lock')},
              'environment': {'GOMAXPROCS': '2', 'GOMEMLIMIT': '2GiB', 'GOFLAGS': '-tags=duckdb_arrow -p=1 -mod=readonly',
                              'GOENV': 'off', 'GOWORK': 'off', 'GOTOOLCHAIN': 'local', 'CGO_ENABLED': '1',
                              'LEAPVIEW_POSTGRES_CONFORMANCE_SKIP': '1', 'LEAPVIEW_POSTGRES_CONFORMANCE_REQUIRED': 'unset'},
              'schedule': 'unchanged harness: three paired cold/warm screens, alternating maintained/compile-once order, 12 arms total',
              'cache': 'six initially empty private Go build caches; warm arms reuse only their own cold-arm cache; module cache intentionally prepared; preparation/input-probe cache is separate',
              'preparation': 'canonical task ci:prepare and generated:check outside timing, separate preparation GOCACHE; no experimental cache exists yet',
              'command': ['python3', 'scripts/performance_ci_study.py', str(root / 'study')],
              'drivers': inventory, 'timeoutSeconds': 10800, 'rssStopKiB': 4194304,
              'resourceAdmission': {'minimumFreeDiskBytes': 24 * 1024**3, 'minimumAvailableMemoryKiB': 6 * 1024**2,
                                    'note': 'prospective admission thresholds, not a predicted peak; actual hardware and resources recorded before start'},
              'observer': {'intervalSeconds': 1, 'processRSSIntervalSeconds': 0.1,
                           'paths': ['/proc/stat', '/proc/loadavg', '/proc/meminfo', '/proc/pressure/cpu', '/proc/pressure/memory', '/proc/pressure/io'],
                           'overhead': 'observer and process-tree watcher share the admitted two CPUs; included in execution condition'},
              'stop': 'first inner failure, timeout, RSS/OOM/cleanup/input/coverage mismatch or outer 3h timeout; no selective retries or extension',
              'interpretation': 'three screening pairs per condition only; no production capacity/adoption/reference acceptance; never mix these rows with VPS measurements',
              'artifacts': 'allowlisted JSON and logs only, maximum256MiB; binaries and Go/module caches excluded; failed/incomplete metrics retained',
          }
          (artifact / 'hosted-protocol.json').write_text(json.dumps(protocol, indent=2) + '\n')
          if disk.free < protocol['resourceAdmission']['minimumFreeDiskBytes'] or memory['MemAvailable'] < protocol['resourceAdmission']['minimumAvailableMemoryKiB']:
              raise SystemExit('host resource admission failed; retained prospective protocol')
          if protocol['source'] != {'commit': os.environ['STUDY_SOURCE'], 'tree': os.environ['STUDY_TREE']}:
              raise SystemExit('frozen tested source differs')
          if (root / 'study').exists():
              raise SystemExit('observation output already exists')
          PY

      - name: Run the unchanged 12-arm study once with bounded owned resources
        shell: bash
        run: |
          set -euo pipefail
          unset LEAPVIEW_POSTGRES_CONFORMANCE_REQUIRED DEBUG DEBUG_FILE
          python3 - <<'PY'
          import hashlib, json, os, sys, threading, time
          from pathlib import Path

          def observe_host(log_path, paths, stop, state, read_path=lambda source: Path(source).read_text()):
              try:
                  with log_path.open('x') as log:
                      while True:
                          row = {'monotonicSeconds': time.monotonic(), 'utc': time.strftime('%Y-%m-%dT%H:%M:%SZ', time.gmtime())}
                          for source in paths:
                              try:
                                  row[source] = read_path(source)
                              except (FileNotFoundError, PermissionError):
                                  row[source] = None
                          log.write(json.dumps(row) + '\n')
                          log.flush()
                          state['samples'] += 1
                          if stop.wait(1):
                              break
              except Exception as error:
                  state['errors'].append(str(error))
              finally:
                  state['terminal'] = True

          def finalize_outer(protocol, artifact, execution, failure, started, observer, thread, source_identity, digest_file):
              source_after = source_error = None
              evidence_errors = []
              try:
                  source_after = source_identity()
              except Exception as error:
                  source_error = str(error)
              def safe_digest(name):
                  try:
                      return digest_file(artifact / name)
                  except Exception as error:
                      evidence_errors.append({'file': name, 'error': str(error)})
                      return None
              observer_healthy = observer['terminal'] and not thread.is_alive() and observer['samples'] > 0 and not observer['errors']
              receipt = {'protocolSHA256': safe_digest('hosted-protocol.json'), 'execution': execution,
                         'failure': failure, 'wallSeconds': time.monotonic() - started,
                         'sourceAfter': source_after, 'sourceGuardError': source_error,
                         'sourceUnchanged': not source_error and source_after == protocol['source'],
                         'observer': {**observer, 'threadTerminated': not thread.is_alive(), 'healthy': observer_healthy},
                         'rawLogSHA256': safe_digest('study-outer.log'),
                         'observationsSHA256': safe_digest('host-observations.jsonl'), 'evidenceErrors': evidence_errors}
              passed = not failure and not evidence_errors and receipt['sourceUnchanged'] and observer_healthy and execution and execution['exitCode'] == 0 and execution['terminationReason'] is None and execution['cleanupComplete']
              receipt['accepted'] = bool(passed)
              (artifact / 'outer-receipt.json').write_text(json.dumps(receipt, indent=2) + '\n')
              return receipt

          root = Path(os.environ['STUDY_ROOT'])
          artifact = root / 'artifact'
          protocol = json.loads((artifact / 'hosted-protocol.json').read_text())
          for item in protocol['drivers']:
              with Path(item['path']).open('rb') as file:
                  if hashlib.file_digest(file, 'sha256').hexdigest() != item['sha256']:
                      raise SystemExit('declared driver changed before launch')
          os.sched_setaffinity(0, protocol['host']['affinityStudy'])
          if sorted(os.sched_getaffinity(0)) != protocol['host']['affinityStudy']:
              raise SystemExit('CPU affinity differs')
          sys.path.insert(0, str(Path.cwd() / 'scripts'))
          from performance_process import run_owned
          from performance_capacity import identity, digest
          if identity() != protocol['source']:
              raise SystemExit('source differs before outer launch')
          stop = threading.Event()
          observer = {'samples': 0, 'errors': [], 'terminal': False}
          thread = threading.Thread(target=observe_host, args=(artifact / 'host-observations.jsonl', protocol['observer']['paths'], stop, observer), daemon=True)
          thread.start()
          started = time.monotonic()
          execution = failure = None
          try:
              with (artifact / 'study-outer.log').open('xb') as log:
                  execution = run_owned(protocol['command'], stdout=log, timeout=protocol['timeoutSeconds'],
                                        peak_rss_limit_kib=protocol['rssStopKiB'])
          except Exception as error:
              failure = str(error)
          finally:
              stop.set()
              thread.join(timeout=3)
          receipt = finalize_outer(protocol, artifact, execution, failure, started, observer, thread, identity, digest)
          print(json.dumps(receipt), flush=True)
          raise SystemExit(0 if receipt['accepted'] else 1)
          PY

      - name: Collect bounded study receipts and exclude caches and binaries
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, re, shutil
          from pathlib import Path

          def file_digest(path):
              with path.open('rb') as file:
                  return hashlib.file_digest(file, 'sha256').hexdigest()

          def stage_evidence(root, upload, limit, identities):
              upload.mkdir(exist_ok=False)
              artifact, study = root / 'artifact', root / 'study'
              candidates = [(item, item.relative_to(artifact)) for item in artifact.rglob('*')
                            if item.is_file() and not item.is_symlink() and item.suffix in ('.json', '.jsonl', '.log', '.yml')]
              if study.exists():
                  for item in study.iterdir():
                      if item.is_file() and not item.is_symlink() and item.suffix == '.json':
                          candidates.append((item, Path('study') / item.relative_to(study)))
                      elif item.is_dir() and not item.is_symlink() and re.fullmatch(r'pair-[123]-(cold|warm)-(maintained|compile-once)', item.name):
                          candidates.extend((child, Path('study') / child.relative_to(study)) for child in item.iterdir()
                                            if child.is_file() and not child.is_symlink() and child.suffix in ('.json', '.log'))
              inventory = [{'path': str(target), 'bytes': source.stat().st_size,
                            'sha256': file_digest(source)}
                           for source, target in sorted(candidates, key=lambda item: str(item[1]))]
              total = sum(item['bytes'] for item in inventory)
              manifest = {'files': inventory, 'bytes': total, **identities, 'adoption': 'none', 'complete': True}
              manifest_bytes = (json.dumps(manifest, indent=2) + '\n').encode()
              if total + len(manifest_bytes) <= limit:
                  for source, relative in candidates:
                      target = upload / relative
                      target.parent.mkdir(parents=True, exist_ok=True)
                      shutil.copyfile(source, target)
                  (upload / 'manifest.json').write_bytes(manifest_bytes)
                  return True
              # Raw evidence remains in the working directory until runner teardown.
              # Only this distinct bounded staging directory is ever uploaded.
              metadata = {'result': 'artifact-overflow', 'complete': False, 'metricsAccepted': False,
                          'rawUploaded': False, 'workingEvidenceRetainedUntil': 'runner teardown',
                          'bytes': total, 'limitBytes': limit, **identities, 'files': list(inventory)}
              reserve = min(1024 * 1024, limit // 2)
              while len((json.dumps(metadata) + '\n').encode()) > reserve and metadata['files']:
                  metadata['files'].pop()
              metadata['omittedFileMetadata'] = len(inventory) - len(metadata['files'])
              encoded = (json.dumps(metadata) + '\n').encode()
              if len(encoded) > limit:
                  raise ValueError('artifact limit cannot hold bounded failure metadata')
              (upload / 'artifact-overflow.json').write_bytes(encoded)
              used = len(encoded)
              for name in ('hosted-protocol.json', 'outer-receipt.json', 'workflow.yml'):
                  source = artifact / name
                  if source.is_file() and not source.is_symlink() and used + source.stat().st_size <= limit:
                      shutil.copyfile(source, upload / name)
                      used += source.stat().st_size
              return False

          root = Path(os.environ['STUDY_ROOT'])
          root.mkdir(parents=True, exist_ok=True)
          upload = root.parent / 'october-ci-efficiency-upload'
          passed = stage_evidence(root, upload, 256 * 1024**2,
                                  {'source': os.environ['STUDY_SOURCE'], 'workflow': os.environ['STUDY_WORKFLOW_SHA']})
          if not passed:
              raise SystemExit('artifact overflow; bounded failure metadata staged, original working evidence retained')
          PY

      - name: Retain failed or successful screening evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: october-ci-efficiency-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/october-ci-efficiency-upload
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
