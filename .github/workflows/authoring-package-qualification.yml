name: Qualification / Authoring package

on:
  workflow_call:
    inputs:
      release_tag:
        description: Exact published server release tag to qualify
        required: true
        type: string
      run_lifecycle:
        description: Run the optional authoring lifecycle
        required: false
        default: false
        type: boolean
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Public release tag whose authoring package should be checked
        required: true
        type: string
      run_lifecycle:
        description: Run init and local dev restart with automatic scoped local authentication
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  qualify:
    if: inputs.release_tag != '' || github.event_name != 'release' || !startsWith(github.event.release.tag_name, 'desktop-')
    name: Qualify released authoring package (linux-${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    concurrency:
      group: released-authoring-package-${{ inputs.release_tag || github.event.release.tag_name }}-${{ matrix.arch }}
      cancel-in-progress: false
    permissions:
      contents: read

    steps:
      - name: Check out qualification contract
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download exact public authoring archive
        id: package
        env:
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
          EVENT_RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_INPUTS: ${{ toJSON(inputs) }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          if jq -e 'has("release_tag")' <<< "$RELEASE_INPUTS" >/dev/null; then
            RELEASE_TAG="$INPUT_RELEASE_TAG"
          else
            RELEASE_TAG="$EVENT_RELEASE_TAG"
          fi
          case "$RELEASE_TAG" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) printf 'invalid release tag: %s\n' "$RELEASE_TAG" >&2; exit 1 ;;
          esac
          package="leapview-cli-${RELEASE_TAG}-linux-${ARCH}"
          root="$RUNNER_TEMP/leapview-authoring-package"
          mkdir -p "$root"
          curl --fail --location --retry 4 --retry-all-errors --silent --show-error \
            --output "$root/$package.tar.gz" \
            "https://github.com/flidai/leapview/releases/download/$RELEASE_TAG/$package.tar.gz"
          curl --fail --location --retry 4 --retry-all-errors --silent --show-error \
            --output "$root/$package.tar.gz.sha256" \
            "https://github.com/flidai/leapview/releases/download/$RELEASE_TAG/$package.tar.gz.sha256"
          printf 'archive=%s\n' "$root/$package.tar.gz" >> "$GITHUB_OUTPUT"

      - name: Install optional lifecycle keyring dependencies
        if: inputs.run_lifecycle == true
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends dbus gnome-keyring

      - name: Run required package qualification and optional lifecycle
        env:
          ARCHIVE: ${{ steps.package.outputs.archive }}
          RUN_LIFECYCLE: ${{ inputs.run_lifecycle || false }}
          EVIDENCE_DIR: ${{ runner.temp }}/authoring-package-qualification-${{ matrix.arch }}
        run: |
          set -euo pipefail
          args=(
            --archive "$ARCHIVE"
            --checksum "$ARCHIVE.sha256"
            --evidence-dir "$EVIDENCE_DIR"
            --required
          )
          if [ "$RUN_LIFECYCLE" = true ]; then
            # Required mode deliberately fails closed if this socket or
            # Compose is unavailable. Local scoped authentication is automatic.
            args+=(
              --run-lifecycle
              --docker-host unix:///var/run/docker.sock
            )
            python3 ./deploy/local/qualification/with_keyring.py \
              ./deploy/local/qualification/qualify.sh "${args[@]}"
          else
            ./deploy/local/qualification/qualify.sh "${args[@]}"
          fi

      - name: Upload bounded qualification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: released-authoring-package-${{ inputs.release_tag || github.event.release.tag_name }}-${{ matrix.arch }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/authoring-package-qualification-${{ matrix.arch }}/qualification-report.json
            ${{ runner.temp }}/authoring-package-qualification-${{ matrix.arch }}/raw-results.json
