name: Fresh-store orchestration root proof
on:
  workflow_dispatch:
permissions:
  contents: read
cache-mode: read
jobs:
  fresh-store-root:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24
        with:
          install_url: https://releases.nixos.org/nix/nix-2.31.2/install
          extra_nix_config: |
            experimental-features = nix-command flakes
            sandbox = true
      - name: Reproduce absent output and verify explicit locked realization
        run: |
          python3 - <<'PY'
          import json, subprocess
          from pathlib import Path
          shell = '.#devShells.x86_64-linux.orchestration'
          root = subprocess.check_output(['nix', 'eval', '--no-update-lock-file', '--raw', shell + '.outPath'], text=True).strip()
          subprocess.run(['nix', 'develop', '--no-update-lock-file', '.#orchestration', '-c', 'python3', 'scripts/export_nix_ci_environment.py', '--profile', 'orchestration'], check=True)
          absent = subprocess.run(['nix-store', '--check-validity', root]).returncode
          assert absent != 0, 'proof requires a fresh store without the shell output'
          subprocess.run(['nix', 'build', '--no-update-lock-file', '--no-link', shell], check=True)
          subprocess.run(['nix-store', '--check-validity', root], check=True)
          closure = json.loads(subprocess.check_output(['nix', 'path-info', '--no-update-lock-file', '--recursive', '--json', root], text=True))
          assert root in closure
          assert all(not p.endswith('-source') and 'leapview' not in p for p in closure)
          print(json.dumps({'sourceRevision': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(), 'root': root, 'closurePaths': len(closure), 'closureNARBytes': sum(p['narSize'] for p in closure.values()), 'absentAfterDevelop': True, 'validAfterBuild': True}))
          PY
