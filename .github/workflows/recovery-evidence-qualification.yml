name: Recovery evidence qualification
run-name: Recovery measurement (${{ inputs.execution }}, pair ${{ inputs.sample }}, provider ${{ inputs.provider_result }})

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '.github/workflows/recovery-evidence-qualification.yml'
      - 'internal/manageddata/**'
      - 'internal/recoveryset/**'
      - 'go.mod'
      - 'go.sum'
  workflow_dispatch:
    inputs:
      execution:
        description: Isolated measurement only; this branch does not change production policy
        type: choice
        default: serial
        options: [serial, parallel]
      sample:
        description: Paired sample identity
        type: choice
        default: '1'
        options: ['1', '2', '3']
      provider_result:
        description: Measure provider failure cost without changing its tests
        type: choice
        default: success
        options: [success, failure]

permissions:
  contents: read

cache-mode: read

concurrency:
  group: recovery-screen-${{ github.ref }}-${{ inputs.execution }}-${{ inputs.sample }}-${{ inputs.provider_result }}
  cancel-in-progress: true

jobs:
  evidence-qualification:
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    name: PostgreSQL and MinIO evidence qualification
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up the pinned CI toolchain
        uses: ./.github/actions/setup-ci
        with:
          go-cache-restore-workload: full-validation
          browser: 'false'
      - name: Prepare generated contracts
        run: task generate
      - name: Qualify recovery evidence against disposable providers
        env:
          LEAPVIEW_POSTGRES_CONFORMANCE_REQUIRED: 'true'
        run: >-
          go test -race -tags='duckdb_arrow fai520qualification'
          ./internal/manageddata/storage/s3
          ./internal/recoveryset/capture
          ./internal/recoveryset/postgres
          ./internal/recoveryset/s3reader
          ./internal/recoveryset/observationstore
          -run '^(TestFAI520|TestProviderObservation)'
          -count=2 -timeout=15m -v
      - name: Inject explicit provider failure for the isolated cost experiment
        if: github.event_name == 'workflow_dispatch' && inputs.provider_result == 'failure'
        run: exit 1
      - name: Verify generated snapshots
        run: task generated:check

  full-validation:
    name: Recovery candidate full validation
    needs: evidence-qualification
    if: ${{ (github.event_name != 'pull_request' || !github.event.pull_request.draft) && inputs.execution != 'parallel' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Set up the pinned CI toolchain
        uses: ./.github/actions/setup-ci
        with:
          go-cache-restore-workload: full-validation
          browser: 'true'
          terraform: 'true'
      - name: Prepare generated and embedded assets
        run: task ci:prepare
      - name: Run the existing full-validation extras
        run: task ci:full:extras

  parallel-full-validation:
    name: Recovery candidate full validation
    if: ${{ (github.event_name != 'pull_request' || !github.event.pull_request.draft) && github.event_name == 'workflow_dispatch' && inputs.execution == 'parallel' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Set up the pinned CI toolchain
        uses: ./.github/actions/setup-ci
        with:
          go-cache-restore-workload: full-validation
          browser: 'true'
          terraform: 'true'
      - name: Prepare generated and embedded assets
        run: task ci:prepare
      - name: Run the existing full-validation extras
        run: task ci:full:extras
