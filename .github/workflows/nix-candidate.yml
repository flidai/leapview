name: Protected Nix candidate

on:
  workflow_dispatch:
    inputs:
      source_revision:
        description: Exact open pull-request head directly based on main
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: nix-candidate-${{ inputs.source_revision }}
  cancel-in-progress: false

jobs:
  authorize:
    if: github.repository == 'flidai/leapview' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: leapview-ephemeral-qualification
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.source_revision }}
          persist-credentials: false
      - name: Require one exact open PR head directly based on main
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_REVISION: ${{ inputs.source_revision }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_REVISION" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_REVISION"
          gh api "repos/$GITHUB_REPOSITORY/commits/$SOURCE_REVISION/pulls" \
            | jq -e --arg revision "$SOURCE_REVISION" \
              'map(select(.base.ref == "main" and .state == "open" and .head.sha == $revision)) | length == 1' >/dev/null

  build:
    needs: authorize
    if: github.repository == 'flidai/leapview' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    permissions:
      contents: read
    outputs:
      artifact_id: ${{ steps.archive.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.source_revision }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
        with:
          install_url: https://releases.nixos.org/nix/nix-2.31.2/install
          extra_nix_config: |
            experimental-features = nix-command flakes
            sandbox = true
      - name: Build candidate recipes without signing or package credentials
        run: |
          nix build --no-update-lock-file .#leapview-image --out-link result-image -L
          mkdir -p candidate
          cp --dereference result-image candidate/image.tar
      - name: Retain the exact candidate archive
        id: archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nix-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: candidate/
          if-no-files-found: error
          retention-days: 7

  qualify:
    needs: [authorize, build]
    if: github.repository == 'flidai/leapview' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    permissions:
      contents: read
    outputs:
      artifact_id: ${{ steps.evidence.outputs.artifact-id }}
    steps:
      - name: Check out protected qualification and scanner code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          path: protected
          persist-credentials: false
      - name: Check out candidate identity only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.source_revision }}
          path: source
          persist-credentials: false
      - name: Download the exact build artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          merge-multiple: true
          path: candidate
      - name: Install protected Nix tools
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
        with:
          install_url: https://releases.nixos.org/nix/nix-2.31.2/install
          extra_nix_config: |
            experimental-features = nix-command flakes
            sandbox = true
      - name: Build the protected Go binary verifier
        working-directory: protected
        run: |
          nix develop --no-update-lock-file .#runtime-security -c \
            go build -o "$RUNNER_TEMP/go-binary-verifier" ./internal/app/tools/securitydependencies
      - name: Scan the archive with protected tools and policy
        working-directory: protected
        run: |
          nix develop --no-update-lock-file .#runtime-security -c \
            python3 scripts/check_nix_runtime_security.py ../candidate/image.tar --evidence-dir ../candidate/runtime
      - name: Scan exact Go entrypoints without executing candidate binaries
        env:
          SOURCE_REVISION: ${{ inputs.source_revision }}
        run: |
          nix develop --no-update-lock-file ./protected#runtime-security -c \
            python3 protected/scripts/nix_archive_go_evidence.py candidate/image.tar --kind application-image \
            --source-root source --source-revision "$SOURCE_REVISION" \
            --evidence-dir candidate/runtime/go --binary-verifier "$RUNNER_TEMP/go-binary-verifier"
      - name: Bind source and exact reports with the protected verifier
        env:
          SOURCE_REVISION: ${{ inputs.source_revision }}
        run: |
          nix develop --no-update-lock-file ./protected#runtime-security -c \
            python3 protected/scripts/nix_candidate_publication.py record \
            --source-root source --source-revision "$SOURCE_REVISION" \
            --binary-verifier "$RUNNER_TEMP/go-binary-verifier" \
            --candidate candidate/image.tar candidate/runtime/candidate-manifest.json candidate/runtime \
            --output candidate/runtime/candidate-manifest.json
          nix develop --no-update-lock-file ./protected#runtime-security -c \
            python3 protected/scripts/nix_candidate_publication.py prepare \
            --source-root source --source-revision "$SOURCE_REVISION" \
            --binary-verifier "$RUNNER_TEMP/go-binary-verifier" \
            --candidate candidate/image.tar candidate/runtime/candidate-manifest.json candidate/runtime \
            --layout "$RUNNER_TEMP/qualified-oci" --output "$RUNNER_TEMP/qualified-content.json"
      - name: Build the protected qualification CLI
        run: nix build --no-update-lock-file ./protected#leapview --out-link trusted-app -L
      - name: Qualify the already-built archive with protected PostgreSQL and browser fixtures
        run: nix develop --no-update-lock-file ./protected -c bash protected/scripts/check_nix_image.sh candidate/image.tar trusted-app
      - name: Retain the qualified archive and independently generated reports
        id: evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nix-qualified-${{ github.run_id }}-${{ github.run_attempt }}
          path: candidate/
          if-no-files-found: error
          retention-days: 7
      - name: Retain runtime findings when qualification fails
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nix-runtime-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
          path: candidate/runtime/
          if-no-files-found: ignore
          retention-days: 14
      - name: Retain the protected image qualification report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nix-image-qualification-${{ github.run_id }}-${{ github.run_attempt }}
          path: protected/.tmp/nix-image-qualification/evidence/image-qualification-report.json
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 14

  publish:
    needs: [authorize, qualify]
    if: github.repository == 'flidai/leapview' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: leapview-ephemeral-qualification
    permissions:
      contents: read
      pull-requests: read
      packages: write
      attestations: write
      id-token: write
    steps:
      # Candidate executables never run in this privileged job. Every command,
      # locked tool and security policy comes from the protected workflow SHA.
      - name: Check out protected verifier and toolchain
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          path: protected
          persist-credentials: false
      - name: Check out source identity without executing candidate code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.source_revision }}
          path: source
          persist-credentials: false
      - name: Download only this qualification job's immutable artifact ID
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.qualify.outputs.artifact_id }}
          merge-multiple: true
          path: candidate
      - name: Install protected Nix tools
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
        with:
          install_url: https://releases.nixos.org/nix/nix-2.31.2/install
          extra_nix_config: |
            experimental-features = nix-command flakes
            sandbox = true
      - name: Build only the protected offline Go verifier
        working-directory: protected
        run: |
          nix develop --no-update-lock-file .#runtime-security -c \
            go build -o "$RUNNER_TEMP/go-binary-verifier" ./internal/app/tools/securitydependencies
      - name: Verify archive and reports and export without rebuilding
        env:
          SOURCE_REVISION: ${{ inputs.source_revision }}
        run: |
          nix develop --no-update-lock-file ./protected#runtime-security -c \
            python3 protected/scripts/nix_candidate_publication.py prepare \
            --source-root source --source-revision "$SOURCE_REVISION" \
            --binary-verifier "$RUNNER_TEMP/go-binary-verifier" \
            --candidate candidate/image.tar candidate/runtime/candidate-manifest.json candidate/runtime \
            --layout "$RUNNER_TEMP/nix-oci" --output "$RUNNER_TEMP/nix-prepared.json"
      - name: Reauthorize the still-current candidate before publication
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_REVISION: ${{ inputs.source_revision }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_REVISION" =~ ^[0-9a-f]{40}$ ]]
          test "$(git -C protected rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C source rev-parse HEAD)" = "$SOURCE_REVISION"
          gh api "repos/$GITHUB_REPOSITORY/commits/$SOURCE_REVISION/pulls" \
            | jq -e --arg revision "$SOURCE_REVISION" \
              'map(select(.base.ref == "main" and .state == "open" and .head.sha == $revision)) | length == 1' >/dev/null
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish and refetch the preserved candidate digest
        id: publish
        env:
          SOURCE_REVISION: ${{ inputs.source_revision }}
        run: |
          nix develop --no-update-lock-file ./protected#runtime-security -c \
            python3 protected/scripts/nix_candidate_publication.py publish \
            --source-root source --source-revision "$SOURCE_REVISION" \
            --binary-verifier "$RUNNER_TEMP/go-binary-verifier" \
            --candidate candidate/image.tar candidate/runtime/candidate-manifest.json candidate/runtime \
            --layout "$RUNNER_TEMP/nix-oci" --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --output "$RUNNER_TEMP/nix-published.json" --github-output "$GITHUB_OUTPUT"
      - name: Attest candidate root provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/flidai/leapview
          subject-digest: ${{ steps.publish.outputs.digest }}
          push-to-registry: true
          create-storage-record: false
      - name: Attest the exact bound platform runtime SPDX
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/flidai/leapview
          subject-digest: ${{ steps.publish.outputs.digest }}
          predicate-type: https://spdx.dev/Document/v2.3
          predicate-path: candidate/runtime/sbom.spdx.json
          push-to-registry: true
          create-storage-record: false
      - name: Verify live registry provenance and the same runtime SPDX
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_REVISION: ${{ inputs.source_revision }}
          IMAGE: ${{ steps.publish.outputs.image }}
        run: |
          nix develop --no-update-lock-file ./protected#runtime-security -c \
            python3 protected/scripts/nix_candidate_publication.py verify-signed \
            --source-root source --source-revision "$SOURCE_REVISION" \
            --binary-verifier "$RUNNER_TEMP/go-binary-verifier" \
            --candidate candidate/image.tar candidate/runtime/candidate-manifest.json candidate/runtime \
            --image "$IMAGE" --signer-revision "$GITHUB_SHA" --output "$RUNNER_TEMP/nix-signed.json"
      - name: Retain verified candidate bindings
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nix-candidate-binding-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/nix-prepared.json
            ${{ runner.temp }}/nix-published.json
            ${{ runner.temp }}/nix-signed.json
          if-no-files-found: error
          retention-days: 14
