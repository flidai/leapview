name: Public adoption smoke

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * *"

permissions:
  contents: read

concurrency:
  group: public-adoption-smoke
  cancel-in-progress: false

jobs:
  smoke:
    name: Verify public installation journey
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Verify DNS, TLS, server and desktop manifests, guides, and artifacts
        run: bun scripts/public_site_smoke.ts

      - name: Verify anonymous immutable image access
        run: |
          image="$(jq -er '.image' docs/public-release.json)"
          docker logout ghcr.io || true
          docker buildx imagetools inspect "$image" >/dev/null
