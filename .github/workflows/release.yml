name: Release image

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      image_tag:
        description: Candidate image tag
        required: true
        default: candidate
        type: string

permissions:
  contents: read

concurrency:
  group: release-image-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/flidai/leapview

jobs:
  identity:
    name: Resolve candidate identity
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      version: ${{ steps.identity.outputs.version }}
      revision: ${{ steps.identity.outputs.revision }}
      build_time: ${{ steps.identity.outputs.build_time }}
      release_tag: ${{ steps.identity.outputs.release_tag }}
      release: ${{ steps.identity.outputs.release }}

    steps:
      - name: Checkout candidate source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Resolve authoritative build identity
        id: identity
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.ref_name }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          canonical_version="$(tr -d '[:space:]' < VERSION)"
          package_version="$(python3 -c 'import json; print(json.load(open("package.json"))["version"])')"
          test "$package_version" = "$canonical_version" || {
            printf 'package.json version %s disagrees with VERSION %s\n' "$package_version" "$canonical_version" >&2
            exit 1
          }
          revision="$(git rev-parse HEAD)"
          build_time="$(git show -s --format=%cI HEAD)"
          version=development
          release_tag=""
          is_release=false
          if [ "$EVENT_NAME" = push ]; then
            test "$RELEASE_TAG" = "v$canonical_version" || {
              printf 'release tag %s disagrees with VERSION %s\n' "$RELEASE_TAG" "$canonical_version" >&2
              exit 1
            }
            version="$canonical_version"
            release_tag="$RELEASE_TAG"
            is_release=true
          else
            version="$canonical_version"
            release_tag="candidate-${RUN_ID}-${RUN_ATTEMPT}"
            is_release=true
          fi
          {
            echo "version=$version"
            echo "revision=$revision"
            echo "build_time=$build_time"
            echo "release_tag=$release_tag"
            echo "release=$is_release"
          } >> "$GITHUB_OUTPUT"

  image-platform:
    name: Build candidate image (${{ matrix.arch }})
    needs: identity
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    steps:
      - name: Checkout candidate source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish native image
        id: publish
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          push: true
          tags: ${{ env.IMAGE_NAME }}:candidate-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.version=${{ needs.identity.outputs.version }}
            org.opencontainers.image.revision=${{ needs.identity.outputs.revision }}
            org.opencontainers.image.created=${{ needs.identity.outputs.build_time }}
            dev.leapview.build.dirty=false
            dev.leapview.build.release=${{ needs.identity.outputs.release }}
          build-args: |
            BUILD_VERSION=${{ needs.identity.outputs.version }}
            BUILD_REVISION=${{ needs.identity.outputs.revision }}
            BUILD_TIME=${{ needs.identity.outputs.build_time }}
            BUILD_DIRTY=false
            BUILD_RELEASE=${{ needs.identity.outputs.release }}
          cache-from: type=gha,scope=release-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=release-${{ matrix.arch }}
          sbom: true
          provenance: mode=max

      - name: Attest native image provenance
        uses: actions/attest@f6bf1532d7d6793fce74eac584813a8eee607999 # v4
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          push-to-registry: true

      - name: Record native image digest
        env:
          IMAGE_DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          mkdir -p platform-digests
          printf '%s@%s\n' "$IMAGE_NAME" "$IMAGE_DIGEST" > "platform-digests/${{ matrix.arch }}.txt"

      - name: Upload native image digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-platform-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.arch }}
          retention-days: 7
          if-no-files-found: error
          path: platform-digests/${{ matrix.arch }}.txt

  image:
    name: Assemble attested candidate
    needs: [identity, image-platform]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    outputs:
      version: ${{ needs.identity.outputs.version }}
      revision: ${{ needs.identity.outputs.revision }}
      build_time: ${{ needs.identity.outputs.build_time }}
      release_tag: ${{ needs.identity.outputs.release_tag }}
      image_digest: ${{ steps.assemble.outputs.digest }}

    steps:
      - name: Checkout candidate source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image metadata
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.IMAGE_NAME }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=candidate-${{ github.run_id }}-${{ github.run_attempt }},enable=${{ github.event_name == 'push' }}
            type=raw,value=${{ inputs.image_tag }},enable=${{ github.event_name == 'workflow_dispatch' }}
            type=sha,prefix=sha-

      - name: Download native image digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-platform-${{ github.run_id }}-${{ github.run_attempt }}-*
          path: platform-digests
          merge-multiple: true

      - name: Assemble multi-platform image
        id: assemble
        env:
          IMAGE_TAGS: ${{ steps.metadata.outputs.tags }}
        run: |
          mapfile -t image_references < <(sort -u platform-digests/*.txt)
          test "${#image_references[@]}" -eq 2
          tag_args=()
          while IFS= read -r image_tag; do
            [ -n "$image_tag" ] && tag_args+=(--tag "$image_tag")
          done <<< "$IMAGE_TAGS"
          test "${#tag_args[@]}" -gt 0
          docker buildx imagetools create "${tag_args[@]}" "${image_references[@]}"
          primary_tag="$(head -n 1 <<< "$IMAGE_TAGS")"
          digest="sha256:$(docker buildx imagetools inspect --raw "$primary_tag" | sha256sum | awk '{print $1}')"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Attest image provenance
        uses: actions/attest@f6bf1532d7d6793fce74eac584813a8eee607999 # v4
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.assemble.outputs.digest }}
          push-to-registry: true

      - name: Verify anonymous image pull
        env:
          IMAGE_REFERENCE: ${{ env.IMAGE_NAME }}@${{ steps.assemble.outputs.digest }}
        run: |
          docker logout ghcr.io
          docker buildx imagetools inspect "$IMAGE_REFERENCE"

      - name: Verify published runtime identity
        env:
          EXPECTED_VERSION: ${{ needs.identity.outputs.version }}
          EXPECTED_REVISION: ${{ needs.identity.outputs.revision }}
          EXPECTED_BUILD_TIME: ${{ needs.identity.outputs.build_time }}
          EXPECTED_RELEASE: ${{ needs.identity.outputs.release }}
          IMAGE_REFERENCE: ${{ env.IMAGE_NAME }}@${{ steps.assemble.outputs.digest }}
        run: |
          docker pull "$IMAGE_REFERENCE"
          docker run --rm "$IMAGE_REFERENCE" version --json > runtime-identity.json
          label_version="$(docker image inspect "$IMAGE_REFERENCE" --format '{{index .Config.Labels "org.opencontainers.image.version"}}')"
          label_revision="$(docker image inspect "$IMAGE_REFERENCE" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')"
          test "$label_version" = "$EXPECTED_VERSION"
          test "$label_revision" = "$EXPECTED_REVISION"
          python3 - <<'PY'
          import json
          import os

          with open("runtime-identity.json", encoding="utf-8") as source:
              actual = json.load(source)
          expected = {
              "version": os.environ["EXPECTED_VERSION"],
              "revision": os.environ["EXPECTED_REVISION"],
              "buildTime": os.environ["EXPECTED_BUILD_TIME"],
              "dirty": False,
              "development": os.environ["EXPECTED_RELEASE"] != "true",
          }
          for field, value in expected.items():
              if actual[field] != value:
                  raise SystemExit(f"published runtime {field}={actual[field]!r}, expected {value!r}")
          PY

      - name: Build candidate Compose archives
        env:
          BUILD_VERSION: ${{ needs.identity.outputs.version }}
          BUILD_REVISION: ${{ needs.identity.outputs.revision }}
          BUILD_TIME: ${{ needs.identity.outputs.build_time }}
          BUILD_DIRTY: "false"
          BUILD_RELEASE: ${{ needs.identity.outputs.release }}
          IMAGE_REFERENCE: ${{ env.IMAGE_NAME }}@${{ steps.assemble.outputs.digest }}
          RELEASE_TAG: ${{ needs.identity.outputs.release_tag }}
        run: |
          printf '%s\n' "$IMAGE_REFERENCE" > image-reference.txt
          python3 - <<'PY'
          import json
          import os

          with open("release-identity.json", "w", encoding="utf-8") as target:
              json.dump({
                  "version": os.environ["BUILD_VERSION"],
                  "revision": os.environ["BUILD_REVISION"],
                  "buildTime": os.environ["BUILD_TIME"],
                  "dirty": False,
                  "development": False,
                  "image": os.environ["IMAGE_REFERENCE"],
              }, target, indent=2)
              target.write("\n")
          PY
          build_ldflags="-s -w \
            -X github.com/flidai/leapview/internal/platform/buildinfo.version=$BUILD_VERSION \
            -X github.com/flidai/leapview/internal/platform/buildinfo.revision=$BUILD_REVISION \
            -X github.com/flidai/leapview/internal/platform/buildinfo.buildTime=$BUILD_TIME \
            -X github.com/flidai/leapview/internal/platform/buildinfo.dirty=$BUILD_DIRTY \
            -X github.com/flidai/leapview/internal/platform/buildinfo.release=$BUILD_RELEASE"
          targets=(
            "linux amd64"
            "linux arm64"
            "darwin amd64"
            "darwin arm64"
          )
          for target in "${targets[@]}"; do
            read -r os arch <<<"$target"
            package="leapview-compose-${RELEASE_TAG}-${os}-${arch}"
            mkdir -p "dist/$package"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath -ldflags="$build_ldflags" -o "dist/$package/leapviewctl" ./cmd/leapviewctl
            cp deploy/compose/compose.yaml deploy/compose/compose.https.yaml deploy/compose/Caddyfile deploy/compose/README.md deploy/compose/QUALIFICATION.md "dist/$package/"
            cp deploy/host/files/leapviewctl-wrapper deploy/host/files/leapview-backup-hook deploy/host/files/leapview-backup.service deploy/host/files/leapview-backup.timer deploy/host/files/leapview-backup-maintenance.service deploy/host/files/leapview-backup-maintenance.timer "dist/$package/"
            cp deploy/host/bootstrap-ubuntu.sh "dist/$package/"
            cp -R deploy/compose/qualification "dist/$package/qualification"
            cp deploy/compose/leapview.env.example "dist/$package/leapview.env.example"
            sed "s|ghcr.io/flidai/leapview@sha256:<release-digest>|$IMAGE_REFERENCE|" deploy/compose/deployment.env.example > "dist/$package/deployment.env.example"
            cp image-reference.txt release-identity.json "dist/$package/"
            if [ "$os" = linux ] && [ "$arch" = amd64 ]; then
              (
                cd "dist/$package"
                ./leapviewctl version --json > runtime-identity.json
                python3 - <<'PY'
          import json

          with open("release-identity.json", encoding="utf-8") as source:
              expected = json.load(source)
          with open("runtime-identity.json", encoding="utf-8") as source:
              actual = json.load(source)
          for field in ("version", "revision", "buildTime", "dirty", "development"):
              if actual[field] != expected[field]:
                  raise SystemExit(f"runtime {field} disagrees with release identity")
          PY
                rm runtime-identity.json
              )
            fi
            (
              cd "dist/$package"
              mapfile -d '' package_files < <(
                find . -type f ! -name SHA256SUMS -print0 | sort -z
              )
              sha256sum "${package_files[@]}" > SHA256SUMS
            )
            tar -C dist -czf "dist/$package.tar.gz" "$package"
            (cd dist && sha256sum "$package.tar.gz" > "$package.tar.gz.sha256")
          done

      - name: Upload unpublished candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-candidate-${{ needs.identity.outputs.release_tag }}
          retention-days: 7
          if-no-files-found: error
          path: |
            image-reference.txt
            release-identity.json
            dist/*.tar.gz
            dist/*.tar.gz.sha256

      - name: Record immutable reference
        run: echo '${{ env.IMAGE_NAME }}@${{ steps.assemble.outputs.digest }}' >> "$GITHUB_STEP_SUMMARY"

  qualify:
    name: Pre-publication qualification (${{ matrix.arch }})
    needs: image
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45

    steps:
      - name: Download unpublished candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-candidate-${{ needs.image.outputs.release_tag }}
          path: candidate

      - name: Verify and extract candidate package
        env:
          RELEASE_TAG: ${{ needs.image.outputs.release_tag }}
          ARCH: ${{ matrix.arch }}
        run: |
          package="leapview-compose-${RELEASE_TAG}-linux-${ARCH}"
          cd candidate/dist
          sha256sum --check "$package.tar.gz.sha256"
          tar --extract --gzip --file "$package.tar.gz"
          echo "PACKAGE_ROOT=$PWD/$package" >> "$GITHUB_ENV"

      - name: Run installed-candidate journey
        run: |
          cd "$PACKAGE_ROOT"
          ./leapviewctl qualify installed-candidate \
            --evidence-dir "$RUNNER_TEMP/installed-candidate-evidence"

      - name: Upload bounded qualification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: prepublication-${{ needs.image.outputs.release_tag }}-${{ matrix.arch }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/installed-candidate-evidence/qualification-report.json
            ${{ runner.temp }}/installed-candidate-evidence/performance-report.json
            ${{ runner.temp }}/installed-candidate-evidence/recovery-report.json
            ${{ runner.temp }}/installed-candidate-evidence/recovery-events.json
            ${{ runner.temp }}/installed-candidate-evidence/runtime-identity.json
            ${{ runner.temp }}/installed-candidate-evidence/*.log
            ${{ runner.temp }}/installed-candidate-evidence/browser-failure.png

  publish:
    name: Publish qualified release
    if: github.event_name == 'push'
    needs: [image, qualify]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      packages: write

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download qualified candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-candidate-${{ needs.image.outputs.release_tag }}
          path: candidate

      - name: Publish qualified image tags
        env:
          RELEASE_VERSION: ${{ needs.image.outputs.version }}
          IMAGE_REFERENCE: ${{ env.IMAGE_NAME }}@${{ needs.image.outputs.image_digest }}
        run: |
          tags=(--tag "${IMAGE_NAME}:${RELEASE_VERSION}")
          case "$RELEASE_VERSION" in
            *-*) ;;
            *)
              major_minor="${RELEASE_VERSION%.*}"
              tags+=(--tag "${IMAGE_NAME}:${major_minor}" --tag "${IMAGE_NAME}:latest")
              ;;
          esac
          docker buildx imagetools create "${tags[@]}" "$IMAGE_REFERENCE"

          docker logout ghcr.io
          actual_digest=""
          for _ in $(seq 1 12); do
            actual_digest="sha256:$(docker buildx imagetools inspect --raw "${IMAGE_NAME}:${RELEASE_VERSION}" 2>/dev/null | sha256sum | awk '{print $1}')"
            [ "$actual_digest" = '${{ needs.image.outputs.image_digest }}' ] && break
            sleep 5
          done
          test "$actual_digest" = '${{ needs.image.outputs.image_digest }}'

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.image.outputs.release_tag }}
          RELEASE_VERSION: ${{ needs.image.outputs.version }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            printf 'release %s is already visible; refusing to bypass qualification\n' "$RELEASE_TAG" >&2
            exit 1
          fi
          release_flags=()
          case "$RELEASE_VERSION" in
            *-*) release_flags+=(--prerelease) ;;
          esac
          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --generate-notes \
            --title "LeapView $RELEASE_TAG" \
            "${release_flags[@]}" \
            candidate/image-reference.txt \
            candidate/release-identity.json \
            candidate/dist/*.tar.gz \
            candidate/dist/*.tar.gz.sha256
