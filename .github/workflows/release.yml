name: Release image

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      image_tag:
        description: Candidate image tag
        required: true
        default: candidate
        type: string

permissions:
  contents: read

concurrency:
  group: release-image-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/flidai/leapview

jobs:
  identity:
    name: Resolve candidate identity
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      version: ${{ steps.identity.outputs.version }}
      revision: ${{ steps.identity.outputs.revision }}
      build_time: ${{ steps.identity.outputs.build_time }}
      release_tag: ${{ steps.identity.outputs.release_tag }}
      release: ${{ steps.identity.outputs.release }}

    steps:
      - name: Checkout candidate source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Resolve authoritative build identity
        id: identity
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.ref_name }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          canonical_version="$(tr -d '[:space:]' < VERSION)"
          package_version="$(python3 -c 'import json; print(json.load(open("package.json"))["version"])')"
          test "$package_version" = "$canonical_version" || {
            printf 'package.json version %s disagrees with VERSION %s\n' "$package_version" "$canonical_version" >&2
            exit 1
          }
          revision="$(git rev-parse HEAD)"
          build_time="$(git show -s --format=%cI HEAD)"
          version=development
          release_tag=""
          is_release=false
          if [ "$EVENT_NAME" = push ]; then
            test "$RELEASE_TAG" = "v$canonical_version" || {
              printf 'release tag %s disagrees with VERSION %s\n' "$RELEASE_TAG" "$canonical_version" >&2
              exit 1
            }
            version="$canonical_version"
            release_tag="$RELEASE_TAG"
            is_release=true
          else
            version="$canonical_version"
            release_tag="candidate-${RUN_ID}-${RUN_ATTEMPT}"
            is_release=true
          fi
          {
            echo "version=$version"
            echo "revision=$revision"
            echo "build_time=$build_time"
            echo "release_tag=$release_tag"
            echo "release=$is_release"
          } >> "$GITHUB_OUTPUT"

  image-platform:
    name: Build candidate image (${{ matrix.arch }})
    needs: identity
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    steps:
      - name: Checkout candidate source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish native image
        id: publish
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          push: true
          tags: ${{ env.IMAGE_NAME }}:candidate-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.version=${{ needs.identity.outputs.version }}
            org.opencontainers.image.revision=${{ needs.identity.outputs.revision }}
            org.opencontainers.image.created=${{ needs.identity.outputs.build_time }}
            dev.leapview.build.dirty=false
            dev.leapview.build.release=${{ needs.identity.outputs.release }}
          build-args: |
            BUILD_VERSION=${{ needs.identity.outputs.version }}
            BUILD_REVISION=${{ needs.identity.outputs.revision }}
            BUILD_TIME=${{ needs.identity.outputs.build_time }}
            BUILD_DIRTY=false
            BUILD_RELEASE=${{ needs.identity.outputs.release }}
          cache-from: type=gha,scope=release-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=release-${{ matrix.arch }}
          sbom: true
          provenance: mode=max

      - name: Attest native image provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          push-to-registry: true

      - name: Admit exact native image
        id: admission
        uses: ./.github/actions/oci-admission
        with:
          image: ${{ env.IMAGE_NAME }}@${{ steps.publish.outputs.digest }}
          repository: ${{ env.IMAGE_NAME }}
          expected-workflow: flidai/leapview/.github/workflows/release.yml
          source-revision: ${{ needs.identity.outputs.revision }}
          platform: linux/${{ matrix.arch }}

      - name: Record admitted native image digest
        env:
          IMAGE_REFERENCE: ${{ steps.admission.outputs.image }}
        run: |
          mkdir -p platform-digests
          printf '%s\n' "$IMAGE_REFERENCE" > "platform-digests/${{ matrix.arch }}.txt"

      - name: Upload native image digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-platform-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.arch }}
          retention-days: 7
          if-no-files-found: error
          path: platform-digests/${{ matrix.arch }}.txt

  image:
    name: Assemble attested candidate
    needs: [identity, image-platform]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    outputs:
      version: ${{ needs.identity.outputs.version }}
      revision: ${{ needs.identity.outputs.revision }}
      build_time: ${{ needs.identity.outputs.build_time }}
      release_tag: ${{ needs.identity.outputs.release_tag }}
      image_digest: ${{ steps.assembled_admission.outputs.digest }}
      image_reference: ${{ steps.assembled_admission.outputs.image }}

    steps:
      - name: Checkout candidate source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up the cached CI toolchain
        uses: ./.github/actions/setup-ci
        with:
          browser: "false"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image metadata
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.IMAGE_NAME }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=candidate-${{ github.run_id }}-${{ github.run_attempt }},enable=${{ github.event_name == 'push' }}
            type=raw,value=${{ inputs.image_tag }},enable=${{ github.event_name == 'workflow_dispatch' }}
            type=sha,prefix=sha-

      - name: Download native image digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-platform-${{ github.run_id }}-${{ github.run_attempt }}-*
          path: platform-digests
          merge-multiple: true

      - name: Assemble multi-platform image
        id: assemble
        env:
          IMAGE_TAGS: ${{ steps.metadata.outputs.tags }}
        run: |
          mapfile -t image_references < <(sort -u platform-digests/*.txt)
          test "${#image_references[@]}" -eq 2
          tag_args=()
          while IFS= read -r image_tag; do
            [ -n "$image_tag" ] && tag_args+=(--tag "$image_tag")
          done <<< "$IMAGE_TAGS"
          test "${#tag_args[@]}" -gt 0
          docker buildx imagetools create "${tag_args[@]}" "${image_references[@]}"
          primary_tag="$(head -n 1 <<< "$IMAGE_TAGS")"
          digest="sha256:$(docker buildx imagetools inspect --raw "$primary_tag" | sha256sum | awk '{print $1}')"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Attest image provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.assemble.outputs.digest }}
          push-to-registry: true

      - name: Admit exact assembled release image
        id: assembled_admission
        uses: ./.github/actions/oci-admission
        with:
          image: ${{ env.IMAGE_NAME }}@${{ steps.assemble.outputs.digest }}
          repository: ${{ env.IMAGE_NAME }}
          expected-workflow: flidai/leapview/.github/workflows/release.yml
          source-revision: ${{ needs.identity.outputs.revision }}
          output: assembled-image-admission.json

      - name: Verify anonymous image pull
        env:
          IMAGE_REFERENCE: ${{ steps.assembled_admission.outputs.image }}
        run: |
          docker logout ghcr.io
          docker buildx imagetools inspect "$IMAGE_REFERENCE"

      - name: Verify published runtime identity
        env:
          EXPECTED_VERSION: ${{ needs.identity.outputs.version }}
          EXPECTED_REVISION: ${{ needs.identity.outputs.revision }}
          EXPECTED_BUILD_TIME: ${{ needs.identity.outputs.build_time }}
          EXPECTED_RELEASE: ${{ needs.identity.outputs.release }}
          IMAGE_REFERENCE: ${{ steps.assembled_admission.outputs.image }}
        run: |
          docker pull "$IMAGE_REFERENCE"
          docker run --rm "$IMAGE_REFERENCE" version --json > runtime-identity.json
          label_version="$(docker image inspect "$IMAGE_REFERENCE" --format '{{index .Config.Labels "org.opencontainers.image.version"}}')"
          label_revision="$(docker image inspect "$IMAGE_REFERENCE" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')"
          test "$label_version" = "$EXPECTED_VERSION"
          test "$label_revision" = "$EXPECTED_REVISION"
          python3 - <<'PY'
          import json
          import os

          with open("runtime-identity.json", encoding="utf-8") as source:
              actual = json.load(source)
          expected = {
              "version": os.environ["EXPECTED_VERSION"],
              "revision": os.environ["EXPECTED_REVISION"],
              "buildTime": os.environ["EXPECTED_BUILD_TIME"],
              "dirty": False,
              "development": os.environ["EXPECTED_RELEASE"] != "true",
          }
          for field, value in expected.items():
              if actual[field] != value:
                  raise SystemExit(f"published runtime {field}={actual[field]!r}, expected {value!r}")
          PY

      - name: Generate release build inputs
        run: task generate

      - name: Build candidate Compose archives
        env:
          BUILD_VERSION: ${{ needs.identity.outputs.version }}
          BUILD_REVISION: ${{ needs.identity.outputs.revision }}
          BUILD_TIME: ${{ needs.identity.outputs.build_time }}
          BUILD_DIRTY: "false"
          BUILD_RELEASE: ${{ needs.identity.outputs.release }}
          IMAGE_REFERENCE: ${{ steps.assembled_admission.outputs.image }}
          RELEASE_TAG: ${{ needs.identity.outputs.release_tag }}
        run: |
          printf '%s\n' "$IMAGE_REFERENCE" > image-reference.txt
          python3 - <<'PY'
          import json
          import os

          with open("release-identity.json", "w", encoding="utf-8") as target:
              json.dump({
                  "version": os.environ["BUILD_VERSION"],
                  "revision": os.environ["BUILD_REVISION"],
                  "buildTime": os.environ["BUILD_TIME"],
                  "dirty": False,
                  "development": False,
                  "image": os.environ["IMAGE_REFERENCE"],
              }, target, indent=2)
              target.write("\n")
          PY
          go run ./internal/app/tools/transitionpolicy \
            --bind-release release-identity.json \
            --candidate-admission assembled-image-admission.json \
            --predecessor-evidence-output predecessor-verification.json \
            --bind-output release-transition-policy.json
          build_ldflags="-s -w \
            -X github.com/flidai/leapview/internal/platform/buildinfo.version=$BUILD_VERSION \
            -X github.com/flidai/leapview/internal/platform/buildinfo.revision=$BUILD_REVISION \
            -X github.com/flidai/leapview/internal/platform/buildinfo.buildTime=$BUILD_TIME \
            -X github.com/flidai/leapview/internal/platform/buildinfo.dirty=$BUILD_DIRTY \
            -X github.com/flidai/leapview/internal/platform/buildinfo.release=$BUILD_RELEASE"
          targets=(
            "linux amd64"
            "linux arm64"
            "darwin amd64"
            "darwin arm64"
          )
          canonical_postgres_init="deploy/postgres/init.sh"
          test -s "$canonical_postgres_init"
          test -x "$canonical_postgres_init"
          canonical_postgres_init_sha256="$(sha256sum "$canonical_postgres_init" | awk '{print $1}')"
          for target in "${targets[@]}"; do
            read -r os arch <<<"$target"
            package="leapview-compose-${RELEASE_TAG}-${os}-${arch}"
            mkdir -p "dist/$package"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath -ldflags="$build_ldflags" -o "dist/$package/leapviewctl" ./cmd/leapviewctl
            cp deploy/compose/compose.yaml deploy/compose/compose.https.yaml deploy/compose/Caddyfile deploy/compose/README.md deploy/compose/QUALIFICATION.md "dist/$package/"
            cp deploy/host/files/leapviewctl-wrapper "dist/$package/"
            cp deploy/host/bootstrap-ubuntu.sh "dist/$package/"
            cp -R deploy/compose/qualification "dist/$package/qualification"
            cp deploy/postgres/init.sh "dist/$package/qualification/postgres-init.sh"
            test -x "dist/$package/qualification/postgres-init.sh"
            test "$(sha256sum "dist/$package/qualification/postgres-init.sh" | awk '{print $1}')" = "$canonical_postgres_init_sha256"
            cp deploy/compose/leapview.env.example "dist/$package/leapview.env.example"
            test -s "dist/$package/Caddyfile"
            test -s "dist/$package/compose.https.yaml"
            grep -q 'reverse_proxy leapview:8080' "dist/$package/Caddyfile"
            grep -q '^LEAPVIEW_POSTGRES_REQUIRE_TLS=true$' "dist/$package/leapview.env.example"
            if grep -Rni 'sqlite' \
              "dist/$package/compose.yaml" "dist/$package/compose.https.yaml" \
              "dist/$package/leapview.env.example" "dist/$package/qualification" || \
              grep -RnE 'LEAPVIEW_(DB|DATABASE|DUCKDB)_' \
              "dist/$package/compose.yaml" "dist/$package/compose.https.yaml" \
              "dist/$package/leapview.env.example" "dist/$package/qualification"; then
              printf 'release package contains an SQLite or file-backed qualification fallback\n' >&2
              exit 1
            fi
            sed "s|ghcr.io/flidai/leapview@sha256:<release-digest>|$IMAGE_REFERENCE|" deploy/compose/deployment.env.example > "dist/$package/deployment.env.example"
            cp image-reference.txt release-identity.json release-transition-policy.json predecessor-verification.json "dist/$package/"
            if [ "$os" = linux ] && [ "$arch" = amd64 ]; then
              (
                cd "dist/$package"
                ./leapviewctl version --json > runtime-identity.json
                python3 - <<'PY'
          import json

          with open("release-identity.json", encoding="utf-8") as source:
              expected = json.load(source)
          with open("runtime-identity.json", encoding="utf-8") as source:
              actual = json.load(source)
          for field in ("version", "revision", "buildTime", "dirty", "development"):
              if actual[field] != expected[field]:
                  raise SystemExit(f"runtime {field} disagrees with release identity")
          PY
                rm runtime-identity.json
              )
            fi
            (
              cd "dist/$package"
              mapfile -d '' package_files < <(
                find . -type f ! -name SHA256SUMS -print0 | sort -z
              )
              sha256sum "${package_files[@]}" > SHA256SUMS
            )
            tar -C dist -czf "dist/$package.tar.gz" "$package"
            (cd dist && sha256sum "$package.tar.gz" > "$package.tar.gz.sha256")
          done

      - name: Upload unpublished candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-candidate-${{ needs.identity.outputs.release_tag }}
          retention-days: 7
          if-no-files-found: error
          path: |
            image-reference.txt
            release-identity.json
            release-transition-policy.json
            assembled-image-admission.json
            predecessor-verification.json
            dist/*.tar.gz
            dist/*.tar.gz.sha256

      - name: Record immutable reference
        run: echo '${{ steps.assembled_admission.outputs.image }}' >> "$GITHUB_STEP_SUMMARY"

  qualify:
    name: Pre-publication qualification (${{ matrix.arch }})
    needs: image
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read
      attestations: read

    steps:
      - name: Check out the release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.image.outputs.revision }}

      - name: Log in to GHCR for admission
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up exact OCI resolver
        if: matrix.arch == 'amd64'
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Admit the exact release image
        id: admission
        uses: ./.github/actions/oci-admission
        with:
          image: ${{ needs.image.outputs.image_reference }}
          repository: ${{ env.IMAGE_NAME }}
          expected-workflow: flidai/leapview/.github/workflows/release.yml
          source-revision: ${{ needs.image.outputs.revision }}

      - name: Download unpublished candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-candidate-${{ needs.image.outputs.release_tag }}
          path: candidate

      - name: Verify and extract candidate package
        env:
          RELEASE_TAG: ${{ needs.image.outputs.release_tag }}
          ARCH: ${{ matrix.arch }}
        run: |
          package="leapview-compose-${RELEASE_TAG}-linux-${ARCH}"
          cd candidate/dist
          sha256sum --check "$package.tar.gz.sha256"
          tar --extract --gzip --file "$package.tar.gz"
          echo "PACKAGE_ROOT=$PWD/$package" >> "$GITHUB_ENV"

      - name: Verify target-native offline extension supply
        env:
          IMAGE_REFERENCE: ${{ steps.admission.outputs.image }}
        run: |
          set -euo pipefail
          docker pull "$IMAGE_REFERENCE"
          docker run --rm --entrypoint /bin/sh "$IMAGE_REFERENCE" -ceu '
            supply=/usr/local/share/leapview/extensions/extension-supply.json
            digest_file=/usr/local/share/leapview/extensions/extension-supply.json.sha256
            test -f "$supply" -a -f "$digest_file"
            artifact_count="$(find /usr/local/share/leapview/extensions/artifacts -type f -name "*.duckdb_extension" | wc -l)"
            manifest_count="$(grep -c "^[[:space:]]*\"identity\":[[:space:]]*{" "$supply")"
            test "$manifest_count" -ge 13
            test "$artifact_count" -eq "$manifest_count"
            digest="$(awk "NF {print \$1; exit}" "$digest_file")"
            test "$digest" = "$(sha256sum "$supply" | awk "{print \$1}")"
            test "${LEAPVIEW_DUCKDB_EXTENSION_SUPPLY_PATH:-}" = "$supply"
          '

      - name: Run installed-candidate journey
        run: |
          cd "$PACKAGE_ROOT"
          args=(qualify installed-candidate --bundle "$PACKAGE_ROOT" --evidence-dir "$RUNNER_TEMP/installed-candidate-evidence")
          ./leapviewctl "${args[@]}"

      - name: Restore least-privilege GHCR access for historical qualification
        if: matrix.arch == 'amd64'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run exact v0.1 preservation qualification
        if: matrix.arch == 'amd64'
        run: |
          set -euo pipefail
          cd "$PACKAGE_ROOT"
          evidence_dir="$RUNNER_TEMP/installed-candidate-evidence"
          predecessor_evidence="$evidence_dir/v0.1-reviewed-identity.json"
          qualification_evidence="$evidence_dir/v0.1-preservation-qualification.json"
          candidate_admission="$GITHUB_WORKSPACE/candidate/assembled-image-admission.json"
          policy="$PACKAGE_ROOT/release-transition-policy.json"
          policy_sha256="$(sha256sum "$policy" | awk '{print $1}')"
          test -s "$candidate_admission"
          test -s "$policy"
          mkdir -p "$evidence_dir"
          ./leapviewctl qualify v0.1-artifact-review \
            --transition-policy "$policy" \
            --policy-sha256 "$policy_sha256" \
            --evidence "$predecessor_evidence"
          test -s "$predecessor_evidence"
          ./leapviewctl qualify v0.1-preservation \
            --candidate-admission "$candidate_admission" \
            --transition-policy "$policy" \
            --policy-sha256 "$policy_sha256" \
            --predecessor-evidence "$predecessor_evidence" \
            --evidence-dir "$evidence_dir"
          test -s "$qualification_evidence"

      - name: Upload bounded qualification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: prepublication-${{ needs.image.outputs.release_tag }}-${{ matrix.arch }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/installed-candidate-evidence/qualification-report.json
            ${{ runner.temp }}/installed-candidate-evidence/performance-report.json
            ${{ runner.temp }}/installed-candidate-evidence/recovery-report.json
            ${{ runner.temp }}/installed-candidate-evidence/recovery-events.json
            ${{ runner.temp }}/installed-candidate-evidence/runtime-identity.json
            ${{ runner.temp }}/installed-candidate-evidence/predecessor-runtime-identity.json
            ${{ runner.temp }}/installed-candidate-evidence/policy-validation.json
            ${{ runner.temp }}/installed-candidate-evidence/decision.json
            ${{ runner.temp }}/installed-candidate-evidence/transition-qualification.json
            ${{ runner.temp }}/installed-candidate-evidence/v0.1-reviewed-identity.json
            ${{ runner.temp }}/installed-candidate-evidence/v0.1-preservation-qualification.json
            ${{ runner.temp }}/installed-candidate-evidence/*.log
            ${{ runner.temp }}/installed-candidate-evidence/browser-failure.png

  minio-conformance:
    name: MinIO object-backed conformance
    needs: identity
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Check out candidate source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up the cached CI toolchain
        uses: ./.github/actions/setup-ci
        with:
          browser: "false"

      - name: Verify Docker container prerequisites
        run: |
          docker version
          docker info

      - name: Run object-backed conformance tests
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/minio-conformance"
          rm -f .tmp/minio-conformance/shared-pool-evidence.json
          task test:go:minio-conformance 2>&1 | tee "$RUNNER_TEMP/minio-conformance/test.log"
          evidence=.tmp/minio-conformance/shared-pool-evidence.json
          test -s "$evidence"
          jq -e '
            .schema_version == 1 and
            .evidence.conformance_version == "lea-406/v1" and
            .evidence.compatibility == {
              "duckdb_runtime": "duckdb:v1.5.4",
              "ducklake_extension": "ducklake:d318a545",
              "catalog_format": "ducklake:v1",
              "storage_implementation": "s3",
              "object_naming_contract": "uuidv7:v1"
            } and
            (.evidence.digest | test("^sha256:[0-9a-f]{64}$")) and
            ([.evidence.checks[] |
              select(.passed == true and (.observation_digest | test("^sha256:[0-9a-f]{64}$"))) |
              .id] | sort) == [
                "aborted_write_isolation",
                "cross_catalog_orphan_classification",
                "different_table_private_clone_isolation",
                "new_file_key_disjointness",
                "normalization_file_union_completeness",
                "safe_close",
                "same_table_private_clone_isolation",
                "sealed_catalog_read",
                "unchanged_file_reference_reuse"
              ]
          ' "$evidence" >/dev/null
          cp "$evidence" "$RUNNER_TEMP/minio-conformance/shared-pool-evidence.json"
          sha256sum "$RUNNER_TEMP/minio-conformance/shared-pool-evidence.json" > "$RUNNER_TEMP/minio-conformance/shared-pool-evidence.json.sha256"

      - name: Record conformance runtime evidence
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/minio-conformance"
          {
            printf 'source_revision=%s\n' "$(git rev-parse HEAD)"
            printf 'build_tags=duckdb_arrow ducklake_minio\n'
            printf 'candidate_test=TestCandidateCatalogMinIOSealedBaseRetainsUnchangedRefs\n'
            printf 'shared_pool_test=TestSharedPoolConformanceMinIOLane\n'
            printf 'minio_image=%s\n' "$(awk -F'\"' '/^[[:space:]]*conformanceMinIOImage[[:space:]]*=/{print $2; exit}' internal/analytics/ducklake/minio_conformance_test.go)"
            go version
            go env GOFLAGS GOOS GOARCH
            go list -m github.com/duckdb/duckdb-go/v2
            go list -m github.com/duckdb/duckdb-go-bindings
            if test -s "$RUNNER_TEMP/minio-conformance/shared-pool-evidence.json.sha256"; then
              printf 'evidence_sha256=%s\n' "$(cut -d' ' -f1 "$RUNNER_TEMP/minio-conformance/shared-pool-evidence.json.sha256")"
            fi
            docker version
            docker info
          } > "$RUNNER_TEMP/minio-conformance/runtime.txt" 2>&1

      - name: Upload MinIO conformance evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: minio-conformance-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 30
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/minio-conformance/test.log
            ${{ runner.temp }}/minio-conformance/runtime.txt
            ${{ runner.temp }}/minio-conformance/shared-pool-evidence.json
            ${{ runner.temp }}/minio-conformance/shared-pool-evidence.json.sha256

  plan-gc-conformance:
    name: Plan-to-GC lifecycle conformance
    needs: identity
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Check out candidate source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up the cached CI toolchain
        uses: ./.github/actions/setup-ci
        with:
          browser: "false"

      - name: Run plan-to-GC lifecycle conformance
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/plan-gc-conformance"
          task test:go:plan-gc-conformance 2>&1 | tee "$RUNNER_TEMP/plan-gc-conformance/test.log"

      - name: Upload plan-to-GC conformance evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: plan-gc-conformance-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 30
          if-no-files-found: error
          path: ${{ runner.temp }}/plan-gc-conformance/test.log

  publish:
    name: Publish qualified release
    if: github.event_name == 'push'
    needs: [image, qualify, minio-conformance, plan-gc-conformance]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      packages: write
      attestations: read

    steps:
      - name: Check out the qualified release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.image.outputs.revision }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Admit the exact release image before promotion
        id: admission
        uses: ./.github/actions/oci-admission
        with:
          image: ${{ env.IMAGE_NAME }}@${{ needs.image.outputs.image_digest }}
          repository: ${{ env.IMAGE_NAME }}
          expected-workflow: flidai/leapview/.github/workflows/release.yml
          source-revision: ${{ needs.image.outputs.revision }}

      - name: Download qualified candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-candidate-${{ needs.image.outputs.release_tag }}
          path: candidate

      - name: Publish qualified image tags
        env:
          RELEASE_VERSION: ${{ needs.image.outputs.version }}
          IMAGE_REFERENCE: ${{ steps.admission.outputs.image }}
        run: |
          tags=(--tag "${IMAGE_NAME}:${RELEASE_VERSION}")
          case "$RELEASE_VERSION" in
            *-*) ;;
            *)
              major_minor="${RELEASE_VERSION%.*}"
              tags+=(--tag "${IMAGE_NAME}:${major_minor}" --tag "${IMAGE_NAME}:latest")
              ;;
          esac
          docker buildx imagetools create "${tags[@]}" "$IMAGE_REFERENCE"

          docker logout ghcr.io
          actual_digest=""
          for _ in $(seq 1 12); do
            actual_digest="sha256:$(docker buildx imagetools inspect --raw "${IMAGE_NAME}:${RELEASE_VERSION}" 2>/dev/null | sha256sum | awk '{print $1}')"
            [ "$actual_digest" = '${{ needs.image.outputs.image_digest }}' ] && break
            sleep 5
          done
          test "$actual_digest" = '${{ needs.image.outputs.image_digest }}'

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.image.outputs.release_tag }}
          RELEASE_VERSION: ${{ needs.image.outputs.version }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            printf 'release %s is already visible; refusing to bypass qualification\n' "$RELEASE_TAG" >&2
            exit 1
          fi
          release_flags=()
          case "$RELEASE_VERSION" in
            *-*) release_flags+=(--prerelease) ;;
          esac
          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --generate-notes \
            --title "LeapView $RELEASE_TAG" \
            "${release_flags[@]}" \
            candidate/image-reference.txt \
            candidate/release-identity.json \
            candidate/release-transition-policy.json \
            candidate/assembled-image-admission.json \
            candidate/predecessor-verification.json \
            candidate/dist/*.tar.gz \
            candidate/dist/*.tar.gz.sha256
