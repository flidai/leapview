name: Electron security proof

on:
  pull_request:
    paths:
      - ".github/actions/desktop-preview-candidate/**"
      - ".github/workflows/electron-security-proof.yml"
      - "desktop/**"
      - "internal/app/testing/maliciousinstance/**"
      - "Taskfile.yml"
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: electron-security-proof-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: Policy and manifest contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Run pure security contract tests
        working-directory: internal/app/testing/maliciousinstance/electron
        run: node --test policy.test.mjs manifest-proof.test.mjs

  packages:
    name: Hardened package (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    env:
      LEAPVIEW_DESKTOP_DISTRIBUTION: preview
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            os: ubuntu-24.04
            artifact: linux-x64
            format: deb
          - name: macOS Intel
            os: macos-15-intel
            artifact: macos-x64
            format: dmg
          - name: macOS Apple silicon
            os: macos-15
            artifact: macos-arm64
            format: dmg
          - name: Windows x64
            os: windows-2025
            artifact: windows-x64
            format: exe

    steps:
      - name: Checkout
        if: ${{ github.event_name != 'pull_request' || matrix.artifact == 'linux-x64' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Build, prove, qualify, and upload the exact preview candidate
        if: ${{ github.event_name != 'pull_request' || matrix.artifact == 'linux-x64' }}
        uses: ./.github/actions/desktop-preview-candidate
        with:
          artifact-name: leapview-desktop-${{ matrix.artifact }}
          source-sha: ${{ github.sha }}

  attest:
    name: Attest main candidate (${{ matrix.name }})
    if: ${{ github.event_name == 'push' }}
    needs: packages
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      attestations: write
      artifact-metadata: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            artifact: linux-x64
            format: deb
          - name: macOS Intel
            artifact: macos-x64
            format: dmg
          - name: macOS Apple silicon
            artifact: macos-arm64
            format: dmg
          - name: Windows x64
            artifact: windows-x64
            format: exe

    steps:
      - name: Download candidate and evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: leapview-desktop-${{ matrix.artifact }}
          path: candidate

      - name: Verify downloaded evidence bundle
        shell: bash
        run: |
          artifact="$(find candidate/out/make -type f -name '*.${{ matrix.format }}' -print -quit)"
          manifest="$(find candidate/out/evidence -type f -name '*.release.json' -print -quit)"
          sbom="$(find candidate/out/evidence -type f -name '*.spdx.json' -print -quit)"
          update_arguments=()
          if [[ "$artifact" == *.dmg ]]; then
            update_arguments+=(--update-artifact "$(find candidate/out/make -type f -name '*.zip' -print -quit)")
          elif [[ "$artifact" == *.exe ]]; then
            update_arguments+=(--update-artifact "$(find candidate/out/make -type f -name '*.nupkg' -print -quit)")
            update_arguments+=(--update-artifact "$(find candidate/out/make -type f -name 'RELEASES' -print -quit)")
          fi
          node candidate/out/evidence/verify-release-evidence.mjs \
            --artifact "$artifact" \
            --checksums candidate/out/evidence/checksums.txt \
            --manifest "$manifest" \
            --policy candidate/release-policy.json \
            --sbom "$sbom" \
            "${update_arguments[@]}"

      - name: Attest candidate provenance
        uses: actions/attest@f6bf1532d7d6793fce74eac584813a8eee607999 # v4
        with:
          subject-path: |
            candidate/out/make/**/*.${{ matrix.format }}
            candidate/out/make/**/*.zip
            candidate/out/make/**/*.nupkg
            candidate/out/make/**/RELEASES
            candidate/out/evidence/*.release.json

      - name: Attest candidate SBOM
        uses: actions/attest@f6bf1532d7d6793fce74eac584813a8eee607999 # v4
        with:
          subject-path: |
            candidate/out/make/**/*.${{ matrix.format }}
            candidate/out/make/**/*.zip
            candidate/out/make/**/*.nupkg
            candidate/out/make/**/RELEASES
          sbom-path: candidate/out/evidence/*.spdx.json

  macos:
    name: Policy integration (macOS ${{ matrix.architecture }})
    if: ${{ github.event_name != 'pull_request' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: Intel
            runner: macos-15-intel
          - architecture: Apple silicon
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Install pinned Electron
        working-directory: internal/app/testing/maliciousinstance/electron
        run: |
          bun install --frozen-lockfile
          node node_modules/electron/install.js

      - name: Run complete malicious-instance proof
        env:
          LEAPVIEW_ELECTRON_BINARY: ${{ github.workspace }}/internal/app/testing/maliciousinstance/electron/node_modules/electron/dist/Electron.app/Contents/MacOS/Electron
        run: |
          go test -count=1 \
            -run TestElectronPolicyIntegrationPreservesBrowserEquivalentAuthority \
            -v ./internal/app/testing/maliciousinstance

  windows:
    name: Policy integration (Windows x64)
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: windows-2025
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Install pinned Electron
        working-directory: internal/app/testing/maliciousinstance/electron
        run: |
          bun install --frozen-lockfile
          node node_modules/electron/install.js

      - name: Run complete malicious-instance proof
        shell: pwsh
        run: |
          $env:LEAPVIEW_ELECTRON_BINARY = Join-Path $env:GITHUB_WORKSPACE "internal/app/testing/maliciousinstance/electron/node_modules/electron/dist/electron.exe"
          go test -count=1 -run TestElectronPolicyIntegrationPreservesBrowserEquivalentAuthority -v ./internal/app/testing/maliciousinstance

  linux:
    name: Policy integration (Linux x64)
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Build sandboxed proof image
        run: |
          docker build \
            --file internal/app/testing/maliciousinstance/electron/Dockerfile.linux \
            --tag leapview-electron-security-proof:43.2.0 .

      - name: Run complete malicious-instance proof
        run: |
          docker run --rm --cap-add=SYS_ADMIN \
            leapview-electron-security-proof:43.2.0
