name: Installed candidate qualification

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      release_tag:
        description: Public LeapView release tag to qualify
        required: true
        default: v0.2.0-rc.1
        type: string
  schedule:
    - cron: "23 5 * * 2"

permissions:
  contents: read

concurrency:
  group: installed-candidate-${{ github.event.release.tag_name || github.event.inputs.release_tag || 'scheduled' }}
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve public release
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      release_tag: ${{ steps.release.outputs.release_tag }}

    steps:
      - name: Resolve requested or latest public release
        id: release
        env:
          REQUESTED_TAG: ${{ github.event.release.tag_name || github.event.inputs.release_tag }}
        run: |
          release_tag="$REQUESTED_TAG"
          if [ -z "$release_tag" ]; then
            release_tag="$(
              curl --fail --location --silent --show-error \
                https://api.github.com/repos/flidai/leapview/releases?per_page=20 |
                jq -er '[.[] | select(.draft == false)][0].tag_name'
            )"
          fi
          case "$release_tag" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) printf 'invalid release tag: %s\n' "$release_tag" >&2; exit 1 ;;
          esac
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"

  qualify:
    name: Public qualification (${{ matrix.arch }})
    needs: resolve
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read
      attestations: read

    steps:
      - name: Check out admission policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download public Compose archive anonymously
        id: download
        env:
          RELEASE_TAG: ${{ needs.resolve.outputs.release_tag }}
          ARCH: ${{ matrix.arch }}
        run: |
          package="leapview-compose-${RELEASE_TAG}-linux-${ARCH}"
          base="https://github.com/flidai/leapview/releases/download/${RELEASE_TAG}"
          mkdir -p "$RUNNER_TEMP/leapview-public"
          cd "$RUNNER_TEMP/leapview-public"
          curl --fail --location --retry 4 --retry-all-errors --silent --show-error \
            --output "${package}.tar.gz" "${base}/${package}.tar.gz"
          curl --fail --location --retry 4 --retry-all-errors --silent --show-error \
            --output "${package}.tar.gz.sha256" "${base}/${package}.tar.gz.sha256"
          sha256sum --check "${package}.tar.gz.sha256"
          tar --extract --gzip --file "${package}.tar.gz"
          echo "package_root=$RUNNER_TEMP/leapview-public/$package" >> "$GITHUB_OUTPUT"

      - name: Verify native PostgreSQL qualification assets
        env:
          PACKAGE_ROOT: ${{ steps.download.outputs.package_root }}
        run: |
          set -euo pipefail
          init_script="$PACKAGE_ROOT/qualification/postgres-init.sh"
          test -s "$init_script"
          # The release archive may have crossed an artifact boundary that
          # strips executable bits (or was produced by a hardened umask).
          # PostgreSQL executes this hook after dropping to the `postgres`
          # user, so normalize its reviewed mode before starting the sidecar.
          chmod 0755 "$init_script"
          test -x "$init_script"
          test "$(stat -c '%a' "$init_script")" = "755"
          grep -q 'CREATE ROLE leapview_control_owner' "$init_script"
          grep -q 'CREATE ROLE leapview_ducklake_owner' "$init_script"
          # The release archive may have crossed an artifact boundary that
          # strips world-readable bits (or was extracted under umask 0077).
          # Caddy reads this bind-mounted file, so restore the reviewed mode
          # before starting Compose.
          chmod 0644 "$PACKAGE_ROOT/Caddyfile"
          test "$(stat -c '%a' "$PACKAGE_ROOT/Caddyfile")" = "644"
          test -s "$PACKAGE_ROOT/Caddyfile"
          test -s "$PACKAGE_ROOT/compose.https.yaml"
          grep -q 'reverse_proxy leapview:8080' "$PACKAGE_ROOT/Caddyfile"
          grep -q '^LEAPVIEW_POSTGRES_REQUIRE_TLS=true$' "$PACKAGE_ROOT/leapview.env.example"
          if grep -Rni 'sqlite' \
            "$PACKAGE_ROOT/compose.yaml" "$PACKAGE_ROOT/compose.https.yaml" \
            "$PACKAGE_ROOT/leapview.env.example" "$PACKAGE_ROOT/qualification" || \
            grep -RnE 'LEAPVIEW_(DB|DATABASE|DUCKDB)_' \
            "$PACKAGE_ROOT/compose.yaml" "$PACKAGE_ROOT/compose.https.yaml" \
            "$PACKAGE_ROOT/leapview.env.example" "$PACKAGE_ROOT/qualification"; then
            printf 'installed archive contains an SQLite or file-backed qualification fallback\n' >&2
            exit 1
          fi

      - name: Resolve candidate image identity
        id: identity
        env:
          PACKAGE_ROOT: ${{ steps.download.outputs.package_root }}
        run: |
          image="$(tr -d '[:space:]' < "$PACKAGE_ROOT/image-reference.txt")"
          revision="$(jq -er '.revision' "$PACKAGE_ROOT/release-identity.json")"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "revision=$revision" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR for admission
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Admit the exact public release image
        id: admission
        uses: ./.github/actions/oci-admission
        with:
          image: ${{ steps.identity.outputs.image }}
          repository: ghcr.io/flidai/leapview
          expected-workflow: flidai/leapview/.github/workflows/release.yml
          source-revision: ${{ steps.identity.outputs.revision }}

      - name: Pin the installed candidate to the admitted image
        env:
          PACKAGE_ROOT: ${{ steps.download.outputs.package_root }}
          ADMITTED_IMAGE: ${{ steps.admission.outputs.image }}
        run: printf '%s\n' "$ADMITTED_IMAGE" > "$PACKAGE_ROOT/image-reference.txt"

      - name: Remove registry credentials before the public journey
        run: docker logout ghcr.io >/dev/null 2>&1

      - name: Run installed-candidate journey
        env:
          PACKAGE_ROOT: ${{ steps.download.outputs.package_root }}
          EVIDENCE_ROOT: ${{ runner.temp }}/qualification-evidence-${{ matrix.arch }}
        run: |
          args=(qualify installed-candidate --bundle "$PACKAGE_ROOT" --evidence-dir "$EVIDENCE_ROOT")
          env -u GH_TOKEN -u GITHUB_TOKEN \
            "$PACKAGE_ROOT/leapviewctl" "${args[@]}"

      - name: Upload bounded qualification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: installed-candidate-${{ needs.resolve.outputs.release_tag }}-${{ matrix.arch }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/qualification-evidence-${{ matrix.arch }}/qualification-report.json
            ${{ runner.temp }}/qualification-evidence-${{ matrix.arch }}/performance-report.json
            ${{ runner.temp }}/qualification-evidence-${{ matrix.arch }}/recovery-report.json
            ${{ runner.temp }}/qualification-evidence-${{ matrix.arch }}/recovery-events.json
            ${{ runner.temp }}/qualification-evidence-${{ matrix.arch }}/runtime-identity.json
            ${{ runner.temp }}/qualification-evidence-${{ matrix.arch }}/predecessor-runtime-identity.json
            ${{ runner.temp }}/qualification-evidence-${{ matrix.arch }}/policy-validation.json
            ${{ runner.temp }}/qualification-evidence-${{ matrix.arch }}/decision.json
            ${{ runner.temp }}/qualification-evidence-${{ matrix.arch }}/transition-qualification.json
            ${{ runner.temp }}/qualification-evidence-${{ matrix.arch }}/*.log
            ${{ runner.temp }}/qualification-evidence-${{ matrix.arch }}/browser-failure.png

  incident:
    name: Create qualification incident
    needs: [resolve, qualify]
    if: always() && needs.qualify.result == 'failure'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write

    steps:
      - name: Create qualification incident
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          RELEASE_TAG: ${{ needs.resolve.outputs.release_tag }}
        with:
          script: |
            const title = `[Release qualification] ${process.env.RELEASE_TAG}`
            const owner = context.repo.owner
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              ...context.repo,
              state: 'open',
              per_page: 100,
            })
            const existing = issues.find(issue => issue.title === title && !issue.pull_request)
            const body = [
              `Owner: @${owner}`,
              '',
              `Installed-candidate qualification failed for \`${process.env.RELEASE_TAG}\`.`,
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              '',
              'Treat this as a release/adoption incident. Attach only bounded redacted evidence and mirror the status into the active Linear release project.',
            ].join('\n')
            if (existing) {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: existing.number,
                body,
              })
            } else {
              await github.rest.issues.create({
                ...context.repo,
                title,
                body,
                assignees: [owner],
              })
            }
