name: Protected Nix controller candidate

on:
  workflow_dispatch:
    inputs:
      source_revision:
        description: Exact open pull-request head directly based on main
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: nix-cli-candidate-${{ inputs.source_revision }}
  cancel-in-progress: false

jobs:
  authorize:
    if: github.repository == 'flidai/leapview' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: leapview-ephemeral-qualification
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.source_revision }}
          path: source
          persist-credentials: false
      - name: Require one exact open PR head directly based on main
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_REVISION: ${{ inputs.source_revision }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_REVISION" =~ ^[0-9a-f]{40}$ ]]
          test "$(git -C source rev-parse HEAD)" = "$SOURCE_REVISION"
          gh api "repos/$GITHUB_REPOSITORY/commits/$SOURCE_REVISION/pulls" \
            | jq -e --arg revision "$SOURCE_REVISION" \
              'map(select(.base.ref == "main" and .state == "open" and .head.sha == $revision)) | length == 1' >/dev/null

  build:
    needs: authorize
    if: github.repository == 'flidai/leapview' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    permissions:
      contents: read
    outputs:
      artifact_id: ${{ steps.archive.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.source_revision }}
          path: source
          persist-credentials: false
      - name: Install pinned Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
        with:
          install_url: https://releases.nixos.org/nix/nix-2.31.2/install
          extra_nix_config: |
            experimental-features = nix-command flakes
            sandbox = true
      - name: Build both controller archives without signing credentials
        env:
          SOURCE_REVISION: ${{ inputs.source_revision }}
        run: |
          set -euo pipefail
          cd source
          test "$(git rev-parse HEAD)" = "$SOURCE_REVISION"
          nix build --no-update-lock-file .#leapviewctl-linux-amd64 --out-link result-cli-amd64 -L
          nix build --no-update-lock-file .#leapviewctl-linux-arm64 --out-link result-cli -L
          mkdir -p ../candidate/amd64 ../candidate/arm64
          for arch in amd64 arm64; do
            cp --dereference result-cli-$arch/leapviewctl-linux-$arch.tar.gz ../candidate/$arch/
            cp --dereference result-cli-$arch/archive-identity.json ../candidate/$arch/
            cp --dereference result-cli-$arch/static-compatibility.json ../candidate/$arch/
          done
      - name: Retain the exact candidate archives and build identities
        id: archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nix-cli-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: candidate/
          if-no-files-found: error
          retention-days: 14

  qualify-amd64:
    needs: [authorize, build]
    if: github.repository == 'flidai/leapview' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    outputs:
      artifact_id: ${{ steps.qualified.outputs.artifact-id }}
    steps:
      - name: Check out protected qualification tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          path: protected
          persist-credentials: false
      - name: Check out candidate source identity only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.source_revision }}
          path: source
          persist-credentials: false
      - name: Install pinned protected Nix tools
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
        with:
          install_url: https://releases.nixos.org/nix/nix-2.31.2/install
          extra_nix_config: |
            experimental-features = nix-command flakes
            sandbox = true
      - name: Download the exact build artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          merge-multiple: true
          path: candidate
      - name: Build the protected Go binary verifier
        working-directory: protected
        run: |
          nix develop --no-update-lock-file .#runtime-security -c \
            go build -o "$RUNNER_TEMP/go-binary-verifier" ./internal/app/tools/securitydependencies
      - name: Qualify the exact amd64 archive with protected tools
        env:
          SOURCE_REVISION: ${{ inputs.source_revision }}
        run: |
          nix develop --no-update-lock-file ./protected#runtime-security -c \
            python3 protected/scripts/nix_cli_publication.py qualify \
            --archive candidate/amd64/leapviewctl-linux-amd64.tar.gz \
            --archive-identity candidate/amd64/archive-identity.json \
            --source-root source --source-revision "$SOURCE_REVISION" \
            --binary-verifier "$RUNNER_TEMP/go-binary-verifier" \
            --evidence-dir qualified/amd64/evidence
      - name: Preserve the unchanged archive and verify qualification evidence
        env:
          SOURCE_REVISION: ${{ inputs.source_revision }}
        run: |
          set -euo pipefail
          mkdir -p qualified/amd64
          cp -- candidate/amd64/leapviewctl-linux-amd64.tar.gz qualified/amd64/
          cp -- candidate/amd64/archive-identity.json qualified/amd64/
          cp -- candidate/amd64/static-compatibility.json qualified/amd64/
          nix develop --no-update-lock-file ./protected#runtime-security -c \
            python3 protected/scripts/nix_cli_publication.py verify \
            --archive qualified/amd64/leapviewctl-linux-amd64.tar.gz \
            --archive-identity qualified/amd64/archive-identity.json \
            --source-root source --source-revision "$SOURCE_REVISION" \
            --binary-verifier "$RUNNER_TEMP/go-binary-verifier" \
            --evidence-dir qualified/amd64/evidence
      - name: Retain exact amd64 qualification
        id: qualified
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nix-cli-qualified-amd64-${{ github.run_id }}-${{ github.run_attempt }}
          path: qualified/amd64/
          if-no-files-found: error
          retention-days: 14
      - name: Retain amd64 diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nix-cli-diagnostic-amd64-${{ github.run_id }}-${{ github.run_attempt }}
          path: qualified/amd64/evidence/
          if-no-files-found: ignore
          retention-days: 14

  qualify-arm64:
    needs: [authorize, build]
    if: github.repository == 'flidai/leapview' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    permissions:
      contents: read
    outputs:
      artifact_id: ${{ steps.qualified.outputs.artifact-id }}
    steps:
      - name: Check out protected qualification tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          path: protected
          persist-credentials: false
      - name: Check out candidate source identity only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.source_revision }}
          path: source
          persist-credentials: false
      - name: Install pinned protected Nix tools
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
        with:
          install_url: https://releases.nixos.org/nix/nix-2.31.2/install
          extra_nix_config: |
            experimental-features = nix-command flakes
            sandbox = true
      - name: Download the exact build artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          merge-multiple: true
          path: candidate
      - name: Build the protected Go binary verifier
        working-directory: protected
        run: |
          nix develop --no-update-lock-file .#runtime-security -c \
            go build -o "$RUNNER_TEMP/go-binary-verifier" ./internal/app/tools/securitydependencies
      - name: Qualify the exact arm64 archive with protected tools
        env:
          SOURCE_REVISION: ${{ inputs.source_revision }}
        run: |
          nix develop --no-update-lock-file ./protected#runtime-security -c \
            python3 protected/scripts/nix_cli_publication.py qualify \
            --archive candidate/arm64/leapviewctl-linux-arm64.tar.gz \
            --archive-identity candidate/arm64/archive-identity.json \
            --source-root source --source-revision "$SOURCE_REVISION" \
            --binary-verifier "$RUNNER_TEMP/go-binary-verifier" \
            --evidence-dir qualified/arm64/evidence
      - name: Preserve the unchanged archive and verify qualification evidence
        env:
          SOURCE_REVISION: ${{ inputs.source_revision }}
        run: |
          set -euo pipefail
          mkdir -p qualified/arm64
          cp -- candidate/arm64/leapviewctl-linux-arm64.tar.gz qualified/arm64/
          cp -- candidate/arm64/archive-identity.json qualified/arm64/
          cp -- candidate/arm64/static-compatibility.json qualified/arm64/
          nix develop --no-update-lock-file ./protected#runtime-security -c \
            python3 protected/scripts/nix_cli_publication.py verify \
            --archive qualified/arm64/leapviewctl-linux-arm64.tar.gz \
            --archive-identity qualified/arm64/archive-identity.json \
            --source-root source --source-revision "$SOURCE_REVISION" \
            --binary-verifier "$RUNNER_TEMP/go-binary-verifier" \
            --evidence-dir qualified/arm64/evidence
      - name: Retain exact arm64 qualification
        id: qualified
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nix-cli-qualified-arm64-${{ github.run_id }}-${{ github.run_attempt }}
          path: qualified/arm64/
          if-no-files-found: error
          retention-days: 14
      - name: Retain arm64 diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nix-cli-diagnostic-arm64-${{ github.run_id }}-${{ github.run_attempt }}
          path: qualified/arm64/evidence/
          if-no-files-found: ignore
          retention-days: 14

  publish:
    needs: [authorize, qualify-amd64, qualify-arm64]
    if: github.repository == 'flidai/leapview' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: leapview-ephemeral-qualification
    outputs:
      artifact_id: ${{ steps.signed.outputs.artifact-id }}
    permissions:
      contents: read
      pull-requests: read
      attestations: write
      id-token: write
    steps:
      - name: Check out protected verifier and toolchain
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          path: protected
          persist-credentials: false
      - name: Check out source identity without executing candidate code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.source_revision }}
          path: source
          persist-credentials: false
      - name: Install pinned protected Nix tools
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
        with:
          install_url: https://releases.nixos.org/nix/nix-2.31.2/install
          extra_nix_config: |
            experimental-features = nix-command flakes
            sandbox = true
      - name: Build only the protected offline Go verifier
        working-directory: protected
        run: |
          nix develop --no-update-lock-file .#runtime-security -c \
            go build -o "$RUNNER_TEMP/go-binary-verifier" ./internal/app/tools/securitydependencies
      - name: Download the exact amd64 qualification artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.qualify-amd64.outputs.artifact_id }}
          path: qualified/amd64
      - name: Download the exact arm64 qualification artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.qualify-arm64.outputs.artifact_id }}
          path: qualified/arm64
      - name: Verify both preserved archives and their bound evidence offline
        env:
          SOURCE_REVISION: ${{ inputs.source_revision }}
        run: |
          set -euo pipefail
          for arch in amd64 arm64; do
            nix develop --no-update-lock-file ./protected#runtime-security -c \
              python3 protected/scripts/nix_cli_publication.py verify \
              --archive "qualified/$arch/leapviewctl-linux-$arch.tar.gz" \
              --archive-identity "qualified/$arch/archive-identity.json" \
              --source-root source --source-revision "$SOURCE_REVISION" \
              --binary-verifier "$RUNNER_TEMP/go-binary-verifier" \
              --evidence-dir "qualified/$arch/evidence"
          done
      - name: Reauthorize the still-current candidate before signing
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_REVISION: ${{ inputs.source_revision }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_REVISION" =~ ^[0-9a-f]{40}$ ]]
          test "$(git -C protected rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C source rev-parse HEAD)" = "$SOURCE_REVISION"
          gh api "repos/$GITHUB_REPOSITORY/commits/$SOURCE_REVISION/pulls" \
            | jq -e --arg revision "$SOURCE_REVISION" \
              'map(select(.base.ref == "main" and .state == "open" and .head.sha == $revision)) | length == 1' >/dev/null
      - name: Attest amd64 archive provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: qualified/amd64/leapviewctl-linux-amd64.tar.gz
      - name: Attest amd64 archive SPDX
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: qualified/amd64/leapviewctl-linux-amd64.tar.gz
          predicate-type: https://spdx.dev/Document/v2.3
          predicate-path: qualified/amd64/evidence/sbom.spdx.json
      - name: Attest arm64 archive provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: qualified/arm64/leapviewctl-linux-arm64.tar.gz
      - name: Attest arm64 archive SPDX
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: qualified/arm64/leapviewctl-linux-arm64.tar.gz
          predicate-type: https://spdx.dev/Document/v2.3
          predicate-path: qualified/arm64/evidence/sbom.spdx.json
      - name: Retain the exact signed controller archives and evidence
        id: signed
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nix-cli-signed-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            qualified/amd64/
            qualified/arm64/
          if-no-files-found: error
          retention-days: 14

  verify-signed:
    needs: [authorize, publish]
    if: github.repository == 'flidai/leapview' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      attestations: read
    steps:
      - name: Check out protected verifier and toolchain
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          path: protected
          persist-credentials: false
      - name: Check out source identity only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.source_revision }}
          path: source
          persist-credentials: false
      - name: Install pinned protected Nix tools
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
        with:
          install_url: https://releases.nixos.org/nix/nix-2.31.2/install
          extra_nix_config: |
            experimental-features = nix-command flakes
            sandbox = true
      - name: Build only the protected offline Go verifier
        working-directory: protected
        run: |
          nix develop --no-update-lock-file .#runtime-security -c \
            go build -o "$RUNNER_TEMP/go-binary-verifier" ./internal/app/tools/securitydependencies
      - name: Download the exact signed publisher artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.publish.outputs.artifact_id }}
          path: qualified
      - name: Verify signed amd64 archive and SPDX
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_REVISION: ${{ inputs.source_revision }}
        run: |
          nix develop --no-update-lock-file ./protected#runtime-security -c \
            python3 protected/scripts/nix_cli_publication.py verify-signed \
            --archive qualified/amd64/leapviewctl-linux-amd64.tar.gz \
            --archive-identity qualified/amd64/archive-identity.json \
            --source-root source --source-revision "$SOURCE_REVISION" \
            --binary-verifier "$RUNNER_TEMP/go-binary-verifier" \
            --evidence-dir qualified/amd64/evidence \
            --signer-revision "$GITHUB_SHA" --output "$RUNNER_TEMP/nix-cli-signed-amd64.json"
      - name: Verify signed arm64 archive and SPDX
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_REVISION: ${{ inputs.source_revision }}
        run: |
          nix develop --no-update-lock-file ./protected#runtime-security -c \
            python3 protected/scripts/nix_cli_publication.py verify-signed \
            --archive qualified/arm64/leapviewctl-linux-arm64.tar.gz \
            --archive-identity qualified/arm64/archive-identity.json \
            --source-root source --source-revision "$SOURCE_REVISION" \
            --binary-verifier "$RUNNER_TEMP/go-binary-verifier" \
            --evidence-dir qualified/arm64/evidence \
            --signer-revision "$GITHUB_SHA" --output "$RUNNER_TEMP/nix-cli-signed-arm64.json"
      - name: Retain independently verified signed evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nix-cli-signed-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/nix-cli-signed-amd64.json
            ${{ runner.temp }}/nix-cli-signed-arm64.json
          if-no-files-found: ignore
          retention-days: 14
