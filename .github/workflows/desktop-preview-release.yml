name: Release / Desktop unsigned preview

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Reviewed commit or branch on the default branch
        required: true
        default: main
        type: string
      release_tag:
        description: Immutable tag such as desktop-v0.1.1-alpha.1
        required: true
        type: string
      confirm_unsigned_preview:
        description: Publish a public GitHub prerelease whose installers are unsigned
        required: true
        default: false
        type: boolean
      nix_desktop_run_id:
        description: Successful protected Nix Desktop producer of these exact Linux bytes
        required: true
        type: string
      nix_desktop_run_attempt:
        description: Exact successful Nix Desktop producer attempt
        required: true
        type: string
      nix_desktop_lifecycle_run_id:
        description: Successful protected version-upgrade and offline-rollback qualification
        required: true
        type: string
      nix_desktop_lifecycle_run_attempt:
        description: Exact successful lifecycle attempt qualifying this candidate
        required: true
        type: string

permissions:
  contents: read
  actions: read
  attestations: read

concurrency:
  group: desktop-preview-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  identity:
    if: github.repository == 'flidai/leapview' && github.ref == 'refs/heads/main'
    name: Resolve preview identity
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      source_sha: ${{ steps.identity.outputs.source_sha }}
      version: ${{ steps.identity.outputs.version }}
      release_tag: ${{ steps.identity.outputs.release_tag }}

    steps:
      - name: Checkout exact preview source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 0

      - name: Require a reviewed default-branch commit and unused tag
        id: identity
        env:
          CONFIRMED: ${{ inputs.confirm_unsigned_preview }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          test "$CONFIRMED" = "true" || {
            printf 'The unsigned preview confirmation was not selected.\n' >&2
            exit 1
          }
          default_branch="$DEFAULT_BRANCH"
          git fetch --no-tags origin "$default_branch"
          source_sha="$(git rev-parse HEAD)"
          git merge-base --is-ancestor "$source_sha" "origin/$default_branch" || {
            printf 'Source %s is not contained in origin/%s.\n' "$source_sha" "$default_branch" >&2
            exit 1
          }
          base_version="$(node -p 'require("./desktop/package.json").version')"
          version="$(node desktop/scripts/preview-release.mjs version \
            --tag "$RELEASE_TAG" --base-version "$base_version")"
          manifest_tag="$(node -p 'require("./docs/desktop-release.json").release.tag')"
          manifest_version="$(node -p 'require("./docs/desktop-release.json").release.version')"
          test "$RELEASE_TAG" = "$manifest_tag" || {
            printf 'Release tag %s does not match desktop manifest tag %s.\n' "$RELEASE_TAG" "$manifest_tag" >&2
            exit 1
          }
          test "$version" = "$manifest_version" || {
            printf 'Release version %s does not match desktop manifest version %s.\n' "$version" "$manifest_version" >&2
            exit 1
          }
          if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            printf 'Tag %s already exists and cannot be replaced.\n' "$RELEASE_TAG" >&2
            exit 1
          fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            printf 'Release %s already exists and cannot be replaced.\n' "$RELEASE_TAG" >&2
            exit 1
          fi
          {
            echo "source_sha=$source_sha"
            echo "version=$version"
            echo "release_tag=$RELEASE_TAG"
          } >> "$GITHUB_OUTPUT"

  packages:
    if: github.repository == 'flidai/leapview' && github.ref == 'refs/heads/main'
    name: Build preview (${{ matrix.name }})
    needs: identity
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      LEAPVIEW_DESKTOP_DISTRIBUTION: preview
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            os: ubuntu-24.04
            artifact: linux-x64
            format: deb
          - name: macOS Intel
            os: macos-15-intel
            artifact: macos-x64
            format: dmg
          - name: macOS Apple silicon
            os: macos-15
            artifact: macos-arm64
            format: dmg
          - name: Windows x64
            os: windows-2025
            artifact: windows-x64
            format: exe

    steps:
      - name: Checkout exact preview source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.identity.outputs.source_sha }}

      - name: Build, prove, qualify, and upload the exact preview candidate
        if: matrix.artifact != 'linux-x64'
        uses: ./.github/actions/desktop-preview-candidate
        with:
          artifact-name: leapview-desktop-${{ matrix.artifact }}
          source-sha: ${{ needs.identity.outputs.source_sha }}

      - name: Check out protected retained-artifact tools
        if: matrix.artifact == 'linux-x64'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          path: protected
          persist-credentials: false

      - name: Install pinned Nix for retained Linux evidence
        if: matrix.artifact == 'linux-x64'
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
        with:
          install_url: https://releases.nixos.org/nix/nix-2.31.2/install
          extra_nix_config: |
            experimental-features = nix-command flakes
            sandbox = true
            sandbox-fallback = false

      - name: Authenticate original qualified and signed Linux artifacts
        if: matrix.artifact == 'linux-x64'
        id: nix_inputs
        env:
          GH_TOKEN: ${{ github.token }}
          PRODUCER_RUN: ${{ inputs.nix_desktop_run_id }}
          PRODUCER_ATTEMPT: ${{ inputs.nix_desktop_run_attempt }}
        run: |
          nix develop --no-update-lock-file ./protected -c python3 protected/scripts/nix_desktop_preview_inputs.py fetch \
            --run-id "$PRODUCER_RUN" --attempt "$PRODUCER_ATTEMPT" \
            --directory "$RUNNER_TEMP/nix-desktop-preview-inputs" --github-output "$GITHUB_OUTPUT"

      - name: Read exact original protected signer identity
        if: matrix.artifact == 'linux-x64'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ steps.nix_inputs.outputs.signerRevision }}
          path: nix-signer
          persist-credentials: false

      - name: Stage exact qualified Linux preview after genuine upgrade and rollback
        if: matrix.artifact == 'linux-x64'
        env:
          GH_TOKEN: ${{ github.token }}
          PRODUCER_RUN: ${{ inputs.nix_desktop_run_id }}
          PRODUCER_ATTEMPT: ${{ inputs.nix_desktop_run_attempt }}
          LIFECYCLE_RUN: ${{ inputs.nix_desktop_lifecycle_run_id }}
          LIFECYCLE_ATTEMPT: ${{ inputs.nix_desktop_lifecycle_run_attempt }}
          SOURCE_SHA: ${{ needs.identity.outputs.source_sha }}
        run: |
          nix develop --no-update-lock-file ./protected -c python3 protected/scripts/nix_desktop_preview_inputs.py stage \
            --run-id "$PRODUCER_RUN" --attempt "$PRODUCER_ATTEMPT" \
            --directory "$RUNNER_TEMP/nix-desktop-preview-inputs" \
            --source-root "$GITHUB_WORKSPACE" --signer-root "$GITHUB_WORKSPACE/nix-signer" \
            --verifier-root "$GITHUB_WORKSPACE/protected" --expected-source "$SOURCE_SHA" \
            --lifecycle-run "$LIFECYCLE_RUN" --lifecycle-attempt "$LIFECYCLE_ATTEMPT" \
            --output "$RUNNER_TEMP/nix-desktop-preview-candidate"

      - name: Retain exact qualified Linux preview bytes and source evidence
        if: matrix.artifact == 'linux-x64'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: leapview-desktop-linux-x64
          retention-days: 7
          if-no-files-found: error
          path: ${{ runner.temp }}/nix-desktop-preview-candidate/

  publish:
    if: github.repository == 'flidai/leapview' && github.ref == 'refs/heads/main'
    name: Publish unsigned GitHub prerelease
    needs: [identity, packages]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: desktop-preview
    permissions:
      contents: write
      actions: read
      attestations: write
      artifact-metadata: write
      id-token: write

    steps:
      - name: Checkout exact preview source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.identity.outputs.source_sha }}

      - name: Check out protected publication verification tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          path: protected
          persist-credentials: false

      - name: Download every native candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: leapview-desktop-*
          path: candidates

      - name: Verify every downloaded evidence bundle
        shell: bash
        run: |
          verify_candidate() {
            candidate="$1"
            format="$2"
            artifact="$(find "$candidate/out/make" -type f -name "*.$format" -print -quit)"
            manifest="$(find "$candidate/out/evidence" -type f -name '*.release.json' -print -quit)"
            sbom="$(find "$candidate/out/evidence" -type f -name '*.spdx.json' -print -quit)"
            update_arguments=()
            if [[ "$artifact" == *.dmg ]]; then
              update_arguments+=(--update-artifact "$(find "$candidate/out/make" -type f -name '*.zip' -print -quit)")
            elif [[ "$artifact" == *.exe ]]; then
              update_arguments+=(--update-artifact "$(find "$candidate/out/make" -type f -name '*.nupkg' -print -quit)")
              update_arguments+=(--update-artifact "$(find "$candidate/out/make" -type f -name 'RELEASES' -print -quit)")
            fi
            cmp "$candidate/release-policy.json" desktop/release-policy.json
            node protected/desktop/scripts/verify-release-evidence.mjs \
              --artifact "$artifact" \
              --checksums "$candidate/out/evidence/checksums.txt" \
              --manifest "$manifest" \
              --policy "$candidate/release-policy.json" \
              --sbom "$sbom" \
              "${update_arguments[@]}"
          }
          verify_candidate candidates/leapview-desktop-linux-x64 deb
          verify_candidate candidates/leapview-desktop-macos-arm64 dmg
          verify_candidate candidates/leapview-desktop-macos-x64 dmg
          verify_candidate candidates/leapview-desktop-windows-x64 exe

      - name: Stage public installer and evidence names
        working-directory: desktop
        run: |
          node scripts/preview-release.mjs stage \
            --candidates ../candidates \
            --output ../release \
            --version "${{ needs.identity.outputs.version }}"

      - name: Attest preview provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: release/*

      - name: Create draft unsigned prerelease with staged assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.identity.outputs.release_tag }}
          SOURCE_SHA: ${{ needs.identity.outputs.source_sha }}
          VERSION: ${{ needs.identity.outputs.version }}
          NIX_PRODUCER_RUN: ${{ inputs.nix_desktop_run_id }}
          NIX_PRODUCER_ATTEMPT: ${{ inputs.nix_desktop_run_attempt }}
          LIFECYCLE_RUN: ${{ inputs.nix_desktop_lifecycle_run_id }}
          LIFECYCLE_ATTEMPT: ${{ inputs.nix_desktop_lifecycle_run_attempt }}
        run: |
          release_tag="$RELEASE_TAG"
          source_sha="$SOURCE_SHA"
          notes="$(mktemp)"
          trap 'rm -f "$notes"' EXIT
          printf '%s\n' \
            '## LeapView Desktop unsigned preview' \
            '' \
            '**This build is unsigned.** It is an alpha for evaluation, not the signed production release.' \
            '' \
            '- macOS may require Control-click → Open, or approval in Privacy & Security.' \
            '- Windows may show Microsoft Defender SmartScreen; continue only if you obtained the file from this release and verified SHA256SUMS.' \
            '- Linux installs through your local package manager and may require administrator approval.' \
            '- The preview does not contact the production updater. Install a future signed release manually.' \
            '' \
            "Source commit: $source_sha" \
            "Publication verifier commit: $GITHUB_SHA" \
            "Linux bytes: protected Nix producer $NIX_PRODUCER_RUN attempt $NIX_PRODUCER_ATTEMPT (no rebuild)." \
            "Versioned upgrade and offline rollback: protected lifecycle $LIFECYCLE_RUN attempt $LIFECYCLE_ATTEMPT." \
            "Preview version: $VERSION" > "$notes"
          gh release create "$release_tag" \
            --target "$source_sha" \
            --title "LeapView Desktop $VERSION (unsigned preview)" \
            --notes-file "$notes" \
            --draft \
            --prerelease \
            release/*

      - name: Verify staged draft assets and attestations
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.identity.outputs.release_tag }}
          PUBLISHER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          gh release view "$RELEASE_TAG" --json isDraft,isPrerelease,assets \
            --jq 'if (.isDraft == true and .isPrerelease == true and (.assets | length) == 13) then "verified" else error("unexpected draft preview release") end'
          download="$RUNNER_TEMP/staged-desktop-evidence"
          mkdir -p "$download"
          gh release download "$RELEASE_TAG" --dir "$download"
          mapfile -t staged_files < <(find release -maxdepth 1 -type f -printf '%f\n' | sort)
          mapfile -t downloaded_files < <(find "$download" -maxdepth 1 -type f -printf '%f\n' | sort)
          test "${#staged_files[@]}" -eq 13
          test "${#downloaded_files[@]}" -eq "${#staged_files[@]}"
          diff -u <(printf '%s\n' "${staged_files[@]}") <(printf '%s\n' "${downloaded_files[@]}")
          for name in "${staged_files[@]}"; do
            cmp "release/$name" "$download/$name"
          done
          cd "$download"
          test "$(find . -maxdepth 1 -type f -name '*.spdx.json' | wc -l)" -eq 4
          test "$(find . -maxdepth 1 -type f -name '*.release.json' | wc -l)" -eq 4
          sha256sum --check SHA256SUMS
          for sbom in ./*.spdx.json; do
            jq -e '.spdxVersion == "SPDX-2.3" and (.packages | type == "array")' "$sbom" >/dev/null
          done
          for evidence in ./*; do
            [[ "$(basename "$evidence")" == SHA256SUMS ]] && continue
            gh attestation verify "$evidence" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow flidai/leapview/.github/workflows/desktop-preview-release.yml \
              --source-digest "$PUBLISHER_SHA" --source-ref refs/heads/main --deny-self-hosted-runners >/dev/null
          done

      - name: Publish verified prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.identity.outputs.release_tag }}
        run: |
          gh release edit "$RELEASE_TAG" --draft=false

      - name: Verify published prerelease shape
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.identity.outputs.release_tag }}
        run: |
          gh release view "$RELEASE_TAG" --json isDraft,isPrerelease,assets \
            --jq 'if (.isDraft == false and .isPrerelease == true and (.assets | length) == 13) then "verified" else error("unexpected published preview release") end'

      - name: Remove failed draft preview
        if: ${{ failure() }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.identity.outputs.release_tag }}
        run: |
          set -euo pipefail
          is_draft="$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft' 2>/dev/null || true)"
          if [[ "$is_draft" == "true" ]]; then
            gh release delete "$RELEASE_TAG" --cleanup-tag --yes
          fi
