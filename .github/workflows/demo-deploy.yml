name: Hosted demo deployment

on:
  workflow_dispatch:
    inputs:
      action:
        description: Hosted demo operation
        type: choice
        required: true
        default: publish
        options: [publish, deploy, upgrade, recover]
      image:
        description: 'Runtime operations: immutable ghcr.io/flidai/leapview@sha256 digest'
        type: string
        required: false
      qualification_run:
        description: 'Runtime operations: successful Main artifacts run ID with qualification receipt'
        type: string
        required: false

permissions:
  contents: read
  id-token: write
  packages: read
  actions: read
  attestations: read
  deployments: read

concurrency:
  group: leapview-hosted-demo
  cancel-in-progress: false

jobs:
  publication-source:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.action == 'publish'
    name: Resolve demo publication source
    environment: leapview-demo
    runs-on: ubuntu-24.04
    outputs:
      publish: ${{ steps.resolve.outputs.publish }}
      revision: ${{ steps.resolve.outputs.revision }}
    steps:
      - name: Check out the deployment policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Resolve the pinned runtime revision
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          DEMO_RUNTIME_REVISION: ${{ vars.DEMO_RUNTIME_REVISION }}
        run: python3 scripts/demo_runtime_record.py resolve

  deploy:
    name: Deploy selected showcase
    needs: publication-source
    if: needs.publication-source.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: leapview-demo
    env:
      SOURCE_REVISION: ${{ needs.publication-source.outputs.revision }}
      DEMO_DATASET: ${{ vars.DEMO_DATASET || 'olist' }}

    steps:
      - name: Check out the qualified revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.SOURCE_REVISION }}

      - name: Validate pinned dataset support
        run: |
          set -euo pipefail
          case "$DEMO_DATASET" in
            olist) ;; # Legacy pinned publishers support Olist without a manifest.
            cfo)
              if ! grep -Fxq -- cfo deploy/demo/datasets.txt 2>/dev/null; then
                echo "Pinned revision does not support CFO publication; qualify and deploy a revision with CFO publisher support first." >&2
                exit 64
              fi
              ;;
            *)
              echo "DEMO_DATASET must be olist or cfo" >&2
              exit 64
              ;;
          esac

      - name: Set up the cached CI toolchain
        uses: ./.github/actions/setup-ci
        with:
          browser: "false"

      - name: Restore the pinned demo dataset cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/leapview
          key: demo-datasets-v1-olist-967e41e0-finance-c3f17156

      - name: Prepare generated code
        run: task generate

      - name: Fetch demo deployment credentials
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d # v1.0.18
        with:
          method: oidc
          identity-id: 6aac9c3e-4f33-45b5-aa4e-884839b950a7
          oidc-audience: https://github.com/flidai
          domain: https://us.infisical.com
          project-slug: leapview
          env-slug: prod
          secret-path: /demo/deployment

      - name: Publish the selected showcase
        env:
          DEMO_SOURCE_REVISION: ${{ env.SOURCE_REVISION }}
          DEMO_TARGET: https://demo.leapview.dev
          DEMO_PROJECT_ID: ${{ vars.DEMO_PROJECT_ID }}
          DEMO_PUBLISHER_CLIENT_ID: ${{ vars.DEMO_PUBLISHER_PRINCIPAL_ID }}
          DEMO_RELEASE_CLIENT_ID: ${{ vars.DEMO_RELEASE_PRINCIPAL_ID }}
        run: ./scripts/deploy_demo.sh

      - name: Record deployed product routes
        if: success()
        run: |
          {
            echo '### Hosted demo'
            echo
            echo '- [Sign in](https://demo.leapview.dev/login)'
            echo '- Product dashboards (sign-in required):'
            if [[ "$DEMO_DATASET" == cfo ]]; then
              echo '- [CFO Command Center](https://demo.leapview.dev/dashboards/dashboard:cfo-command-center/pages/overview)'
            else
              echo '- [Visual Showcase](https://demo.leapview.dev/dashboards/dashboard:visual-showcase/pages/overview)'
              echo '- [Executive Sales](https://demo.leapview.dev/dashboards/dashboard:executive-sales/pages/overview)'
              echo '- [Fulfillment Operations](https://demo.leapview.dev/dashboards/dashboard:fulfillment-operations/pages/overview)'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  runtime:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && contains(fromJSON('["deploy","upgrade","recover"]'), inputs.action)
    name: Deploy qualified application image to demo-02
    permissions:
      contents: read
      id-token: write
      packages: read
      actions: read
      attestations: read
      deployments: write
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    environment: leapview-demo
    env:
      DEMO_ACTION: ${{ inputs.action }}
      DEMO_IMAGE: ${{ inputs.image }}
      QUALIFICATION_RUN: ${{ inputs.qualification_run }}
      DEMO_PROJECT_ID: ${{ vars.DEMO_PROJECT_ID }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Match immutable image to successful qualification
        id: qualified
        run: python3 scripts/demo_image_policy.py
      - name: Admit exact image provenance
        uses: ./.github/actions/oci-admission
        with:
          image: ${{ inputs.image }}
          repository: ghcr.io/flidai/leapview
          expected-workflow: flidai/leapview/.github/workflows/artifacts.yml
          source-revision: ${{ steps.qualified.outputs.revision }}
      - name: Set up browser validation
        uses: ./.github/actions/setup-ci
        with:
          browser: "true"
      - name: Install locked browser dependencies
        run: bun install --frozen-lockfile
      - name: Fetch demo deployment credentials
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d # v1.0.18
        with:
          method: oidc
          identity-id: 6aac9c3e-4f33-45b5-aa4e-884839b950a7
          oidc-audience: https://github.com/flidai
          domain: https://us.infisical.com
          project-slug: leapview
          env-slug: prod
          secret-path: /demo/deployment
      - name: Check demo upgrade requirements before recording deployment
        env:
          SOURCE_REVISION: ${{ steps.qualified.outputs.revision }}
        run: python3 scripts/demo_compose_deploy.py --preflight
      - name: Record runtime deployment in progress
        id: record
        env:
          SOURCE_REVISION: ${{ steps.qualified.outputs.revision }}
        run: python3 scripts/demo_runtime_record.py start
      - name: Execute reviewed operation and validate CFO pages
        id: rollout
        env:
          SOURCE_REVISION: ${{ steps.qualified.outputs.revision }}
        run: python3 scripts/demo_compose_deploy.py
      - name: Advance verified runtime pin
        if: success()
        env:
          DEPLOYMENT_ID: ${{ steps.record.outputs.id }}
        run: python3 scripts/demo_runtime_record.py success
      - name: Record incomplete runtime deployment
        if: ${{ !success() && steps.record.outputs.id != '' }}
        env:
          DEPLOYMENT_ID: ${{ steps.record.outputs.id }}
        run: python3 scripts/demo_runtime_record.py failure
      - name: Record deployed image
        if: success()
        env:
          SOURCE_REVISION: ${{ steps.qualified.outputs.revision }}
        run: |
          printf 'Deployed `%s` at revision `%s` to https://demo.leapview.dev.\n' "$DEMO_IMAGE" "$SOURCE_REVISION" >> "$GITHUB_STEP_SUMMARY"
