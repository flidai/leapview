name: Hosted demo deployment

on:
  workflow_run:
    workflows: [Main artifacts]
    types: [completed]
  workflow_dispatch:
    inputs:
      recover_assets:
        description: Install and verify the pinned map bundle on the existing demo host
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

concurrency:
  group: leapview-hosted-demo
  cancel-in-progress: false

jobs:
  recover-assets:
    name: Recover hosted-demo map assets
    if: >-
      github.event_name == 'workflow_dispatch' &&
      (github.ref != 'refs/heads/main' || inputs.recover_assets)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: leapview-demo

    steps:
      - name: Check out the recovery revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Fetch Hetzner infrastructure credentials
        uses: Infisical/secrets-action@6cd3f7c0e4cc0d2395ee4ef414eb6eeb5d3e73db # v1.0.17
        with:
          method: oidc
          identity-id: 6aac9c3e-4f33-45b5-aa4e-884839b950a7
          oidc-audience: https://github.com/flidai
          domain: https://us.infisical.com
          project-slug: leapview
          env-slug: prod
          secret-path: /hetzner-qualification/infrastructure

      - name: Fetch demo deployment credentials
        uses: Infisical/secrets-action@6cd3f7c0e4cc0d2395ee4ef414eb6eeb5d3e73db # v1.0.17
        with:
          method: oidc
          identity-id: 6aac9c3e-4f33-45b5-aa4e-884839b950a7
          oidc-audience: https://github.com/flidai
          domain: https://us.infisical.com
          project-slug: leapview
          env-slug: prod
          secret-path: /demo/deployment

      - name: Resolve temporary runner access
        run: |
          set -euo pipefail
          runner_ip="$(curl -4fsS --connect-timeout 5 --max-time 10 https://api.ipify.org)"
          [[ "$runner_ip" =~ ^([0-9]{1,3}\.){3}[0-9]{1,3}$ ]]
          echo "DEMO_RUNNER_IP=$runner_ip" >> "$GITHUB_ENV"

      - name: Install and verify the pinned map package
        env:
          DEMO_EXPECTED_SSH_FINGERPRINT: SHA256:JZaqjYFmZYGuJIy4Rmz+gRsrDGTZ6zNR0trob104AgY
          DEMO_LOGIN_PASSWORD: ${{ secrets.DEMO_LOGIN_PASSWORD }}
        run: ./scripts/recover_demo_assets.sh

  deploy:
    name: Deploy Olist showcase
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main') ||
      (github.event_name == 'workflow_dispatch' &&
       github.ref == 'refs/heads/main' &&
       !inputs.recover_assets)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: leapview-demo
    env:
      SOURCE_REVISION: ${{ github.event.workflow_run.head_sha || github.sha }}

    steps:
      - name: Check out the qualified revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.SOURCE_REVISION }}

      - name: Set up the cached CI toolchain
        uses: ./.github/actions/setup-ci
        with:
          browser: "false"

      - name: Restore the pinned Olist dataset cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/leapview
          key: olist-v2-967e41e04fc306fe604e2a693f488995a8b41e5047418f8a5c8e4abd6deca784

      - name: Prepare generated code
        run: task generate

      - name: Fetch demo deployment credentials
        uses: Infisical/secrets-action@6cd3f7c0e4cc0d2395ee4ef414eb6eeb5d3e73db # v1.0.17
        with:
          method: oidc
          identity-id: 6aac9c3e-4f33-45b5-aa4e-884839b950a7
          oidc-audience: https://github.com/flidai
          domain: https://us.infisical.com
          project-slug: leapview
          env-slug: prod
          secret-path: /demo/deployment

      - name: Publish the canonical Olist showcase
        env:
          DEMO_SOURCE_REVISION: ${{ env.SOURCE_REVISION }}
          DEMO_TARGET: https://demo.leapview.dev
        run: ./scripts/deploy_demo.sh

      - name: Record deployed product routes
        if: success()
        run: |
          {
            echo '### Hosted demo'
            echo
            echo '- [Visual Showcase](https://demo.leapview.dev/dashboards/dashboard:visual-showcase/pages/overview)'
            echo '- [Executive Sales](https://demo.leapview.dev/dashboards/dashboard:executive-sales/pages/overview)'
            echo '- [Fulfillment Operations](https://demo.leapview.dev/dashboards/dashboard:fulfillment-operations/pages/overview)'
          } >> "$GITHUB_STEP_SUMMARY"
