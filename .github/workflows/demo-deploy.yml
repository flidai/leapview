name: Hosted demo deployment

on:
  workflow_run:
    workflows: [Main artifacts]
    types: [completed]
  workflow_dispatch:
    inputs:
      action:
        description: Hosted demo operation
        type: choice
        required: true
        default: publish
        options: [publish, stage, prepare, deploy]

permissions:
  contents: read
  id-token: write
  packages: read
  actions: read
  attestations: read

concurrency:
  group: leapview-hosted-demo
  cancel-in-progress: false

jobs:
  publication-source:
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.action == 'publish')
    name: Resolve demo publication source
    environment: leapview-demo
    runs-on: ubuntu-24.04
    outputs:
      publish: ${{ steps.resolve.outputs.publish }}
      revision: ${{ steps.resolve.outputs.revision }}
    steps:
      - name: Check out the deployment policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 2
      - name: Resolve the pinned runtime revision
        id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          DEMO_RUNTIME_REVISION: ${{ vars.DEMO_RUNTIME_REVISION }}
        run: |
          set -euo pipefail
          extract_revision() {
            sed -nE "s/^REVISION = '([0-9a-f]{40})'$/\1/p"
          }
          tracked_revision="$(extract_revision < scripts/rollout_demo_runtime.py)"
          revision="${DEMO_RUNTIME_REVISION:-$tracked_revision}"
          [[ "$revision" =~ ^[0-9a-f]{40}$ ]]
          publish=false
          if [[ "$EVENT_NAME" == workflow_dispatch ]]; then
            publish=true
          elif [[ -z "$DEMO_RUNTIME_REVISION" ]]; then
            previous_revision="$(git show HEAD^:scripts/rollout_demo_runtime.py | extract_revision)"
            [[ "$previous_revision" =~ ^[0-9a-f]{40}$ ]]
            if [[ "$revision" != "$previous_revision" ]]; then
              publish=true
            fi
          fi
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
          if [[ "$publish" == false ]]; then
            echo "Skipping automatic publication; operator-selected runtimes publish through workflow dispatch." >> "$GITHUB_STEP_SUMMARY"
          fi

  deploy:
    name: Deploy selected showcase
    needs: publication-source
    if: needs.publication-source.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: leapview-demo
    env:
      SOURCE_REVISION: ${{ needs.publication-source.outputs.revision }}
      DEMO_DATASET: ${{ vars.DEMO_DATASET || 'olist' }}

    steps:
      - name: Check out the qualified revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.SOURCE_REVISION }}

      - name: Validate pinned dataset support
        run: |
          set -euo pipefail
          case "$DEMO_DATASET" in
            olist) ;; # Legacy pinned publishers support Olist without a manifest.
            cfo)
              if ! grep -Fxq -- cfo deploy/demo/datasets.txt 2>/dev/null; then
                echo "Pinned revision does not support CFO publication; qualify and deploy a revision with CFO publisher support first." >&2
                exit 64
              fi
              ;;
            *)
              echo "DEMO_DATASET must be olist or cfo" >&2
              exit 64
              ;;
          esac

      - name: Set up the cached CI toolchain
        uses: ./.github/actions/setup-ci
        with:
          browser: "false"

      - name: Restore the pinned demo dataset cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/leapview
          key: demo-datasets-v1-olist-967e41e0-finance-c3f17156

      - name: Prepare generated code
        run: task generate

      - name: Fetch demo deployment credentials
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d # v1.0.18
        with:
          method: oidc
          identity-id: 6aac9c3e-4f33-45b5-aa4e-884839b950a7
          oidc-audience: https://github.com/flidai
          domain: https://us.infisical.com
          project-slug: leapview
          env-slug: prod
          secret-path: /demo/deployment

      - name: Publish the selected showcase
        env:
          DEMO_SOURCE_REVISION: ${{ env.SOURCE_REVISION }}
          DEMO_TARGET: https://demo.leapview.dev
          DEMO_PROJECT_ID: ${{ vars.DEMO_PROJECT_ID }}
          DEMO_PUBLISHER_CLIENT_ID: ${{ vars.DEMO_PUBLISHER_PRINCIPAL_ID }}
          DEMO_RELEASE_CLIENT_ID: ${{ vars.DEMO_RELEASE_PRINCIPAL_ID }}
        run: ./scripts/deploy_demo.sh

      - name: Record deployed product routes
        if: success()
        run: |
          {
            echo '### Hosted demo'
            echo
            echo '- [Sign in](https://demo.leapview.dev/login)'
            echo '- Product dashboards (sign-in required):'
            if [[ "$DEMO_DATASET" == cfo ]]; then
              echo '- [CFO Command Center](https://demo.leapview.dev/dashboards/dashboard:cfo-command-center/pages/overview)'
            else
              echo '- [Visual Showcase](https://demo.leapview.dev/dashboards/dashboard:visual-showcase/pages/overview)'
              echo '- [Executive Sales](https://demo.leapview.dev/dashboards/dashboard:executive-sales/pages/overview)'
              echo '- [Fulfillment Operations](https://demo.leapview.dev/dashboards/dashboard:fulfillment-operations/pages/overview)'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  stage:
    if: inputs.action == 'stage' && github.ref == 'refs/heads/main'
    concurrency:
      group: leapview-demo-operator
      cancel-in-progress: false
    name: Stage qualified demo runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: leapview-demo
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Require the exact qualified main image
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run_json="$(gh api repos/flidai/leapview/actions/runs/35894842492)"
          test "$(jq -r .conclusion <<<"$run_json")" = success
          test "$(jq -r .head_sha <<<"$run_json")" = 2caaf4d0c3e0ce637a22c376f63240c27dfaf20d
      - name: Admit exact image provenance
        uses: ./.github/actions/oci-admission
        with:
          image: ghcr.io/flidai/leapview@sha256:35d1207a312279cc7bcf3c64a9284a8410d1f21c30920f2cbf1935113553eb24
          repository: ghcr.io/flidai/leapview
          expected-workflow: flidai/leapview/.github/workflows/artifacts.yml
          source-revision: 2caaf4d0c3e0ce637a22c376f63240c27dfaf20d
      - name: Fetch infrastructure credentials
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d # v1.0.18
        with:
          method: oidc
          identity-id: 6aac9c3e-4f33-45b5-aa4e-884839b950a7
          oidc-audience: https://github.com/flidai
          domain: https://us.infisical.com
          project-slug: leapview
          env-slug: prod
          secret-path: /hetzner-qualification/infrastructure
      - name: Fetch demo deployment credentials
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d # v1.0.18
        with:
          method: oidc
          identity-id: 6aac9c3e-4f33-45b5-aa4e-884839b950a7
          oidc-audience: https://github.com/flidai
          domain: https://us.infisical.com
          project-slug: leapview
          env-slug: prod
          secret-path: /demo/deployment
      - name: Stage immutable image with pinned SSH identity
        env:
          DEMO_EXPECTED_SSH_FINGERPRINT: SHA256:k3AZrVrLBF5tyItYzRUkcsVJEFVVOqxsHhBvQypTVWE
        run: |
          set -euo pipefail
          DEMO_RUNNER_IP=""
          for endpoint in https://api.ipify.org https://checkip.amazonaws.com; do
            candidate="$(curl -4fsS --retry 2 --retry-delay 1 --retry-all-errors --connect-timeout 5 --max-time 10 "$endpoint" || true)"
            if [[ "$candidate" =~ ^([0-9]{1,3}\.){3}[0-9]{1,3}$ ]]; then
              DEMO_RUNNER_IP="$candidate"
              break
            fi
          done
          [[ -n "$DEMO_RUNNER_IP" ]] || {
            echo "unable to resolve the GitHub runner public IPv4 address" >&2
            exit 1
          }
          export DEMO_RUNNER_IP
          bash scripts/stage_demo_runtime.sh

  rollout:
    if: >-
      github.ref == 'refs/heads/main' &&
      (inputs.action == 'prepare' || inputs.action == 'deploy')
    concurrency:
      group: leapview-demo-operator
      cancel-in-progress: false
    name: Prepare or deploy qualified demo runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: leapview-demo
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Require the exact qualified main image
        if: inputs.action == 'deploy'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run_json="$(gh api repos/flidai/leapview/actions/runs/35894842492)"
          test "$(jq -r .conclusion <<<"$run_json")" = success
          test "$(jq -r .head_sha <<<"$run_json")" = 2caaf4d0c3e0ce637a22c376f63240c27dfaf20d
      - name: Fetch infrastructure credentials
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d # v1.0.18
        with:
          method: oidc
          identity-id: 6aac9c3e-4f33-45b5-aa4e-884839b950a7
          oidc-audience: https://github.com/flidai
          domain: https://us.infisical.com
          project-slug: leapview
          env-slug: prod
          secret-path: /hetzner-qualification/infrastructure
      - name: Fetch demo deployment credentials
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d # v1.0.18
        with:
          method: oidc
          identity-id: 6aac9c3e-4f33-45b5-aa4e-884839b950a7
          oidc-audience: https://github.com/flidai
          domain: https://us.infisical.com
          project-slug: leapview
          env-slug: prod
          secret-path: /demo/deployment
      - name: Run checked rollout with pinned SSH identity
        env:
          DEMO_ROLLOUT_ACTION: ${{ inputs.action }}
          DEMO_EXPECTED_SSH_FINGERPRINT: SHA256:k3AZrVrLBF5tyItYzRUkcsVJEFVVOqxsHhBvQypTVWE
        run: |
          set -euo pipefail
          DEMO_RUNNER_IP=""
          for endpoint in https://api.ipify.org https://checkip.amazonaws.com; do
            candidate="$(curl -4fsS --retry 2 --retry-delay 1 --retry-all-errors --connect-timeout 5 --max-time 10 "$endpoint" || true)"
            if [[ "$candidate" =~ ^([0-9]{1,3}\.){3}[0-9]{1,3}$ ]]; then
              DEMO_RUNNER_IP="$candidate"
              break
            fi
          done
          [[ -n "$DEMO_RUNNER_IP" ]] || {
            echo "unable to resolve the GitHub runner public IPv4 address" >&2
            exit 1
          }
          export DEMO_RUNNER_IP
          bash scripts/rollout_demo_runtime.sh
