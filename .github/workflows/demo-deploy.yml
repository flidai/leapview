name: Hosted demo deployment

on:
  workflow_run:
    workflows: [Main artifacts]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  packages: read

concurrency:
  group: leapview-hosted-demo
  cancel-in-progress: false

env:
  IMAGE_REPOSITORY: ghcr.io/flidai/leapview

jobs:
  deploy:
    name: Deploy Olist showcase
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: leapview-demo
    env:
      SOURCE_REVISION: ${{ github.event.workflow_run.head_sha || github.sha }}

    steps:
      - name: Check out the qualified revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.SOURCE_REVISION }}

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Restore the pinned Olist dataset cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/leapview
          key: olist-v2-967e41e04fc306fe604e2a693f488995a8b41e5047418f8a5c8e4abd6deca784

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve the qualified immutable image
        run: |
          set -euo pipefail
          [[ "$SOURCE_REVISION" =~ ^[0-9a-f]{40}$ ]]
          image_tag="${IMAGE_REPOSITORY}:main-${SOURCE_REVISION}"
          docker pull "$image_tag"
          demo_image="$(docker image inspect "$image_tag" --format '{{json .RepoDigests}}' |
            jq -r '.[] | select(startswith("ghcr.io/flidai/leapview@sha256:"))' |
            head -n 1)"
          [[ "$demo_image" =~ ^ghcr\.io/flidai/leapview@sha256:[0-9a-f]{64}$ ]]
          echo "DEMO_IMAGE=$demo_image" >> "$GITHUB_ENV"
          printf 'Qualified demo image: `%s`\n' "$demo_image" >> "$GITHUB_STEP_SUMMARY"

      - name: Fetch Hetzner infrastructure credentials
        uses: Infisical/secrets-action@77ab1f4ccd183a543cb5b42435fbd181189f4995 # v1.0.16
        with:
          method: oidc
          identity-id: 6aac9c3e-4f33-45b5-aa4e-884839b950a7
          oidc-audience: https://github.com/flidai
          domain: https://us.infisical.com
          project-slug: leapview
          env-slug: prod
          secret-path: /hetzner-qualification/infrastructure

      - name: Fetch demo deployment credentials
        uses: Infisical/secrets-action@77ab1f4ccd183a543cb5b42435fbd181189f4995 # v1.0.16
        with:
          method: oidc
          identity-id: 6aac9c3e-4f33-45b5-aa4e-884839b950a7
          oidc-audience: https://github.com/flidai
          domain: https://us.infisical.com
          project-slug: leapview
          env-slug: prod
          secret-path: /demo/deployment

      - name: Resolve temporary runner access
        run: |
          set -euo pipefail
          runner_ip="$(curl -4fsS --connect-timeout 5 --max-time 10 https://api.ipify.org)"
          [[ "$runner_ip" =~ ^([0-9]{1,3}\.){3}[0-9]{1,3}$ ]]
          echo "DEMO_RUNNER_IP=$runner_ip" >> "$GITHUB_ENV"

      - name: Upgrade and deploy the canonical Olist showcase
        env:
          DEMO_SOURCE_REVISION: ${{ env.SOURCE_REVISION }}
          DEMO_TARGET: https://demo.leapview.dev
        run: ./scripts/deploy_demo.sh

      - name: Record deployed product routes
        if: success()
        run: |
          {
            echo '### Hosted demo'
            echo
            echo '- [Visual Showcase](https://demo.leapview.dev/workspaces/visuals/dashboards/visual-showcase/pages/overview)'
            echo '- [Executive Sales](https://demo.leapview.dev/workspaces/sales/dashboards/executive-sales/pages/overview)'
            echo '- [Fulfillment Operations](https://demo.leapview.dev/workspaces/operations/dashboards/fulfillment-operations/pages/overview)'
          } >> "$GITHUB_STEP_SUMMARY"
