name: Hosted demo deployment
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: leapview-hosted-demo
  cancel-in-progress: false
jobs:
  inspect:
    name: Inspect hosted demo runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: leapview-demo
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Fetch infrastructure credentials
        uses: Infisical/secrets-action@6cd3f7c0e4cc0d2395ee4ef414eb6eeb5d3e73db
        with:
          method: oidc
          identity-id: 6aac9c3e-4f33-45b5-aa4e-884839b950a7
          oidc-audience: https://github.com/flidai
          domain: https://us.infisical.com
          project-slug: leapview
          env-slug: prod
          secret-path: /hetzner-qualification/infrastructure
      - name: Fetch demo deployment credentials
        uses: Infisical/secrets-action@6cd3f7c0e4cc0d2395ee4ef414eb6eeb5d3e73db
        with:
          method: oidc
          identity-id: 6aac9c3e-4f33-45b5-aa4e-884839b950a7
          oidc-audience: https://github.com/flidai
          domain: https://us.infisical.com
          project-slug: leapview
          env-slug: prod
          secret-path: /demo/deployment
      - name: Inspect runtime with pinned SSH identity
        env:
          DEMO_EXPECTED_SSH_FINGERPRINT: SHA256:JZaqjYFmZYGuJIy4Rmz+gRsrDGTZ6zNR0trob104AgY
        run: |
          set -euo pipefail
          DEMO_RUNNER_IP="$(curl -4fsS --connect-timeout 5 --max-time 10 https://api.ipify.org)"
          export DEMO_RUNNER_IP
          bash scripts/inspect_demo_runtime.sh
