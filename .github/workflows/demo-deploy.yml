name: Hosted demo deployment
on:
  workflow_dispatch:
    inputs:
      action:
        type: choice
        default: inspect
        options: [inspect, remove-invalid-olist-view, repair-managed-data-pointer, recover-credentials, grant-recovery-admin, revoke-recovery-admin, grant-recovery-generation, revoke-recovery-generation, qualify, stage, prepare, deploy]
permissions:
  contents: read
  id-token: write
  packages: read
  attestations: read
  actions: read
jobs:
  inspect:
    if: inputs.action == 'inspect' || inputs.action == 'remove-invalid-olist-view' || inputs.action == 'repair-managed-data-pointer' || inputs.action == 'recover-credentials' || inputs.action == 'grant-recovery-admin' || inputs.action == 'revoke-recovery-admin' || inputs.action == 'grant-recovery-generation' || inputs.action == 'revoke-recovery-generation'
    concurrency:
      group: leapview-demo-operator
      cancel-in-progress: false
    name: Inspect hosted demo runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: leapview-demo
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up recovery toolchain
        if: inputs.action == 'recover-credentials' || inputs.action == 'grant-recovery-admin' || inputs.action == 'revoke-recovery-admin' || inputs.action == 'grant-recovery-generation' || inputs.action == 'revoke-recovery-generation'
        uses: ./.github/actions/setup-ci
        with:
          browser: "false"
      - name: Build bounded credential recovery helper
        if: inputs.action == 'recover-credentials' || inputs.action == 'grant-recovery-admin' || inputs.action == 'revoke-recovery-admin' || inputs.action == 'grant-recovery-generation' || inputs.action == 'revoke-recovery-generation'
        run: |
          task generate
          go build -o /tmp/recover-demo-credentials ./internal/app/tools/recoverdemocredentials
      - name: Fetch infrastructure credentials
        uses: Infisical/secrets-action@6cd3f7c0e4cc0d2395ee4ef414eb6eeb5d3e73db
        with:
          method: oidc
          identity-id: 6aac9c3e-4f33-45b5-aa4e-884839b950a7
          oidc-audience: https://github.com/flidai
          domain: https://us.infisical.com
          project-slug: leapview
          env-slug: prod
          secret-path: /hetzner-qualification/infrastructure
      - name: Fetch demo deployment credentials
        uses: Infisical/secrets-action@6cd3f7c0e4cc0d2395ee4ef414eb6eeb5d3e73db
        with:
          method: oidc
          identity-id: 6aac9c3e-4f33-45b5-aa4e-884839b950a7
          oidc-audience: https://github.com/flidai
          domain: https://us.infisical.com
          project-slug: leapview
          env-slug: prod
          secret-path: /demo/deployment
      - name: Inspect runtime with pinned SSH identity
        env:
          DEMO_EXPECTED_SSH_FINGERPRINT: SHA256:JZaqjYFmZYGuJIy4Rmz+gRsrDGTZ6zNR0trob104AgY
          DEMO_RECOVER_CREDENTIALS: ${{ inputs.action == 'recover-credentials' || inputs.action == 'grant-recovery-admin' || inputs.action == 'revoke-recovery-admin' || inputs.action == 'grant-recovery-generation' || inputs.action == 'revoke-recovery-generation' }}
          DEMO_REPAIR_MANAGED_DATA_POINTER: ${{ inputs.action == 'repair-managed-data-pointer' }}
          DEMO_REMOVE_INVALID_OLIST_VIEW: ${{ inputs.action == 'remove-invalid-olist-view' }}
          DEMO_PLATFORM_ADMIN_MODE: ${{ inputs.action == 'grant-recovery-admin' && 'grant' || inputs.action == 'revoke-recovery-admin' && 'revoke' || inputs.action == 'grant-recovery-generation' && 'grant-generation' || inputs.action == 'revoke-recovery-generation' && 'revoke-generation' || 'unchanged' }}
          DEMO_RECOVERY_BINARY: /tmp/recover-demo-credentials
          DEMO_PUBLISHER_CLIENT_ID: ${{ vars.DEMO_PUBLISHER_PRINCIPAL_ID }}
          DEMO_RELEASE_CLIENT_ID: ${{ vars.DEMO_RELEASE_PRINCIPAL_ID }}
        run: |
          set -euo pipefail
          DEMO_RUNNER_IP="$(curl -4fsS --connect-timeout 5 --max-time 10 https://api.ipify.org)"
          export DEMO_RUNNER_IP
          bash scripts/inspect_demo_runtime.sh
      - name: Report public runtime compatibility identity
        if: inputs.action == 'inspect'
        env:
          DEMO_PUBLISHER_CLIENT_ID: ${{ vars.DEMO_PUBLISHER_PRINCIPAL_ID }}
          DEMO_PROJECT_ID: ${{ vars.DEMO_PROJECT_ID }}
        run: |
          set -euo pipefail
          token="$(curl --fail --silent --show-error \
            --request POST \
            --header 'Content-Type: application/x-www-form-urlencoded' \
            --data-urlencode 'grant_type=client_credentials' \
            --data-urlencode "client_id=$DEMO_PUBLISHER_CLIENT_ID" \
            --data-urlencode "client_secret=$DEMO_PUBLISHER_CLIENT_SECRET" \
            --data-urlencode "project_id=$DEMO_PROJECT_ID" \
            --data-urlencode 'scope=RESOURCE_USE RESOURCE_READ RESOURCE_EDIT RESOURCE_PUBLISH' \
            --data-urlencode 'lifetime_seconds=300' \
            https://demo.leapview.dev/oauth/token | jq -er .access_token)"
          curl --fail --silent --show-error \
            --header "Authorization: Bearer $token" \
            https://demo.leapview.dev/api/v1/capabilities \
            | jq -c '{apiVersion,deliveryMode,buildRevision,buildDirty,buildDevelopment}'
  qualify:
    if: inputs.action == 'qualify'
    name: Qualify exact open-PR demo image
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up the cached CI toolchain
        uses: ./.github/actions/setup-ci
      - name: Install browser dependencies
        run: bun install --frozen-lockfile
      - name: Wait for the exact image build and provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 80); do
            state="$(gh api repos/flidai/leapview/actions/runs/35416975080/jobs --jq '.jobs[] | select(.name == "Build production image") | if .status == "completed" then .conclusion else .status end')"
            case "$state" in
              success) exit 0 ;;
              failure|cancelled|skipped) echo "Canonical image build ended in $state"; exit 1 ;;
            esac
            sleep 30
          done
          echo 'Image build did not finish within 40 minutes'
          exit 1
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve exact main image
        id: image
        run: |
          set -euo pipefail
          tag=ghcr.io/flidai/leapview:candidate-6e32701df11e2de137e7db59025e7ed9c0399078
          docker pull "$tag"
          image="$(docker image inspect "$tag" --format '{{json .RepoDigests}}' | jq -er '.[] | select(startswith("ghcr.io/flidai/leapview@sha256:"))' | head -1)"
          echo "reference=$image" >> "$GITHUB_OUTPUT"
      - name: Admit exact image provenance
        id: admission
        uses: ./.github/actions/oci-admission
        with:
          image: ${{ steps.image.outputs.reference }}
          repository: ghcr.io/flidai/leapview
          expected-workflow: flidai/leapview/.github/workflows/artifacts.yml
          source-revision: 6e32701df11e2de137e7db59025e7ed9c0399078
      - name: Run complete image qualification with current token UI contract
        env:
          IMAGE_REFERENCE: ${{ steps.admission.outputs.image }}
        run: task image:qualify:production IMAGE="$IMAGE_REFERENCE"
      - name: Upload qualification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: demo-6e32701df-qualification
          path: .tmp/qualification/production-image
          if-no-files-found: ignore
  stage:
    if: inputs.action == 'stage'
    concurrency:
      group: leapview-demo-operator
      cancel-in-progress: false
    name: Stage exact open-PR demo runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: leapview-demo
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Fetch infrastructure credentials
        uses: Infisical/secrets-action@6cd3f7c0e4cc0d2395ee4ef414eb6eeb5d3e73db
        with:
          method: oidc
          identity-id: 6aac9c3e-4f33-45b5-aa4e-884839b950a7
          oidc-audience: https://github.com/flidai
          domain: https://us.infisical.com
          project-slug: leapview
          env-slug: prod
          secret-path: /hetzner-qualification/infrastructure
      - name: Fetch demo deployment credentials
        uses: Infisical/secrets-action@6cd3f7c0e4cc0d2395ee4ef414eb6eeb5d3e73db
        with:
          method: oidc
          identity-id: 6aac9c3e-4f33-45b5-aa4e-884839b950a7
          oidc-audience: https://github.com/flidai
          domain: https://us.infisical.com
          project-slug: leapview
          env-slug: prod
          secret-path: /demo/deployment
      - name: Stage immutable image with pinned SSH identity
        env:
          DEMO_EXPECTED_SSH_FINGERPRINT: SHA256:JZaqjYFmZYGuJIy4Rmz+gRsrDGTZ6zNR0trob104AgY
        run: |
          set -euo pipefail
          DEMO_RUNNER_IP="$(curl -4fsS --connect-timeout 5 --max-time 10 https://api.ipify.org)"
          export DEMO_RUNNER_IP
          bash scripts/stage_demo_runtime.sh
  rollout:
    if: inputs.action == 'prepare' || inputs.action == 'deploy'
    concurrency:
      group: leapview-demo-operator
      cancel-in-progress: false
    name: Prepare or roll out exact open-PR demo runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: leapview-demo
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Require complete qualification before cutover
        if: inputs.action == 'deploy'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          conclusion="$(gh api repos/flidai/leapview/actions/runs/35416975080 --jq .conclusion)"
          test "$conclusion" = success
      - name: Fetch infrastructure credentials
        uses: Infisical/secrets-action@6cd3f7c0e4cc0d2395ee4ef414eb6eeb5d3e73db
        with:
          method: oidc
          identity-id: 6aac9c3e-4f33-45b5-aa4e-884839b950a7
          oidc-audience: https://github.com/flidai
          domain: https://us.infisical.com
          project-slug: leapview
          env-slug: prod
          secret-path: /hetzner-qualification/infrastructure
      - name: Fetch demo deployment credentials
        uses: Infisical/secrets-action@6cd3f7c0e4cc0d2395ee4ef414eb6eeb5d3e73db
        with:
          method: oidc
          identity-id: 6aac9c3e-4f33-45b5-aa4e-884839b950a7
          oidc-audience: https://github.com/flidai
          domain: https://us.infisical.com
          project-slug: leapview
          env-slug: prod
          secret-path: /demo/deployment
      - name: Run checked rollout with pinned SSH identity
        env:
          DEMO_ROLLOUT_ACTION: ${{ inputs.action }}
          DEMO_EXPECTED_SSH_FINGERPRINT: SHA256:JZaqjYFmZYGuJIy4Rmz+gRsrDGTZ6zNR0trob104AgY
        run: |
          set -euo pipefail
          DEMO_RUNNER_IP="$(curl -4fsS --connect-timeout 5 --max-time 10 https://api.ipify.org)"
          export DEMO_RUNNER_IP
          bash scripts/rollout_demo_runtime.sh
