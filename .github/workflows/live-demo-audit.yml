name: Temporary live demo audit

on:
  workflow_dispatch:
  push:
    branches:
      - codex/live-demo-audit-temp

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: leapview-demo
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: codex/dashboard-builder-audit
      - name: Fetch infrastructure credentials
        uses: Infisical/secrets-action@6cd3f7c0e4cc0d2395ee4ef414eb6eeb5d3e73db # v1.0.17
        with:
          method: oidc
          identity-id: 6aac9c3e-4f33-45b5-aa4e-884839b950a7
          oidc-audience: https://github.com/flidai
          domain: https://us.infisical.com
          project-slug: leapview
          env-slug: prod
          secret-path: /hetzner-qualification/infrastructure
      - uses: ./.github/actions/setup-ci
        with:
          browser: "false"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/leapview
          key: olist-v2-967e41e04fc306fe604e2a693f488995a8b41e5047418f8a5c8e4abd6deca784
      - run: task generate
      - name: Fetch demo deployment credentials
        uses: Infisical/secrets-action@6cd3f7c0e4cc0d2395ee4ef414eb6eeb5d3e73db # v1.0.17
        with:
          method: oidc
          identity-id: 6aac9c3e-4f33-45b5-aa4e-884839b950a7
          oidc-audience: https://github.com/flidai
          domain: https://us.infisical.com
          project-slug: leapview
          env-slug: prod
          secret-path: /demo/deployment
      - name: Generate bounded transition credentials
        shell: bash
        run: |
          set -euo pipefail
          publisher_token="lv_pat_$(openssl rand -hex 32)"
          release_token="lv_pat_$(openssl rand -hex 32)"
          echo "::add-mask::$publisher_token"
          echo "::add-mask::$release_token"
          {
            echo "DEMO_RECOVERY_PUBLISHER_TOKEN_ID=$(cat /proc/sys/kernel/random/uuid)"
            echo "DEMO_RECOVERY_PUBLISHER_PRINCIPAL_ID=01a0a9d0-898d-74b6-b699-d7284c942404"
            echo "DEMO_RECOVERY_PUBLISHER_TOKEN=$publisher_token"
            echo "DEMO_RECOVERY_RELEASE_TOKEN_ID=$(cat /proc/sys/kernel/random/uuid)"
            echo "DEMO_RECOVERY_RELEASE_PRINCIPAL_ID=01a0a9dd-28f9-7277-a4ad-409260d4912d"
            echo "DEMO_RECOVERY_RELEASE_TOKEN=$release_token"
          } >> "$GITHUB_ENV"
      - name: Resolve runner address
        id: runner-ip
        run: echo "ip=$(curl --fail --silent --show-error https://api.ipify.org)" >> "$GITHUB_OUTPUT"
      - name: Grant bounded transition credentials
        env:
          DEMO_EXPECTED_SSH_FINGERPRINT: SHA256:JZaqjYFmZYGuJIy4Rmz+gRsrDGTZ6zNR0trob104AgY
          DEMO_RUNNER_IP: ${{ steps.runner-ip.outputs.ip }}
          DEMO_RECOVER_CREDENTIALS: "true"
          DEMO_PLATFORM_ADMIN_MODE: grant-api-tokens
          DEMO_RECOVERY_BINARY: /tmp/recover-demo-credentials
          DEMO_PUBLISHER_CLIENT_ID: ${{ vars.DEMO_PUBLISHER_PRINCIPAL_ID }}
          DEMO_RELEASE_CLIENT_ID: ${{ vars.DEMO_RELEASE_PRINCIPAL_ID }}
        run: |
          git fetch --depth=1 origin codex/demo-rollout-67d69c9
          git show FETCH_HEAD:scripts/inspect_demo_runtime.sh > /tmp/inspect-demo-runtime.sh
          mkdir -p internal/app/tools/recoverdemocredentials
          git show FETCH_HEAD:internal/app/tools/recoverdemocredentials/main.go > internal/app/tools/recoverdemocredentials/main.go
          go build -o /tmp/recover-demo-credentials ./internal/app/tools/recoverdemocredentials
          chmod +x /tmp/inspect-demo-runtime.sh
          /tmp/inspect-demo-runtime.sh
      - name: Publish canonical demo content
        env:
          DEMO_SOURCE_REVISION: 67d69c97f26096521fa7633114b145c7c43480b2
          DEMO_TARGET: https://demo.leapview.dev
          DEMO_PROJECT_ID: ${{ vars.DEMO_PROJECT_ID }}
          DEMO_PUBLISHER_CLIENT_ID: ${{ vars.DEMO_PUBLISHER_PRINCIPAL_ID }}
          DEMO_RELEASE_CLIENT_ID: ${{ vars.DEMO_RELEASE_PRINCIPAL_ID }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/deploy_demo_recovery.sh')
          source = Path('scripts/deploy_demo.sh').read_text()
          block = '''"$leapview" data sync \\
            --source-root "$source_root" \\
            --connection olist \\
            --from "$data_path" \\
            --target "$demo_target" \\
            --project-id "$project_id" \\
            --token "$publisher_token"
          '''
          if source.count(block) != 1:
              raise SystemExit('managed-data bootstrap block changed unexpectedly')
          exchange = '''publisher_token="$(exchange_workload_token \\
            "$publisher_client_id" \\
            "$publisher_client_secret" \\
            'RESOURCE_USE RESOURCE_READ RESOURCE_EDIT RESOURCE_PUBLISH')"
          release_token="$(exchange_workload_token \\
            "$release_client_id" \\
            "$release_client_secret" \\
            'PROJECT_ADMIN')"
          '''
          if source.count(exchange) != 1:
              raise SystemExit('workload token exchange block changed unexpectedly')
          replacement = '''publisher_token="${DEMO_RECOVERY_PUBLISHER_TOKEN:?Set DEMO_RECOVERY_PUBLISHER_TOKEN}"
          release_token="${DEMO_RECOVERY_RELEASE_TOKEN:?Set DEMO_RECOVERY_RELEASE_TOKEN}"
          '''
          path.write_text(source.replace(block, '').replace(exchange, replacement))
          path.chmod(0o755)
          PY
          ./scripts/deploy_demo_recovery.sh
      - name: Revoke bounded transition credentials
        if: always()
        env:
          DEMO_EXPECTED_SSH_FINGERPRINT: SHA256:JZaqjYFmZYGuJIy4Rmz+gRsrDGTZ6zNR0trob104AgY
          DEMO_RUNNER_IP: ${{ steps.runner-ip.outputs.ip }}
          DEMO_RECOVER_CREDENTIALS: "true"
          DEMO_PLATFORM_ADMIN_MODE: revoke-api-tokens
          DEMO_RECOVERY_BINARY: /tmp/recover-demo-credentials
          DEMO_PUBLISHER_CLIENT_ID: ${{ vars.DEMO_PUBLISHER_PRINCIPAL_ID }}
          DEMO_RELEASE_CLIENT_ID: ${{ vars.DEMO_RELEASE_PRINCIPAL_ID }}
        run: /tmp/inspect-demo-runtime.sh

  audit:
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    environment: leapview-demo
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-ci
      - run: bun install --frozen-lockfile
      - run: node scripts/ensure_playwright.mjs
      - name: Fetch demo deployment credentials
        uses: Infisical/secrets-action@6cd3f7c0e4cc0d2395ee4ef414eb6eeb5d3e73db # v1.0.17
        with:
          method: oidc
          identity-id: 6aac9c3e-4f33-45b5-aa4e-884839b950a7
          oidc-audience: https://github.com/flidai
          domain: https://us.infisical.com
          project-slug: leapview
          env-slug: prod
          secret-path: /demo/deployment
      - name: Diagnose deployment identity exchange
        shell: bash
        env:
          DEMO_PUBLISHER_CLIENT_ID: ${{ vars.DEMO_PUBLISHER_PRINCIPAL_ID }}
          DEMO_RELEASE_CLIENT_ID: ${{ vars.DEMO_RELEASE_PRINCIPAL_ID }}
        run: |
          set -euo pipefail
          for role in PUBLISHER RELEASE; do
            client_id_variable="DEMO_${role}_CLIENT_ID"
            client_secret_variable="DEMO_${role}_CLIENT_SECRET"
            scope='RESOURCE_USE RESOURCE_READ RESOURCE_EDIT RESOURCE_PUBLISH'
            if [[ "$role" == RELEASE ]]; then scope='PROJECT_ADMIN'; fi
            response="$(curl --silent --show-error --write-out $'\n%{http_code}' \
              --request POST \
              --header 'Content-Type: application/x-www-form-urlencoded' \
              --data-urlencode 'grant_type=client_credentials' \
              --data-urlencode "client_id=${!client_id_variable}" \
              --data-urlencode "client_secret=${!client_secret_variable}" \
              --data-urlencode 'project_id=lvproject_fI7xfxRH2qubXpUe5KcU7o6T5MOt7tHz' \
              --data-urlencode "scope=$scope" \
              --data-urlencode 'lifetime_seconds=300' \
              https://demo.leapview.dev/oauth/token)"
            status="${response##*$'\n'}"
            body="${response%$'\n'*}"
            jq -cn --arg role "$role" --arg status "$status" --arg error "$(jq -r '.error // ""' <<<"$body")" --arg description "$(jq -r '.error_description // ""' <<<"$body")" \
              '{role: $role, status: $status, error: $error, description: $description}'
          done
      - name: Audit deployed pages and filters
        env:
          LEAPVIEW_BASE_URL: https://demo.leapview.dev
          DEMO_LOGIN_PASSWORD: ${{ secrets.DEMO_LOGIN_PASSWORD }}
        run: node scripts/live_demo_audit.mjs
      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: live-demo-audit
          path: .tmp/live-demo-audit
          if-no-files-found: error
