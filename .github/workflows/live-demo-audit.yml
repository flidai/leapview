name: Direct hosted demo rollout

on:
  workflow_dispatch:
    inputs:
      action:
        description: Validate and stage, or perform the complete hosted-demo rollout
        required: true
        type: choice
        default: prepare
        options: [prepare, deploy]

permissions:
  contents: read

concurrency:
  group: leapview-hosted-demo
  cancel-in-progress: false

env:
  IMAGE_REPOSITORY: ghcr.io/flidai/leapview
  DEMO_TARGET: https://demo.leapview.dev
  DEMO_EXPECTED_SSH_FINGERPRINT: SHA256:JZaqjYFmZYGuJIy4Rmz+gRsrDGTZ6zNR0trob104AgY
  DIRECT_DEMO_PREDECESSOR_SCHEMA: "22"
  DIRECT_DEMO_EXPECTED_SCHEMA: "23"

jobs:
  build:
    name: Require already tested CFO image
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      revision: ${{ steps.qualified.outputs.revision }}
      image: ${{ steps.qualified.outputs.image }}
    steps:
      - name: Verify completed source validation and artifact build
        id: qualified
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          revision=af98947d553e3e9715c0a2274050165381342a51
          image=ghcr.io/flidai/leapview@sha256:075c51e3ae81c3d0dca3f97824ecf11ef8e5e0630597def862acd191a803b835
          run_json="$(gh api repos/flidai/leapview/actions/runs/35500085019)"
          jq -e --arg revision "$revision" '
            .head_sha == $revision and .event == "workflow_dispatch" and
            .path == ".github/workflows/live-demo-audit.yml" and .status == "completed"
          ' <<<"$run_json" >/dev/null
          jobs="$(gh api 'repos/flidai/leapview/actions/runs/35500085019/jobs?per_page=100')"
          jq -e '
            any(.jobs[]; .name == "Validate exact source revision" and .conclusion == "success") and
            any(.jobs[]; .name == "Build and attest exact OCI image" and .conclusion == "success")
          ' <<<"$jobs" >/dev/null
          {
            echo "revision=$revision"
            echo "image=$image"
          } >> "$GITHUB_OUTPUT"

  admit:
    name: Admit exact OCI provenance
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
      attestations: read
    outputs:
      image: ${{ steps.admission.outputs.image }}
    steps:
      - name: Check out exact dispatched source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Admit immutable direct-demo image
        id: admission
        uses: ./.github/actions/oci-admission
        with:
          image: ${{ needs.build.outputs.image }}
          repository: ${{ env.IMAGE_REPOSITORY }}
          expected-workflow: flidai/leapview/.github/workflows/live-demo-audit.yml
          source-revision: ${{ needs.build.outputs.revision }}

  stage:
    name: Stage admitted image without pruning
    needs: [build, admit]
    if: inputs.action == 'prepare' || inputs.action == 'deploy'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: leapview-demo
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out exact dispatched source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.build.outputs.revision }}
      - name: Fetch infrastructure credentials
        uses: Infisical/secrets-action@6cd3f7c0e4cc0d2395ee4ef414eb6eeb5d3e73db # v1.0.17
        with:
          method: oidc
          identity-id: 6aac9c3e-4f33-45b5-aa4e-884839b950a7
          oidc-audience: https://github.com/flidai
          domain: https://us.infisical.com
          project-slug: leapview
          env-slug: prod
          secret-path: /hetzner-qualification/infrastructure
      - name: Fetch demo deployment credentials
        uses: Infisical/secrets-action@6cd3f7c0e4cc0d2395ee4ef414eb6eeb5d3e73db # v1.0.17
        with:
          method: oidc
          identity-id: 6aac9c3e-4f33-45b5-aa4e-884839b950a7
          oidc-audience: https://github.com/flidai
          domain: https://us.infisical.com
          project-slug: leapview
          env-slug: prod
          secret-path: /demo/deployment
      - name: Stage exact image over pinned SSH
        env:
          DIRECT_DEMO_REVISION: ${{ needs.build.outputs.revision }}
          DIRECT_DEMO_IMAGE: ${{ needs.admit.outputs.image }}
        run: |
          set -euo pipefail
          export DEMO_RUNNER_IP="$(curl -4fsS --connect-timeout 5 --max-time 10 https://api.ipify.org)"
          ./scripts/direct_demo_stage_runtime.sh

  rollout:
    name: Prepare or roll out schema 23
    needs: [build, admit, stage]
    if: inputs.action == 'prepare' || inputs.action == 'deploy'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    environment: leapview-demo
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out exact dispatched source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.build.outputs.revision }}
      - name: Fetch infrastructure credentials
        uses: Infisical/secrets-action@6cd3f7c0e4cc0d2395ee4ef414eb6eeb5d3e73db # v1.0.17
        with:
          method: oidc
          identity-id: 6aac9c3e-4f33-45b5-aa4e-884839b950a7
          oidc-audience: https://github.com/flidai
          domain: https://us.infisical.com
          project-slug: leapview
          env-slug: prod
          secret-path: /hetzner-qualification/infrastructure
      - name: Fetch demo deployment credentials
        uses: Infisical/secrets-action@6cd3f7c0e4cc0d2395ee4ef414eb6eeb5d3e73db # v1.0.17
        with:
          method: oidc
          identity-id: 6aac9c3e-4f33-45b5-aa4e-884839b950a7
          oidc-audience: https://github.com/flidai
          domain: https://us.infisical.com
          project-slug: leapview
          env-slug: prod
          secret-path: /demo/deployment
      - name: Prepare or roll out exact release
        env:
          DIRECT_DEMO_REVISION: ${{ needs.build.outputs.revision }}
          DIRECT_DEMO_IMAGE: ${{ needs.admit.outputs.image }}
          DIRECT_DEMO_ROLLOUT_ACTION: ${{ inputs.action }}
        run: |
          set -euo pipefail
          export DEMO_RUNNER_IP="$(curl -4fsS --connect-timeout 5 --max-time 10 https://api.ipify.org)"
          ./scripts/direct_demo_rollout.sh

  verify:
    name: Verify preserved CFO contents
    needs: [build, rollout]
    if: inputs.action == 'deploy'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: leapview-demo
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out exact dispatched source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.build.outputs.revision }}
      - name: Fetch demo deployment credentials
        uses: Infisical/secrets-action@6cd3f7c0e4cc0d2395ee4ef414eb6eeb5d3e73db # v1.0.17
        with:
          method: oidc
          identity-id: 6aac9c3e-4f33-45b5-aa4e-884839b950a7
          oidc-audience: https://github.com/flidai
          domain: https://us.infisical.com
          project-slug: leapview
          env-slug: prod
          secret-path: /demo/deployment
      - name: Set up verification tools
        uses: ./.github/actions/setup-ci
        with:
          browser: "false"
      - name: Prepare generated CLI sources
        run: task generate
      - name: Verify healthy runtime and active CFO project
        env:
          DEMO_SOURCE_REVISION: ${{ needs.build.outputs.revision }}
          DEMO_PROJECT_ID: ${{ vars.DEMO_PROJECT_ID }}
          DEMO_RELEASE_CLIENT_ID: ${{ vars.DEMO_RELEASE_PRINCIPAL_ID }}
        run: ./scripts/direct_demo_verify.sh
