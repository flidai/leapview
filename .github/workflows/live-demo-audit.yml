name: Direct hosted demo rollout

on:
  workflow_dispatch:
    inputs:
      action:
        description: Validate and stage, or perform the complete hosted-demo rollout
        required: true
        type: choice
        default: prepare
        options: [prepare, deploy, verify, diagnose]

permissions:
  contents: read

concurrency:
  group: leapview-hosted-demo
  cancel-in-progress: false

env:
  IMAGE_REPOSITORY: ghcr.io/flidai/leapview
  DEMO_TARGET: https://demo.leapview.dev
  DEMO_EXPECTED_SSH_FINGERPRINT: SHA256:JZaqjYFmZYGuJIy4Rmz+gRsrDGTZ6zNR0trob104AgY
  DIRECT_DEMO_PREDECESSOR_SCHEMA: "23"
  DIRECT_DEMO_EXPECTED_SCHEMA: "23"

jobs:
  validate:
    name: Validate exact source revision
    if: inputs.action != 'diagnose'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Check out dispatched source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Set up LeapView CI
        uses: ./.github/actions/setup-ci
        with:
          browser: "true"
      - name: Require the exact dispatched commit
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Run the pull-request contract
        run: task ci:pr

  diagnose:
    name: Diagnose hosted login safely
    if: inputs.action == 'diagnose'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: leapview-demo
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out dispatched source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
      - name: Fetch infrastructure credentials
        uses: Infisical/secrets-action@6cd3f7c0e4cc0d2395ee4ef414eb6eeb5d3e73db # v1.0.17
        with:
          method: oidc
          identity-id: 6aac9c3e-4f33-45b5-aa4e-884839b950a7
          oidc-audience: https://github.com/flidai
          domain: https://us.infisical.com
          project-slug: leapview
          env-slug: prod
          secret-path: /hetzner-qualification/infrastructure
      - name: Fetch demo deployment credentials
        uses: Infisical/secrets-action@6cd3f7c0e4cc0d2395ee4ef414eb6eeb5d3e73db # v1.0.17
        with:
          method: oidc
          identity-id: 6aac9c3e-4f33-45b5-aa4e-884839b950a7
          oidc-audience: https://github.com/flidai
          domain: https://us.infisical.com
          project-slug: leapview
          env-slug: prod
          secret-path: /demo/deployment
      - name: Inspect non-secret hosted auth state
        run: |
          set -euo pipefail
          export DEMO_RUNNER_IP="$(curl -4fsS --connect-timeout 5 --max-time 10 https://api.ipify.org)"
          ./scripts/direct_demo_auth_diagnose.sh

  build:
    name: Build and attest exact OCI image
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    outputs:
      revision: ${{ steps.identity.outputs.revision }}
      build_time: ${{ steps.identity.outputs.build_time }}
      digest: ${{ steps.build.outputs.digest }}
      image: ${{ steps.image.outputs.image }}
    steps:
      - name: Check out exact dispatched source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Resolve authoritative build identity
        id: identity
        run: |
          set -euo pipefail
          revision="$(git rev-parse HEAD)"
          test "$revision" = "$GITHUB_SHA"
          build_time="$(git show -s --format=%cI "$revision")"
          {
            echo "revision=$revision"
            echo "build_time=$build_time"
          } >> "$GITHUB_OUTPUT"
      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish the direct-demo image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          build-args: |
            BUILD_VERSION=direct-demo.${{ steps.identity.outputs.revision }}
            BUILD_REVISION=${{ steps.identity.outputs.revision }}
            BUILD_TIME=${{ steps.identity.outputs.build_time }}
            BUILD_DIRTY=false
            BUILD_RELEASE=false
          push: true
          pull: true
          tags: ${{ env.IMAGE_REPOSITORY }}:direct-demo-${{ steps.identity.outputs.revision }}
          cache-from: |
            type=gha,scope=direct-demo-amd64
            type=gha,scope=production-amd64
          cache-to: type=gha,mode=max,scope=direct-demo-amd64,ignore-error=true
          provenance: mode=max
          sbom: true
      - name: Attest direct-demo image provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_REPOSITORY }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: Export immutable image reference
        id: image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "image=${IMAGE_REPOSITORY}@${DIGEST}" >> "$GITHUB_OUTPUT"

  admit:
    name: Admit exact OCI provenance
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
      attestations: read
    outputs:
      image: ${{ steps.admission.outputs.image }}
    steps:
      - name: Check out exact dispatched source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Admit immutable direct-demo image
        id: admission
        uses: ./.github/actions/oci-admission
        with:
          image: ${{ needs.build.outputs.image }}
          repository: ${{ env.IMAGE_REPOSITORY }}
          expected-workflow: flidai/leapview/.github/workflows/live-demo-audit.yml
          source-revision: ${{ needs.build.outputs.revision }}

  stage:
    name: Stage admitted image without pruning
    needs: [build, admit]
    if: inputs.action == 'prepare' || inputs.action == 'deploy'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: leapview-demo
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out exact dispatched source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
      - name: Fetch infrastructure credentials
        uses: Infisical/secrets-action@6cd3f7c0e4cc0d2395ee4ef414eb6eeb5d3e73db # v1.0.17
        with:
          method: oidc
          identity-id: 6aac9c3e-4f33-45b5-aa4e-884839b950a7
          oidc-audience: https://github.com/flidai
          domain: https://us.infisical.com
          project-slug: leapview
          env-slug: prod
          secret-path: /hetzner-qualification/infrastructure
      - name: Fetch demo deployment credentials
        uses: Infisical/secrets-action@6cd3f7c0e4cc0d2395ee4ef414eb6eeb5d3e73db # v1.0.17
        with:
          method: oidc
          identity-id: 6aac9c3e-4f33-45b5-aa4e-884839b950a7
          oidc-audience: https://github.com/flidai
          domain: https://us.infisical.com
          project-slug: leapview
          env-slug: prod
          secret-path: /demo/deployment
      - name: Stage exact image over pinned SSH
        env:
          DIRECT_DEMO_REVISION: ${{ needs.build.outputs.revision }}
          DIRECT_DEMO_IMAGE: ${{ needs.admit.outputs.image }}
        run: |
          set -euo pipefail
          export DEMO_RUNNER_IP="$(curl -4fsS --connect-timeout 5 --max-time 10 https://api.ipify.org)"
          ./scripts/direct_demo_stage_runtime.sh

  rollout:
    name: Prepare or roll out schema 23
    needs: [build, admit, stage]
    if: inputs.action == 'prepare' || inputs.action == 'deploy'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    environment: leapview-demo
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out exact dispatched source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.build.outputs.revision }}
      - name: Fetch infrastructure credentials
        uses: Infisical/secrets-action@6cd3f7c0e4cc0d2395ee4ef414eb6eeb5d3e73db # v1.0.17
        with:
          method: oidc
          identity-id: 6aac9c3e-4f33-45b5-aa4e-884839b950a7
          oidc-audience: https://github.com/flidai
          domain: https://us.infisical.com
          project-slug: leapview
          env-slug: prod
          secret-path: /hetzner-qualification/infrastructure
      - name: Fetch demo deployment credentials
        uses: Infisical/secrets-action@6cd3f7c0e4cc0d2395ee4ef414eb6eeb5d3e73db # v1.0.17
        with:
          method: oidc
          identity-id: 6aac9c3e-4f33-45b5-aa4e-884839b950a7
          oidc-audience: https://github.com/flidai
          domain: https://us.infisical.com
          project-slug: leapview
          env-slug: prod
          secret-path: /demo/deployment
      - name: Prepare or roll out exact release
        env:
          DIRECT_DEMO_REVISION: ${{ needs.build.outputs.revision }}
          DIRECT_DEMO_IMAGE: ${{ needs.admit.outputs.image }}
          DIRECT_DEMO_ROLLOUT_ACTION: ${{ inputs.action }}
        run: |
          set -euo pipefail
          export DEMO_RUNNER_IP="$(curl -4fsS --connect-timeout 5 --max-time 10 https://api.ipify.org)"
          ./scripts/direct_demo_rollout.sh

  verify:
    name: Verify preserved CFO contents
    needs: [build, admit, rollout]
    if: always() && needs.build.result == 'success' && needs.admit.result == 'success' && (inputs.action == 'verify' || (inputs.action == 'deploy' && needs.rollout.result == 'success'))
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: leapview-demo
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out exact dispatched source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
      - name: Fetch demo deployment credentials
        uses: Infisical/secrets-action@6cd3f7c0e4cc0d2395ee4ef414eb6eeb5d3e73db # v1.0.17
        with:
          method: oidc
          identity-id: 6aac9c3e-4f33-45b5-aa4e-884839b950a7
          oidc-audience: https://github.com/flidai
          domain: https://us.infisical.com
          project-slug: leapview
          env-slug: prod
          secret-path: /demo/deployment
      - name: Verify healthy runtime and active CFO project
        env:
          DEMO_SOURCE_REVISION: ${{ needs.build.outputs.revision }}
          DEMO_PROJECT_ID: ${{ vars.DEMO_PROJECT_ID }}
          DEMO_RELEASE_CLIENT_ID: ${{ vars.DEMO_RELEASE_PRINCIPAL_ID }}
        run: ./scripts/direct_demo_verify.sh
