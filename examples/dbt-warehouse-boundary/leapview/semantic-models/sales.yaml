apiVersion: leapview.dev/v1
kind: SemanticModel
metadata:
  id: semantic-model:warehouse_sales
  name: warehouse_sales
  displayName: Warehouse Sales
  description: Governed BI semantics over dbt-published marts.
spec:
  datasets:
    - name: orders
      model: orders
      defaultTimeDimension: order_date
      metrics:
        - name: revenue
          type: simple
          empty: zero
          label: Revenue
          description: Revenue produced at order grain by dbt.
          format: currency
          agg: sum
        - name: order_count
          type: simple
          empty: zero
          label: Orders
          format: integer
          agg: count_distinct
          field: order_id
      dimensions:
        - name: order_date
          datatype: Date
          label: Order date
          time:
            nativeGrain: day
            grains: [ day, week, month, quarter, year ]
            calendar: iso8601
        - name: order_status
          datatype: String
          label: Order status
    - name: customers
      model: customers
  relationships:
    - name: orders_customers
      from: { dataset: orders, entity: customer }
      to: { dataset: customers, entity: customer }
      description: Joins each order to its dbt-published customer row.
  dimensions:
    - name: customer_region
      datatype: String
      label: Customer region
      bindings:
        - dataset: orders
          field: customers.region
          path: [ orders_customers ]
  metrics:
    - name: average_order_value
      type: ratio
      numerator: revenue
      denominator: order_count
      label: Average order value
      format: currency
