apiVersion: leapview.dev/v1
kind: Source
metadata:
  id: source:warehouse.fct_orders
  name: warehouse.fct_orders
  displayName: Published order mart
spec:
  connection: warehouse
  location:
    type: path
    path: fct_orders.parquet
    format: parquet
  schema:
    mode: strict
  fields:
    order_id: {datatype: String}
    customer_id: {datatype: String}
    order_date: {datatype: Date}
    order_status: {datatype: String}
    revenue: {datatype: Float}
