apiVersion: leapview.dev/v1
kind: Source
metadata:
  id: source:warehouse.dim_customers
  name: warehouse.dim_customers
  displayName: Published customer mart
spec:
  connection: directory
  location:
    type: path
    path: dim_customers.parquet
    format: parquet
  schema:
    mode: strict
  fields:
    customer_id: {datatype: String}
    customer_name: {datatype: String}
    region: {datatype: String}
    order_count: {datatype: Integer}
    lifetime_value: {datatype: Float}
